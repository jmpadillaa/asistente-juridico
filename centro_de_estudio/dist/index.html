orio | Art. 359: no procede la reforma de la demanda ni la reconvención, coincide |\n| Laborales y sumarios: solo reconvención conexa | Arts. 150 y 333 num. 2, coincide |\n| Alimentos y divorcio contencioso se tramitan en sumario | Art. 332 nums. 3 y 4, coincide |\n| Monitorio dentro de los ejecutivos | Es el capítulo II del título «Procedimientos ejecutivos», coincide |\n| Divorcio por abandono, causal 9 del art. 110 | Código Civil: abandono injustificado por más de seis meses ininterrumpidos, coincide |\n| Código del Trabajo arts. 185 y 188 | No se pudo verificar: no está en la carpeta |\n\nNo se encontró nada que contradiga el texto de la norma.\n\n## Posibles Preguntas de Examen\n\n★★★★★ Cuáles son los actos de proposición; diferencia entre contestar y reconvenir; en qué casos no procede la reconvención (alimentos, monitorio) y cuándo solo cabe la conexa (laborales y sumarios); qué debe contener la contestación (admitir, negar, excepciones, prueba de descargo); pruebas de cargo y de descargo.\n★★★★ Elementos del acto de proposición; reconvención como proceso paralelo resuelto en la misma sentencia; la reconvención en el mismo procedimiento.\n★★★ Ejemplo reivindicación y prescripción adquisitiva; anticipos como reconvención conexa.\n\n## Recomendaciones para Estudiar\n\nEscribir con palabras propias las cuatro definiciones, como pide el autor, y comprobar que cada una tenga hechos, sujetos, prueba, norma y pretensión. Repasar los arts. 142 a 144, 151 a 155, 150 y 333. Tema de la base de conocimiento: `actos_de_proposicion_demanda_contestacion_y_reconvencion`.\n\n## Nivel de importancia\n\n★★★★★ Es el tema central de la unidad (actos de proposición) explicado en orden y con ejemplos.\n"}],"tarjetas":[{"q":"¿Con qué comienza todo proceso?","a":"Con la presentación de la demanda; las diligencias preparatorias pueden precederla (COGEP, art. 141)."},{"q":"¿Para qué sirven las diligencias preparatorias?","a":"Para determinar o completar la legitimación de las partes y anticipar prueba urgente (art. 120)."},{"q":"¿Cuándo se pueden pedir las providencias preventivas?","a":"Antes de presentar la demanda y dentro del proceso (art. 124)."},{"q":"Providencias preventivas del COGEP","a":"Secuestro, retención, prohibición de enajenar inmuebles y arraigo (arts. 124 a 133). El embargo no es preventiva: es de ejecución."},{"q":"¿Qué debe probar quien pide secuestro o retención?","a":"La existencia del crédito y que los bienes del deudor no alcanzan, pueden desaparecer u ocultarse o el deudor trata de enajenarlos (art. 125)."},{"q":"¿Cómo se tramitan las providencias preventivas?","a":"El juez convoca audiencia en 48 horas y resuelve en ella (art. 127)."},{"q":"¿Cómo interrumpe el deudor una providencia preventiva?","a":"Asegurando con caución suficiente (art. 128)."},{"q":"¿Qué recurso cabe contra una providencia preventiva?","a":"Apelación en efecto no suspensivo (art. 132)."},{"q":"Caducidad de las providencias preventivas","a":"Si no se propone la demanda principal, caducan a los 15 días de ordenadas o de exigible la obligación; el solicitante paga daños y perjuicios (art. 133)."},{"q":"¿Cuándo procede el arraigo?","a":"Cuando el acreedor teme que el deudor se ausente: debe probar el crédito, que el deudor es extranjero y que no tiene bienes raíces suficientes en el país (art. 131)."},{"q":"Apremio personal y real","a":"Personal: la medida recae sobre la persona. Real: sobre su patrimonio. Deben ser idóneos, necesarios y proporcionales (art. 134)."},{"q":"¿Cuándo cesa el apremio personal?","a":"Si se conduce a la persona ante el juez, se cumple la obligación o pasan 30 días sin hacerse efectivo (art. 139)."},{"q":"Apremio en alimentos","a":"Incumplimiento de dos o más pensiones: prohibición de salida del país y audiencia en diez días (art. 137)."},{"q":"¿Cuántos requisitos tiene la demanda?","a":"Trece numerales (art. 142): juzgador, datos del actor, RUC, datos del demandado, hechos, fundamentos de derecho, anuncio de prueba, acceso judicial, pretensión, cuantía, procedimiento, firmas y otros requisitos."},{"q":"¿En qué plazo califica el juez la demanda?","a":"En un máximo de cinco días (art. 146). Si falta algo, el actor completa o aclara en cinco días o se archiva."},{"q":"¿Cuándo se inadmite la demanda?","a":"Incompetencia o indebida acumulación de pretensiones, o si es manifiestamente inadmisible; la providencia es apelable (art. 147)."},{"q":"¿Hasta cuándo se reforma la demanda?","a":"Hasta antes de la contestación; si sobreviene un hecho nuevo, hasta antes de la audiencia preliminar o única (art. 148). En el sumario no procede reformar (art. 333.1)."},{"q":"¿Qué debe hacer el demandado al contestar?","a":"Pronunciarse sobre cada pretensión, los hechos y la autenticidad de los documentos; deducir todas las excepciones y anunciar toda su prueba (arts. 151 y 152)."},{"q":"¿Qué pasa si no contesta o no se pronuncia?","a":"Se aprecia como negativa de los hechos, salvo que la ley dé otro efecto (art. 157)."},{"q":"¿Cómo se tramita la reconvención?","a":"Junto con la demanda y las excepciones, en la misma sentencia; no procede en alimentos (art. 154)."},{"q":"Principio dispositivo","a":"Las partes disponen del proceso desde el inicio hasta el final cuando se discuten derechos disponibles. Base: Constitución art. 168.6 y COFJ art. 19."},{"q":"¿Cómo se fija el objeto del proceso?","a":"Con la demanda y la contestación: lo pedido y la causa de pedir (Aguirrezabal, 2017, p. 428)."},{"q":"¿Dónde está la congruencia de las sentencias?","a":"En el art. 92 del COGEP (las diapositivas dicen 252, que trata de recursos sucesivos)."},{"q":"Finalidad de la prueba","a":"Llevar al juzgador al convencimiento de los hechos y circunstancias controvertidos (art. 158)."},{"q":"¿Cuándo se presenta la prueba documental?","a":"Con la demanda, contestación, reconvención y contestación a la reconvención; la de imposible acceso se anuncia (art. 159)."},{"q":"¿Qué pasa con la prueba no anunciada?","a":"No se puede introducir en la audiencia, salvo las excepciones del Código (art. 159), por ejemplo la prueba nueva del art. 166."},{"q":"Requisitos de admisibilidad de la prueba","a":"Pertinencia, utilidad y conducencia; practicada según la ley, con lealtad y veracidad (art. 160)."},{"q":"Hechos que no requieren prueba","a":"Los admitidos por la contraparte, los imposibles, los notorios y los presumidos de derecho (art. 163)."},{"q":"Prueba nueva","a":"Se pide hasta antes de la convocatoria a audiencia de juicio o única, si no era conocida por la parte o no pudo disponer de ella; el juez decide por sana crítica (art. 166)."},{"q":"Prueba para mejor resolver","a":"El juez la ordena de oficio, excepcionalmente y con razones, para esclarecer hechos controvertidos; la audiencia puede suspenderse hasta 15 días (art. 168)."},{"q":"Carga de la prueba","a":"El actor prueba los hechos que afirma y el demandado niega; el demandado solo prueba si su contestación contiene afirmaciones (art. 169)."},{"q":"Prueba testimonial","a":"Declaración de una parte o de un tercero, en la audiencia de juicio o segunda fase de la única, con juramento, interrogatorio y contrainterrogatorio (arts. 174 a 177)."},{"q":"Eficacia de los documentos públicos","a":"Hacen fe aun contra terceros en otorgamiento, fecha y declaraciones del servidor, pero no sobre la verdad de lo declarado por los interesados (guía; arts. 193 y siguientes)."},{"q":"Perito","a":"Persona acreditada por el Consejo de la Judicatura que informa al juez; sustenta su informe en audiencia; si no comparece sin justificación, el informe carece de eficacia (art. 221 y siguientes)."},{"q":"Inspección judicial","a":"El juez examina directamente lugares, cosas o documentos, de oficio o a petición de parte (arts. 228 y 229)."},{"q":"Formas extraordinarias de conclusión","a":"Conciliación, transacción, retiro de la demanda, desistimiento, allanamiento y abandono (arts. 233 a 248)."},{"q":"Retiro de la demanda","a":"Antes de que se cite; vuelve las cosas al estado anterior; hasta dos veces (art. 236)."},{"q":"Desistimiento","a":"El actor puede desistir antes de la sentencia de primera instancia y no podrá presentar de nuevo la demanda; el juez revisa la naturaleza del derecho y que no afecte a terceros (art. 237)."},{"q":"Validez del desistimiento","a":"Voluntario y por persona capaz; en autos con firma reconocida; aprobado por el juez; si es condicional, con consentimiento de la contraparte (art. 239)."},{"q":"Allanamiento","a":"El demandado acepta expresamente las pretensiones antes de la sentencia; no se acepta con derechos indisponibles; se aprueba en sentencia (arts. 241 y 244)."},{"q":"Ineficacia del allanamiento","a":"Demandado incapaz, derecho indisponible, hechos que no se prueban por declaración de parte o sentencia con cosa juzgada frente a terceros (art. 242)."},{"q":"Conciliación","a":"En cualquier estado del proceso, en audiencia ante el juez, que la aprueba en sentencia (arts. 233 y 234)."},{"q":"Abandono","a":"Todas las partes cesan en la prosecución durante seis meses desde la última notificación útil; no cabe en niñez, laboral, voluntarios ni ejecución (arts. 245 y 247)."},{"q":"Procedimiento sumario (art. 333)","a":"No reforma de demanda; solo reconvención conexa; contestación en 15 días; audiencia única en dos fases en 30 días desde la contestación; resoluciones apelables."},{"q":"Procedimiento ejecutivo (APE): títulos","a":"Letras de cambio entre los títulos ejecutivos (art. 347); la obligación debe ser clara, pura, determinada, actualmente exigible y líquida (art. 348)."},{"q":"¿Cuáles son los cuatro actos de proposición?","a":"Demanda, contestación a la demanda, reconvención y contestación a la reconvención (COGEP, arts. 141 a 157)."},{"q":"Elementos de todo acto de proposición","a":"Es escrito; narra hechos; identifica sujetos activo y pasivo; anuncia medios de prueba; invoca normas de derecho; formula una pretensión ajustada a la norma (video de Cando)."},{"q":"Diferencia entre contestar la demanda y reconvenir","a":"Contestar es defenderse; reconvenir es contraatacar con una contrademanda dentro del mismo proceso. Ejemplo: frente a una reivindicación, pedir la prescripción adquisitiva exige reconvenir."},{"q":"¿Cuándo no procede la reconvención?","a":"En alimentos (art. 154) y en el procedimiento monitorio (art. 359). En laborales y en el sumario solo cabe la reconvención conexa (arts. 150 y 333 num. 2)."},{"q":"Reconvención conexa: ejemplo","a":"El trabajador demanda por despido y el empleador reconviene por anticipos de remuneración: conexa. Reconvenir porque el trabajador debe USD 500 a su hermano: no es conexa y no se admite."},{"q":"Pruebas de cargo y de descargo","a":"De cargo: las anuncian quienes atacan (actor, reconviniente). De descargo: quienes se defienden (demandado, reconvenido)."},{"q":"¿Quién contesta la reconvención?","a":"El actor, que pasa a ser el reconvenido, frente al reconviniente; con el tiempo y la forma de la contestación a la demanda (arts. 151 a 155)."},{"q":"Cuestionario de la docente: ¿qué finalidades tiene la diligencia preparatoria?","a":"Determinar o completar la legitimación activa o pasiva y anticipar prueba urgente que pudiera perderse (art. 120). El mismo juez conoce luego la demanda principal."},{"q":"Medidas cautelares con la causa en la corte provincial","a":"Se piden al juez de primera instancia, porque es quien ejecuta lo resuelto (docente, semana 6)."},{"q":"Interrupción de providencias preventivas (art. 128)","a":"El deudor ofrece garantía suficiente, caución u otro bien, dentro de la cuantía adeudada."},{"q":"Secuestro (art. 129) frente a retención (art. 130)","a":"Secuestro: el bien queda bajo custodia durante el litigio; no cambia de dueño. Retención: recae en rentas, créditos o bienes del deudor en poder de un tercero."},{"q":"¿Hasta cuándo dura la retención?","a":"Hasta el pago de lo adeudado (capital, intereses, costas y liquidación), no solo hasta la sentencia (docente, semana 6)."},{"q":"Apremio personal por deudas","a":"Solo en alimentos (docente). Parcial: privación de libertad de 22h a 6h por 30 días; total: hasta 30 días, con reincidencia hasta 180 (art. 137)."},{"q":"Conciliación frente a transacción","a":"Ambas son autocomposición. La conciliación se hace en audiencia ante el juez y se aprueba en sentencia (arts. 233 y 234); la transacción es acuerdo con concesiones recíprocas que el juez autoriza (art. 235)."},{"q":"Transacción frente a allanamiento","a":"Transacción: concesiones recíprocas de las partes. Allanamiento: el demandado acepta la pretensión del actor, total o parcialmente (art. 241)."},{"q":"Antes de valorar una transacción, ¿qué examina el juez?","a":"La capacidad de las partes, la disponibilidad del derecho y el alcance del acuerdo (cuestionario, pregunta 16)."},{"q":"Desistimiento en alimentos","a":"El actor de alimentos no puede desistir (art. 240 num. 4); prima el interés superior del niño y la oficina técnica valora. En una letra de cambio pagada, el actor sí puede."},{"q":"Allanamiento parcial: ejemplo","a":"Demanda por USD 12.000; el demandado reconoce USD 8.000 y discute el resto: el proceso sigue por USD 4.000 (art. 241)."},{"q":"Abandono: lo que se dijo en la tutoría","a":"Seis meses sin actividad antes de la sentencia; no con sentencia dictada ni en ejecución; no en niñez (art. 247). La docente añadió los sumarios, pero el art. 247 no los menciona: responder con el COGEP."},{"q":"¿Quién declara el abandono?","a":"El juzgador, cuando se cumplen los requisitos: el secretario sienta razón del tiempo transcurrido desde la última providencia y el juez lo dispone (art. 245)."}],"simulacro":"# Simulacro de la unidad 1: Derecho Procesal II (No Penal)\n\n**Agente:** Preparador de Exámenes · **Unidad 1** · Basado en `conocimiento/` y el texto de las normas de la carpeta.\n**Formato de la evaluación:** no consta en el sílabo (cuestionario o estudio de caso). Este simulacro mezcla preguntas objetivas y casos.\n**Marcas:** [Clase] sale de lo dicho por el docente; [Guía] de la guía o el sílabo; [Propia] elaboración propia. Respuestas al final, con su fundamento.\n\n**Alcance:** actos de proposición, principio dispositivo, prueba y medios de prueba, diligencias preparatorias, providencias preventivas, apremios y formas de conclusión (COGEP, texto de febrero de 2021). Evaluación: sábado 7 de noviembre, 10h00 a 12h00.\n\n## Preguntas de memoria\n\n1. ¿Cuántos numerales tiene el art. 142 del COGEP y qué exige el numeral 7? [Propia]\n2. ¿En qué plazo califica el juez la demanda y qué plazo tiene el actor para completarla? [Propia]\n3. ¿En cuántos días caducan las providencias preventivas si no se propone la demanda principal? [Guía]\n4. ¿A los cuántos días cesa el apremio personal que no se hace efectivo? [Guía]\n5. ¿Cuántas veces se puede retirar la demanda y hasta cuándo? [Propia]\n6. ¿Cuánto tiempo de inactividad exige el abandono? [Clase, diapositiva 10]\n7. ¿En qué artículo está la finalidad de la prueba y cuál es? [Guía]\n8. Verdadero o falso (guía): a) Todo proceso empieza con las diligencias preparatorias. b) Las providencias preventivas solo se presentan dentro del proceso. c) En el procedimiento de providencias preventivas debe haber audiencia. d) La reconvención se tramita y resuelve con la demanda y las excepciones. e) Existen hechos que no requieren prueba. f) Las excepciones previas forman parte de la estructura de la demanda.\n\n## Preguntas de comprensión\n\n9. Diferencie diligencia preparatoria y providencia preventiva. [Clase]\n10. Explique el principio dispositivo y cómo se relaciona con el objeto del proceso. [Guía; Aguirrezabal]\n11. ¿Qué diferencia hay entre aceptar una pretensión (allanamiento) y negociar una solución (transacción o conciliación)? [Clase, semana 4]\n12. ¿Por qué el abandono no puede equipararse al desistimiento? [Clase, semana 4]\n13. ¿Qué es la prueba nueva y cuándo se admite? [Guía]\n14. ¿Quién tiene la carga de la prueba y cuándo debe probar el demandado? [Propia]\n\n## Preguntas de aplicación\n\n15. Un acreedor teme que su deudor venda su único inmueble antes de que se cite una demanda de cobro. ¿Qué puede pedir, qué debe probar y qué ocurre si no demanda? [Propia]\n16. En una demanda de alimentos, la actora no anunció prueba de los ingresos del demandado y la pide en la audiencia. ¿Procede? ¿Puede el juez suplir esa omisión? [Propia, caso del video foro]\n17. Un demandado se allana a la demanda sobre un derecho indisponible. ¿Qué hace el juez? [Propia]\n\n## Casos prácticos\n\n18. **Caso Ana y Luis** [Clase, diapositiva 12]: Ana demanda a Luis por USD 12.000 de un contrato. Luis reconoce USD 8.000 y discute el saldo. Ambos proponen un calendario de pagos y piden terminar el litigio. Determine si procede allanamiento parcial, conciliación o transacción y justifique con el COGEP.\n19. **Letra de cambio** [Propia]: el tenedor demanda por USD 8.000 a quien aceptó la letra; el demandado alega un abono de USD 2.500. ¿Qué excepción plantea, cómo prueba y quién tiene la carga?\n\n## Preguntas de alta probabilidad\n\n20. Las cuatro preguntas de análisis de la diapositiva 13 de la semana 4, los verdaderos o falsos de la guía, los requisitos de la demanda y la contestación, la preclusión del anuncio de prueba y la prueba nueva.\n\n## Respuestas sugeridas\n\n1. Trece numerales. El numeral 7 exige el anuncio de los medios de prueba, con la nómina de testigos y los hechos sobre los que declararán, y la especificación de los objetos de las diligencias (inspección, exhibición, peritajes). Si no tiene acceso a pruebas documentales o periciales, se describe su contenido y el lugar donde están.\n\n2. Cinco días para calificar (art. 146); si faltan requisitos, el actor completa o aclara en cinco días, y si no lo hace se archiva (apelable).\n\n3. Quince días desde que se ordenan o se hizo exigible la obligación; el solicitante paga los daños y perjuicios (art. 133).\n\n4. Treinta días (art. 139, numeral 3); el juez puede emitir de nuevo la orden.\n\n5. Hasta dos veces y antes de que la demanda sea citada (art. 236).\n\n6. Seis meses desde el día siguiente de la última notificación de una providencia útil (art. 245); verificar la versión vigente porque la diapositiva advierte una corrección.\n\n7. Art. 158: llevar al juzgador al convencimiento de los hechos y circunstancias controvertidos.\n\n8. a) Falso (art. 141: la demanda inicia el proceso; las diligencias pueden precederla). b) Falso (art. 124: antes de la demanda y dentro del proceso). c) Verdadero (art. 127: audiencia en 48 horas). d) Verdadero (art. 154). e) Verdadero (art. 163). f) Falso: las excepciones se deducen en la contestación (arts. 151 y 153). Nota: la guía no trae las respuestas; estas son de contraste con el COGEP.\n\n9. Las diligencias preparatorias son previas al proceso y sirven para completar la legitimación o anticipar prueba urgente (art. 120). Las providencias preventivas aseguran el crédito o la cosa y se piden antes o durante el proceso (art. 124); caducan si no se demanda en 15 días (art. 133).\n\n10. Las partes disponen del inicio, desarrollo y fin del proceso cuando discuten derechos disponibles. Fijan el objeto con la demanda y la contestación (petición y causa de pedir) y el juez debe ser congruente con él (Aguirrezabal, p. 428; COGEP, art. 92). Base: Constitución, art. 168.6.\n\n11. El allanamiento es un acto unilateral del demandado que acepta la pretensión (art. 241) y se aprueba en sentencia (art. 244). La transacción y la conciliación son acuerdos con concesiones recíprocas de ambas partes (arts. 234 y 235). Ni la voluntad de las partes ni el acuerdo eliminan el control del juez (derechos indisponibles, capacidad).\n\n12. El desistimiento es un acto voluntario del actor que impide volver a demandar (art. 237); el abandono es una consecuencia de la inactividad de todas las partes durante seis meses y se declara por auto (arts. 245 y 248). Tienen presupuestos, trámite y efectos distintos.\n\n13. Prueba no anunciada en la demanda o contestación que se pide hasta antes de la convocatoria a la audiencia de juicio o única, si se acredita que la parte no la conocía o que, conociéndola, no pudo disponer de ella; el juez decide con sana crítica (art. 166).\n\n14. El actor prueba los hechos que afirma y que el demandado niega; el demandado no debe probar si solo niega, pero sí si afirma hechos, derecho o calidad de la cosa (art. 169).\n\n15. Puede pedir la prohibición de enajenar inmuebles (art. 126), antes de demandar (art. 124). Debe probar el crédito y que el deudor no tendría otros bienes saneados suficientes (art. 126). El juez convoca audiencia en 48 horas (art. 127). Si no presenta la demanda en 15 días, la medida caduca y debe indemnizar daños (art. 133). El deudor puede interrumpirla con caución (art. 128).\n\n16. No procede como prueba ordinaria: la que no se anuncia no se introduce en la audiencia (art. 159). Solo cabría prueba nueva si acredita que no la conocía o no pudo disponer de ella (art. 166), algo difícil en alimentos si el dato era accesible. El juez puede ordenar prueba para mejor resolver de forma excepcional (art. 168), pero no para remediar la inactividad de la parte que tenía la carga (art. 169 y principio dispositivo). Nota: en el video foro se respondió con el texto del COGEP y no con la frase de la diapositiva.\n\n17. No lo acepta (art. 241) y el proceso continúa; el allanamiento sería además ineficaz (art. 242, numeral 2).\n\n18. Hay allanamiento parcial por USD 8.000, que el juez revisa y aprueba en sentencia si el derecho es disponible (arts. 241 y 244); el proceso sigue por el saldo de USD 4.000. Si acuerdan además el calendario de pagos del total, procede conciliación en audiencia, aprobada en sentencia (art. 234), o transacción presentada al juez (art. 235). Sirve cualquiera si justifica la capacidad y la disponibilidad del derecho.\n\n19. Excepción de extinción parcial de la obligación por el abono (art. 353, num. 3), con prueba en la contestación (art. 351). El demandado debe probar el abono (art. 169, afirma un hecho); el actor prueba el título. El Código de Comercio permite el pago parcial con anotación en el título y recibo (art. 84 y art. 156 del texto de 2019).\n\n20. Estudiar el simulacro junto con `salida/flashcards/derecho_procesal_II_no_penal_unidad_01.md`.\n","repaso":"# Hoja de repaso rápido: Derecho Procesal II (No Penal), unidad 1\n\n**Agente:** Constructor de Material · Fuentes: `conocimiento/derecho_procesal_II_no_penal/`. Evaluación: sábado 7 de noviembre, 10h00 a 12h00, por el link de conexión de las clases. La docente no ha anunciado el formato; el 6-nov dio un cuestionario de 20 preguntas de opción múltiple y dijo que importa explicar el porqué de cada respuesta.\n\n## Temas prioritarios (de mayor a menor)\n\n1. ★★★★★ **Actos de proposición y preclusión del anuncio de prueba:** requisitos de la demanda (art. 142, 13 numerales), documentos (143), calificación en 5 días (146), reforma (148), contestación (151 y 152), reconvención (154), falta de contestación (157).\n2. ★★★★★ **Prueba:** finalidad (158), oportunidad (159), admisibilidad (160), no requieren prueba (163), prueba nueva (166), prueba para mejor resolver (168), carga (169).\n3. ★★★★★ **Verdadero o falso de la guía** (diligencias, providencias, apremios, reconvención, excepciones, hechos): ver el simulacro, pregunta 8.\n4. ★★★★ **Formas de conclusión:** las cuatro preguntas de análisis de la semana 4 y los requisitos de desistimiento y allanamiento.\n5. ★★★★ **Providencias preventivas y apremios:** requisitos, audiencia en 48 horas, caución, caducidad en 15 días, apremio cesa a 30 días.\n6. ★★★ **Sujetos procesales, procuración y tercerías; principio dispositivo.**\n\n## Cuadro: formas extraordinarias de conclusión\n\n| Figura | Quién actúa | Hasta cuándo | Efecto | Control del juez | Artículos |\n|---|---|---|---|---|---|\n| Retiro de la demanda | Actor | Antes de la citación | Archivo; puede demandar de nuevo (máximo 2 veces) | Ordena archivo | 236 |\n| Desistimiento | Actor | Antes de la sentencia de primera instancia | No puede volver a demandar | Naturaleza del derecho; no afectar a terceros | 237 a 240 |\n| Allanamiento | Demandado | Antes de la sentencia | Se aprueba en sentencia (total); si es parcial, sigue por el resto | No con derechos indisponibles | 241 a 244 |\n| Conciliación | Ambas partes | Cualquier estado | Sentencia que aprueba el acuerdo | En audiencia ante el juez | 233 y 234 |\n| Transacción | Ambas partes | Cualquier estado | El juez autoriza la conclusión | Valida el acuerdo | 235 |\n| Abandono | Nadie (inactividad de todas las partes) | 6 meses desde la última notificación útil | Auto que declara el abandono; se cancelan providencias preventivas | De oficio o a petición; no en niñez, laboral, voluntarios ni ejecución | 245 a 248 |\n\n## Correcciones frente a las diapositivas (usar el COGEP)\n\n- Congruencia: art. 92 (no 252).\n- Prueba nueva (art. 166): solo \"no conocida o no pudo disponer\"; no hay \"juramento\" ni \"hechos sobrevenidos\".\n- Prueba para mejor resolver (art. 168): no dice \"prohibición de suplencia\".\n- Providencias preventivas: no incluyen embargo.\n\n## Antes de entrar\n\nPracticar `salida/examenes/derecho_procesal_II_no_penal_simulacro_unidad_01.md` y las tarjetas (`salida/flashcards/`). Ya confirmado: la infografía es una sola y el video foro tuvo tres preguntas. El formato de la evaluación no se ha anunciado.\n\n## Agregado el 7-nov-2026 (tutoría de la semana 6 y video de Cando)\n\n**Base de la evaluación:** el cuestionario de 20 preguntas (clave confirmada por la docente: `salida/examenes/derecho_procesal_II_no_penal_cuestionario_docente_clave.md`) y el video de Cando sobre los actos de proposición.\n\n| Tema | Lo que hay que saber decir |\n|---|---|\n| Cuatro actos de proposición | Demanda, contestación, reconvención y contestación a la reconvención (arts. 141 a 157) |\n| Contestar y reconvenir | Contestar es defenderse; reconvenir es contraatacar en el mismo proceso y procedimiento |\n| Reconvención no procede | Alimentos (art. 154) y monitorio (art. 359); en laborales y sumario solo la conexa (arts. 150 y 333.2) |\n| Prueba de cargo y de descargo | Cargo: actor y reconviniente. Descargo: demandado y reconvenido |\n| Medidas cautelares en corte provincial | Se piden al juez de primera instancia |\n| Secuestro y retención | Custodia del bien sin cambio de dueño; retención sobre bienes en poder de un tercero, hasta el pago |\n| Transacción y allanamiento | Concesiones recíprocas frente a aceptar la pretensión |\n| Alimentos | No hay desistimiento del actor (art. 240.4), ni abandono (art. 247), ni reconvención (art. 154); sí apremio personal (art. 137) |\n| Abandono | Seis meses antes de la sentencia; no en ejecución, niñez ni voluntarios; sumarios no están en el art. 247 aunque la docente los nombró |\n","guia":"# Análisis de guía y sílabo: Derecho Procesal II (No Penal)\n\n**Agente:** Analista de Guías · **Fuentes:** `entrada/guias/DerechoProcesalIINoPenal/SÍLABO DERECHO PROCESAL NO PENAL II.pdf` y `GUIA DERECHO PROCESAL NO PENAL II.pdf`\n\n## Datos de la materia\n\n| Dato | Valor |\n|---|---|\n| Carrera / modalidad | Derecho, Unidad de Educación a Distancia (Universidad Nacional de Loja) |\n| Ciclo y periodo | IV ciclo, septiembre 2026 a febrero de 2027 (el sílabo dice \"septiembre 2026-marzo 2027\") |\n| Código | M5C4A4 (institucional), 5605.02 (UNESCO) |\n| Responsable según el sílabo | Orosco Aguilar Ximena Alexandra (ximena.orosco@unl.edu.ec) |\n| Docente autor y responsable según la guía | Abg. Paul Fernando González, Mgtr. |\n| Docente de las tutorías del paralelo D | Ximena Orosco Aguilar (se presentó así en la semana 1; es secretaria de la Unidad Judicial de Familia, Mujer, Niñez y Adolescencia de Loja) |\n| Horas | 280 en total según el sílabo; la tabla de horas por componente es ilegible y no permite confirmar el reparto |\n| Horario de tutoría | Viernes de 19h00 a 21h00: la primera hora es tutoría, la segunda es actividad práctica (dicho por la docente) |\n| Prerrequisito | Derecho Procesal I (No Penal), M5C3A5 |\n| Proyecto integrador | Clínica Jurídica II, Práctica Civil |\n| Propósito | Contrastar la teoría general del proceso con la legislación civil ecuatoriana; analizar actos de proposición, prueba y medios de prueba; interpretar los procedimientos de la ley vigente |\n\n## Unidades y temas\n\n| Unidad | Nombre | Semanas | Horas | Resultado de aprendizaje |\n|---|---|---|---|---|\n| 1 | Actos de proposición y medios de prueba | 6 (28 sep a 8 nov 2026) | 75 | Analiza los actos de proposición en el marco del principio dispositivo; la prueba y los medios de prueba |\n| 2 | Procedimientos ordinario y sumario | 5 (9 nov a 13 dic 2026) | 62,5 | Interpreta los procedimientos ordinario y sumario en materia no penal |\n| 3 | Procedimientos voluntarios, ejecutivo y monitorio | 5 (enero a febrero 2027) | 62,5 | Interpreta los procedimientos ejecutivo y monitorio |\n\nContenido de la unidad 1 según la guía: (1.1) sujetos procesales, patrocinio, procuración y tercerías; (1.2) principio dispositivo; (1.3) actos de proposición: demanda, contestación, allanamiento, reconvención, admisión e inadmisión; (1.4) prueba: finalidad, práctica, carga, objeciones, hechos que no requieren prueba, valoración, prueba nueva y de oficio, testimonial, documental, pericial, inspección judicial; (1.5) formas extraordinarias de conclusión. Normas que la guía manda leer: COGEP arts. 69 a 88, 120 a 123, 124 a 133.1, 134 a 140, 141 a 150, 151 a 157 y 158 a 249.\n\n## Actividades de la unidad 1 (cada unidad vale 10 puntos)\n\n| Componente | Actividad | Puntos | Fechas |\n|---|---|---|---|\n| ACD | Foro académico (análisis, debate, síntesis) | 1,00 | 28 sep a 25 oct |\n| ACD | Video foro síncrono (conexión obligatoria; la docente dijo que ya no se califica la asistencia) | 1,00 | 26 oct a 1 nov |\n| AA | Infografía científica jurídica, actividad 1 | 1,00 | 28 sep a 18 oct |\n| AA | Infografía científica jurídica, actividad 2 | 1,00 | 19 oct a 1 nov |\n| APE | Estudio de caso y piezas procesales: letra de cambio (demanda ejecutiva y contestación) | 2,50 | 28 sep a 1 nov |\n| Evaluación sumativa | Cuestionario o caso, individual, en la tutoría presencial | 3,50 | 7 y 8 nov |\n| Retroalimentación | Videoconferencia de la unidad (conexión no obligatoria) | sin nota | 2 a 8 nov |\n\nInstrumentos: rúbricas (AA: conceptos 5/3/2/0, jerarquización 3/2/1/0, formato y bibliografía 2/1/0,5/0), lista de cotejo y registro de desempeño, calificación automática.\n\n## Fechas importantes\n\nSocialización 28 sep a 4 oct; presenciales 7 y 8 nov, 15 y 16 dic 2026 y 20 y 21 feb 2027; semana del estudiante 10 a 12 feb 2027; recuperación 8 a 12 mar 2027. Las unidades 2 y 3 tienen sus propias fechas en la guía.\n\n## Bibliografía\n\n- COGEP (enlace de la guía); Aguirrezabal Grünstein, M. (2017) (la guía lo fecha en 2019 con otro ISSN: error de la guía); Ramírez Romero (2015), *Principales cuestiones acerca del COGEP en preguntas y respuestas*. Detalles en `entrada/bibliografia/LISTA_BIBLIOGRAFIA_POR_MATERIA.md`.\n\n## Normas de entrega\n\nPDF, citación APA 7, plataforma EVA. Las actividades prácticas semanales de los viernes (de refuerzo) se pueden entregar hasta el domingo.\n\n## Alertas\n\n1. **Dos infografías en la guía, una sola entrega (confirmado por el estudiante).** La guía describe dos actividades de aprendizaje autónomo de infografía (actividad 1 hasta el 18 oct y actividad 2 hasta el 1 nov) con temas casi iguales; el sílabo solo muestra \"trabajo autónomo 1\". La primera dice \"actividad no calificada\" y la segunda lleva la rúbrica. El estudiante confirmó que se entrega **una sola**; la guía repite la actividad. Entregada: `Entregables/Infografia - Los actos de proposición - UnidadI.pdf`.\n2. **Docente responsable.** El sílabo nombra a Ximena Orosco y la guía a Paul González. **La docente del paralelo D es Ximena Orosco Aguilar** (confirmado por el estudiante); el nombre de la guía es un error o corresponde al autor. Paul dio la tutoría de la semana 4 en otros paralelos.\n3. **Preguntas del video foro.** Son **tres**: la docente dijo en clase que había borrado dos de las cinco (confirmado por el estudiante).\n4. **Guía en borrador.** La tabla de resumen de actividades de la guía trae \"Actividad 1: …\" sin nombres, y el foro de la unidad 2 y 3 mezcla contenidos. Usar el sílabo para los nombres.\n5. **Evaluación sumativa.** El sílabo habla de \"cuestionario o estudio de caso\"; el formato exacto **no consta**. La guía incluye diez preguntas de verdadero o falso como práctica (ver `conocimiento/`, preguntas frecuentes de cada tema).\n6. **Bibliografía chilena.** Un estudiante pidió en la semana 1 autores ecuatorianos; la docente dijo que traería legislación y doctrina ecuatorianas en clase.\n7. **Material en el EVA.** En la semana 1 la guía y el sílabo no eran visibles en el EVA; la docente los subió como anuncio. Fechas del EVA pueden diferir: la guía manda.\n8. **Quintero y Prieto** (1995): solo portadas e índices en la carpeta; faltan los capítulos.\n","mapas":[{"id":"proposicion","titulo":"Actos de proposición","nota":"COGEP. De mayor a menor prioridad según su hoja de repaso. Si la diapositiva difiere del texto de la norma, gana la norma.","tipo":"flujo","datos":{"pasos":[{"t":"Demanda","n":"art. 142: 13 numerales. Documentos: art. 143."},{"t":"Calificación","n":"art. 146: 5 días."},{"t":"Reforma","n":"art. 148."},{"t":"Contestación","n":"arts. 151 y 152."},{"t":"Reconvención","n":"art. 154."},{"t":"Falta de contestación","n":"art. 157.","fin":true}],"pie":"En el procedimiento sumario no se puede reformar la demanda (art. 333.1)."}},{"id":"prueba","titulo":"La prueba","nota":"Arts. 158 a 169 del COGEP.","tipo":"arbol","datos":{"t":"La prueba","c":[{"t":"Finalidad","n":"art. 158"},{"t":"Oportunidad","n":"art. 159"},{"t":"Admisibilidad","n":"art. 160"},{"t":"No requieren prueba","n":"art. 163"},{"t":"Prueba nueva","n":"art. 166","c":[{"t":"Solo la no conocida o que no pudo disponer"}]},{"t":"Prueba para mejor resolver","n":"art. 168"},{"t":"Carga de la prueba","n":"art. 169"}]}},{"id":"conclusion","titulo":"Formas extraordinarias de conclusión","nota":"Arts. 233 a 248. El cuadro completo está en la pestaña Repaso.","tipo":"arbol","datos":{"t":"Terminar el proceso sin sentencia de fondo","c":[{"t":"Lo decide el actor","c":[{"t":"Retiro de la demanda","n":"art. 236. Antes de la citación. Puede demandar de nuevo (máximo 2 veces)."},{"t":"Desistimiento","n":"arts. 237 a 240. Antes de la sentencia de primera instancia. No puede volver a demandar."}]},{"t":"Lo decide el demandado","c":[{"t":"Allanamiento","n":"arts. 241 a 244. No con derechos indisponibles."}]},{"t":"Lo deciden ambas partes","c":[{"t":"Conciliación","n":"arts. 233 y 234. En audiencia."},{"t":"Transacción","n":"art. 235."}]},{"t":"Nadie actúa","c":[{"t":"Abandono","n":"arts. 245 a 248. 6 meses desde la última notificación útil."}]}]}},{"id":"correcciones","titulo":"Correcciones frente a las diapositivas","nota":"Cuando la diapositiva contradice el COGEP, se responde con el texto de la norma.","tipo":"comparar","datos":{"cols":[{"t":"Dice la diapositiva","items":["Congruencia en el art. 252","Prueba nueva con juramento y hechos sobrevenidos","Prueba para mejor resolver con prohibición de suplencia","Providencias preventivas incluyen embargo"]},{"t":"Dice el COGEP","destacado":true,"items":["Congruencia: art. 92","Art. 166: solo la no conocida o que no pudo disponer","Art. 168: no dice nada sobre prohibición de suplencia","No incluyen embargo"]}]}}]}],"plan":[{"titulo":"Plan final (6 al 8 nov)","md":"# Plan final: viernes 6 al domingo 8 de noviembre de 2026\n\n**Agente:** Planificador Académico · Reemplaza a `plan_refuerzo_31oct_8nov_2026.md` para estos tres días. Actualizado el 6 de noviembre con el horario oficial de las evaluaciones.\n\n## Horario de las evaluaciones (establecido)\n\n| Día | Hora | Materia | Cómo |\n|---|---|---|---|\n| Sábado 7 | 8h00 a 10h00 | Derecho Penal | EVA |\n| Sábado 7 | 10h00 a 12h00 | Derecho Procesal II (No Penal) | Por el link de conexión recurrente de las clases (anuncio de la docente) |\n| Sábado 7 | 14h00 a 16h00 | Derecho Civil II | EVA |\n| Domingo 8 | 13h00 a 14h00 | Medicina Legal | EVA |\n\nTodas valen 3,50 puntos. Ya están cargadas en tu Google Calendar, con aviso un día antes y una hora antes.\n\n## Lo que no coincide con el EVA\n\nEsto no cambia el horario de arriba, pero conviene mirarlo hoy en el EVA para no llevarte una sorpresa:\n\n- **Penal:** el docente dijo en clase \"sábado de 8 a 10\". El cuestionario del EVA figura el sábado de 23:00 a 23:59.\n- **Civil II:** el aviso de la docente lista dos franjas (14h00 a 15h00 y 15h00 a 16h00) y el correo del EVA decía domingo 8. Tú tienes el sábado de 14 a 16.\n- **Medicina Legal:** el cuestionario del EVA aparece con apertura y cierre a las 00:00 del domingo, sin hora de verdad.\n- **Procesal II:** coincide. El cuestionario abre a las 10h00 y cierra a las 12h00.\n\nSi un cuestionario no abre a la hora acordada, escribe al docente por el EVA antes de la evaluación.\n\n## Lo que ya está entregado\n\nTodas las entregas de la unidad 1 (APE, AA, ACD, foros y video foros de las cuatro materias, el mapa conceptual y la actividad práctica de la semana 6 de Civil II) están marcadas como hechas. Lo que queda es estudiar y rendir.\n\n## Plan por días (propuesta; ajusta las horas a tu día)\n\n**Viernes 6**\n- 11h30 a 13h30: **Penal**. Hoja de repaso, resumen de la clase 6 y simulacro con casos. Es la primera evaluación.\n- 15h00 a 17h00: **Procesal II**. Hoja de repaso, cuadro de formas de conclusión y correcciones al COGEP (congruencia art. 92; prueba nueva art. 166).\n- 17h30 a 18h30: **Civil II**. Matriz de clasificación, destino y consecuencias de ser mueble o inmueble. Solo repaso, el resto es mañana.\n- 19h00 a 21h00: retroalimentación de Procesal II (no obligatoria, pero es la víspera).\n- 21h15 a 22h00: tarjetas de Penal y Procesal. Acostarte temprano.\n\n**Sábado 7**\n- 6h45 a 7h30: Penal, solo la hoja de repaso y los cuatro filtros.\n- 8h00 a 10h00: **Evaluación de Penal.**\n- 10h00 a 12h00: **Evaluación de Procesal II.** Entra por el link de las clases. Deja la conexión y el computador listos antes de las 10h00, porque quedan seguidas.\n- 12h00 a 13h30: almuerzo y descanso.\n- 13h30 a 14h00: Civil II, repaso de 30 minutos.\n- 14h00 a 16h00: **Evaluación de Civil II.**\n- 19h00 a 21h00: **Medicina Legal**. Simulacro y tarjetas. Insiste en espasmo frente a rigidez, en tatuaje frente a negro de humo y en el anillo de Fisch.\n\n**Domingo 8**\n- 9h00 a 10h30: Medicina Legal, segunda vuelta de tarjetas y simulacro.\n- 12h15 a 12h45: repaso final de la hoja de repaso.\n- 13h00 a 14h00: **Evaluación de Medicina Legal.**\n\n## Qué mirar de cada materia\n\n| Materia | Qué abrir en el Centro de estudio |\n|---|---|\n| Penal | Mapa «Los cuatro filtros del delito», «Causalismo frente a finalismo», «La evaluación de un vistazo» y la pestaña Repaso |\n| Procesal II | Mapas «Actos de proposición», «Formas extraordinarias de conclusión» y «Correcciones frente a las diapositivas» |\n| Civil II | Mapas «Clasificación de los bienes», «¿Es inmueble por destino?» y «Mueble frente a inmueble» |\n| Medicina Legal | Mapas «Espasmo frente a rigidez», «Disparo a corta frente a larga distancia» y «Fenómenos cadavéricos recientes» |\n\nSi no entiendes una palabra, tócala en el texto o búscala en el Glosario.\n\n## Después\n\nLa unidad 2 empieza el lunes 9 de noviembre. Los pendientes de ese día están en el checklist.\n"},{"titulo":"Calendario del periodo","md":"# Calendario consolidado · Civil II, Penal y Medicina Legal\n\n**Agente:** Planificador Académico · **Fecha del plan:** 28 de octubre de 2026 · **Fuentes:** guías y sílabos de las tres materias (ver `salida/analisis_guias/`)\nDerecho Procesal II (No Penal) no está incluida: falta su guía y su sílabo.\n\n## Calendario común\n\n| Hito | Fecha |\n|---|---|\n| Unidad 1 | semanas 1–6 · 28 sep – 8 nov 2026 |\n| Unidad 2 | semanas 7–12 · 9 nov – 16 dic 2026 |\n| Receso académico | 17 dic 2026 – 3 ene 2027 (según el docente de Medicina Legal) |\n| Unidad 3 | semanas 13–19 · 4 ene – 21 feb 2027 |\n| Evaluación de la unidad 1 | **7 y 8 de noviembre 2026**. Horario establecido (6 nov): sáb 7 · Penal 8h00 a 10h00; Procesal II 10h00 a 12h00; Civil II 14h00 a 16h00. Dom 8 · Medicina Legal 13h00 a 14h00 |\n| Evaluación de la unidad 2 | 15 y 16 de diciembre 2026 (Civil II: 14–16 dic en el calendario general) |\n| Semana del estudiante | 10, 11 y 12 de febrero 2027 |\n| Evaluación de la unidad 3 | 20 y 21 de febrero 2027 |\n| Recuperación | 8–12 de marzo 2027 |\n\nNota: Civil II da como presenciales el 7–8 nov, 9–10 ene y 20–21 feb; Penal y Medicina Legal, el 7–8 nov, 15–16 dic y 20–21 feb. Confirmar con el docente de Civil II.\n\n## Qué vence ahora (unidad 1)\n\nCada unidad vale 10 puntos: ACD 2,00 · APE 2,50 · AA 2,00 · evaluación 3,50. En Civil II, el sílabo reparte los puntos distinto (ver el análisis de la materia).\n\n| Prioridad | Materia | Actividad | Puntos | Fecha límite |\n|---|---|---|---|---|\n| 1 | Todas | Evaluación de la unidad 1 | 3,50 × 3 | 7 y 8 nov |\n| 2 | Civil II | Demanda de amparo posesorio (APE) | 2,50 | 1 nov |\n| 3 | Penal | Ensayo académico sobre la teoría del delito (APE) | 2,50 | 1 nov |\n| 4 | Medicina Legal | Estudio de caso y ficha de análisis (APE, lesionología) | 2,50 | 1 nov |\n| 5 | Civil II | Video interactivo (autónomo 2) | 1,00 | 1 nov |\n| 6 | Penal | Video-foro de roles o su alternativa asincrónica (ACD 2) | 1,00 | 1 nov |\n| 7 | Medicina Legal | Video foro (ACD 2); conexión sincrónica obligatoria según la guía | 1,00 | 1 nov |\n| 8 | Civil II | Video foro (ACD 2), conexión obligatoria | 1,00 | 1 nov |\n| 9 | Penal | Infografía o mapa conceptual sobre la tipicidad (AA 2) | 2,00 | 1 nov |\n| 10 | Medicina Legal | Test de 50 preguntas, 60 min (AA 1; ver alerta) | 2,00 | 18 oct (¿vencido?) |\n\nYa vencidas, por revisar si se entregaron: foros de las tres materias (25 oct), autónoma 1 de Civil II (mapa conceptual, 18 oct).\n\n## Plan de los próximos 11 días\n\n| Días | Prioridad |\n|---|---|\n| 28–29 oct | Entregar lo que vence el 1 de nov. Empezar por las tres actividades de 2,50 puntos (demanda, ensayo, ficha de caso). |\n| 30 oct – 1 nov | Terminar el video foro y los videos. Subir todo antes del cierre del EVA: no se aceptan entregas tardías. |\n| 2–6 nov | Repasar para el examen de la unidad 1 (ver abajo). |\n| 7–8 nov | Evaluaciones de la unidad 1. |\n\n## Repaso para la evaluación de la unidad 1\n\n| Materia | Qué repasar | Pista del docente |\n|---|---|---|\n| Civil II | Muebles e inmuebles (naturaleza, adherencia, destino, anticipación); separación momentánea; muebles de una casa; fungibles | Se evalúa la norma (Libro II del Código Civil, arts. 583-593, por verificar), no la doctrina |\n| Penal | Legalidad y principios; tipicidad, imputación objetiva, dolo, culpa, error de tipo; estructura del delito; **finalismo** | Las preguntas salen de las diapositivas semanales; \"causalista o finalista → finalista\" |\n| Medicina Legal | Divisiones de la medicina legal; anillo de Fisch y tatuaje; fenómenos cadavéricos; **espasmo vs. rigidez** | \"Espasmo vs. rigidez normalmente se toma en el examen\" |\n\nUsar `salida/resumenes/` (por clase) y `conocimiento/` (por tema, con preguntas frecuentes).\n\n## Alertas de riesgo\n\n1. **Mucho vence el 1 de noviembre**: tres APE de 2,50 y varios videos en una sola semana. Es el cuello de botella.\n2. **Penal, unidades 2 y 3:** la guía trae actividades de otra materia; confirmar con el docente antes de planificar.\n3. **Medicina Legal:** hay que confirmar si el test de la autónoma venció el 18 de octubre y si el video foro exige cámara.\n4. **Fechas del EVA vs. guía** (Civil II): valen las de la guía.\n5. **Falta Derecho Procesal II:** sin guía no se puede planificar.\n6. **Receso (17 dic – 3 ene):** las entregas de la unidad 2 cierran el 13 de diciembre; no dejarlas para el receso.\n\n## Cada semana\n\n- Ver el video y las diapositivas de la tutoría (Penal y Medicina Legal los suben apenas termina la clase).\n- Revisar la rúbrica antes de entregar.\n- Reservar tiempo para JURLEX (Penal) y para citar en APA 7.\n"},{"titulo":"Horario de clases","md":"# Horario de tutorías (Zoom) · Unidad 1\n\n**Agente:** Planificador Académico · **Fuentes:** los eventos semanales de tu calendario, los correos de la docente de Civil II, la tutoría de la semana 5 y los sílabos.\nLa asistencia a las tutorías **no es obligatoria**, pero las actividades calificadas sí. Receso: 17 de diciembre al 3 de enero.\n\n## Horario semanal\n\n| Materia | Día y hora | Docente | Zoom |\n|---|---|---|---|\n| Derecho Penal (paralelo D) | Miércoles, 19:00 a 21:00 | Mgtr. Wilson Rafael Rodas Mogrovejo · wilson.rodas@unl.edu.ec | https://cedia.zoom.us/j/86872920338 |\n| Derecho Civil II | Jueves, 19:00 a 21:00 | Abg. Claudia Patiño Izquierdo, Mgt. · claudia.patino@unl.edu.ec | https://cedia.zoom.us/j/89351741237 |\n| Derecho Procesal II (No Penal) | Viernes, 19:00 a 21:00 | Abg. Ximena Alexandra Orosco Aguilar, Mgtr. · ximena.orosco@unl.edu.ec | https://cedia.zoom.us/j/88018304803 |\n| Medicina Legal (paralelo D) | Lunes, 18:00 a 20:00 | Abg. José David Mazón Loayza · jose.mazon@unl.edu.ec | https://cedia.zoom.us/j/87803726145 |\n\n## Del 29 de octubre al 8 de noviembre\n\n| Fecha | Qué hay | Nota |\n|---|---|---|\n| Jue 29 oct | Civil II, 19:00 a 21:00 | **No hay clase.** La docente está en una delegación universitaria. |\n| Vie 30 oct | Procesal II, 19:00 a 21:00 | Probable sesión del foro síncrono de la semana 5 (ACD 2). Confírmalo. |\n| Sáb 31 oct, dom 1 nov | Sin tutorías | Vencen las entregas, 23h00. |\n| Lun 2 nov | Medicina Legal, 18:00 a 20:00 | **Feriado** (Día de los Muertos). Confirma si hay clase. |\n| Mar 3 nov | Sin tutorías | **Feriado** (Independencia de Cuenca). |\n| Mié 4 nov | Penal, 19:00 a 21:00 | Retroalimentación previa a la evaluación. Ya se dio: resumen en `salida/resumenes/derecho_penal/clase_06_...md`; el docente subió la grabación al EVA. |\n| Jue 5 nov | Civil II, 19:00 a 21:00 | Semana 6: bienes inmuebles. La docente anunció el examen. |\n| Vie 6 nov | Procesal II, 19:00 a 21:00 | Retroalimentación de la unidad, no obligatoria. |\n| Sáb 7 nov | **Evaluaciones** | Penal 8h00 a 10h00 · Procesal II 10h00 a 12h00 · Civil II 14h00 a 16h00 |\n| Dom 8 nov | **Evaluación** | Medicina Legal 13h00 a 14h00 |\n\n## Grabaciones de Civil II (YouTube)\n\nLa docente sube la tutoría a YouTube después de cada sesión. Sirve si no puedes conectarte a las 19:00.\n\n- Semana 1: https://youtube.com/live/XVvFQw2sRa8\n- Semana 3: https://youtube.com/live/XzWZmQk7zeU\n- Semana 4: https://youtube.com/live/1nfV0ujBQ5k\n- Semana 5 (28 oct): la docente dijo que la subiría; no tengo el enlace.\n\n## Lo que no sé\n\n- Las diferencias entre el horario acordado y el que muestra el EVA (Penal, Civil II y Medicina Legal). Ver `plan_final_6_8nov_2026.md`.\n- La sede de las tutorías presenciales del 7 y 8 de noviembre, si las hay.\n\nResuelto el 6 de noviembre: el horario de las evaluaciones, la retroalimentación de Civil II (ya pasó, fuera miércoles 4 o jueves 5) y la tutoría de Medicina Legal del 2 de noviembre (feriado, ya pasó).\n\n## Tu calendario\n\n- **Actualizado el 6 de noviembre:** las evaluaciones. El evento de todo el día que nombraba solo tres materias se reemplazó por cuatro eventos con hora (Penal, Procesal II y Civil II el sábado 7; Medicina Legal el domingo 8), con aviso un día y una hora antes.\n- **Sin cambiar, porque ya pasaron:** los eventos \"VENCE 1 nov\" de Civil II, Penal y Medicina Legal. Sus descripciones hablan de \"video interactivo\" y \"video foro de roles\", que ya no aplican; las entregas están hechas.\n- Las tutorías semanales siguen igual (Penal miércoles, Civil II jueves, Procesal II viernes, Medicina Legal lunes).\n"},{"titulo":"Pendientes de verificar","md":"# Pendientes de verificación y ampliación: unidad 1\n\n**Agente:** Investigador Académico. **Tipo de trabajo:** lista de lo que falta comprobar; **no se hizo una búsqueda en internet** para este documento. Todo lo de abajo debe consultarse en fuente oficial (Registro Oficial, JURLEX/LEXIS desde la Biblioteca Virtual de la UNL) y anotarse con la fecha de consulta.\n\n## Obligatorio (afecta entregables o evaluaciones)\n\n| Pendiente | Materia | Por qué importa | Dónde |\n|---|---|---|---|\n| ~~COFJ: art. 19 y competencia civil~~ **Verificado el 31-oct-2026** (art. 19 coincide con lo dicho por la docente; arts. 239 y 240 asignan a los jueces de lo civil y mercantil los asuntos patrimoniales y mercantiles; arts. 328, 329, 330 y 335 sobre el abogado). Versión: Ley 0, R.O. Suplemento 544, 9-mar-2009, última modificación 5-feb-2018 | Procesal, Civil II | Ya no es pendiente. Falta solo confirmar reformas posteriores a 2018 | `entrada/bibliografia/Normas/Código Orgánico de la Función Judicial.pdf` |\n| Vigencia del COGEP después de febrero de 2021 y del Código Civil después de enero de 2024 | Procesal, Civil II | Los entregables citan esas versiones | Registro Oficial, JURLEX |\n| COGEP, arts. 64 a 66 (términos) | Procesal | Un docente dijo \"días hábiles sin feriados ni fines de semana\"; la guía lo plantea como verdadero o falso | COGEP |\n| COIP, art. 152 (lesiones): texto y numeral 3 | Penal | El caso integrador lo cita; no consta verificado en `_normas_verificadas.md` | COIP |\n\n## Recomendado\n\n| Pendiente | Materia | Detalle |\n|---|---|---|\n| Capítulos de González Pesantes (2012) sobre posesión y de Parraguez sobre posesión y prescripción | Civil II | Solo están los capítulos 1, 3 y 4 de González y 1, 6 y 17 de Parraguez; hacen falta para la unidad 2 y para fundamentar la demanda |\n| Artículo completo de Morand-Deviller (2011) | Civil II | Tema \"bienes públicos y derecho de propiedad\"; solo se leyó el resumen. Discrepancia de páginas: portada 11-26, interior 13-28 |\n| Código Civil, arts. 604 a 625 | Civil II | Bienes nacionales y de uso público |\n| Quintero y Prieto (1995): capítulos | Procesal | Solo portadas e índices |\n| Resolución n.º 7 de la Corte Nacional de Justicia sobre abandono (R.O. 539, 9-jul-2015) | Procesal | Citada en la nota del art. 245 |\n| Código de Comercio posterior a 2019 | Procesal (APE) | El informe de la letra de cambio usa el texto de 2019 |\n\n## Avanzado\n\n- Jurisprudencia de la Corte Nacional sobre preclusión probatoria, prueba nueva y abandono (Procesal) y sobre acciones posesorias (Civil II).\n- Doctrina ecuatoriana sobre el principio dispositivo y la carga de la prueba (un estudiante pidió autores nacionales; la docente de Procesal ofreció traer material).\n- Video de la guía sobre carga dinámica de la prueba (Jairo Parra Quijano) para el foro de la unidad 1.\n\n## Contradicciones en la bibliografía que se deben mantener anotadas\n\nAguirrezabal: la guía dice 2019 y otro ISSN; es 2017, *Revista de Derecho Privado* n.º 32. Peñaranda: 2011, no 2008. Parraguez: 2020 (sílabo) frente a 2021 (guía).\n"}],"tareas":[{"id":"t07fd7ec0","mat":"civil","t":"Video foro casa de María (ACD 2): pegar en el EVA","tipo":"Entrega","fecha":"2026-10-31","estado":"Hecho","hecho":true,"nota":"Entregado"},{"id":"t0dadcf5e","mat":"civil","t":"Demanda de amparo posesorio (APE): subir PDF","tipo":"Entrega","fecha":"2026-11-01","estado":"Hecho","hecho":true,"nota":"Entregado. Se evalúa en la tutoría presencial"},{"id":"td474ed47","mat":"civil","t":"Mapa conceptual clasificación de bienes (AA): subir PDF","tipo":"Entrega","fecha":"2026-11-08","estado":"Hecho","hecho":true,"nota":"Entregado"},{"id":"td438ec55","mat":"civil","t":"Actividad práctica semana 6 (bienes inmuebles): subir PDF","tipo":"Entrega","fecha":"2026-11-08","estado":"Hecho","hecho":true,"nota":"Entregado"},{"id":"t8f77b16c","mat":"civil","t":"Guion corto de defensa de la demanda","tipo":"Estudio","fecha":"2026-11-05","est   function formAdd(matId) {
    var sel = '<select name="m" aria-label="Materia">' + D.materias.map(function (m) { return '<option value="' + m.id + '"' + (m.id === matId ? " selected" : "") + ">" + esc(m.corto) + "</option>"; }).join("") + '<option value="general">General</option></select>';
    return '<form class="add" data-a="agregar"><input name="t" required placeholder="Nueva tarea o pendiente" aria-label="Título"><input name="f" type="date" aria-label="Fecha"><span>' + sel + '</span><button class="btn pri" type="submit">Agregar</button></form>';
  }
  function vistaTareas() {
    var all = tareas(), hoy = hoyStr();
    var fm = nav.fMat, fe = nav.fEst;
    var ts = all.filter(function (t) { return (fm === "todas" || t.mat === fm) && (fe === "todas" || (fe === "pend" ? !t.hecho : t.hecho)); });
    var h = '<div class="vh"><div><h1>Tareas</h1><p>' + all.filter(function (t) { return t.hecho; }).length + " de " + all.length + " hechas. Marca la casilla para dar el check; se guarda solo.</p></div></div>";
    h += '<div class="chips" style="margin-bottom:8px">' + [["pend", "Pendientes"], ["hecho", "Hechas"], ["todas", "Todas"]].map(function (f) { return '<button class="chip" data-a="fest" data-f="' + f[0] + '" aria-pressed="' + (fe === f[0]) + '">' + f[1] + "</button>"; }).join("") + "</div>";
    h += '<div class="chips">' + [["todas", "Todas las materias"]].concat(D.materias.map(function (m) { return [m.id, m.corto]; })).concat([["general", "General"]]).map(function (f) { return '<button class="chip" data-a="fmat" data-f="' + f[0] + '" aria-pressed="' + (fm === f[0]) + '">' + esc(f[1]) + "</button>"; }).join("") + "</div>";
    var gr = { "Vencidas": [], "Hoy": [], "Próximos días": [], "Sin fecha": [], "Hechas": [] };
    ts.forEach(function (t) {
      if (t.hecho) gr["Hechas"].push(t);
      else if (!t.fecha) gr["Sin fecha"].push(t);
      else if (t.fecha < hoy) gr["Vencidas"].push(t);
      else if (t.fecha === hoy) gr["Hoy"].push(t);
      else gr["Próximos días"].push(t);
    });
    Object.keys(gr).forEach(function (g) {
      var l = gr[g].sort(function (a, b) { return (a.fecha || "9") < (b.fecha || "9") ? -1 : (a.fecha || "9") > (b.fecha || "9") ? 1 : 0; });
      if (l.length) h += '<div class="grp">' + g + " · " + l.length + '</div><div class="tl">' + l.map(function (t) { return tareaHtml(t, true); }).join("") + "</div>";
    });
    if (!ts.length) h += '<div class="empty" style="margin-top:16px">Nada en este filtro.</div>';
    h += '<div class="sec"><h2>Agregar una tarea</h2>' + formAdd(fm !== "todas" ? fm : "civil") + "</div>";
    return h;
  }
  function vistaPlan() {
    var i = Math.min(nav.pi || 0, D.plan.length - 1);
    var h = '<div class="vh"><div><h1>Plan y calendario</h1><p>Lo que dicen tus planes de estudio y los horarios del periodo.</p></div></div><div class="chips" style="margin-bottom:14px">';
    D.plan.forEach(function (p, j) { h += '<button class="chip" data-a="plan" data-i="' + j + '" aria-pressed="' + (j === i) + '">' + esc(p.titulo) + "</button>"; });
    return h + '</div><div class="md wide">' + (D.plan[i] ? md(D.plan[i].md) : "") + "</div>";
  }

  /* explicación simple, términos subrayados y glosario */
  function autolink(root) {
    if (!GLRE || !root) return;
    root.querySelectorAll(".md, .simple").forEach(function (b) {
      var usados = {};
      var w = document.createTreeWalker(b, NodeFilter.SHOW_TEXT, { acceptNode: function (n) {
        var p = n.parentElement;
        if (!p || p.closest("code, a, button, h1, h2, h3, h4, th, summary, .gl")) return NodeFilter.FILTER_REJECT;
        return n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      } });
      var nodos = [];
      while (w.nextNode()) nodos.push(w.currentNode);
      nodos.forEach(function (n) {
        var txt = n.nodeValue, m, last = 0, frag = null;
        GLRE.lastIndex = 0;
        while ((m = GLRE.exec(txt))) {
          var id = GLMAP[m[1].toLowerCase()];
          if (!id || usados[id]) continue;
          usados[id] = 1;
          frag = frag || document.createDocumentFragment();
          frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
          var s = document.createElement("span");
          s.className = "gl"; s.dataset.a = "gl"; s.dataset.g = id; s.tabIndex = 0; s.textContent = m[1];
          frag.appendChild(s);
          last = m.index + m[1].length;
        }
        if (frag) { frag.appendChild(document.createTextNode(txt.slice(last))); n.parentNode.replaceChild(frag, n); }
      });
    });
  }
  function cerrarPop() { var p = document.querySelector(".pop"); if (p) p.remove(); }
  function abrirPop(id) {
    var g = GL[id]; if (!g) return;
    cerrarPop();
    var el = document.createElement("div");
    el.className = "pop mt"; el.setAttribute("style", mstyle(g.m)); el.setAttribute("role", "dialog"); el.setAttribute("aria-label", g.t);
    el.innerHTML = '<div class="pop-h"><b>' + esc(g.t) + '</b><button class="btn sm" data-a="gl-cerrar">Cerrar</button></div><p>' + esc(g.s) + "</p>" +
      (g.e ? '<p class="pe"><span>Ejemplo</span>' + esc(g.e) + "</p>" : "") + (g.a ? '<p class="small">' + esc(g.a) + "</p>" : "") +
      '<button class="btn sm" data-a="gl-ver" data-g="' + g.id + '">Ver en el glosario</button>';
    document.body.appendChild(el);
  }
  function simpleHtml(ex) {
    var h = '<div class="simple md"><p class="lead">' + esc(ex.corto) + "</p>";
    ex.texto.forEach(function (p) { h += "<p>" + esc(p) + "</p>"; });
    h += '<div class="ej"><span class="tg">Un ejemplo</span><p>' + esc(ex.ejemplo) + "</p></div>";
    if (ex.ojo) h += '<div class="ojo"><span class="tg">Ojo con esto</span><p>' + esc(ex.ojo) + "</p></div>";
    h += "</div>";
    if (ex.terminos && ex.terminos.length) {
      h += '<div class="sec"><h2>Palabras de este tema <small>toca una para ver qué significa</small></h2><div class="chips">' +
        ex.terminos.map(function (id) { var g = GL[id]; return g ? '<button class="chip" data-a="gl" data-g="' + id + '">' + esc(g.t) + "</button>" : ""; }).join("") + "</div></div>";
    }
    return h;
  }
  function glItem(g) {
    return '<article class="gi mt" style="' + mstyle(g.m) + '"><div class="gh"><b>' + esc(g.t) + '</b><span class="pill"><i></i>' + esc((MAT[g.m] || GENERAL).corto) + "</span></div><p>" + esc(g.s) + "</p>" +
      (g.e ? '<p class="pe"><span>Ejemplo</span>' + esc(g.e) + "</p>" : "") + (g.a ? '<p class="small">' + esc(g.a) + "</p>" : "") + "</article>";
  }
  function glFiltrado(mat, q) {
    var nq = norm(q || "").trim();
    return D.glosario.filter(function (g) {
      return (mat === "todas" || g.m === mat) && (!nq || norm(g.t + " " + (g.v || []).join(" ") + " " + g.s + " " + (g.e || "")).indexOf(nq) >= 0);
    }).sort(function (a, b) { return norm(a.t) < norm(b.t) ? -1 : 1; });
  }
  function renderGlosarioLista() {
    var box = document.getElementById("gllista"); if (!box) return;
    var l = glFiltrado(nav.gm || "todas", nav.gq);
    box.innerHTML = '<p class="small">' + l.length + " términos</p>" + (l.map(glItem).join("") || '<div class="empty">No hay términos con esa palabra.</div>');
  }
  function vistaGlosario() {
    var gm = nav.gm || "todas";
    var h = '<div class="vh"><div><h1>Glosario</h1><p>Los términos legales y médicos de tus materias, en palabras simples.</p></div></div><div class="search"><input id="gq" type="search" value="' + esc(nav.gq || "") + '" placeholder="Busca un término: dolo, usufructo, caución" aria-label="Buscar en el glosario"></div><div class="chips" style="margin-bottom:12px">';
    [["todas", "Todas"]].concat(D.materias.map(function (m) { return [m.id, m.corto]; })).forEach(function (f) {
      h += '<button class="chip" data-a="glm" data-f="' + f[0] + '" aria-pressed="' + (gm === f[0]) + '">' + esc(f[1]) + "</button>";
    });
    return h + '</div><div id="gllista" class="gl-list"></div>';
  }
  function tabGlosario(m) {
    var l = glFiltrado(m.id, "");
    return '<p class="small">' + l.length + " términos de " + esc(m.corto) + '. Los que aparecen subrayados en los textos también se explican al tocarlos.</p><div class="gl-list">' + l.map(glItem).join("") + "</div>";
  }

  /* búsqueda */
  var IDX = null;
  function buildIdx() {
    IDX = [];
    D.glosario.forEach(function (g) { IDX.push({ m: g.m, titulo: "Glosario: " + g.t, texto: g.s + " " + (g.e || ""), n: norm(g.t + " " + (g.v || []).join(" ") + " " + g.s + " " + (g.e || "")), dest: { v: "glosario", gq: g.t, gm: "todas" } }); });
    D.materias.forEach(function (m) {
      function add(titulo, texto, dest) { IDX.push({ m: m.id, titulo: titulo, texto: texto, n: norm(titulo + " " + texto), dest: dest }); }
      m.unidades.forEach(function (u) { u.temas.forEach(function (t) { var ex = D.explicaciones[m.id + ":" + t.id]; if (ex) add(t.titulo + " · En simple", ex.corto + " " + ex.texto.join(" ") + " " + ex.ejemplo, { v: "materia", mat: m.id, tab: "temas", un: u.id, tema: t.id, dtab: "_simple" }); t.docs.forEach(function (d) { add(t.titulo + " · " + d.n, d.md, { v: "materia", mat: m.id, tab: "temas", un: u.id, tema: t.id, dtab: d.k }); }); }); });
      m.resumenes.forEach(function (r) { add(r.titulo, r.md, { v: "materia", mat: m.id, tab: "clases", open: "cl:" + m.id + ":" + r.id }); });
      add("Hoja de repaso", m.repaso, { v: "materia", mat: m.id, tab: "repaso" });
      add("Simulacro", m.simulacro, { v: "materia", mat: m.id, tab: "simulacro" });
      add("Análisis de la guía", m.guia, { v: "materia", mat: m.id, tab: "guia" });
      m.tarjetas.forEach(function (c) { add("Tarjeta: " + c.q, c.a, { v: "materia", mat: m.id, tab: "tarjetas" }); });
      m.mapas.forEach(function (g) { add("Mapa: " + g.titulo, JSON.stringify(g.datos), { v: "materia", mat: m.id, tab: "mapas" }); });
    });
  }
  function vistaBuscar() {
    var h = '<div class="vh"><div><h1>Buscar</h1><p>En todos los temas, clases, tarjetas, simulacros y mapas de las cuatro materias.</p></div></div><div class="search"><input id="q" type="search" value="' + esc(nav.q) + '" placeholder="Por ejemplo: legítima defensa, art. 588, rigidez" aria-label="Buscar"></div><div id="resultados"></div>';
    return h;
  }
  function resultados() {
    var box = document.getElementById("resultados"); if (!box) return;
    var q = norm(nav.q).trim();
    if (q.length < 2) { box.innerHTML = '<div class="empty">Escribe al menos dos letras.</div>'; return; }
    if (!IDX) buildIdx();
    var partes = q.split(/\s+/), out = [];
    IDX.forEach(function (e, i) {
      var ok = partes.every(function (p) { return e.n.indexOf(p) >= 0; });
      if (ok) { var score = (norm(e.titulo).indexOf(q) >= 0 ? 5 : 0) + partes.length; out.push({ e: e, i: i, s: score }); }
    });
    out.sort(function (a, b) { return b.s - a.s; });
    if (!out.length) { box.innerHTML = '<div class="empty">No encontré nada con esas palabras.</div>'; return; }
    box.innerHTML = '<p class="small">' + out.length + " resultados" + (out.length > 40 ? " (muestro 40)" : "") + "</p>" + out.slice(0, 40).map(function (r) {
      var e = r.e, txt = e.texto.replace(/[#*|`>_-]+/g, " ").replace(/\s+/g, " "), nt = norm(txt), pos = nt.indexOf(partes[0]);
      var snip = pos >= 0 ? txt.slice(Math.max(0, pos - 60), pos + 140) : txt.slice(0, 140);
      var re = new RegExp("(" + partes.map(function (p) { return p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|") + ")", "ig");
      return '<button class="res mt" style="' + mstyle(e.m) + '" data-a="res" data-i="' + r.i + '"><span class="pill"><i></i>' + esc(MAT[e.m].corto) + "</span> <b>" + esc(e.titulo) + "</b><p>" + (pos > 60 ? "…" : "") + esc(snip).replace(re, "<mark>$1</mark>") + "…</p></button>";
    }).join("");
  }

  /* ---------- render ---------- */
  function render(keepScroll) {
    var y = window.scrollY;
    var vista = { inicio: vistaInicio, materias: vistaMaterias, materia: vistaMateria, tareas: vistaTareas, glosario: vistaGlosario, buscar: vistaBuscar, plan: vistaPlan }[nav.v] || vistaInicio;
    document.getElementById("main").innerHTML = vista();
    autolink(document.getElementById("main"));
    if (nav.v === "glosario") renderGlosarioLista();
    renderSide();
    if (nav.v === "buscar") resultados();
    lsSet("ce_nav", nav);
    if (keepScroll === true) window.scrollTo(0, y);
  }
  function irA(cambios, arriba) {
    Object.assign(nav, cambios);
    render();
    if (arriba !== false) window.scrollTo(0, 0);
  }
  function toast(t) {
    var el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 1800);
  }

  /* ---------- eventos ---------- */
  document.addEventListener("click", function (ev) {
    if (!ev.target.closest(".pop") && !ev.target.closest(".gl")) cerrarPop();
    var el = ev.target.closest("[data-a]"); if (!el) return;
    var a = el.dataset.a, d = el.dataset;
    if (el.tagName === "INPUT" && el.type === "checkbox") return;
    if (el.tagName === "FORM") return;
    if (a === "go") { if (d.v === "buscar") nav.q = nav.q || ""; irA({ v: d.v }); if (d.v === "buscar") { var q = document.getElementById("q"); if (q) q.focus(); } }
    else if (a === "mat") irA({ v: "materia", mat: d.m, tab: d.t || (nav.mat === d.m && nav.tab) || "mapas", un: null, tema: null, card: 0, flip: false });
    else if (a === "tab") { irA({ tab: d.t, un: null, tema: null, card: 0, flip: false }, false); }
    else if (a === "tema") irA({ un: d.u, tema: d.t, dtab: D.explicaciones[nav.mat + ":" + d.t] ? "_simple" : "conceptos" });
    else if (a === "gl") abrirPop(d.g);
    else if (a === "gl-cerrar") cerrarPop();
    else if (a === "gl-ver") { cerrarPop(); irA({ v: "glosario", gq: GL[d.g].t, gm: "todas" }); }
    else if (a === "glm") irA({ gm: d.f }, false);
    else if (a === "volver-temas") irA({ un: null, tema: null });
    else if (a === "dtab") irA({ dtab: d.d }, false);
    else if (a === "normas") { var m = MAT[nav.mat]; var box = document.querySelector("#main .mt > div:last-child"); if (box) box.innerHTML = '<p><button class="btn sm" data-a="volver-temas">&larr; Todos los temas</button></p><div class="md">' + md(m.normas) + "</div>"; window.scrollTo(0, 0); }
    else if (a === "ver-estructura") { var mm = MAT[nav.mat], u = mm.unidades.filter(function (x) { return x.id === d.u; })[0]; var b2 = document.querySelector("#main .mt > div:last-child"); if (b2 && u) b2.innerHTML = '<p><button class="btn sm" data-a="volver-temas">&larr; Todos los temas</button></p><div class="md">' + md(u.estructura) + "</div>"; window.scrollTo(0, 0); }
    else if (a === "voltear") { nav.flip = !nav.flip; var fc = document.querySelector(".fc"); if (fc) fc.classList.toggle("flip", nav.flip); }
    else if (a === "cnext") { nav.card++; nav.flip = false; render(true); }
    else if (a === "cprev") { nav.card = Math.max(0, nav.card - 1); nav.flip = false; render(true); }
    else if (a === "cmark") { var mc = MAT[nav.mat], idx = mezclaIdx(mc), i = idx[nav.card]; if (i !== undefined) { S.marks["card:" + mc.id + ":" + i] = d.s; pushState(); } var fil = nav.cfil !== "todas"; if (!fil) nav.card++; nav.flip = false; render(true); }
    else if (a === "cfil") irA({ cfil: d.f, card: 0, flip: false }, false);
    else if (a === "cmezcla") { var mz = MAT[nav.mat]; var ord = mz.tarjetas.map(function (c, i) { return { c: c, i: i, r: Math.random() }; }).sort(function (x, y) { return x.r - y.r; }); mz.tarjetas = ord.map(function (o) { return o.c; }); var mapa = {}; ord.forEach(function (o, n) { mapa[o.i] = n; }); var nuevas = {}; Object.keys(S.marks).forEach(function (k) { var p = k.split(":"); if (p[0] === "card" && p[1] === mz.id) nuevas["card:" + mz.id + ":" + mapa[+p[2]]] = S.marks[k]; else nuevas[k] = S.marks[k]; }); S.marks = nuevas; pushState(); nav.card = 0; nav.flip = false; render(true); toast("Tarjetas mezcladas"); }
    else if (a === "creset") { var mr = MAT[nav.mat]; Object.keys(S.marks).forEach(function (k) { if (k.indexOf("card:" + mr.id + ":") === 0) delete S.marks[k]; }); pushState(); nav.card = 0; render(true); toast("Marcas borradas"); }
    else if (a === "fest") irA({ fEst: d.f }, false);
    else if (a === "fmat") irA({ fMat: d.f }, false);
    else if (a === "plan") irA({ pi: +d.i }, false);
    else if (a === "borrar-extra") { S.extras = (S.extras || []).filter(function (t) { return t.id !== d.id; }); pushState(); render(true); }
    else if (a === "res") { var e = IDX[+d.i]; if (e.dest.open) openSet[e.dest.open] = true; irA(Object.assign({ un: null, tema: null }, e.dest)); }
    else if (a === "tema-oscuro") { var root = document.documentElement, dark = window.matchMedia("(prefers-color-scheme: dark)").matches, cur2 = root.getAttribute("data-theme") || (dark ? "dark" : "light"), nx = cur2 === "dark" ? "light" : "dark"; root.setAttribute("data-theme", nx); try { localStorage.setItem("ce_tema", nx); } catch (e2) {} }
  });
  document.addEventListener("change", function (ev) {
    var el = ev.target;
    if (el.dataset && el.dataset.a === "chk") {
      var k = el.dataset.k;
      if (k.indexOf("e:") === 0) { var id = k.slice(2); (S.extras || []).forEach(function (t) { if (t.id === id) t.hecho = el.checked; }); }
      else S.marks[k] = el.checked;
      pushState(); render(true);
    }
  });
  document.addEventListener("toggle", function (ev) { var el = ev.target; if (el.tagName === "DETAILS" && el.dataset.k) openSet[el.dataset.k] = el.open; }, true);
  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (el.dataset && el.dataset.note) { N[el.dataset.note] = { t: el.value, u: Date.now() }; saveNote(el.dataset.note); }
    else if (el.id === "q") { nav.q = el.value; resultados(); lsSet("ce_nav", nav); }
    else if (el.id === "gq") { nav.gq = el.value; renderGlosarioLista(); lsSet("ce_nav", nav); }
  });
  document.addEventListener("submit", function (ev) {
    var f = ev.target; if (!f.matches("form.add")) return;
    ev.preventDefault();
    var t = f.elements.t.value.trim(); if (!t) return;
    (S.extras = S.extras || []).push({ id: "x" + Date.now().toString(36), mat: f.elements.m.value, t: t, tipo: "Propia", fecha: f.elements.f.value || "", estado: "", hecho: false, nota: "" });
    pushState(); render(true); toast("Tarea agregada");
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") cerrarPop();
    if (ev.key === "Enter" && ev.target.classList && ev.target.classList.contains("gl")) { abrirPop(ev.target.dataset.g); return; }
    if (nav.v !== "materia" || nav.tab !== "tarjetas") return;
    var tag = (ev.target.tagName || "").toLowerCase(); if (tag === "input" || tag === "textarea" || tag === "select") return;
    if (ev.key === " ") { ev.preventDefault(); nav.flip = !nav.flip; var fc = document.querySelector(".fc"); if (fc) fc.classList.toggle("flip", nav.flip); }
    else if (ev.key === "ArrowRight") { nav.card++; nav.flip = false; render(true); }
    else if (ev.key === "ArrowLeft") { nav.card = Math.max(0, nav.card - 1); nav.flip = false; render(true); }
  });

  /* cuenta regresiva: solo actualiza el texto, no vuelve a dibujar la página */
  setInterval(function () {
    var now = new Date();
    document.querySelectorAll("[data-cd]").forEach(function (el) {
      var m = MAT[el.dataset.cd], i = dt(m.evaluacion.inicio), f = dt(m.evaluacion.fin);
      el.textContent = f <= now ? "Terminada" : i <= now ? "En curso" : "en " + faltan(i - now);
    });
  }, 30000);

  try { var th = localStorage.getItem("ce_tema"); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) {}
  if (nav.v === "materia" && !MAT[nav.mat]) nav.v = "inicio";
  render();
  initDb();
})();
</script>
