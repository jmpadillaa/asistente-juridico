xa en lo laboral (video Cando):** el trabajador reclama indemnización por despido intempestivo; el empleador reconviene por anticipos de remuneración. Es conexa. Que el trabajador deba USD 500 a su hermano no lo es y no se admite.\n- **Demanda de despido (video Cando):** ingreso como bodeguero en 2000, ocho horas, USD 300; despido verbal el 2 de enero de 2020 ante testigos; norma: Código del Trabajo; pretensión: indemnización; procedimiento sumario.\n- **Demanda de divorcio (video Cando):** matrimonio inscrito en el Registro Civil, hijos, casa con préstamo hipotecario, abandono del hogar; Código Civil art. 110, causal 9 (abandono injustificado por más de seis meses ininterrumpidos); pretensión: terminar el vínculo; sumario.\n"},{"k":"preguntas_frecuentes","n":"Preguntas","md":"# Preguntas frecuentes: Actos de proposición: demanda, contestación y reconvención\n\n1. ★ ¿Cuáles son los requisitos de la demanda? (art. 142, 13 numerales) [Guía; foro, APE]\n2. ★ ¿Qué documentos deben acompañar la demanda? (art. 143)\n3. ★ ¿Cuáles son los requisitos y contenido de la contestación? (art. 151)\n4. ★ ¿La reconvención se tramita y resuelve con la demanda y las excepciones? **Verdadero** (art. 154). [Guía, V/F]\n5. ★ ¿Las excepciones previas forman parte de la estructura de la demanda? **Falso**: son de la contestación. [Guía, V/F]\n6. ★ ¿Las pretensiones forman parte de la estructura de la contestación? **Falso**: la contestación se pronuncia sobre las pretensiones del actor; las pretensiones propias van en la demanda o la reconvención. [Guía, V/F; interpretación]\n7. ★ ¿Se pueden proponer pretensiones diversas en una misma demanda? **Sí**, si cumplen el art. 145. [Guía, V/F]\n8. ¿Cuántos días tiene el juez para calificar la demanda? ¿Y el actor para completarla? (5 y 5)\n9. ¿Hasta cuándo se puede reformar la demanda? ¿Y en el sumario? (art. 148; art. 333.1)\n10. ¿Cuándo se inadmite la demanda? (art. 147)\n\nRespuestas sugeridas en `salida/examenes/derecho_procesal_II_no_penal_simulacro_unidad_01.md`.\n11. ★★★★★ ¿Cuáles son los cuatro actos de proposición? Demanda, contestación, reconvención y contestación a la reconvención (arts. 141 a 157). [Video Cando]\n12. ★★★★★ ¿Qué diferencia hay entre contestar la demanda y reconvenir? Contestar es defenderse; reconvenir es contraatacar con otra demanda en el mismo proceso. [Video Cando]\n13. ★★★★★ ¿En qué casos no procede la reconvención? En alimentos (art. 154) y en el monitorio (art. 359). En laborales y sumarios solo la conexa (arts. 150 y 333.2).\n14. ★★★★ ¿Qué debe contener la contestación? Pronunciamiento sobre hechos, pruebas y pretensiones; qué admite y qué niega; excepciones previas y de fondo; prueba de descargo (arts. 151 a 153).\n15. ★★★★ ¿Dónde se tramita la reconvención? En el mismo procedimiento y se resuelve con la demanda y las excepciones (art. 154).\n16. ★★★ ¿Qué elementos tiene todo acto de proposición? Hechos, sujetos, medios de prueba, normas de derecho y pretensión. [Video Cando]\n"},{"k":"bibliografia","n":"Bibliografía","md":"# Bibliografía: Actos de proposición: demanda, contestación y reconvención\n\n## Obligatoria (sílabo y guía)\n\n- Código Orgánico General de Procesos (COGEP). Versión Lexis actualizada a febrero de 2021 en `entrada/bibliografia/Normas/COGEP_act_feb-2021.pdf`. Reformas posteriores: no verificadas.\n- Aguirrezabal Grünstein, M. (2017). El principio dispositivo y su influencia en la determinación del objeto del proceso en el proceso civil chileno. *Revista de Derecho Privado*, (32), 423-441. https://doi.org/10.18601/01234366.n32.14 (la guía la fecha en 2019 y le atribuye otro ISSN: es un error de la guía).\n- Ramírez Romero, C. (2015). *Principales cuestiones acerca del COGEP en preguntas y respuestas*. Corte Nacional de Justicia. Es anterior a la reforma de 2019.\n\n## Complementaria\n\nVer `entrada/bibliografia/LISTA_BIBLIOGRAFIA_POR_MATERIA.md` (Larroucau 2019, Peñaranda Valbuena 2011, Quintero y Prieto 1995, solo portadas e índices).\n\n## Videos de la guía\n\n- Demanda y contestación: https://www.youtube.com/watch?v=GyTPBK_UDeo\n- Litisconsorcio: https://www.youtube.com/watch?v=N1g8R6PUsWo\n- Carga dinámica de la prueba, Jairo Parra Quijano: https://www.youtube.com/watch?v=RtSo0eI76XA\n## Material de clase agregado el 7-nov-2026\n\n- Cando Arévalo, L. Video «Los actos de proposición en el COGEP» (YouTube). Transcripción en `entrada/guias/DerechoProcesalIINoPenal/Clases/Examen - Video de actos de proposicion _.txt`. Resumen en `salida/resumenes/derecho_procesal_II_no_penal/video_examen_actos_de_proposicion_cando.md`. Contrastado con el COGEP: sin contradicciones.\n- Tutoría de la semana 6 (cuestionario): `Clases/Semana_06.txt`.\n"},{"k":"jurisprudencia","n":"Jurisprudencia","md":"# Jurisprudencia: Actos de proposición: demanda, contestación y reconvención\n\nNo consta jurisprudencia en las fuentes del curso (los docentes no citaron ninguna). No es un faltante: se llena solo si una tarea la pide. Ni la guía, ni el sílabo ni las clases citan jurisprudencia de este tema.\n\nPor investigar: criterios de la Corte Nacional de Justicia sobre este tema (Investigador Académico, con búsqueda real y fecha de consulta).\n"},{"k":"_ficha","n":"Ficha","md":"# Ficha del Gestor de Conocimiento\n\n**Materia:** Derecho Procesal II (No Penal)\n**Unidad:** 1 · Actos de proposición y medios de prueba (sílabo)\n**Tema:** Actos de proposición (COGEP, arts. 141 a 157)\n\n## Conceptos incorporados\n\nDemanda, requisitos, documentos anexos, calificación, inadmisión, reforma, contestación, excepciones previas y de fondo, allanamiento, reconvención, preclusión, anuncio de prueba.\n\n## Fuentes\n\nGuía (1.3), COGEP, semana 3 (estructura de la demanda), semana 5 (video foro) y los tres entregables elaborados (video foro, infografía, informe de la letra de cambio).\n\n## Relaciones\n\n- El APE de la unidad (letra de cambio) es la aplicación: demanda ejecutiva y contestación (procedimiento ejecutivo, arts. 347 a 355, unidad 3 del sílabo).\n- Conecta con Derecho Civil II: la demanda de amparo posesorio se redacta con el art. 142.\n\n## Contradicciones registradas\n\n- Las diapositivas de la semana 5 mencionan \"hechos sobrevenidos\" y \"solemne juramento\" en la prueba nueva, y \"prohibición expresa de suplencia\" en la prueba de oficio. Esas expresiones **no están** en los arts. 166 y 168 del COGEP (texto de febrero de 2021). Se respondió con el COGEP, por indicación del estudiante.\n- El video foro tiene **tres preguntas**: la docente dijo en clase que había borrado dos de las cinco originales (confirmado por el estudiante).\n\n## Estado de actualización\n\nIncorporado el 31-oct-2026.\n## Actualización del 7-nov-2026\n\nFuentes nuevas: video de Cando sobre los actos de proposición (cuatro actos, elementos, definiciones, reconvención conexa y casos en que no procede) y la tutoría de la semana 6. El video se verificó contra los arts. 142 a 144, 150 a 155, 332, 333 y 359 del COGEP; no hay contradicciones. Pendiente: arts. 185 y 188 del Código del Trabajo citados en el video (el Código no está en la carpeta).\n"}]},{"id":"diligencias_preparatorias_providencias_preventivas_y_apremios","titulo":"Diligencias preparatorias, providencias preventivas y apremios (COGEP, arts. 120 a 140)","docs":[{"k":"conceptos","n":"Conceptos","md":"# Conceptos: Diligencias preparatorias, providencias preventivas y apremios\n\n## Diligencias preparatorias (arts. 120 a 123)\n\n- Todo proceso **puede** ser precedido por una diligencia preparatoria, a petición de parte (art. 120). No es obligatorio: el proceso comienza con la demanda (art. 141). [COGEP]\n- Finalidades: (1) determinar o completar la legitimación activa o pasiva; (2) anticipar prueba urgente que pudiera perderse. [COGEP 120]\n- El juzgador que conoce la diligencia es competente para la demanda principal (art. 120); la competencia se radica por sorteo según la materia (art. 123). [COGEP]\n- Se pide indicando nombres y domicilio de la persona contra quien se promoverá el proceso, el objeto y la finalidad concreta; el juez califica, cita y señala día y hora; la persona citada puede oponerse (art. 121). [COGEP]\n- Ejemplos del art. 122: exhibición de la cosa mueble que se pretende reivindicar, del testamento, de libros de comercio o de documentos para rendición de cuentas. [COGEP]\n- Si el peticionario no concurre, tiene los efectos de la falta de comparecencia a las audiencias (art. 123). [COGEP]\n\n## Providencias preventivas (arts. 124 a 133)\n\n- Se pueden pedir **antes de la demanda y dentro del proceso**, al juzgador de primera instancia aunque la causa esté en la corte provincial (art. 124). [COGEP]\n- Tipos: secuestro, retención, prohibición de enajenar bienes inmuebles y arraigo. [COGEP; diapositiva de la semana 3]\n- Requisitos (art. 125): probar el crédito y que los bienes del deudor no alcanzan, pueden desaparecer u ocultarse o el deudor trata de enajenarlos.\n- Trámite (art. 127): el juez convoca audiencia en 48 horas y resuelve ahí.\n- El deudor puede interrumpirlas asegurando con **caución** suficiente (art. 128).\n- Secuestro (art. 129): de bienes y frutos si se teme su deterioro; el de inmuebles se inscribe en el Registro de la Propiedad.\n- Retención (art. 130): sobre rentas, créditos o bienes del deudor en poder de un tercero; basta notificar al tercero; se puede impugnar en tres días.\n- Arraigo (art. 131): el deudor es extranjero y no tiene bienes raíces suficientes en el país.\n- Recursos (art. 132): apelación solo en **efecto no suspensivo**.\n- Caducidad (art. 133): si no se propone la demanda principal, caducan a los **quince días** de ordenadas o de exigible la obligación; el solicitante paga daños y perjuicios.\n\n## Apremios (arts. 134 a 140)\n\n- Son medidas coercitivas para que se cumplan las decisiones; deben ser idóneas, necesarias y proporcionales. Son **personales** si recaen sobre la persona y **reales** si recaen sobre el patrimonio (art. 134). [COGEP]\n- Exigen prevención legal previa; el apremio personal solo cuando la ley lo autoriza (art. 135).\n- Solo se ejecutan si consta el incumplimiento dentro del término (art. 136).\n- Alimentos (art. 137): incumplimiento de **dos o más pensiones**, sucesivas o no, produce prohibición de salida del país y audiencia en diez días.\n- El apremio personal cesa si se conduce a la persona ante el juez, se cumple la obligación o transcurren **treinta días** sin hacerse efectivo (art. 139).\n\n## Qué dijo la docente\n\nInsistió en distinguir las diligencias preparatorias (antes del proceso) de las providencias preventivas (antes o dentro) y puso ejemplos de alimentos: retención de salarios, alquileres y vehículo; apremio por pensiones impagas. [Clase, semana 3]\n## Ampliación de la tutoría de la semana 6 (7-nov-2026)\n\n- **Diligencia preparatoria (art. 120):** no reemplaza la prueba del proceso principal, solo la asegura. El juzgador que la conoce es competente para la demanda principal.\n- **Medidas con la causa en la corte provincial:** se piden al juez de primera instancia, que es quien ejecuta lo resuelto. [Docente]\n- **Interrupción (art. 128):** garantía suficiente (caución u otro bien) dentro de la cuantía adeudada. [Docente]\n- **Secuestro (art. 129):** custodia del bien durante el litigio; no transfiere la propiedad ni autoriza a venderlo. Si el deudor no paga en la ejecución, se remata. [Docente]\n- **Retención (art. 130):** dura hasta el pago de lo adeudado (capital, intereses, costas, liquidación), no solo hasta la sentencia. Si no cubre, se piden medidas sobre bienes del garante. [Docente]\n- **Apremio personal por deudas:** solo en alimentos (la docente); el art. 135 limita el apremio personal a los casos en que la ley lo autoriza y el art. 137 regula el de alimentos (parcial de 22h a 6h por 30 días; total hasta 30 días, con reincidencia hasta 180). No cabe contra obligados subsidiarios ni garantes (art. 137).\n"},{"k":"definiciones","n":"Definiciones","md":"# Definiciones: Diligencias preparatorias, providencias preventivas y apremios\n\n## Diligencia preparatoria\n\nActuación previa a la demanda, a petición de parte, para completar la legitimación o anticipar prueba urgente (COGEP, art. 120).\n\n## Providencia preventiva\n\nMedida de aseguramiento del crédito o de la cosa litigada que se solicita antes o durante el proceso: secuestro, retención, prohibición de enajenar inmuebles y arraigo (arts. 124 a 133).\n\n## Caución\n\nGarantía suficiente con la que el deudor interrumpe las providencias preventivas (art. 128).\n\n## Apremio\n\nMedida coercitiva para hacer cumplir una decisión judicial; personal (sobre la persona) o real (sobre el patrimonio) (art. 134).\n\n## Caducidad de la providencia preventiva\n\nPérdida de eficacia si no se propone la demanda principal en quince días (art. 133).\n"},{"k":"ejemplos","n":"Ejemplos","md":"# Ejemplos: Diligencias preparatorias, providencias preventivas y apremios\n\n- **Retención** (diapositiva, semana 3): alquileres o salarios que un tercero debe al deudor; una deuda que le deben; un vehículo o dinero en poder de otro. El juez la dicta, se notifica al tercero, se puede impugnar.\n- **Secuestro:** un vehículo que se teme se deteriore mientras dura el litigio. [Diapositiva]\n- **Apremio en alimentos:** un padre debe más de dos pensiones; el juez dispone la prohibición de salida del país y convoca audiencia. [Clase, art. 137]\n- **Interrupción:** el deudor ofrece caución suficiente y la medida se levanta (art. 128).\n- **Letra de cambio (APE):** el tenedor teme que el deudor venda su inmueble y pide la prohibición de enajenar antes de demandar; debe presentar la demanda dentro de quince días o la medida caduca.\n"},{"k":"preguntas_frecuentes","n":"Preguntas","md":"# Preguntas frecuentes: Diligencias preparatorias, providencias preventivas y apremios\n\nMarcadas ★ las que la guía incluye como verdadero o falso (posibles preguntas de examen).\n\n1. ★ ¿Todo proceso empieza con las diligencias preparatorias? **Falso**: comienza con la demanda; las diligencias *pueden* precederla (art. 141).\n2. ★ ¿Las providencias preventivas solo se presentan dentro del proceso? **Falso**: antes de la demanda y dentro del proceso (art. 124).\n3. ★ En el procedimiento de providencias preventivas, ¿debe haber audiencia? **Verdadero**: el juez convoca audiencia en 48 horas (art. 127).\n4. ★ ¿Los apremios personales cesan a los 30 días si no se hacen efectivos? **Verdadero**: art. 139, numeral 3; el juez puede emitir de nuevo la orden.\n5. ★ ¿Los términos corren todos los días salvo feriados? La guía lo propone como verdadero o falso; la docente de otro paralelo dijo en clase que se cuentan días hábiles, sin sábado ni domingo. **Por verificar** con los arts. 64 a 66 del COGEP.\n6. ¿Qué diferencia hay entre diligencia preparatoria y providencia preventiva?\n7. ¿Qué debe probar quien pide secuestro o retención? (art. 125)\n8. ¿Cómo se interrumpe una providencia preventiva? (art. 128)\n9. ¿Qué pasa si no se presenta la demanda principal? (art. 133)\n10. ¿Cuándo procede el arraigo? (art. 131)\n\nRespuestas sugeridas en `salida/examenes/derecho_procesal_II_no_penal_simulacro_unidad_01.md`.\n"},{"k":"bibliografia","n":"Bibliografía","md":"# Bibliografía: Diligencias preparatorias, providencias preventivas y apremios\n\n## Obligatoria (sílabo y guía)\n\n- Código Orgánico General de Procesos (COGEP). Versión Lexis actualizada a febrero de 2021 en `entrada/bibliografia/Normas/COGEP_act_feb-2021.pdf`. Reformas posteriores: no verificadas.\n- Aguirrezabal Grünstein, M. (2017). El principio dispositivo y su influencia en la determinación del objeto del proceso en el proceso civil chileno. *Revista de Derecho Privado*, (32), 423-441. https://doi.org/10.18601/01234366.n32.14 (la guía la fecha en 2019 y le atribuye otro ISSN: es un error de la guía).\n- Ramírez Romero, C. (2015). *Principales cuestiones acerca del COGEP en preguntas y respuestas*. Corte Nacional de Justicia. Es anterior a la reforma de 2019.\n\n## Complementaria\n\nVer `entrada/bibliografia/LISTA_BIBLIOGRAFIA_POR_MATERIA.md` (Larroucau 2019, Peñaranda Valbuena 2011, Quintero y Prieto 1995, solo portadas e índices).\n\n## Videos de la guía\n\n- Demanda y contestación: https://www.youtube.com/watch?v=GyTPBK_UDeo\n- Litisconsorcio: https://www.youtube.com/watch?v=N1g8R6PUsWo\n- Carga dinámica de la prueba, Jairo Parra Quijano: https://www.youtube.com/watch?v=RtSo0eI76XA\n"},{"k":"jurisprudencia","n":"Jurisprudencia","md":"# Jurisprudencia: Diligencias preparatorias, providencias preventivas y apremios\n\nNo consta jurisprudencia en las fuentes del curso (los docentes no citaron ninguna). No es un faltante: se llena solo si una tarea la pide. Ni la guía, ni el sílabo ni las clases citan jurisprudencia de este tema.\n\nPor investigar: criterios de la Corte Nacional de Justicia sobre este tema (Investigador Académico, con búsqueda real y fecha de consulta).\n"},{"k":"_ficha","n":"Ficha","md":"# Ficha del Gestor de Conocimiento\n\n**Materia:** Derecho Procesal II (No Penal)\n**Unidad:** 1 · Actos de proposición y medios de prueba (sílabo)\n**Tema:** Diligencias preparatorias, providencias preventivas y apremios (COGEP, arts. 120 a 140)\n\n## Conceptos incorporados\n\nDiligencia preparatoria, legitimación, prueba urgente, secuestro, retención, prohibición de enajenar, arraigo, caución, caducidad de la providencia, apremio personal y real.\n\n## Fuentes\n\nGuía (lecturas de los arts. 120 a 140), COGEP (texto), diapositivas y tutoría de la semana 3 (docente Ximena Orosco). La semana 3 es el tema del que habla la guía en \"Los actos de proposición\".\n\n## Relaciones encontradas\n\n- Las providencias preventivas dependen de una demanda principal: caducan a los 15 días (art. 133). Se conecta con la letra de cambio (APE): el acreedor puede pedir retención o prohibición de enajenar mientras demanda.\n- Los apremios se vinculan con alimentos (Derecho de Familia) y con la ejecución.\n\n## Contradicciones registradas\n\n- La diapositiva de la semana 3 incluye \"embargo de bienes\" entre las providencias preventivas. En el COGEP (arts. 124 a 133) son secuestro, retención, prohibición de enajenar y arraigo; el embargo es medida de ejecución. Para el examen, usar la lista del COGEP.\n\n## Información pendiente\n\nTextos de los arts. 136 a 138 en detalle y jurisprudencia.\n\n## Estado de actualización\n\nIncorporado el 31-oct-2026 desde la guía, el COGEP y la semana 3.\n## Actualización del 7-nov-2026\n\nFuente nueva: tutoría de la semana 6 (preguntas 1 a 10 del cuestionario, explicadas por la docente con ejemplos de secuestro, retención y apremio). Contraste con el art. 137: el orden de apremios en alimentos que dio la docente es un resumen libre.\n"}]},{"id":"formas_extraordinarias_de_conclusion_del_proceso","titulo":"Formas extraordinarias de conclusión (COGEP, arts. 233 a 248)","docs":[{"k":"conceptos","n":"Conceptos","md":"# Conceptos: Formas extraordinarias de conclusión del proceso\n\n## Distinción de la semana 4\n\n- **Autocomposición:** las partes resuelven (conciliación y transacción).\n- **Actos unilaterales:** una parte adopta una posición (desistimiento del actor, allanamiento del demandado).\n- **Inactividad:** el abandono. [Diapositiva 4]\n- Pregunta de la clase: ¿todos estos mecanismos producen los mismos efectos? No: cada uno tiene presupuestos, trámite y efectos propios, y la voluntad de las partes no elimina el control judicial.\n\n## Conciliación y transacción (arts. 233 a 235)\n\n- Las partes pueden conciliar en **cualquier estado del proceso**, incluso al cumplir la sentencia. Principios: voluntariedad, confidencialidad, flexibilidad, neutralidad, imparcialidad, equidad, legalidad y honestidad (art. 233).\n- Se hace **en audiencia ante el juzgador**; en la audiencia única, preliminar o de juicio, el juez la aprueba **en sentencia** y declara terminado el juicio; si es parcial, el proceso sigue por lo no comprendido (art. 234).\n- La **transacción** válidamente celebrada termina el proceso y el juez autoriza su conclusión cuando una parte se la presenta; si se incumple, se ejecuta forzosamente (art. 235).\n\n## Retiro de la demanda (art. 236)\n\n- El actor puede retirarla **antes de que sea citada**; el juez ordena el archivo, las cosas vuelven al estado anterior y se puede volver a demandar. Puede retirarse hasta **dos veces**.\n\n## Desistimiento (arts. 237 a 240)\n\n- El actor puede desistir de su pretensión en cualquier estado del proceso **antes de la sentencia de primera instancia** y **no podrá presentar nuevamente la demanda**. El juez solo examina si procede por la naturaleza del derecho y por no afectar a la contraparte o a terceros (art. 237). Puede también desistir de un recurso (art. 238).\n- Validez (art. 239): voluntario y por persona capaz; constar en autos con firma reconocida ante el juez; aprobado por el juez; si es condicional, con consentimiento de la contraparte.\n- **No pueden desistir** (art. 240): quienes no pueden comprometer en arbitraje, quienes quieren eludir el provecho que el proceso pueda dar a la otra parte o a un tercero, quienes representen al Estado sin autorización del Procurador General y los actores en procesos de alimentos.\n\n## Allanamiento (arts. 241 a 244)\n\n- El demandado se allana **expresamente** a las pretensiones en cualquier estado del proceso **antes de la sentencia**. El juez **no lo acepta** si se trata de derechos indisponibles (art. 241). Si hay varios demandados y la obligación es divisible, no afecta a los demás; si es parcial o condicional, sigue el proceso por lo no aceptado.\n- Es **ineficaz** (art. 242) cuando el demandado es incapaz (salvo personas jurídicas), el derecho es indisponible, los hechos admitidos no pueden probarse por declaración de parte, o la sentencia debe producir cosa juzgada frente a terceros.\n- El Estado solo se allana con autorización expresa del Procurador General (art. 243). Se aprueba **mediante sentencia** que causa ejecutoria (art. 244).\n\n## Abandono (arts. 245 a 248)\n\n- Procede cuando **todas las partes** han cesado en la prosecución durante **seis meses** desde el día siguiente de la notificación de la última providencia útil (art. 245; plazo según el art. 33 del Código Civil).\n- **No cabe** en causas de niñas, niños, adolescentes, incapaces, adultos mayores y personas con discapacidad; derechos laborales; procesos voluntarios; acciones subjetivas contencioso administrativas; ni en la ejecución (art. 247).\n- Se declara por auto, de oficio o a petición; se cancelan las providencias preventivas (art. 248). Nota del propio COGEP: Resolución de la Corte Nacional de Justicia n.º 7 (R.O. 539, 9-jul-2015) sobre abandono.\n- El abandono no equivale al desistimiento y no debe confundirse con la caducidad. [Diapositiva 10; docente]\n## Ampliación de la tutoría de la semana 6 (7-nov-2026)\n\n- **Autocomposición:** conciliación y transacción. La transacción exige **concesiones recíprocas**; el allanamiento es aceptar la pretensión. Antes de valorar una transacción el juez examina capacidad de las partes, disponibilidad del derecho y alcance del acuerdo. [Docente, preguntas 11, 15 y 16]\n- **Conciliación:** hay etapa de conciliación en todos los procesos (primera fase de la audiencia); el juez la promueve, no la impone, y la eleva a sentencia (art. 234). [Docente, pregunta 17]\n- **Desistimiento:** acto unilateral. En la letra de cambio pagada el actor puede desistir; en alimentos no (art. 240 num. 4), y la suspensión tampoco se concede por solo decirlo las partes, porque prima el interés superior del niño y la oficina técnica valora. [Docente]\n- **Allanamiento parcial:** el proceso sigue por lo no aceptado (art. 241). Casos: divorcio con aceptación de todo menos la pensión; reconocer USD 8.000 de USD 12.000 y discutir el saldo.\n- **Alimentos:** el juez aplica la tabla y no aprueba un acuerdo por menos; los pactos entre adultos son extraprocesales. [Docente; dicho sin cita legal]\n- **Abandono:** seis meses de inactividad antes de la sentencia (art. 245); no con sentencia dictada ni en ejecución; no en niñez ni en las demás causas del art. 247. Lo declara el juez, con razón del secretario. La docente añadió \"sumarios\", que **no** está en el art. 247: responder con el texto del COGEP. Una estudiante citó \"ochenta días\" (texto anterior a la reforma de 2019).\n"},{"k":"definiciones","n":"Definiciones","md":"# Definiciones: Formas extraordinarias de conclusión del proceso\n\n## Conciliación\n\nAcuerdo de las partes aprobado por el juez en audiencia, en sentencia (COGEP, arts. 233 y 234).\n\n## Transacción\n\nAcuerdo con concesiones recíprocas que termina el proceso al ser autorizado por el juez (art. 235).\n\n## Retiro de la demanda\n\nActo del actor antes de la citación que archiva la demanda y permite demandar de nuevo (art. 236).\n\n## Desistimiento\n\nRenuncia del actor a su pretensión, antes de la sentencia de primera instancia, sin poder volver a demandar (art. 237).\n\n## Allanamiento\n\nAceptación expresa y total o parcial de la pretensión por el demandado, antes de la sentencia (art. 241).\n\n## Abandono\n\nTerminación del proceso por inactividad de todas las partes durante seis meses (art. 245).\n\n## Derecho indisponible\n\nDerecho que las partes no pueden renunciar ni transigir; impide el allanamiento y el desistimiento (arts. 240 y 241).\n"},{"k":"ejemplos","n":"Ejemplos","md":"# Ejemplos: Formas extraordinarias de conclusión del proceso\n\n- **Caso de apertura (diapositiva 3):** una persona demanda el pago de una deuda y, antes de la sentencia, el demandado propone un acuerdo; ¿qué opciones hay?\n- **Transacción:** pago de USD 7.000 para cerrar una reclamación de USD 9.000. [Diapositiva 8]\n- **Caso integrador:** Ana demanda a Luis por USD 12.000; Luis reconoce USD 8.000 y discute el saldo; ambos proponen un calendario de pagos. Hay allanamiento parcial por USD 8.000 y el proceso sigue por el saldo (art. 241), o conciliación o transacción si acuerdan el total (arts. 234 y 235). [Diapositiva 12; resolución de apoyo: artículos citados]\n- **Desistimiento:** la actora quiere desistir tras recibir una oferta de pago; el juez revisa que no afecte a terceros y la actora no podrá demandar de nuevo (art. 237). [Diapositiva 6]\n- **Alimentos:** el actor en procesos de alimentos no puede desistir (art. 240.4) y no cabe abandono en causas de niñez (art. 247.1). [Docente]\n"},{"k":"preguntas_frecuentes","n":"Preguntas","md":"# Preguntas frecuentes: Formas extraordinarias de conclusión del proceso\n\n1. ★ ¿Cuáles son las formas extraordinarias de conclusión del proceso? [Guía 1.5; diapositivas semana 4]\n2. ★ ¿Cuál es la diferencia entre aceptar una pretensión y negociar una solución? [Diapositiva 13]\n3. ★ ¿Qué debe revisar el juez antes de aprobar un acuerdo? [Diapositiva 13]\n4. ★ ¿Por qué el abandono no puede equipararse al desistimiento? [Diapositiva 13]\n5. ★ ¿Qué riesgos hay al afirmar que todas las figuras producen cosa juzgada? [Diapositiva 13]\n6. ¿Hasta cuándo puede desistir el actor? ¿Puede volver a demandar? (art. 237)\n7. ¿Cuándo es ineficaz el allanamiento? (art. 242)\n8. ¿Cuántas veces puede retirarse la demanda y hasta cuándo? (art. 236)\n9. ¿En qué casos no cabe abandono? (art. 247)\n10. ¿La conciliación se aprueba en auto o en sentencia? (en sentencia, art. 234.1)\n\nRespuestas sugeridas en `salida/examenes/derecho_procesal_II_no_penal_simulacro_unidad_01.md`.\n"},{"k":"bibliografia","n":"Bibliografía","md":"# Bibliografía: Formas extraordinarias de conclusión del proceso\n\n## Obligatoria (sílabo y guía)\n\n- Código Orgánico General de Procesos (COGEP). Versión Lexis actualizada a febrero de 2021 en `entrada/bibliografia/Normas/COGEP_act_feb-2021.pdf`. Reformas posteriores: no verificadas.\n- Aguirrezabal Grünstein, M. (2017). El principio dispositivo y su influencia en la determinación del objeto del proceso en el proceso civil chileno. *Revista de Derecho Privado*, (32), 423-441. https://doi.org/10.18601/01234366.n32.14 (la guía la fecha en 2019 y le atribuye otro ISSN: es un error de la guía).\n- Ramírez Romero, C. (2015). *Principales cuestiones acerca del COGEP en preguntas y respuestas*. Corte Nacional de Justicia. Es anterior a la reforma de 2019.\n\n## Complementaria\n\nVer `entrada/bibliografia/LISTA_BIBLIOGRAFIA_POR_MATERIA.md` (Larroucau 2019, Peñaranda Valbuena 2011, Quintero y Prieto 1995, solo portadas e índices).\n\n## Videos de la guía\n\n- Demanda y contestación: https://www.youtube.com/watch?v=GyTPBK_UDeo\n- Litisconsorcio: https://www.youtube.com/watch?v=N1g8R6PUsWo\n- Carga dinámica de la prueba, Jairo Parra Quijano: https://www.youtube.com/watch?v=RtSo0eI76XA\n"},{"k":"jurisprudencia","n":"Jurisprudencia","md":"# Jurisprudencia: Formas extraordinarias de conclusión del proceso\n\nResolución de la Corte Nacional de Justicia n.º 7, publicada en el Registro Oficial 539 del 9 de julio de 2015, sobre el abandono de la primera, segunda o única instancia. La cita consta en la nota del art. 245 del COGEP (versión Lexis). **No se leyó el texto de la resolución**: Pendiente de verificar.\n"},{"k":"_ficha","n":"Ficha","md":"# Ficha del Gestor de Conocimiento\n\n**Materia:** Derecho Procesal II (No Penal)\n**Unidad:** 1 · Actos de proposición y medios de prueba (sílabo)\n**Tema:** Formas extraordinarias de conclusión (COGEP, arts. 233 a 248)\n\n## Conceptos incorporados\n\nConciliación, transacción, retiro de la demanda, desistimiento, allanamiento, abandono, derechos indisponibles, cosa juzgada.\n\n## Fuentes\n\nGuía (1.5), COGEP (texto de los arts. 233 a 248), tutoría y diapositivas de la semana 4 (impartida por otro docente, Paul, que da otros paralelos según la docente Orosco; la diapositiva dice \"ciclos A y B\"; la docente del paralelo D no estuvo esa semana).\n\n## Contradicciones registradas\n\n- La diapositiva 10 de la semana 4 advierte que la regla de \"seis meses\" del abandono en la presentación original requería corrección. El texto vigente del COGEP (art. 245, reformado en 2019) fija **seis meses** desde el día siguiente de la última notificación de una providencia útil. Verificar la versión vigente antes de citar.\n- La guía agrupa conciliación y transacción como una forma; el COGEP las regula en artículos distintos (233 a 235).\n\n## Estado de actualización\n\nIncorporado el 31-oct-2026.\n## Actualización del 7-nov-2026\n\nFuente nueva: tutoría de la semana 6 (cuestionario de 20 preguntas de la docente Orosco, todas las respuestas de la clave confirmadas). Contradicción registrada: la docente dijo que el abandono tampoco cabe en sumarios; el art. 247 no lo incluye. Ver `salida/resumenes/derecho_procesal_II_no_penal/clase_06_tutoria_cuestionario_previo_a_la_evaluacion.md`.\n"}]},{"id":"la_prueba_y_los_medios_de_prueba","titulo":"La prueba y los medios de prueba (COGEP, arts. 158 a 229)","docs":[{"k":"conceptos","n":"Conceptos","md":"# Conceptos: La prueba y los medios de prueba\n\n## Reglas generales (arts. 158 a 169)\n\n- **Finalidad:** llevar al juzgador al convencimiento de los hechos y circunstancias controvertidos (art. 158).\n- **Oportunidad (art. 159):** la prueba documental que se tiene o era posible obtener se adjunta a la demanda, contestación, reconvención y contestación a la reconvención. La de imposible acceso **se anuncia**. La no anunciada no se introduce en la audiencia, salvo las excepciones del Código.\n- **Admisibilidad (art. 160):** pertinencia, utilidad y conducencia, practicada conforme a la ley, con lealtad y veracidad. En la audiencia preliminar o en la segunda fase de la audiencia única se rechaza de oficio o a petición la impertinente, inútil e inconducente; la obtenida con violación de la Constitución o la ley es **improcedente**.\n- **Conducencia y pertinencia (art. 161):** aptitud del contenido para demostrar el hecho; relación directa o indirecta con lo controvertido.\n- **Necesidad (art. 162):** deben probarse los hechos alegados; el juez no puede usar su conocimiento propio de los hechos.\n- **No requieren prueba (art. 163):** hechos afirmados por una parte y admitidos por la otra; hechos imposibles; notorios; presumidos de derecho.\n- **Valoración (art. 164):** la prueba debe solicitarse, practicarse e incorporarse en los términos legales; se aprecia en conjunto con sana crítica; el juez expresa la valoración de todas las pruebas que justifican su decisión.\n- **Contradicción (art. 165):** derecho a conocer oportunamente la prueba, oponerse y contradecirla.\n- **Prueba nueva (art. 166):** se puede pedir prueba no anunciada hasta antes de la convocatoria a la audiencia de juicio o única, siempre que se acredite que no era conocida por la parte a la que beneficia o que, conociéndola, no pudo disponer de ella. El juez acepta o no según su sana crítica.\n- **Prueba en el extranjero (art. 167):** funcionarios consulares por medios telemáticos; exhorto o carta rogatoria.\n- **Prueba para mejor resolver (art. 168):** excepcionalmente el juez ordena de oficio, con expresión de razones, la prueba necesaria para esclarecer hechos controvertidos; la audiencia puede suspenderse hasta quince días.\n- **Carga de la prueba (art. 169):** el actor prueba los hechos que afirma y el demandado niega; el demandado no está obligado a probar si su contestación es simple o absolutamente negativa, pero sí si afirma hechos, derecho o calidad de la cosa. Hay reglas especiales (alimentos, ambiental) según la guía.\n\n## Medios de prueba\n\n- **Testimonial (arts. 174 a 177):** declaración de una parte o de un tercero; se practica en la audiencia de juicio o en la segunda fase de la única; interrogatorio por quien la propone y contrainterrogatorio; el juez solo pide aclaraciones; se rinde con juramento y asistido por defensor; se puede negar a responder si hay responsabilidad penal propia o de familiares o secreto profesional. Se anuncian nombres, domicilio y hechos; la guía menciona notificación con tres días de anticipación. Declaración anticipada en audiencia especial para quien está gravemente enfermo, imposibilitado o saldrá del país.\n- **Documental (arts. 193 a 196):** todo documento público o privado que recoja o represente un hecho o declare, constituya o incorpore un derecho. Se presentan en original o copia certificada; se leen o exhiben en la parte pertinente; los públicos hacen fe aun contra terceros en otorgamiento, fecha y declaraciones del servidor, pero no sobre la verdad de lo declarado por los interesados.\n- **Pericial (arts. 221 a 227):** el perito es la persona acreditada por el Consejo de la Judicatura con conocimientos científicos, técnicos, artísticos, prácticos o profesionales; presenta informe y lo sustenta en audiencia; si no comparece sin justificación, el informe carece de eficacia. Informes contradictorios: debate y, si persisten dudas, nuevo peritaje por sorteo (art. 226).\n- **Inspección judicial (arts. 228 y 229):** el juez examina directamente lugares, cosas o documentos, de oficio o a petición de parte; se solicita con la demanda o la contestación, precisando los motivos.\n\n## Qué dijo la docente (semana 5)\n\nLa demanda y la contestación son los actos preclusivos para formular pretensiones y excepciones y anunciar toda la prueba; el éxito depende de la técnica probatoria y no del auxilio del juez; el sistema es oral por audiencias. [Diapositivas y tutoría; con las salvedades de arriba]\n"},{"k":"definiciones","n":"Definiciones","md":"# Definiciones: La prueba y los medios de prueba\n\n## Prueba\n\nElementos con los que se demuestra al juzgador la teoría del caso para convencerlo de los hechos controvertidos (art. 158; guía).\n\n## Conducencia\n\nAptitud del contenido de la prueba para demostrar el hecho (art. 161).\n\n## Pertinencia\n\nReferencia directa o indirecta a los hechos controvertidos (art. 161).\n\n## Utilidad\n\nQue la prueba sirva para esclarecer el hecho (art. 160, junto con pertinencia y conducencia).\n\n## Sana crítica\n\nRegla de apreciación conjunta de la prueba (art. 164).\n\n## Carga de la prueba\n\nObligación de probar los hechos propuestos o afirmados (art. 169).\n\n## Prueba nueva\n\nPrueba no anunciada que se admite antes de la convocatoria a audiencia de juicio o única si se acredita que no era conocida o no pudo disponerse de ella (art. 166).\n\n## Prueba para mejor resolver\n\nPrueba ordenada de oficio, excepcionalmente y con razones, para esclarecer hechos controvertidos (art. 168).\n\n## Perito\n\nPersona acreditada por el Consejo de la Judicatura para informar al juez sobre un hecho de su ciencia o arte (art. 221).\n"},{"k":"ejemplos","n":"Ejemplos","md":"# Ejemplos: La prueba y los medios de prueba\n\n- **Prueba no anunciada (video foro):** Carmen demanda alimentos sin anunciar prueba de los ingresos de Esteban. No puede presentarla en la audiencia (art. 159); solo cabe prueba nueva si acredita que no la conocía o no pudo disponer de ella (art. 166).\n- **Hechos que no requieren prueba:** el demandado admite en la contestación que firmó la letra de cambio; ese hecho queda fuera del debate probatorio (art. 163.1).\n- **Inspección judicial (amparo posesorio):** el actor pide que el juez examine el lote para verificar el cerramiento y los mojones (art. 228).\n- **Carga:** el demandado que solo niega los hechos no tiene que probar; si alega un abono, debe probarlo (art. 169).\n"},{"k":"preguntas_frecuentes","n":"Preguntas","md":"# Preguntas frecuentes: La prueba y los medios de prueba\n\n1. ★ ¿Cuál es la finalidad de la prueba? (art. 158) [Foro 1: capacidad de debate sobre el capítulo de la prueba]\n2. ★ ¿Qué requisitos debe reunir la prueba para ser admitida? (art. 160)\n3. ★ ¿Cuándo se anuncia la prueba y qué pasa con la no anunciada? (art. 159)\n4. ★ ¿En qué casos se admite prueba nueva? (art. 166)\n5. ★ ¿Existen hechos que no requieren ser probados? **Verdadero** (art. 163). [Guía, V/F]\n6. ¿Quién tiene la carga de la prueba? ¿Cuándo debe probar el demandado? (art. 169)\n7. ¿Qué es la prueba para mejor resolver y qué límite tiene? (art. 168)\n8. ¿Cómo se practica la prueba testimonial? (arts. 174 a 177)\n9. ¿Qué eficacia tienen los documentos públicos? (art. 193 y siguientes)\n10. ¿Quién puede ser perito y qué pasa si no comparece? (art. 221 y siguientes)\n11. ¿Cuándo se pide la inspección judicial? (arts. 228 y 229)\n\nRespuestas sugeridas en `salida/examenes/derecho_procesal_II_no_penal_simulacro_unidad_01.md`.\n"},{"k":"bibliografia","n":"Bibliografía","md":"# Bibliografía: La prueba y los medios de prueba\n\n## Obligatoria (sílabo y guía)\n\n- Código Orgánico General de Procesos (COGEP). Versión Lexis actualizada a febrero de 2021 en `entrada/bibliografia/Normas/COGEP_act_feb-2021.pdf`. Reformas posteriores: no verificadas.\n- Aguirrezabal Grünstein, M. (2017). El principio dispositivo y su influencia en la determinación del objeto del proceso en el proceso civil chileno. *Revista de Derecho Privado*, (32), 423-441. https://doi.org/10.18601/01234366.n32.14 (la guía la fecha en 2019 y le atribuye otro ISSN: es un error de la guía).\n- Ramírez Romero, C. (2015). *Principales cuestiones acerca del COGEP en preguntas y respuestas*. Corte Nacional de Justicia. Es anterior a la reforma de 2019.\n\n## Complementaria\n\nVer `entrada/bibliografia/LISTA_BIBLIOGRAFIA_POR_MATERIA.md` (Larroucau 2019, Peñaranda Valbuena 2011, Quintero y Prieto 1995, solo portadas e índices).\n\n## Videos de la guía\n\n- Demanda y contestación: https://www.youtube.com/watch?v=GyTPBK_UDeo\n- Litisconsorcio: https://www.youtube.com/watch?v=N1g8R6PUsWo\n- Carga dinámica de la prueba, Jairo Parra Quijano: https://www.youtube.com/watch?v=RtSo0eI76XA\n"},{"k":"jurisprudencia","n":"Jurisprudencia","md":"# Jurisprudencia: La prueba y los medios de prueba\n\nNo consta jurisprudencia en las fuentes del curso (los docentes no citaron ninguna). No es un faltante: se llena solo si una tarea la pide. Ni la guía, ni el sílabo ni las clases citan jurisprudencia de este tema.\n\nPor investigar: criterios de la Corte Nacional de Justicia sobre este tema (Investigador Académico, con búsqueda real y fecha de consulta).\n"},{"k":"_ficha","n":"Ficha","md":"# Ficha del Gestor de Conocimiento\n\n**Materia:** Derecho Procesal II (No Penal)\n**Unidad:** 1 · Actos de proposición y medios de prueba (sílabo)\n**Tema:** La prueba y los medios de prueba (COGEP, arts. 158 a 229)\n\n## Conceptos incorporados\n\nFinalidad, admisibilidad (pertinencia, utilidad, conducencia), necesidad, hechos que no requieren prueba, carga, valoración, contradicción, prueba nueva, prueba para mejor resolver, testimonial, documental, pericial, inspección judicial.\n\n## Fuentes\n\nGuía (1.4), COGEP (texto de los arts. 158 a 169 y 174 a 229 revisados), diapositivas de la semana 5.\n\n## Contradicciones registradas\n\n- Ver el tema de actos de proposición: \"hechos sobrevenidos\", \"solemne juramento\" y \"prohibición expresa de suplencia\" no están en el texto del COGEP.\n- La guía llama \"prueba de oficio\" a lo que el art. 168 titula \"prueba para mejor resolver\".\n\n## Estado de actualización\n\nIncorporado el 31-oct-2026.\n"}]},{"id":"sujetos_procesales_y_principio_dispositivo","titulo":"Sujetos procesales (arts. 30 a 50 del COGEP) y principio dispositivo","docs":[{"k":"conceptos","n":"Conceptos","md":"# Conceptos: Sujetos procesales y principio dispositivo\n\n## Sujetos procesales\n\n- Son personas naturales, personas jurídicas, comunidades, pueblos, nacionalidades o colectivos, y la naturaleza debidamente representada. [Guía 1.1; COGEP 30 y 38]\n- Deben ser legalmente capaces (art. 31). Los menores de edad e incapaces comparecen por representante (art. 32); los adolescentes tienen excepcionalmente derecho de acción para proteger sus derechos. [Guía]\n- Las partes comparecen con **defensor** (art. 36); los escritos se aceptan firmados por abogado, salvo excepciones. [COGEP; guía]\n- **Procurador común** (art. 37): se nombra cuando hay dos o más actores o demandados por un mismo derecho; no necesita ser abogado y debe ser uno de los actores o demandados. [Guía; COGEP]\n- **Procuración judicial** (arts. 41 a 45): mandatario con poder para comparecer. Requiere cláusula especial para sustituir, allanarse, transigir, desistir de la acción o de un recurso, aprobar convenios, absolver posiciones, deferir el juramento decisorio, recibir valores o la cosa litigiosa o tomar posesión de ella (art. 43). [Guía; COGEP]\n- **Renuncia** del defensor (art. 44): por objeción de conciencia o incumplimiento contractual del cliente; se comunica al mandante, que tiene quince días para nombrar otro; no suspende los términos.\n- **Tercerías** (arts. 46 a 50): intervención de un tercero a quien la providencia le causa perjuicio directo; derechos comprometidos, no meras expectativas. Clases: **excluyentes de dominio** y **coadyuvantes** (art. 47). Oportunidad (art. 48): en el ordinario, diez días después de notificada la convocatoria a audiencia de juicio; en el sumario, cinco días antes de la audiencia; en la ejecución, desde la convocatoria a audiencia de ejecución hasta su realización. El tercero tiene los mismos derechos y deberes que las partes (art. 50).\n- **Régimen del abogado:** incompatibilidades e impedimentos, deberes y prohibiciones están en el Código Orgánico de la Función Judicial (arts. 328 incompatibilidad, 329 impedimentos, 330 deberes y 335 prohibiciones). [Guía; COFJ verificado el 31-oct-2026]\n\n## Principio dispositivo\n\n- Supone que las partes tienen la disposición del proceso **desde el inicio hasta el final**; se funda en que son dueñas del derecho material en discusión y, por eso, del procesal. Solo rige donde se discuten derechos disponibles. [Guía 1.2]\n- Base constitucional: el art. 168 numeral 6 de la Constitución establece el sistema oral conforme a los principios de concentración, contradicción y dispositivo. [Diapositiva semana 5; texto de la Constitución verificado antes en el proyecto]\n- Base legal: el art. 19 del COFJ (todo proceso se promueve por iniciativa de parte legitimada; los jueces resuelven conforme a lo fijado por las partes y a la prueba pedida y actuada). [Docente; art. 19 del COFJ verificado el 31-oct-2026 en `entrada/bibliografia/Normas/Código Orgánico de la Función Judicial.pdf`]\n- Manifestaciones: iniciativa (demanda, contestación, reconvención) y disponibilidad (conciliación, transacción, desistimiento). [Diapositiva]\n- **Fijación del debate:** el objeto del proceso se fija con la demanda y la contestación, y tiene dos elementos, la petición y la causa de pedir (Aguirrezabal, 2017, p. 428). La sentencia debe ser congruente con ese objeto (COGEP, art. 92).\n"},{"k":"definiciones","n":"Definiciones","md":"# Definiciones: Sujetos procesales y principio dispositivo\n\n## Parte\n\nSujeto procesal que propone la demanda y aquel contra quien se la propone (COGEP, art. 30).\n\n## Procurador común\n\nRepresentante único de varios actores o demandados con un mismo derecho (art. 37).\n\n## Tercería\n\nIntervención de un tercero en un proceso en curso, excluyente de dominio o coadyuvante (arts. 46 a 50).\n\n## Principio dispositivo\n\nPoder de las partes sobre el inicio, el desarrollo y el fin del proceso en que se discuten derechos disponibles. [Guía]\n\n## Objeto del proceso\n\nLo que se pide (petitum) y su fundamento fáctico y jurídico (causa de pedir), fijados en la demanda y la contestación. [Aguirrezabal, p. 428]\n\n## Congruencia\n\nDeber del juez de resolver sobre lo pedido y en los términos fijados por las partes (COGEP, art. 92).\n"},{"k":"ejemplos","n":"Ejemplos","md":"# Ejemplos: Sujetos procesales y principio dispositivo\n\n- **Procuración con cláusula especial:** un mandatario no puede allanarse ni desistir sin que el poder lo autorice expresamente (art. 43). [Guía]\n- **Tercería excluyente de dominio:** en un secuestro se retiene un vehículo que no es del deudor y su dueño interviene. [Deducción sobre el art. 47]\n- **Objeto blindado:** en un divorcio la parte actora alega que el demandado abandonó el hogar el 5 de enero de 2020; toda la prueba debe orientarse a ese hecho. [Docente, semana 5, ejemplo]\n- **Impulso de parte:** el abogado, y no el ayudante judicial, saca las copias para citar al demandado. [Docente, semana 5]\n"},{"k":"preguntas_frecuentes","n":"Preguntas","md":"# Preguntas frecuentes: Sujetos procesales y principio dispositivo\n\n1. ★ ¿Qué es el principio dispositivo y en qué procesos opera? [Guía; foro y video foro]\n2. ★ ¿Qué relación tiene el principio dispositivo con la fijación del objeto del proceso? [Aguirrezabal, guía]\n3. ¿Quiénes pueden ser sujetos procesales? ¿Puede serlo la naturaleza?\n4. ¿Cuándo se nombra procurador común y debe ser abogado?\n5. ¿Qué actos requieren cláusula especial en una procuración judicial? (art. 43)\n6. ¿Qué plazo tiene el mandante para nombrar nuevo defensor tras la renuncia? (15 días, art. 44)\n7. ¿Qué clases de tercerías existen y cuándo se proponen? (arts. 47 y 48)\n8. ¿En qué artículo del COGEP está la congruencia de las sentencias? (art. 92; las diapositivas dicen 252)\n\nRespuestas sugeridas en `salida/examenes/derecho_procesal_II_no_penal_simulacro_unidad_01.md`.\n"},{"k":"bibliografia","n":"Bibliografía","md":"# Bibliografía: Sujetos procesales y principio dispositivo\n\n## Obligatoria (sílabo y guía)\n\n- Código Orgánico General de Procesos (COGEP). Versión Lexis actualizada a febrero de 2021 en `entrada/bibliografia/Normas/COGEP_act_feb-2021.pdf`. Reformas posteriores: no verificadas.\n- Aguirrezabal Grünstein, M. (2017). El principio dispositivo y su influencia en la determinación del objeto del proceso en el proceso civil chileno. *Revista de Derecho Privado*, (32), 423-441. https://doi.org/10.18601/01234366.n32.14 (la guía la fecha en 2019 y le atribuye otro ISSN: es un error de la guía).\n- Ramírez Romero, C. (2015). *Principales cuestiones acerca del COGEP en preguntas y respuestas*. Corte Nacional de Justicia. Es anterior a la reforma de 2019.\n\n## Complementaria\n\nVer `entrada/bibliografia/LISTA_BIBLIOGRAFIA_POR_MATERIA.md` (Larroucau 2019, Peñaranda Valbuena 2011, Quintero y Prieto 1995, solo portadas e índices).\n\n## Videos de la guía\n\n- Demanda y contestación: https://www.youtube.com/watch?v=GyTPBK_UDeo\n- Litisconsorcio: https://www.youtube.com/watch?v=N1g8R6PUsWo\n- Carga dinámica de la prueba, Jairo Parra Quijano: https://www.youtube.com/watch?v=RtSo0eI76XA\n"},{"k":"jurisprudencia","n":"Jurisprudencia","md":"# Jurisprudencia: Sujetos procesales y principio dispositivo\n\nNo consta jurisprudencia en las fuentes del curso (los docentes no citaron ninguna). No es un faltante: se llena solo si una tarea la pide. Ni la guía, ni el sílabo ni las clases citan jurisprudencia de este tema.\n\nPor investigar: criterios de la Corte Nacional de Justicia sobre este tema (Investigador Académico, con búsqueda real y fecha de consulta).\n"},{"k":"_ficha","n":"Ficha","md":"# Ficha del Gestor de Conocimiento\n\n**Materia:** Derecho Procesal II (No Penal)\n**Unidad:** 1 · Actos de proposición y medios de prueba (sílabo)\n**Tema:** Sujetos procesales (arts. 30 a 50 del COGEP) y principio dispositivo\n\n## Conceptos incorporados\n\nParte, capacidad procesal, patrocinio, procurador común, procuración judicial y cláusula especial, renuncia de la defensa, tercerías, principio dispositivo, objeto del proceso, congruencia.\n\n## Fuentes\n\nGuía (sección 1.1 y 1.2), COGEP (texto), Aguirrezabal (2017), diapositivas de la semana 5.\n\n## Contradicciones registradas\n\n- Las diapositivas de la semana 5 citan la congruencia como \"art. 252 COGEP\". El art. 252 trata de la improcedencia de recursos sucesivos; la congruencia de las sentencias está en el **art. 92**. Para el examen, usar el art. 92.\n- Las diapositivas citan el art. 19 del Código Orgánico de la Función Judicial como fuente del principio dispositivo. El art. 19 **sí existe** en el COFJ (verificado el 31-oct-2026: principios dispositivo, de inmediación y concentración) y dice lo que explicó la docente.\n\n## Información pendiente\n\nDesarrollo de litisconsorcio (art. 37 en adelante y video de la guía).\n\n## Estado de actualización\n\nIncorporado el 31-oct-2026.\n"}]}]},{"id":"unidad_02_procedimientos_ordinario_y_sumario","num":2,"titulo":"Unidad 2 · Procedimientos ordinario y sumario","pendiente":true,"estructura":"# Unidad 2 · Procedimientos ordinario y sumario\n\nEstructura del sílabo. Aún no hay clases de esta unidad (semanas 7 a 11, 9 nov a 13 dic 2026; evaluación 15 y 16 dic).\n\n## Temas (carpetas por crear cuando haya clase)\n\n- `aplicacion_y_diferencias_entre_procedimiento_ordinario_y_sumario` (COGEP arts. 289 a 298 el ordinario; 332 y 333 el sumario)\n- `etapas_y_audiencias_de_los_procedimientos_ordinario_y_sumario`\n\n## Actividades (sílabo)\n\n- ACD: foro (400 a 500 palabras, mínimo tres disposiciones del COGEP, una fuente doctrinaria, comentar a un compañero) y video foro sobre la determinación del procedimiento aplicable.\n- APE: estudio comparativo de casos y piezas procesales (dos demandas, una por procedimiento, con al menos dos instituciones como diligencia preparatoria o providencia preventiva) y portafolio jurídico.\n- AA: storyboard jurídico comparativo de las etapas, términos y audiencias.\n\n## Lo que ya se sabe\n\nDel sumario (art. 333): no se reforma la demanda, solo reconvención conexa, contestación en 15 días, audiencia única en dos fases dentro de 30 días de la contestación, resoluciones apelables. Las acciones posesorias se tramitan por sumario (art. 332.2).\n","temas":[]},{"id":"unidad_03_procedimientos_voluntarios_ejecutivo_y_monitorio","num":3,"titulo":"Unidad 3 · Procedimientos voluntarios ejecutivo y monitorio","pendiente":true,"estructura":"# Unidad 3 · Procedimientos voluntarios, ejecutivo y monitorio\n\nEstructura del sílabo. Sin clases aún (semanas 13 a 17, enero y febrero de 2027).\n\n## Temas (carpetas por crear cuando haya clase)\n\n- `procedimientos_voluntarios` (COGEP arts. 334 a 337)\n- `procedimiento_ejecutivo` (arts. 347 a 355)\n- `procedimiento_monitorio` (arts. 356 a 361)\n- `recursos_horizontales_y_verticales` (arts. 250 a 252 y siguientes)\n\n## Actividades (sílabo)\n\n- ACD: foro (ejecutivo frente a monitorio; oposición y celeridad) y video foro.\n- APE: análisis de caso y simulación de audiencia (video e informe grupal).\n- AA: ensayo jurídico argumentativo sobre recursos.\n\n## Lo que ya se sabe\n\nEl procedimiento ejecutivo se trabajó a fondo en el APE de la unidad 1 (letra de cambio): arts. 347 a 355 y Código de Comercio arts. 84, 113 a 120, 138, 141, 155, 156, 160 y 179 (texto de 2019). Ver `salida/material_estudio/DerechoProcesalIINoPenal/Entregables/`.\n","temas":[]}],"normas":"","resumenes":[{"id":"clase_01_tutoria_de_encuadre","titulo":"Resumen Ejecutivo: Semana 1, tutoría de encuadre","md":"# Resumen Ejecutivo: Semana 1, tutoría de encuadre\n\n**Agente:** Analista de Clases · **Fuente:** `entrada/guias/DerechoProcesalIINoPenal/Clases/Semana_01.txt` (docente Ximena Orosco, 28 sep a 4 oct 2026). Clase administrativa: no tiene contenido jurídico.\n\n## Ubicación en el Sílabo\n\nUnidad 1, semana 1 (socialización del sílabo).\n\n## Temas Principales\n\nPresentación de la docente y de los estudiantes; organización de la asignatura; actividades de la unidad 1; problemas de acceso al EVA.\n\n## Indicaciones Administrativas\n\n- Tutoría los **viernes de 19h00 a 21h00**: la primera hora es la tutoría y la segunda una actividad práctica (de refuerzo). La actividad práctica queda abierta hasta el domingo y no se pone cero a quien no asiste.\n- La conexión no es obligatoria. El video foro, que se hace una o dos semanas antes de cerrar la unidad, **ya no califica la asistencia** (desde el ciclo anterior), pero la docente pide asistir.\n- La docente compartirá enlaces de audiencias reales de la Unidad Judicial Civil de Loja (voluntario); se pueden ver en vivo con nombre \"estudiante UNL\" y cámara apagada, o ir presencialmente. No hay grabaciones.\n- Se carga una evaluación diagnóstica **no calificada** sobre Derecho Procesal I.\n- El 9 de octubre (viernes siguiente) fue feriado: se dejó una lectura voluntaria.\n- Las preguntas que se trabajen cada semana \"servirán de soporte para la evaluación de cada unidad\".\n- El sílabo y la guía no eran visibles en el EVA; los enlaces del artículo de Aguirrezabal y del libro base no abrían. La docente subió los documentos como anuncio.\n- Presidente del paralelo: Jason Paul Sarango.\n- Un estudiante pidió estudiar doctrina ecuatoriana en lugar de chilena; la docente aceptó traer material ecuatoriano en clase y recordó la utilidad del derecho comparado.\n\n## Relación con Actividades Calificadas\n\nSe describieron: foro académico (hasta el 25 oct, leer COGEP arts. 120 a 249 y el artículo de Aguirrezabal), infografía científica (AA) y el caso de la **letra de cambio** como APE (demanda y contestación, el estudiante asume alternadamente el papel de actor y demandado).\n\n## Posibles Preguntas de Examen\n\nNinguna de contenido jurídico.\n\n## Nivel de importancia\n\n★★★ Administrativo. Las reglas de entrega y las fechas son lo útil.\n"},{"id":"clase_03_diligencias_preparatorias_providencias_y_apremios","titulo":"Resumen Ejecutivo: Semana 3, diligencias preparatorias, providencias preventivas, apremios y estructura de la demanda","md":"# Resumen Ejecutivo: Semana 3, diligencias preparatorias, providencias preventivas, apremios y estructura de la demanda\n\n**Agente:** Analista de Clases · **Fuentes:** `Clases/Semana_03.txt` y `DiapositivasClases/Semana_03.pdf` (docente Ximena Orosco, 12 a 18 oct 2026; la transcripción tiene saludos y lectura de artículos por estudiantes; este resumen se apoya sobre todo en las diapositivas, y los datos de la clase se marcan [Clase]).\n\n## Ubicación en el Sílabo\n\nUnidad 1, semana 3. Contenido: disposiciones comunes a todos los procesos no penales (COGEP arts. 120 a 143).\n\n## Temas Principales\n\n1. **Diligencias preparatorias** (arts. 120 a 123): actuaciones previas al proceso para asegurar pruebas o completar la legitimación.\n2. **Providencias preventivas** (arts. 124 a 133): secuestro, retención, prohibición de enajenar inmuebles y arraigo.\n3. **Apremios** (arts. 134 a 140): personales y reales; apremio en alimentos (art. 137).\n4. **Estructura de la demanda** (arts. 142 y 143) y actos de proposición: demanda, contestación, reconvención, prueba y sentencia.\n\n## Conceptos Clave\n\n- Las diligencias preparatorias **aseguran pruebas, identifican partes y derechos y aclaran hechos**.\n- Providencias preventivas: se piden **antes de la demanda y dentro del proceso** (art. 124); requisitos (art. 125): crédito probado y riesgo para los bienes; se pueden interrumpir con caución (art. 128); la apelación es en efecto no suspensivo (art. 132); caducan en 15 días si no se demanda (art. 133).\n- Retención: rentas, créditos o bienes en poder de un tercero (alquileres, salarios, deudas, vehículo, dinero); se notifica al tercero y se puede impugnar en tres días.\n- Arraigo: sobre persona extranjera, para impedir que salga del país.\n\n## Definiciones\n\n- Diligencias preparatorias, providencias preventivas y apremios: ver `conocimiento/derecho_procesal_II_no_penal/unidad_01.../diligencias_preparatorias_providencias_preventivas_y_apremios/definiciones.md`.\n\n## Ejemplos del Docente\n\nAlimentos: padre que debe pensiones y se le retiene un vehículo o se le aplica boleta de apremio si no paga; ofrecer pagar USD 500 y el saldo en cuotas de USD 100 [Clase].\n\n## Temas Enfatizados\n\nLa diferencia entre diligencia preparatoria (antes del proceso) y providencia preventiva (antes o dentro); que los documentos del art. 143 se acompañan siempre a la demanda; que la demanda se redacta siguiendo el art. 142 [Clase].\n\n## Normas y Autores Citados\n\nCOGEP arts. 120 a 143. Concordancia de la docente con alimentos (art. 137). **Advertencia:** la diapositiva sobre tipos de providencias incluye \"embargo\", que el COGEP no lista como providencia preventiva.\n\n## Indicaciones Administrativas\n\nLa docente pidió hacer la actividad práctica de la semana en la clase siguiente; hubo dudas del EVA sobre fechas de entrega (las fechas válidas son las de la guía).\n\n## Relación con Actividades Calificadas\n\nForo (diligencias preparatorias en la capacidad de síntesis), infografía (guía manda revisar arts. 120 a 249) y APE (la demanda ejecutiva usa el art. 142; la prohibición de enajenar sirve de providencia previa).\n\n## Posibles Preguntas de Examen\n\n★★★★★ Verdadero o falso de la guía: \"todo proceso empieza con las diligencias preparatorias\" (falso), \"las providencias preventivas solo se presentan dentro del proceso\" (falso), \"los apremios cesan a los 30 días\" (verdadero) y \"debe haber audiencia en las providencias preventivas\" (verdadero, art. 127).\n★★★★ Requisitos del art. 125; efecto de la apelación (art. 132); caducidad (art. 133).\n\n## Recomendaciones para Estudiar\n\nLeer los arts. 120 a 140 con la lista del COGEP, no la de la diapositiva. Practicar con el simulacro de unidad.\n\n## Nivel de importancia\n\n★★★★★ Las preguntas de verdadero o falso de la guía. ★★★ El resto como contexto de la demanda.\n"},{"id":"clase_04_formas_extraordinarias_de_conclusion","titulo":"Resumen Ejecutivo: Semana 4, formas extraordinarias de conclusión del proceso","md":"# Resumen Ejecutivo: Semana 4, formas extraordinarias de conclusión del proceso\n\n**Agente:** Analista de Clases · **Fuentes:** `Clases/Semana_04.txt` y `DiapositivasClases/Semana_4_Derecho_Procesal_No_Penal_II.pptx`. Tutoría dada por el docente Paul a los ciclos A y B; la docente Orosco no estuvo.\n\n## Ubicación en el Sílabo\n\nUnidad 1, semana 4. Guía, sección 1.5; COGEP arts. 233 a 248.\n\n## Temas Principales\n\nConciliación, transacción, retiro de la demanda, desistimiento, allanamiento y abandono. Pregunta orientadora: ¿todos estos mecanismos producen los mismos efectos?\n\n## Conceptos Clave\n\n- Autocomposición (conciliación, transacción), actos unilaterales (desistimiento, allanamiento) e inactividad (abandono).\n- El control judicial subsiste aunque las partes quieran terminar el proceso.\n- El docente leyó los artículos con participación de los estudiantes: 237 (desistimiento), 239 (validez), 241 y 242 (allanamiento), 233 y 234 (conciliación), 235 (transacción) y 245 (abandono).\n\n## Definiciones\n\nVer `conocimiento/derecho_procesal_II_no_penal/unidad_01.../formas_extraordinarias_de_conclusion_del_proceso/definiciones.md`.\n\n## Ejemplos del Docente\n\nCaso de apertura (deuda con propuesta de acuerdo); caso Ana y Luis (USD 12.000, reconoce USD 8.000); transacción de USD 7.000 sobre USD 9.000; una letra de cambio de USD 10.000 que sube a 13.000 o 14.000 con intereses tras años de espera.\n\n## Temas Enfatizados\n\n- Término y plazo: los términos se cuentan en días hábiles, sin feriados ni fines de semana. **Por verificar** con el COGEP (arts. 64 a 66).\n- El allanamiento solo es posible antes de la sentencia y no procede con derechos indisponibles (niñez, incapaces). No significa sentencia inmediata cuando es parcial.\n- La conciliación se realiza en audiencia ante el juez; el docente discutió con estudiantes si la transacción también se hace en audiencia: el art. 235 solo dice que se presenta al juez.\n- Advertencia en la diapositiva 10: la regla de \"seis meses\" del abandono de la presentación original requería corrección; el COGEP vigente (art. 245) dice seis meses desde la última notificación útil. Verificar.\n\n## Normas y Autores Citados\n\nCOGEP arts. 233 a 248; Código Civil art. 33 (cómputo del plazo del abandono).\n\n## Relación con Actividades Calificadas\n\nAPE (la letra de cambio: allanamiento parcial por el abono, transacción); evaluación sumativa.\n\n## Posibles Preguntas de Examen\n\n★★★★★ Las cuatro preguntas de análisis de la diapositiva 13: diferencia entre aceptar una pretensión y negociar; qué revisa el juez antes de aprobar un acuerdo; por qué el abandono no equivale al desistimiento; riesgo de decir que todas las figuras producen cosa juzgada.\n★★★★ Requisitos de validez del desistimiento (art. 239); causales de ineficacia del allanamiento (art. 242).\n\n## Recomendaciones para Estudiar\n\nHacer una tabla de las cinco figuras con quién actúa, hasta cuándo, qué efecto tiene y qué controla el juez (ver `salida/material_estudio/DerechoProcesalIINoPenal/hoja_de_repaso_unidad_01.md`).\n\n## Nivel de importancia\n\n★★★★★ Todo el tema: es el contenido 1.5 de la guía y el docente lo planteó con preguntas de análisis (no se dijo expresamente que sea de examen).\n"},{"id":"clase_05_video_foro_actos_de_proposicion","titulo":"Resumen Ejecutivo: Semana 5, video foro: actos de proposición y principio dispositivo","md":"# Resumen Ejecutivo: Semana 5, video foro: actos de proposición y principio dispositivo\n\n**Agente:** Analista de Clases · **Fuentes:** `Clases/Semana_05.txt` (la transcripción termina cortada en \"No podrá producirse prueba no anunciada…\") y `DiapositivasClases/DERECHO PROCESAL II- SEMANA 5- VIDEO FORO.pdf` (imagen, leída con OCR). Docente Ximena Orosco, 26 oct a 1 nov 2026.\n\n## Ubicación en el Sílabo\n\nUnidad 1, semana 5: video foro (ACD 2). Tema: actos de proposición, principio dispositivo, prueba y medios de prueba.\n\n## Temas Principales\n\n1. Actos de proposición: actuaciones de las partes para iniciar el juicio, formular pretensiones y excepciones y delimitar el objeto del litigio.\n2. Principio dispositivo: Constitución art. 168.6, COFJ art. 19; fijación del debate (\"objeto blindado\").\n3. Preclusión probatoria: demanda y contestación como actos para anunciar la prueba.\n4. Admisibilidad y producción de la prueba; prueba nueva; prueba de oficio.\n\n## Conceptos Clave\n\n- \"Cuando escuchen acto de proposición, es la demanda\" (la docente simplifica; el concepto incluye contestación y reconvención).\n- La reconvención es la \"contrademanda\".\n- Lo que se afirma debe demostrarse; el juez llega a la verdad con la prueba de las partes.\n- Sistema oral por audiencias (art. 4 COGEP, según la diapositiva).\n\n## Ejemplos del Docente\n\nDivorcio: la parte actora afirma que abandonó el hogar el 5 de enero de 2020; el debate se fija en ese hecho. Los abogados, no los servidores judiciales, sacan las copias para citar al demandado en procesos civiles.\n\n## Normas y Autores Citados\n\nCRE art. 168; COFJ art. 19; COGEP arts. 4, 6, 26, 93, 141 y siguientes, 142, 148, 151 a 154, 158, 159, 160, 165, 166, 168, 169, 174 a 177, 193 a 196, 228 y 229, 294 y 297, 252.\n\n**Correcciones al texto de las diapositivas (hechas por el estudiante con el COGEP en la mano):**\n- \"Hechos sobrevenidos\" y \"solemne juramento\" no figuran en el art. 166: solo exige acreditar que la prueba no era conocida o que no se pudo disponer de ella.\n- \"Prohibición expresa de suplencia\" no figura en el art. 168 (prueba para mejor resolver): el límite se deduce del art. 169 y del principio dispositivo.\n- La congruencia está en el art. 92, no en el 252.\n\n## Indicaciones Administrativas\n\nEl video foro tiene un caso práctico y, tres preguntas (la docente dijo que había borrado dos de las cinco). Se responde por escrito en el EVA hasta el domingo 1 de noviembre. Se calificaba lo escrito, no la asistencia.\n\n## Relación con Actividades Calificadas\n\nVideo foro (caso Carmen v. Esteban, alimentos): se entregó `Entregables/VideoForo - Los actos de proposición - UnidadI.pdf`.\n\n## Posibles Preguntas de Examen\n\n★★★★★ Preclusión del anuncio de prueba; requisitos de la prueba nueva (art. 166); límites de la prueba de oficio (art. 168); carga de la prueba (art. 169).\n★★★★ Principio dispositivo y fijación del objeto del proceso.\n\n## Recomendaciones para Estudiar\n\nEstudiar los arts. 158 a 169 en el texto del COGEP, no en las diapositivas; ver el tema `la_prueba_y_los_medios_de_prueba`.\n\n## Nivel de importancia\n\n★★★★★ Tema central de la evaluación de la unidad.\n"},{"id":"clase_06_tutoria_cuestionario_previo_a_la_evaluacion","titulo":"Resumen Ejecutivo: Semana 6, tutoría con el cuestionario previo a la evaluación","md":"# Resumen Ejecutivo: Semana 6, tutoría con el cuestionario previo a la evaluación\n\n**Agente:** Analista de Clases · **Fuentes:** `Clases/Semana_06.txt` (tutoría del viernes 6 de nov de 2026, a las 19h00, con 10 a 15 estudiantes conectados) y `Clases/CUESTIONARIO DERECHO PROCESAL NO PENAL.pdf`. Docente: Ximena Orosco. La transcripción trae cifras dañadas por el audio (\"$,000\", \"8010\"); donde importa, se contrastó con el COGEP.\n\n## Ubicación en el Sílabo\n\nUnidad 1, semana 6 (última de la unidad). Cierra el repaso de diligencias preparatorias, providencias preventivas, apremios y formas de conclusión del proceso (COGEP arts. 120 a 134 y 233 a 248).\n\n## Lo que dijo la docente sobre la evaluación\n\n- La evaluación es el **sábado 7 de noviembre a las 10h00** (lo repite al despedirse).\n- El cuestionario de 20 preguntas es su método de preparación; no es obligatorio. Lo resolvieron en forma individual, entre las 19h20 y las 19h40.\n- Dijo que las preguntas están \"en base a todo lo que hemos visto\" y que no le interesa la letra de la respuesta sino que el estudiante sepa **por qué** la marca. Eso sugiere que la evaluación va por la misma línea (interpretación mía; ella no dio el formato).\n- El cuestionario se cerró ese mismo día para subir respuestas; no se calificó.\n- Recordó los pendientes que caducan el 8 de nov: video foro (25 de 39 estudiantes habían participado) y actividad práctico experimental.\n- Simplifica otra vez: \"los actos de proposición no es más que la demanda\". El concepto completo incluye contestación, reconvención y contestación a la reconvención (ver el video complementario de Cando).\n\n## Respuestas del cuestionario revisadas en clase\n\nTodas las respuestas de la clave (`salida/examenes/derecho_procesal_II_no_penal_cuestionario_docente_clave.md`) fueron **confirmadas por la docente**: 1b, 2a, 3c, 4d, 5a, 6b, 7c, 8d, 9a, 10b, 11c, 12d, 13a, 14b, 15c, 16d, 17a, 18b, 19c, 20d.\n\n## Explicaciones de la docente por tema\n\n**Diligencias preparatorias (preguntas 1 a 3).** Finalidades del art. 120: determinar o completar la legitimación y anticipar prueba urgente que pudiera perderse. No reemplazan la prueba del proceso principal, la aseguran. Es competente para la demanda el mismo juzgador que conoció la diligencia.\n\n**Providencias preventivas (4 a 9).**\n- Se piden antes de la demanda o durante el proceso (art. 124).\n- Aunque la causa esté en la corte provincial, se piden al juez de primera instancia, porque es quien ejecuta lo resuelto.\n- Para interrumpirlas (art. 128) el deudor ofrece garantía suficiente, sea caución u otro bien, dentro de la cuantía adeudada.\n- Secuestro (art. 129): el bien queda bajo custodia mientras dura el litigio; no transfiere la propiedad ni autoriza a venderlo. Ejemplo: crédito vencido más de tres meses, juicio ejecutivo, secuestro del vehículo del deudor; si no paga en la ejecución, se remata.\n- Retención (art. 130): sobre rentas, créditos o bienes del deudor en poder de un tercero. Corrigió a una estudiante: dura hasta que se pague lo adeudado (capital, intereses, honorarios, liquidación del perito), no solo hasta la sentencia.\n- Si el bien retenido no cubre la deuda, se pide prohibición de enajenar o retención sobre bienes del garante. Mencionó el término de cinco días del mandamiento de ejecución (no verificado aquí).\n\n**Apremios (10).** Personal sobre la persona, real sobre el patrimonio. La docente dijo que el apremio personal por deudas solo existe en alimentos. Base legal: art. 135 del COGEP (el juez ordena apremio personal solo cuando la ley lo autoriza) y art. 137 (alimentos).\n\n**Desistimiento (12 y 13).** Acto unilateral de una parte; renuncia que exige verificar objeto, oportunidad y admisibilidad (arts. 237 a 240).\n- Letra de cambio pagada: el actor sí puede desistir.\n- Alimentos con demandado ya citado: no puede. La estudiante Karina explicó que prima el interés superior del niño y la docente lo confirmó. Base: art. 240 num. 4, los actores en procesos de alimentos no pueden desistir. La suspensión tampoco se concede por la sola afirmación de las partes: interviene la oficina técnica.\n\n**Allanamiento parcial (14 y 20).** Se acepta una parte de lo pedido y el proceso sigue por el resto (art. 241). Ejemplos: divorcio donde el demandado acepta divorcio, visitas y tenencia pero no la pensión de USD 500; demanda por USD 12.000 donde el demandado reconoce USD 8.000 y discute el saldo.\n\n**Alimentos, dichos de la docente (no son preguntas del cuestionario).**\n- El juez fija la pensión con la tabla, según número de derechohabientes e ingresos del demandado; no acepta un acuerdo por un valor menor (\"el juez sería destituido\"). Los acuerdos fuera del proceso entre adultos son libres.\n- Pensiones atrasadas: se pueden pactar pagos; si no se cumplen, apremio personal parcial (dormir en el centro de privación de libertad de 22h a 6h, hasta 30 días), luego total, y después los obligados subsidiarios (abuelos, hermanos, según el orden del COGEP). No hay segunda instancia sobre esos acuerdos en ejecución.\n- Contraste con el COGEP (art. 137): el apremio total viene primero si el alimentante no justifica su incapacidad; el parcial se ordena cuando incumple un compromiso de pago aprobado o reincide. El orden que dio en clase es un resumen libre.\n\n**Transacción, conciliación y allanamiento (11, 15, 16, 17).**\n- Autocomposición: conciliación y transacción.\n- La transacción tiene **concesiones recíprocas**; el allanamiento es aceptar la pretensión.\n- Antes de valorar una transacción el juez examina capacidad de las partes, disponibilidad del derecho y alcance del acuerdo.\n- En todos los procesos hay etapa de conciliación (en la primera fase de la audiencia: saneamiento, fijación de puntos en debate y conciliación). El juez promueve el acuerdo, no lo impone, y lo eleva a sentencia.\n\n**Abandono (18 y 19).**\n- Falta de actividad procesal jurídicamente relevante durante **seis meses**, antes de la sentencia (art. 245).\n- No procede con sentencia dictada ni en ejecución. No procede en causas de niñez (art. 247). Ejemplo: alimentos con citación por exhorto a Estados Unidos que tarda ocho meses.\n- Lo declara el órgano judicial: en las depuraciones el secretario sienta razón del tiempo transcurrido y el juez dispone el abandono.\n- Dijo que tampoco cabe en \"procedimientos voluntarios, en procedimientos sumarios\". Los voluntarios sí están en el art. 247 num. 3; los sumarios **no** figuran en ese artículo. Para el examen, responder con el texto del COGEP.\n- Una estudiante citó el art. 245 con \"ochenta días\" (texto anterior a la reforma de 2019); el texto vigente del archivo dice seis meses.\n\n## Correcciones frente al COGEP\n\n| Dicho en clase | Texto del COGEP (feb. 2021) |\n|---|---|\n| Abandono tampoco cabe en sumarios | El art. 247 no lo menciona; sí excluye niñez, incapaces, adultos mayores, discapacidad, laboral, voluntarios, contencioso administrativo subjetivo y ejecución |\n| Estudiante: abandono a los 80 días | Art. 245: seis meses |\n| Incumplir el acuerdo de pago lleva a apremio parcial y luego total | Art. 137: total si no justifica incapacidad; parcial si incumple el compromiso aprobado |\n\n## Posibles Preguntas de Examen\n\n★★★★★ Las 20 del cuestionario (con el porqué de cada una); distinguir desistimiento, allanamiento, transacción, conciliación y abandono; alimentos como excepción (no desistimiento, no abandono, no reconvención, apremio personal).\n★★★★ Interrupción de providencias (caución), secuestro frente a retención, juez competente para la demanda tras una diligencia preparatoria.\n★★★ Casos de allanamiento parcial con cifras.\n\n## Recomendaciones para Estudiar\n\nRepasar los arts. 120 a 134 y 233 a 248 con el texto del COGEP y practicar explicar en voz alta el porqué de cada respuesta. Ver `salida/material_estudio/DerechoProcesalIINoPenal/hoja_de_repaso_unidad_01.md` y las tarjetas 46 en adelante.\n\n## Nivel de importancia\n\n★★★★★ Es la tutoría de preparación de la evaluación de Procesal II.\n"},{"id":"video_examen_actos_de_proposicion_cando","titulo":"Resumen Ejecutivo: Video «Los actos de proposición en el COGEP» (material para el examen)","md":"# Resumen Ejecutivo: Video «Los actos de proposición en el COGEP» (material para el examen)\n\n**Agente:** Analista de Clases · **Fuente:** `Clases/Examen - Video de actos de proposicion _.txt`, transcripción automática de un video de YouTube de Luis Cando Arévalo, que se presenta como abogado, profesor universitario y juez. Agregado a la carpeta el 7 de nov de 2026 con el nombre «Examen - Video…», que indica que es material para la evaluación (la docente no lo mencionó en la tutoría de la semana 6; el origen de la indicación no consta en los archivos). La transcripción tiene errores de audio (\"coge\", \"alto de proposición\", \"asignación\" por citación); lo dudoso se marca.\n\n## Ubicación en el Sílabo\n\nUnidad 1, tema «Actos de proposición» (COGEP arts. 141 a 157). Complementa la guía 1.3, la semana 3 (estructura de la demanda) y la semana 5 (video foro).\n\n## Temas Principales\n\n1. Qué son los actos de proposición y sus elementos.\n2. Demanda: requisitos de forma (arts. 142 a 144).\n3. Contestación a la demanda (arts. 151 a 153).\n4. Reconvención (art. 154): cuándo procede y cuándo no.\n5. Contestación a la reconvención (art. 155).\n\n## Elementos del acto de proposición (según el video)\n\nEscrito; describe **hechos** (fundamentos de hecho); identifica **sujetos** (activo y pasivo); anuncia **medios de prueba** (testimoniales, documentales, periciales y oculares, es decir inspección judicial); invoca **normas jurídicas** (fundamentos de derecho); formula una **pretensión** ajustada a una norma, sin lo cual sería arbitraria.\n\nDefinición del autor: escritos en los que se hace conocer al juez la existencia de ciertos hechos atribuidos a determinadas personas y que son susceptibles de acarrearles consecuencias jurídicas de ser comprobados en un procedimiento judicial. Invita a que el estudiante escriba la suya (tarea de estudio útil para el examen).\n\nLos actos de proposición son cuatro: demanda, contestación a la demanda, reconvención y contestación a la reconvención. Están en el Libro III, título I, arts. 141 a 157, en dos capítulos: demanda; contestación y reconvención.\n\n## Demanda\n\n- Todo proceso inicia con demanda por el **principio dispositivo**; no empieza de oficio.\n- Requisitos de forma: arts. 142, 143 y 144. Contenido: hechos, fundamentos de derecho, medios de prueba (útiles, pertinentes y conducentes), pretensión, **cuantía** (art. 144) y **procedimiento** (sumario, ordinario, ejecutivo, monitorio o voluntario).\n- Ejemplos del autor: despido intempestivo (sumario; Código del Trabajo arts. 188 y 185, no verificable aquí) y divorcio por abandono (Código Civil art. 110, causal 9; sumario).\n- Definición: escrito con el que el actor inicia un proceso judicial y hace conocer al juez hechos comprobables y susceptibles de acarrear consecuencias jurídicas al demandado.\n\n## Contestación a la demanda\n\n- Es la **defensa procesal del demandado**. Requisitos en los arts. 151 a 153.\n- Debe pronunciarse sobre los hechos, las pruebas anunciadas y las pretensiones del actor; indicar **qué admite y qué niega**; deducir **excepciones** (previas, art. 153; y de fondo, que atacan la base de la pretensión); anunciar **pruebas de descargo**. El actor presenta pruebas de cargo.\n- Dice que se pronuncia sobre veracidad de hechos, autenticidad, utilidad, pertinencia y conducencia de la prueba.\n\n## Reconvención\n\n- Es la **contrademanda**. Se distingue de contestar: en la contestación el demandado solo se defiende; para **contraatacar** necesita reconvenir.\n- Ejemplo: el actor pide reivindicación; el demandado, poseedor por más de 15 años con ánimo de señor y dueño, quiere que el juez declare la **prescripción adquisitiva**. No lo puede pedir en la contestación; debe reconvenir. (Se conecta con Civil II: reivindicación y prescripción.)\n- Inicia un proceso **en paralelo** y el juez resuelve ambos en la sentencia.\n- Cumple las reglas de la demanda **en lo pertinente** (arts. 142 a 144). Se omite lo innecesario: según el audio, el dato de la citación del demandado, porque las partes ya están litigando (transcripción dudosa, dice \"asignación\"). Debe tener hechos, fundamentos de derecho, anuncio de prueba, pretensión, cuantía y procedimiento. Va en el **mismo procedimiento** que la demanda.\n- **No procede** en alimentos ni en el procedimiento monitorio.\n- En laborales y en sumarios en general solo cabe la reconvención **conexa**. Ejemplo del autor: empleador reconviene al trabajador por anticipos de remuneración (conexa); que el trabajador le deba USD 500 a su hermano no es conexa y el juez no la admite.\n- Definición: escrito de contrademanda con el que el demandado contraataca judicialmente al actor y hace conocer al juez otros hechos comprobables y susceptibles de acarrearle consecuencias jurídicas.\n\n## Contestación a la reconvención\n\nEs la defensa del actor (que pasa a ser **reconvenido**) frente al **reconviniente**. Cumple en lo posible los arts. 151, 152 y 153: se pronuncia sobre hechos, prueba y pretensiones, dice lo que admite y niega, deduce excepciones (previas y de fondo) y anuncia prueba de descargo. El reconviniente presenta pruebas de cargo.\n\n## Verificación contra el COGEP (feb. 2021)\n\n| Afirmación del video | Resultado |\n|---|---|\n| Actos de proposición en arts. 141 a 157 | Coincide con el Libro III, título I |\n| Demanda: arts. 142 a 144 (contenido, documentos, cuantía) | Coincide |\n| Contestación: arts. 151 a 153 (contenido, anuncio de prueba, excepciones previas) | Coincide |\n| Reconvención: reglas de la demanda en lo pertinente, se resuelve con la demanda | Art. 154, coincide |\n| No procede en alimentos | Art. 154 inciso final, coincide |\n| No procede en el monit
