s: tatuaje y negro de humo apuntan a corta distancia; si faltan, el disparo fue de larga distancia. El anillo de Fisch aparece en ambos casos y dice si la persona estaba viva."],"ejemplo":"Un orificio con pólvora incrustada que no sale al lavar, rodeado por un anillo, indica un disparo cercano y una herida producida en vida.","ojo":"Lo que más se pregunta: la diferencia entre tatuaje verdadero y negro de humo (se borra o no) y qué prueba el anillo de Fisch.","terminos":["arma-fuego","balistica","contusion","excoriacion","anillo-fisch","tatuaje","negro-humo","signo-rojas","escarapela-simonin","calcado-bonnet"]},"medicina:tanatologia_forense":{"corto":"Cuando alguien muere, el cuerpo cambia en un orden predecible. Esos cambios sirven para calcular cuánto tiempo hace que murió.","texto":["Primero vienen los fenómenos recientes: el cuerpo se deshidrata, se enfría hasta igualar la temperatura ambiente (unas 24 horas), la sangre se acumula en las zonas bajas (livideces, visibles desde las 3 horas) y los músculos se endurecen (rigidez, entre 3 y 6 horas).","Después viene la putrefacción: los gérmenes del intestino destruyen los tejidos. Su primer signo es la mancha verde abdominal. Más adelante los órganos pierden su forma (etapa colicuativa).","El espasmo cadavérico es distinto de la rigidez: aparece en el momento de la muerte y fija la postura que tenía la persona. La rigidez aparece horas después. El espasmo no se puede simular."],"ejemplo":"Si un cuerpo ya tiene livideces y rigidez, pasaron por lo menos varias horas desde la muerte. Si aún no hay ninguna de las dos, la muerte fue más reciente.","ojo":"Espasmo frente a rigidez: el docente dijo que «normalmente se toma en el examen».","terminos":["tanatologia","fenomenos-cadavericos","deshidratacion","enfriamiento","livideces","declive","rigidez","espasmo","putrefaccion","mancha-verde","colicuativa","autopsia"]}},"materias":[{"id":"civil","nombre":"Derecho Civil II","corto":"Civil II","docente":"Abg. Claudia Patiño Izquierdo","color":"#2F6FB5","colorOscuro":"#6FA3E0","evaluacion":{"inicio":"2026-11-07T14:00","fin":"2026-11-07T16:00"},"unidades":[{"id":"unidad_01_enfoque_general_sobre_bienes","num":1,"titulo":"Unidad 1 · Enfoque general sobre bienes (sílabo)","pendiente":false,"estructura":"","temas":[{"id":"bienes_publicos_y_derecho_de_propiedad","titulo":"Los bienes públicos y el derecho de propiedad (tema de la demanda de amparo posesorio según la guía)","docs":[{"k":"conceptos","n":"Conceptos","md":"# Conceptos: Bienes públicos y derecho de propiedad\n\n- **Art. 604:** bienes nacionales son aquellos cuyo dominio pertenece a la Nación toda. [Código Civil]\n- **Art. 605:** son bienes del Estado todas las tierras situadas dentro de los límites territoriales que carecen de otro dueño.\n- **Art. 612:** los ríos y todas las aguas que corren por cauces naturales y los lagos naturales son bienes nacionales de uso público.\n- **Art. 608:** los puentes y caminos construidos por particulares en tierras suyas no son bienes nacionales aunque se permita su uso a todos.\n- **Morand-Deviller (2011):** distingue los bienes demaniales y los bienes públicos mundiales y nacionales, y examina cómo se ejerce el derecho de propiedad sobre cada categoría según sus tres atributos: usus, fructus y abusus. [Resumen del artículo; lectura completa pendiente]\n"},{"k":"definiciones","n":"Definiciones","md":"# Definiciones: Bienes públicos y derecho de propiedad\n\n## Bienes nacionales\n\nAquellos cuyo dominio pertenece a la Nación toda (art. 604).\n\n## Bienes de uso público\n\nLos bienes nacionales cuyo uso pertenece a todos los habitantes, como ríos y lagos naturales (art. 612). La definición general de los arts. 604 y siguientes por verificar con el texto completo.\n\n## Bienes del Estado\n\nTierras sin otro dueño dentro de los límites territoriales (art. 605).\n"},{"k":"ejemplos","n":"Ejemplos","md":"# Ejemplos: Bienes públicos y derecho de propiedad\n\n- Aplicación a la demanda de amparo posesorio: no cabe la posesión amparable sobre un río o un camino público (art. 961).\n- Un camino construido por un particular en su tierra no es bien nacional (art. 608).\n"},{"k":"preguntas_frecuentes","n":"Preguntas","md":"# Preguntas frecuentes: Bienes públicos y derecho de propiedad\n\n1. ¿Qué son los bienes nacionales? (art. 604)\n2. ¿Qué diferencia hay entre bienes nacionales y bienes del Estado? (arts. 604 y 605)\n3. ¿Por qué no procede una acción posesoria sobre un bien nacional de uso público? (art. 961)\n\nPendiente de ampliar con la lectura completa de Morand-Deviller.\n"},{"k":"bibliografia","n":"Bibliografía","md":"# Bibliografía: Bienes públicos y derecho de propiedad\n\n- Morand-Deviller, J. (2011). Los bienes públicos y el derecho de propiedad. *Revista de Estudios de la Administración Local y Autonómica*, (317), 11-26 (la portada del PDF dice pp. 11-26; las páginas internas dicen 13-28: discrepancia). http://www.redalyc.org/articulo.oa?id=576461203001\n- Código Civil, arts. 604 a 625 (por leer).\n"},{"k":"jurisprudencia","n":"Jurisprudencia","md":"# Jurisprudencia: Bienes públicos y derecho de propiedad\n\nNo consta jurisprudencia en las fuentes del curso (los docentes no citaron ninguna). No es un faltante: se llena solo si una tarea la pide.\n"},{"k":"_ficha","n":"Ficha","md":"# Ficha del Gestor de Conocimiento\n\n**Materia:** Derecho Civil II\n**Unidad:** 1 · Enfoque general sobre bienes (sílabo)\n**Tema:** Los bienes públicos y el derecho de propiedad (tema de la demanda de amparo posesorio según la guía)\n\n## Conceptos incorporados\n\nBienes nacionales, bienes del Estado, bienes de uso público, bienes demaniales, atributos del dominio (usus, fructus, abusus).\n\n## Fuentes\n\nCódigo Civil, arts. 604 a 612 (revisados parcialmente); Morand-Deviller (2011), solo resumen e introducción leídos.\n\n## Estado\n\n**Incompleto.** La docente no desarrolló este tema en las tutorías disponibles y la diapositiva de la semana 5 lo menciona solo como \"según su titularidad: públicos y privados\". Falta leer el artículo completo y los arts. 604 a 625 del Código Civil. Marcado como pendiente para el Investigador Académico.\n\n## Relaciones\n\n- Las acciones posesorias no proceden sobre cosas que no pueden ganarse por prescripción (art. 961), como los bienes nacionales de uso público.\n\n## Estado de actualización\n\nCreado el 31-oct-2026 con lo verificado.\n"}]},{"id":"clasificacion_de_los_bienes","titulo":"Los bienes y su clasificación","docs":[{"k":"conceptos","n":"Conceptos","md":"# Conceptos: Los bienes y su clasificación\n\nFuentes: [Clase 2] docente · [Guía] Guía de estudio, citando a Parraguez · [Sílabo]\n\n## Objeto, bien y cosa\n\n- **Objeto del derecho:** noción funcional; es el ente que cumple el papel objetivo en la relación jurídica. No alude a un tipo de cosa. [Guía, Parraguez]\n- **Bien:** toda entidad material o inmaterial que la ley considera porque es o puede ser objeto de relaciones jurídicas. Es más amplio que cosa. [Guía, Avendaño Arana citado por Solís]\n- **Cosa:** objeto material con valor económico, apropiable y transferible. Los bienes comprenden las cosas (corporales) y los derechos (incorporales). [Guía]\n\n## Clasificación (guía, según Parraguez)\n\n- **Corporales:** existencia física (ganado, máquina, casa). **Incorporales:** meros derechos (créditos, servidumbres activas).\n- **Muebles por naturaleza:** semovientes (fuerza propia) e inanimados (fuerza externa).\n- **Inmuebles:** no se pueden movilizar sin detrimento de su sustancia.\n- **Muebles por anticipación:** adheridos al suelo (árbol y frutos pendientes) que por razones prácticas se negocian como muebles.\n- **Cosa específica (cuerpo cierto)** frente a **cosa genérica**.\n- **Consumibles y no consumibles; fungibles y no fungibles; divisibles e indivisibles.**\n\n## Muebles e inmuebles según la clase (arts. 584–593; verificados con el Código Civil de enero de 2024)\n\n| Categoría | Criterio | Ejemplo |\n|---|---|---|\n| Mueble por naturaleza | Se mueve por fuerza propia o externa | caballo, laptop |\n| Inmueble por naturaleza | No se traslada | tierras, minas, canteras |\n| Inmueble por adherencia | Unido permanentemente al inmueble | edificio, árbol, espejo empotrado |\n| Inmueble por destino | Mueble que el dueño destina de forma permanente al uso o cultivo del inmueble | tractor y animales de una finca |\n| Mueble por anticipación | Fruto o producto adherido, tratado como mueble antes de separarse | naranjas, madera de un árbol |\n\nReglas complementarias:\n- **Separación momentánea:** reparar no quita la calidad de inmueble. Regalar o vender sí devuelve la calidad de mueble.\n- **\"Muebles de una casa\":** incluye camas, vajillas, muebles de uso común. Excluye ropa, joyas, obras de arte y dinero, salvo mención expresa.\n- **Idea central:** la categoría depende del destino económico y de la voluntad de las partes, no solo de la física.\n\n## Relaciones\n\n- Muebles/inmuebles → forma de transferir (entrega vs. escritura e inscripción) → garantía (prenda vs. hipoteca) → prescripción.\n- Posible conexión con la unidad 2 (modos de adquirir) y con la posesión (unidad 3).\n\n## Actualización: contenido de las semanas 3 y 5 (diapositivas de la docente)\n\nFuente: `DiapositivasClases/Semana_03.pdf` y `Semana_05.pdf` (leídas con OCR) y tutorías.\n\n- **Macro-arquitectura:** los bienes se clasifican por su materialidad (corporales e incorporales, art. 583), por su movilidad (muebles e inmuebles, art. 584) y por su titularidad (públicos y privados). [Diapositiva 6, semana 5]\n- **Consecuencias jurídicas de mueble o inmueble:** transferencia (entrega material frente a escritura pública más inscripción registral), garantía (prenda frente a hipoteca) y prescripción (plazos cortos frente a largos). \"Categorizar mal un objeto invalida contratos y garantías.\" [Diapositivas 7 y 8]\n- **Espectro de adherencia:** fuerza propia (semovientes) y fuerza externa (cosas inanimadas), art. 585; unión permanente (edificios, árboles) e inamovibles por naturaleza (tierras, minas, canteras), art. 586. [Diapositiva 9]\n- **Ficción jurídica:** la ley altera la clasificación natural por el propósito económico o el futuro acordado. Inmuebles por adherencia y ornato: arts. 587 (plantas; macetas y cajones móviles son muebles) y 590 (cuadro en gancho mueble; espejo embutido, inmueble). Inmuebles por destino (art. 588): destinados al uso o cultivo, de forma permanente y puestos por el dueño. Muebles por anticipación (art. 589): frutos y productos aún adheridos. Separación momentánea (art. 591). Ajuar (art. 592). Fungibles (art. 593).\n- **Matriz maestra:** muebles por naturaleza (caballo, computadora), inmuebles por naturaleza (terrenos, minas), por adherencia (edificios, árboles plantados), por destino (tractores, alambiques) y muebles por anticipación (madera en pie, frutos en el árbol). La categoría \"no depende únicamente de la física, sino del destino económico, la adherencia estructural y la intención jurídica\". [Diapositiva 16]\n- **Evolución histórica (semana 5):** comunidades antiguas (sin propiedad individual), derecho romano (separa propiedad y posesión), edad media (dominio dividido), edad moderna (propiedad unificada y absoluta; Código de Napoleón y Andrés Bello, base del Código Civil ecuatoriano). Propiedad es ser dueño; posesión es tener la cosa con ánimo de señor o dueño. [Diapositivas 3 a 5]\n\n## Matices dichos en clase\n\n- La docente (semana 3) insistió en que la voluntad de las partes pesa: si se vende una finca \"con todo\", se incluyen tractor y animales aunque sean muebles; conviene pactar por escrito y notarizar. [Clase]\n- Un tractor alquilado una semana no es inmueble por destino: la destinación debe ser permanente. [Clase, semana 5]\n- Contradicción menor: en la clase 5 la docente dijo \"artículo 568\" al referirse a inmuebles por destino; el artículo es el 588. La transcripción es dudosa.\n"},{"k":"definiciones","n":"Definiciones","md":"# Definiciones: Los bienes y su clasificación\n\n| Término | Definición | Fuente |\n|---|---|---|\n| Bien | Entidad material o inmaterial considerada por la ley como objeto de relaciones jurídicas | Guía (Avendaño Arana, citado por Solís) |\n| Cosa | Objeto material de valor económico, apropiable y transferible | Guía |\n| Bien corporal | Existe físicamente y se percibe con los sentidos | Guía (Parraguez); Clase 2 |\n| Bien incorporal | Mero derecho, que se concibe intelectualmente (crédito, servidumbre activa) | Guía (Parraguez) |\n| Bien mueble | Se puede movilizar sin detrimento de su sustancia | Guía (Parraguez) |\n| Mueble por naturaleza (semoviente) | Se mueve por fuerza propia: animales | Guía; Clase 2 |\n| Mueble por naturaleza (inanimado) | Se mueve por fuerza externa: escritorio, laptop | Guía; Clase 2 |\n| Inmueble | No se puede movilizar ni por sí mismo ni por fuerza externa sin detrimento de su sustancia | Guía (Parraguez) |\n| Inmueble por adherencia | Unido permanentemente a un inmueble | Clase 2 (art. 590, por verificar) |\n| Inmueble por destino | Mueble puesto por el dueño del inmueble para su uso o cultivo, con carácter permanente | Clase 2 (art. 588, por verificar) |\n| Mueble por anticipación | Fruto o producto adherido que se trata como mueble antes de separarse | Guía; Clase 2 (art. 589) |\n| Cosa específica (cuerpo cierto) | Determinada por sus caracteres propios | Guía (Parraguez) |\n| Cosa genérica | Determinada solo por los caracteres comunes a su género o especie | Guía (Parraguez) |\n| Cosa consumible | No sobrevive a la primera utilización | Guía (Parraguez) |\n| Cosa fungible | Puede sustituirse por otra del mismo género sin cambiar las consecuencias jurídicas | Guía; Clase 2 |\n| Cosa no fungible | Tiene individualidad propia, es irremplazable | Clase 2 |\n| Cosa divisible | Se fracciona sin disminuir el valor del conjunto | Guía (Parraguez) |\n| Cosa indivisible | No admite división por su naturaleza o por voluntad de las partes | Guía (Parraguez) |\n"},{"k":"ejemplos","n":"Ejemplos","md":"# Ejemplos: Los bienes y su clasificación\n\nTodos son ejemplos de la docente en la Clase 2, salvo los marcados [Guía].\n\n- **Mueble vs. inmueble:** una computadora se transfiere con la entrega. Un lote exige escritura pública e inscripción.\n- **Garantías:** joyas en prenda por un préstamo (mueble); hipoteca sobre un terreno (inmueble).\n- **Adherencia:** cuadro con un clavo = mueble; espejo empotrado = inmueble; cuadro descrito en el inventario del departamento amoblado = se vuelve inmueble.\n- **Árbol:** inmueble mientras está en el suelo. En una maceta o extraído es mueble.\n- **Destino:** una finca vendida con todo (tractor, mula, animales) se trata como un solo inmueble. Si el contrato excluye las vacas, se las puede llevar.\n- **Anticipación:** las naranjas pendientes se pueden vender como muebles. La madera del árbol se vende antes de talarlo.\n- **Frutos en terreno ajeno:** el dueño del árbol es dueño de los frutos mientras estén en él. Si caen en el terreno del vecino, puede reclamarlos. Cortarlos sin permiso es robo.\n- **Separación momentánea:** un portón enviado a reparar sigue siendo inmueble. Un jacuzzi desmontable se vuelve mueble si se regala o se vende.\n- **Muebles de una casa:** en una casa heredada, camas y vajillas entran. Joyas, ropa, dinero y obras de arte no, salvo que se describan.\n- **Fungible:** dinero ($20 = dos billetes de $10); arroz.\n- **No fungible:** caballo de pedigrí, cuadro único de Picasso, vestido de Lady Di subastado.\n- **Incorporales:** bonos de carbono y deuda externa canjeada por conservar reservas (el docente puso el ejemplo de Ecuador y la reserva Cayapas); transferencias electrónicas.\n- **Contratos:** un contrato que no describe bien el vehículo (placa, chasis) o cambia el plazo de pago pactado puede invalidarse. Describir hasta las manchas de las vacas evitó un pleito real.\n- [Guía] Corporal mueble: caballo, automóvil, ordenador. Corporal inmueble: casa. Incorporal: crédito, servidumbre activa.\n\n## Ejemplos de las semanas 3 y 5\n\n- Mateo compra una computadora (mueble: transferencia por entrega) y un lote (inmueble: escritura pública e inscripción). [Diapositiva 2, semana 3]\n- Cuadro en gancho (mueble) frente a espejo embutido en mampostería (inmueble). Maceta o cajón móvil (mueble) frente a raíces en tierra (inmueble). [Semanas 3 y 5]\n- Finca vitivinícola: al venderla, el comprador adquiere los alambiques y el ganado de ordeño por destino, aunque no se mencionen. [Diapositiva 7]\n- El agricultor que vende la cosecha de naranjas aún en el árbol: las naranjas son muebles por anticipación. [Diapositiva 8]\n- Tejas retiradas para reparar una gotera o portones llevados a soldar: siguen siendo inmuebles; si se regalan o venden aparte, vuelven a ser muebles. [Diapositiva 9]\n- Testador que deja \"la casa y sus bienes muebles\": el sobrino hereda el comedor, no la colección de monedas de la caja fuerte. [Diapositiva 10]\n- Dinero (fungible) frente a un caballo con pedigrí (no fungible). [Diapositiva 11]\n- **Caso de refuerzo, Hacienda El Paraíso** (semana 3): tractor (inmueble por destino), orquídeas en macetas (muebles), tejas desmontadas (inmuebles), naranjas sin cosechar (muebles por anticipación), espejo empotrado (inmueble por adherencia), dinero y camionetas (muebles).\n"},{"k":"preguntas_frecuentes","n":"Preguntas","md":"# Preguntas frecuentes: Los bienes y su clasificación\n\nMarcadas ★ las que el sílabo o la docente destacan. Ninguna fue anunciada como examen.\n\n1. ★ ¿Qué entiende por bien? ¿A qué denominamos cosa? ¿Qué diferencia hay? [Guía]\n2. ★ ¿Cuál es la clasificación de los bienes en la legislación civil ecuatoriana? [Guía, foro]\n3. ★ ¿Qué son los bienes incorporales? Dé su concepto y un ejemplo de cada uno. [Sílabo, foro]\n4. ¿Qué es un bien mueble por naturaleza? ¿Qué diferencia hay entre semoviente e inanimado?\n5. ¿Cuándo un bien mueble se vuelve inmueble? Explique adherencia, destino y anticipación.\n6. ¿Qué requisitos exige el inmueble por destino?\n7. ¿Qué pasa con un portón que se retira para repararlo? ¿Y si se regala?\n8. ¿Qué incluye la expresión \"muebles de una casa\"?\n9. ¿Qué es un bien fungible? ¿Y uno no fungible? Dé ejemplos.\n10. Caso: el árbol del vecino cuelga sobre mi terreno y cae fruta. ¿De quién es?\n11. Caso: vendo una finca \"con todo\". ¿Me llevo los animales y el tractor?\n12. ¿Por qué la forma de transferir un mueble es distinta a la de un inmueble?\n\nRespuestas: pendientes de redactar con el Constructor de Material y de verificar con el texto del Código Civil.\n\n## Actualización: respuestas sugeridas y preguntas probables\n\nLa docente dijo que el examen sale del material de la semana 5. Con base en él:\n\n13. ★ ¿Qué consecuencias jurídicas tiene la distinción entre muebles e inmuebles? Transferencia, garantía y prescripción (arts. 584 y siguientes; González Pesantes, p. 19).\n14. ★ ¿Qué requisitos tiene un inmueble por destino? Destino al uso, cultivo o beneficio de un inmueble, permanente, y colocado por el dueño (art. 588).\n15. ★ ¿Qué es un mueble por anticipación y para qué sirve? Frutos o productos adheridos que la ley reputa muebles para constituir derechos a favor de otra persona (art. 589).\n16. ★ ¿Qué diferencia hay entre un espejo colgado y uno embutido? Art. 590.\n17. ★ ¿Cuándo un bien por adherencia o destino conserva su calidad pese a separarse? Separación momentánea (art. 591).\n18. ★ ¿Qué comprende la expresión \"muebles de una casa\"? Solo el ajuar, no dinero, joyas, ropa ni libros (art. 592).\n19. ¿Qué diferencia hay entre bien fungible y no fungible? (art. 593)\n20. ¿Qué pasó históricamente con la propiedad y la posesión desde Roma hasta el Código de Bello? [Diapositivas 3 a 5]\n\nPara derechos reales y personales (alcance del mapa conceptual): ver el tema `cosas_incorporales_derechos_reales_y_personales`.\nRespuestas completas en `salida/examenes/derecho_civil_II_simulacro_unidad_01.md`.\n"},{"k":"bibliografia","n":"Bibliografía","md":"# Bibliografía: Los bienes y su clasificación\n\n## Obligatoria (sílabo)\n\n- Parraguez Ruiz, Luis. *Régimen Jurídico de los Bienes*. Ecuador: Cevallos Editora Jurídica, 2020 (primera reimpresión). ISBN 978-9942-794-07-9. La guía la cita como 2021 y remite a las págs. 39–52 (objetos del derecho, cosa y bien, clasificación). **Contradicción de año entre sílabo y guía.**\n- Morand-Deviller, Jacqueline (2011). *Los bienes públicos y el derecho de propiedad*. Revista de Estudios de la Administración Local y Autonómica. https://www.redalyc.org/articulo.oa?id=576461203001 (para el foro \"bienes públicos y derecho de propiedad\").\n\n## Complementaria\n\n- González Pesantes, Ernesto (2012). *Derecho Patrimonial*. AJSA-UNL. ISBN 978-9942-13-006-8. La docente dijo que amplía los bienes más que el Código Civil.\n\n## Mencionados por la guía\n\n- Avendaño Arana, citado por Mario Solís (definición de bien).\n\n## Recurso audiovisual de la guía\n\n- Video de YouTube \"Código Civil – Libro II – Bienes\".\n\n## Verificado el 31-oct-2026\n\n- Código Civil, arts. 583 a 598 (versión Lexis, enero de 2024): `entrada/bibliografia/Normas/Codigo_Civil_act_ene-2024.pdf`.\n- González Pesantes, E. (2012). *Derecho patrimonial*, cap. 1, De los bienes, pp. 13 a 21 (clasificación en pp. 15 a 21). Escaneado: leído con OCR.\n- Parraguez Ruiz, L. (2020). *Régimen jurídico de los bienes*, cap. 1, pp. 39 a 66 (cosa y bien, pp. 48 a 51). Escaneado: leído con OCR. La guía lo fecha en 2021.\n- Diapositivas de la docente: semanas 3 y 5.\n"},{"k":"jurisprudencia","n":"Jurisprudencia","md":"# Jurisprudencia: Los bienes y su clasificación\n\nNo consta jurisprudencia en las fuentes del curso (los docentes no citaron ninguna). No es un faltante: se llena solo si una tarea la pide. Ni la guía, ni el sílabo ni las clases 1 y 2 citan jurisprudencia.\n\n## Normas que aparecen\n\n- Código Civil, Libro II (De los bienes y de su dominio, posesión, uso, goce y limitación). La docente citó los arts. 584 a 593 (por verificar).\n- COGEP, art. 142 (contenido de la demanda): la docente lo pidió leer para la demanda de amparo posesorio.\n\n## Por investigar\n\n- Texto de los arts. 583 a 598: verificado el 31-oct-2026.\n- Fallos de la Corte Nacional sobre inmuebles por destino y por adherencia, si existen.\n"},{"k":"_ficha","n":"Ficha","md":"# Ficha del Gestor de Conocimiento\n\n**Materia:** Derecho Civil II\n**Unidad:** 1 · Enfoque general sobre bienes (sílabo)\n**Tema:** Los bienes y su clasificación\n\n## Conceptos incorporados\n\nObjeto del derecho, bien, cosa, corporales/incorporales, muebles (naturaleza, anticipación), inmuebles (naturaleza, adherencia, destino), separación momentánea, muebles de una casa, específica/genérica, consumible, fungible, divisible.\n\n## Fuentes\n\n- Sílabo y guía (estructura, bibliografía, preguntas de foro).\n- Clase 2 (arts. 584–593 según la docente). La Clase 1 fue de encuadre y no aportó contenido jurídico.\n- Resúmenes: `salida/resumenes/derecho_civil_II/`.\n\n## Relaciones encontradas\n\n- Muebles/inmuebles → forma de transferencia (entrega vs. escritura e inscripción), garantía (prenda vs. hipoteca) y prescripción (unidad 2).\n- Inmuebles por adherencia/destino → posesión y amparo posesorio (la demanda de amparo posesorio de la unidad 1 las aplica).\n- Conexión con Derecho Procesal II: la demanda se redacta según el COGEP.\n- Contradicción registrada: año de Parraguez (2020 sílabo, 2021 guía).\n\n## Información pendiente de ampliar\n\n- Texto de los arts. 583–593 del Código Civil (los números de la clase son por verificar).\n- Jurisprudencia.\n- Temas de la unidad 2 (modos de adquirir, limitaciones al dominio) y de la unidad 3 (acción de dominio, posesión): aún sin clases.\n\n## Estado de actualización\n\nIncorporado desde las Clases 1 y 2, la guía y el sílabo.\n\n## Actualización del 31-oct-2026\n\n- Incorporadas las semanas 3 y 5 (diapositivas \"Anatomía de los bienes corporales\" y \"La arquitectura de los bienes\"), el texto de los arts. 583 a 598 del Código Civil (versión de enero de 2024) y los capítulos de González Pesantes (pp. 13 a 21) y Parraguez (pp. 41 a 51), leídos con OCR.\n- **La docente dijo el 28 de octubre que el examen sale del material de la semana 5** (`DiapositivasClases/Semana_05.pdf`) y que los demás temas de bienes se ven en la unidad 2 \"sin tomar examen de eso\". El alcance del mapa conceptual es hasta los derechos reales y personales.\n- **El archivo `Clases/Semana_04.txt` de Derecho Civil II no es de la materia**: es una tutoría de vinculación con la sociedad (emprendimientos, firmas electrónicas). La semana 4 real fue un video sobre bienes incorporales (art. 594) y no hay transcripción. Conviene subir la correcta si existe.\n- Las dos semanas 2 y 4 fueron test (quiz) y la semana 3 un refuerzo (caso Hacienda El Paraíso), sin nota.\n- Nuevos temas creados: `cosas_incorporales_derechos_reales_y_personales`, `bienes_publicos_y_derecho_de_propiedad` y `posesion_y_acciones_posesorias`.\n"}]},{"id":"cosas_incorporales_derechos_reales_y_personales","titulo":"Cosas incorporales: derechos reales y personales (Código Civil, arts. 594 a 598)","docs":[{"k":"conceptos","n":"Conceptos","md":"# Conceptos: Las cosas incorporales: derechos reales y personales\n\n## Texto del Código Civil\n\n- Art. 583: los bienes consisten en cosas corporales o incorporales. Las incorporales \"consisten en meros derechos, como los créditos y las servidumbres activas\".\n- Art. 594: las cosas incorporales son derechos reales o personales.\n- **Art. 595:** derecho real es el que tenemos sobre una cosa sin respecto a determinada persona. Son derechos reales el de dominio, el de herencia, los de usufructo, uso o habitación, los de servidumbres activas, el de prenda y el de hipoteca. De ellos nacen las **acciones reales**.\n- **Art. 596:** derechos personales o créditos son los que solo pueden reclamarse de ciertas personas que, por un hecho suyo o por la sola disposición de la ley, han contraído las obligaciones correlativas; ejemplos: el del prestamista contra su deudor por el dinero prestado y el del hijo contra el padre por alimentos. De ellos nacen las **acciones personales**.\n- **Art. 597:** los derechos y acciones se reputan muebles o inmuebles según la cosa en que han de ejercerse o que se debe: el usufructo sobre un inmueble es inmueble; la acción del comprador para que se le entregue la finca es inmueble; la acción del que prestó dinero para que se le pague es mueble.\n- **Art. 598:** los hechos que se deben se reputan muebles (la acción para que un artífice ejecute la obra o resarza perjuicios es mueble).\n\n## Doctrina\n\n- Los derechos reales son potestades inmediatas y directas sobre cosas determinadas, sin relación a personas determinadas, y se oponen a todos (erga omnes) (Parraguez, 2020, p. 41).\n- El derecho de dominio es el más amplio de los reales; varios reales, como el usufructo y las servidumbres, son a la vez limitaciones del dominio (González Pesantes, 2012, p. 17).\n- Los derechos personales generan obligaciones correlativas entre personas determinadas; las acciones personales se dirigen contra quien contrajo la obligación, aun contra su voluntad (p. 18).\n- Los derechos fundamentales no encajan en la división de derechos reales y personales: son extrapatrimoniales (Parraguez, pp. 42 a 43).\n- Para el Código Civil ecuatoriano \"cosa\" es todo lo que tiene alguna modalidad de existencia, material o inmaterial, y no distingue entre cosa y bien (Parraguez, pp. 49 a 51). González Pesantes sí distingue: todos los bienes son cosas, pero no todas las cosas son bienes (p. 14).\n\n## Qué dijo la docente (28 oct)\n\nAlcance del mapa conceptual: la clasificación de los bienes hasta las cosas incorporales y los derechos patrimoniales, hasta el derecho real y personal. Incorporales: propiedad intelectual, créditos, cuentas bancarias. [Clase, semana 5]\n"},{"k":"definiciones","n":"Definiciones","md":"# Definiciones: Las cosas incorporales: derechos reales y personales\n\n## Derecho real\n\nEl que se tiene sobre una cosa, sin respecto a determinada persona (art. 595).\n\n## Derecho personal o crédito\n\nEl que solo puede reclamarse de ciertas personas que contrajeron una obligación por un hecho suyo o por la ley (art. 596).\n\n## Acción real\n\nLa que nace de un derecho real (art. 595).\n\n## Acción personal\n\nLa que nace de un derecho personal y se dirige contra el obligado (art. 596).\n\n## Erga omnes\n\nQue se puede oponer a todos. Característica de los derechos reales (Parraguez, p. 41).\n\n## Nuda propiedad\n\nLa propiedad separada del goce de la cosa (art. 599).\n"},{"k":"ejemplos","n":"Ejemplos","md":"# Ejemplos: Las cosas incorporales: derechos reales y personales\n\n- **La casa de María y el préstamo de Juan** (ACD 2): el usufructo de Rosa sobre la casa es derecho real (arts. 595 y 778); el crédito de María contra Juan por USD 500 es derecho personal (art. 596). Rosa puede defender su derecho respecto de todos; María solo puede reclamar a Juan. El usufructo sobre un inmueble es inmueble y el crédito en dinero es mueble (art. 597).\n- Alimentos: el hijo tiene un derecho personal contra el padre (art. 596).\n- Hipoteca y prenda: derechos reales de garantía (art. 595).\n"},{"k":"preguntas_frecuentes","n":"Preguntas","md":"# Preguntas frecuentes: Las cosas incorporales: derechos reales y personales\n\n1. ★ ¿Qué son las cosas incorporales y cuáles son sus clases? (arts. 583 y 594) [Mapa; foro]\n2. ★ ¿Qué es un derecho real y cuáles enumera el Código? (art. 595)\n3. ★ ¿Qué es un derecho personal? Dé un ejemplo del Código. (art. 596)\n4. ★ ¿Cuál es la diferencia principal entre un derecho real y un personal? [ACD 2, pregunta 3]\n5. ¿Cómo se clasifican como muebles o inmuebles los derechos y acciones? (art. 597)\n6. ¿Por qué el usufructo es a la vez derecho real y limitación al dominio?\n7. ¿Qué acciones nacen de cada derecho?\n\nRespuestas en `salida/examenes/derecho_civil_II_simulacro_unidad_01.md`.\n"},{"k":"bibliografia","n":"Bibliografía","md":"# Bibliografía: Las cosas incorporales: derechos reales y personales\n\n## Obligatoria\n\n- Código Civil, arts. 583 a 598 (versión Lexis, ene 2024).\n- González Pesantes, E. (2012). *Derecho patrimonial*, pp. 15 a 18.\n- Parraguez Ruiz, L. (2020). *Régimen jurídico de los bienes*, pp. 41 a 51.\n\n## Producto elaborado\n\n`salida/material_estudio/DerechoCivilII/Entregables/AA - Mapa conceptual Clasificacion de los bienes - UnidadI.pdf` y el video foro del caso La casa de María.\n"},{"k":"jurisprudencia","n":"Jurisprudencia","md":"# Jurisprudencia: Las cosas incorporales: derechos reales y personales\n\nNo consta jurisprudencia en las fuentes del curso (los docentes no citaron ninguna). No es un faltante: se llena solo si una tarea la pide. Ni la guía, ni el sílabo ni las clases citan jurisprudencia. Concordancias del Código Civil mencionan Gacetas Judiciales (por ejemplo, \"Derechos reales\", 11-abr-1888, y \"Derechos personales\", 16-ene-1901): no se leyeron. Pendiente de verificar.\n"},{"k":"_ficha","n":"Ficha","md":"# Ficha del Gestor de Conocimiento\n\n**Materia:** Derecho Civil II\n**Unidad:** 1 · Enfoque general sobre bienes (sílabo)\n**Tema:** Cosas incorporales: derechos reales y personales (Código Civil, arts. 594 a 598)\n\n## Conceptos incorporados\n\nCosa incorporal, derecho real, derecho personal o crédito, acción real, acción personal, muebles e inmuebles por la cosa en que se ejercen, hechos que se deben.\n\n## Fuentes\n\nCódigo Civil (texto), González Pesantes (pp. 15 a 18), Parraguez (pp. 41 a 51), tutoría y anuncio de la semana 5 (actividad obligatoria del caso \"La casa de María y el préstamo de Juan\"), mapa conceptual y video foro elaborados.\n\n## Relaciones\n\n- El usufructo es derecho real y a la vez limitación del dominio (unidad 2).\n- Las acciones posesorias protegen bienes raíces y derechos reales constituidos en ellos (art. 960).\n- Conecta con Derecho Procesal II: acción real y acción personal definen la vía y el juez competente.\n\n## Contradicciones registradas\n\n- González Pesantes recuerda que la doctrina critica que los derechos se llamen \"cosas\" y recomienda empezar por la división en derechos reales y personales (p. 17); el Código Civil, siguiendo a Bello, usa \"cosas incorporales\". Para el examen, usar el Código.\n\n## Estado de actualización\n\nIncorporado el 31-oct-2026.\n"}]},{"id":"posesion_y_acciones_posesorias","titulo":"Posesión y acciones posesorias (Código Civil, arts. 715 y 960 a 977; COGEP, arts. 11.2, 142, 332 y 333)","docs":[{"k":"conceptos","n":"Conceptos","md":"# Conceptos: Posesión y acciones posesorias\n\n## Posesión\n\n- Es la tenencia de una cosa determinada con ánimo de señor o dueño (art. 715).\n\n## Las acciones posesorias (arts. 960 a 977)\n\n- Objeto: conservar o recuperar la posesión de bienes raíces o de derechos reales constituidos en ellos (art. 960). No procede sobre cosas que no se ganan por prescripción (art. 961).\n- Requisito: posesión tranquila y no interrumpida durante **un año completo**; basta la posesión material (art. 962). El heredero tiene las mismas acciones de su antecesor (art. 963).\n- Plazo: las de conservar prescriben en **un año** desde el acto de molestia; las de recuperar, en un año desde que se perdió la posesión (art. 964).\n- **Amparo o conservación (art. 965):** el poseedor puede pedir que no se le turbe, que se le indemnice y que se le dé seguridad contra quien fundadamente teme.\n- Usufructuario, usuario y habitador pueden ejercer las acciones posesorias aun contra el propietario (art. 966).\n- En el juicio posesorio no se toma en cuenta el dominio; se pueden exhibir títulos solo para probar la posesión (art. 967).\n- Prueba: la posesión de derechos inscritos se prueba por la inscripción (art. 968); la del suelo, por hechos positivos como cerramientos, plantaciones y construcciones (art. 969).\n- **Restitución (arts. 970 y 971):** quien fue privado injustamente de la posesión puede pedir que se le restituya con indemnización, contra el usurpador o quien derive de él.\n- **Restablecimiento (art. 972):** quien fue despojado violentamente, de la posesión o de la mera tenencia, puede pedir que se restablezcan las cosas sin más prueba que el despojo; prescribe en **seis meses**.\n- Obra nueva (arts. 974 y 975) y obras ruinosas (arts. 976 y 977).\n\n## Procedimiento (COGEP)\n\n- Competencia **excluyente** del juzgador del lugar de la cosa (art. 11.2).\n- Procedimiento sumario (arts. 332.2 y 333): no se reforma la demanda; contestación en 15 días; audiencia única en dos fases en 30 días desde la contestación.\n- La demanda sigue el art. 142 y se acompaña de los documentos del art. 143.\n\n## Doctrina\n\n- Parraguez (2020, p. 727): las acciones posesorias son protección complementaria del dominio; quien las ejerce invoca su condición de poseedor, no de propietario; las de amparo o conservación están en el art. 965, las de restitución en el 970 y las de restablecimiento en el 972.\n- Alcalde Silva (2021, p. 263), sobre el Código chileno: la querella de amparo busca que cese la turbación o el embarazo para que la posesión se conserve.\n"},{"k":"definiciones","n":"Definiciones","md":"# Definiciones: Posesión y acciones posesorias\n\n## Amparo posesorio\n\nAcción para conservar la posesión frente a turbaciones o embarazos (Código Civil, art. 965).\n\n## Turbación\n\nActo que perturba el ejercicio de la posesión sin quitarla (por ejemplo, retirar un cerramiento).\n\n## Restitución\n\nAcción para recuperar la posesión de quien fue privado injustamente (art. 970).\n\n## Restablecimiento\n\nAcción de quien fue despojado con violencia, sin más prueba que el despojo, con plazo de seis meses (art. 972).\n\n## Juicio posesorio\n\nEl que discute la posesión sin tomar en cuenta el dominio (art. 967).\n"},{"k":"ejemplos","n":"Ejemplos","md":"# Ejemplos: Posesión y acciones posesorias\n\n- **Demanda elaborada (APE):** el poseedor del lote \"El Mirador\" (3.200 m², Taquil, Loja) demanda al vecino que arrancó 40 m de cerramiento y fijó mojones a ocho metros dentro del lote; pide amparo, indemnización de USD 1.350, caución y costas. Es un caso supuesto: `salida/material_estudio/DerechoCivilII/Entregables/APE - Informe demanda de amparo posesorio - UnidadI.pdf`.\n- Si el vecino hubiera ocupado la franja y sacado al poseedor, la acción sería la restitución (art. 970).\n"},{"k":"preguntas_frecuentes","n":"Preguntas","md":"# Preguntas frecuentes: Posesión y acciones posesorias\n\n1. ★ ¿Qué es el amparo posesorio y cuál es su objeto? (arts. 960 y 965) [APE]\n2. ★ ¿Qué requisitos exige el art. 962?\n3. ★ ¿En cuánto tiempo prescribe la acción de conservar la posesión? (art. 964)\n4. ¿Se discute el dominio en el juicio posesorio? (art. 967)\n5. ¿Cómo se prueba la posesión del suelo? (art. 969)\n6. ¿Qué diferencia hay entre amparo, restitución y restablecimiento? (arts. 965, 970 y 972)\n7. ¿Qué juez es competente y por qué procedimiento se tramita? (COGEP, arts. 11.2 y 332.2)\n\nRespuestas en `salida/examenes/derecho_civil_II_simulacro_unidad_01.md`.\n"},{"k":"bibliografia","n":"Bibliografía","md":"# Bibliografía: Posesión y acciones posesorias\n\n- Código Civil, arts. 715 y 960 a 977; COGEP, arts. 11, 142, 143, 332 y 333.\n- Parraguez Ruiz, L. (2020). Protección jurídica del dominio y los demás derechos reales. En *Régimen jurídico de los bienes* (pp. 721-729).\n- Alcalde Silva, J. (2021). Las acciones posesorias ordinarias y el concepto de posesión en el Código Civil. *Revista Chilena de Derecho Privado*, (36), 247-268 (derecho chileno).\n- González Pesantes, E. (2012), capítulos de posesión: faltan en la carpeta (solo están los capítulos 1, 3 y 4).\n"},{"k":"jurisprudencia","n":"Jurisprudencia","md":"# Jurisprudencia: Posesión y acciones posesorias\n\nNo consta jurisprudencia en las fuentes del curso (los docentes no citaron ninguna). No es un faltante: se llena solo si una tarea la pide. Las concordancias del Código Civil citan Gacetas Judiciales sobre juicios posesorios (por ejemplo, \"Juicios posesorios\", 22-feb-1912, y \"Acción posesoria\", 28-jul-1978): no se leyeron.\n"},{"k":"_ficha","n":"Ficha","md":"# Ficha del Gestor de Conocimiento\n\n**Materia:** Derecho Civil II\n**Unidad:** 1 (demanda de amparo posesorio, APE) y unidad 3 (acciones posesorias y reivindicatoria) del sílabo\n**Tema:** Posesión y acciones posesorias (Código Civil, arts. 715 y 960 a 977; COGEP, arts. 11.2, 142, 332 y 333)\n\n## Conceptos incorporados\n\nPosesión, acción de amparo o conservación, restitución, restablecimiento, turbación, caución, obra nueva, juicio posesorio, competencia excluyente, procedimiento sumario.\n\n## Fuentes\n\nCódigo Civil y COGEP (texto), Parraguez (2020, pp. 721 a 729), Alcalde Silva (2021), y el informe jurídico de la demanda elaborado.\n\n## Relaciones\n\n- Procesal II: las acciones posesorias se tramitan por procedimiento sumario (COGEP, art. 332.2) y son de competencia excluyente del juez del lugar de la cosa (art. 11.2).\n\n## Estado de actualización\n\nIncorporado el 31-oct-2026. La unidad 3 aún no se dicta; esto adelanta lo necesario para la demanda de la unidad 1.\n"}]}]},{"id":"unidad_02_dominio_y_modos_de_adquirir_la_propiedad","num":2,"titulo":"Unidad 2 · Dominio y modos de adquirir la propiedad","pendiente":true,"estructura":"# Unidad 2 · El dominio y los modos de adquirir la propiedad\n\nEstructura del sílabo. Aún no hay clases de esta unidad (semanas 7–12, 9 nov – 16 dic 2026).\n\n## Temas (carpetas por crear cuando haya clase)\n\n- `propiedad_o_dominio` (concepto, etimología, características)\n- `modos_de_adquirir_el_dominio` (título y modo; originarios: ocupación, accesión, prescripción; derivativos: tradición, sucesión por causa de muerte; prescripción ordinaria y extraordinaria)\n- `limitaciones_al_dominio`\n- `tipos_de_posesion` (el sílabo los pide en el foro)\n\n## Lo que ya dice la guía\n\n- Todo dominio tiene dos causas: la próxima (modo, la tradición) y la remota (el título, el contrato de compra). [José María Álvarez]\n- Los modos de adquirir son las formas como nace el dominio. [Ernesto González]\n- Propiedad deriva de *proprius*; dominio de *dominium* (de *domus*: señor o dueño). [Peña Guzmán, González 2012]\n\n## Actividades\n\nForo, video foro (conexión obligatoria), mapa conceptual de las limitaciones, video, y demanda de prescripción extraordinaria adquisitiva de dominio. Evaluación: 14–16 dic 2026.\n\n## Bibliografía\n\nGonzález Pesantes (2012) y Guzmán Brito (2015), *La tradición como modo de adquirir el dominio en el derecho romano*.\n","temas":[]},{"id":"unidad_03_acciones_derivadas_del_dominio","num":3,"titulo":"Unidad 3 · Acciones derivadas del dominio","pendiente":true,"estructura":"# Unidad 3 · Las acciones derivadas del dominio\n\nEstructura del sílabo. Aún no hay clases de esta unidad (semanas 13–19, 4 ene – 21 feb 2027).\n\n## Temas (carpetas por crear cuando haya clase)\n\n- `accion_de_dominio` (reivindicatoria: quién la presenta, contra quién, tiempo para accionar y trámite)\n- `posesion` (clases de posesión; diferencia entre poseedor y tenedor)\n- `acciones_posesorias`\n\n## Actividades\n\nForo, video foro, mapa conceptual de las acciones posesorias, video y demanda de acción reivindicatoria. Evaluación: 20–21 feb 2027.\n\n## Bibliografía\n\nAlcalde Silva (2021), *Las acciones posesorias ordinarias y el concepto de posesión*.\n\n## Conexión\n\nLa demanda de amparo posesorio de la unidad 1 anticipa el tema de las acciones posesorias.\n","temas":[]}],"normas":"","resumenes":[{"id":"clase_01_tutoria_de_iniciacion","titulo":"Clase 1 · Tutoría de iniciación (Derecho Civil II)","md":"# Clase 1 · Tutoría de iniciación (Derecho Civil II)\n\n**Agente:** Analista de Clases · **Fuente:** `entrada/guias/DerechoCivilII/Clases/Semana_01.txt`\n**Tipo:** clase de encuadre. Es material administrativo, no contenido jurídico.\n\n## Resumen Ejecutivo\n\nLa docente se presentó, dio las normas de convivencia de la tutoría y recorrió el sílabo y la guía: unidades, actividades, puntos y fechas. Aclaró que **las tutorías ya no son obligatorias, pero las actividades calificadas sí**, y que las fechas de la guía mandan sobre las del EVA. No se dictó contenido jurídico, salvo la presentación de los temas de la unidad 1.\n\n## Ubicación en el Sílabo\n\nSemana 1 (28 sep – 4 oct 2026), socialización de sílabo y guía. Unidad 1: Enfoque general sobre bienes.\n\n## Indicaciones Administrativas\n\n- Medio de contacto: correo institucional, y WhatsApp para el grupo del curso. Los estudiantes eligen un representante del curso.\n- Quien falte por enfermedad u otra causa debe enviar al correo la evidencia (por ejemplo, certificado médico).\n- Las tareas no se reciben fuera del plazo del EVA: hay que subirlas hasta el cierre.\n- Las tutorías ya no son obligatorias. Sí lo es cada actividad calificada.\n- Evaluaciones de unidad: fechas tentativas de la guía (7–8 nov, 9–10 ene, 20–21 feb). La docente cree que seguirán siendo telemáticas, pero no está confirmado.\n- **Discrepancia de fechas:** el EVA mostraba cierre el 8 de noviembre para algunas entregas. Valen las de la guía: autónoma 1 hasta el 18 de octubre; autónoma 2 y demanda hasta el 1 de noviembre. Un estudiante pidió unificar la fecha.\n- La docente mencionó una autoevaluación no obligatoria con valoración de 4 puntos (por verificar con la guía).\n\n## Relación con Actividades Calificadas\n\nSe repasaron las de la unidad 1: foro académico (concepto de bienes, clases de bienes, bienes incorporales), video foro \"Los bienes\", mapa conceptual de la clasificación de los bienes, video interactivo y **demanda de amparo posesorio** (leer el art. 142 del COGEP).\n\n## Posibles Preguntas de Examen\n\nNo hubo contenido evaluable. El examen de la unidad 1 saldrá de bienes y su clasificación (ver clase 2).\n\n## Recomendaciones para Estudiar\n\n- Respetar las fechas de la guía y subir cada entrega antes del cierre.\n- Revisar el art. 142 del COGEP antes de redactar la demanda de amparo posesorio.\n- Estudiar el Libro II del Código Civil: la docente insistió en que se evalúa la norma.\n\n## Nivel de importancia\n\n| Tema | Nivel |\n|---|---|\n| Reglas de entrega y fechas | ★★★ |\n| Actividades calificadas de la unidad 1 | ★★★★ |\n"},{"id":"clase_02_clasificacion_de_los_bienes","titulo":"Clase 2 · Clasificación de los bienes corporales (Derecho Civil II)","md":"# Clase 2 · Clasificación de los bienes corporales (Derecho Civil II)\n\n**Agente:** Analista de Clases · **Fuente:** `entrada/guias/DerechoCivilII/Clases/Semana_03.txt` y `DiapositivasClases/Semana_03.pdf`\nLos números de artículo son los que dijo la docente y pueden estar mal transcritos: **por verificar** en el Código Civil.\n\n## Resumen Ejecutivo\n\nLa docente repasó bienes corporales e incorporales y desarrolló la clasificación de los corporales en **muebles e inmuebles** (Libro II del Código Civil, arts. 584 a 593 según la clase). Su idea central: la categoría legal no depende solo de la física del bien, sino del destino económico y de la voluntad de las partes, así que **un bien puede cambiar de categoría**. Cerró con bienes fungibles y no fungibles y con una actividad práctica en el EVA.\n\n## Ubicación en el Sílabo\n\nUnidad 1, semanas 2–3. Tema: \"Los bienes y su clasificación\". La actividad práctica quedó publicada en el EVA como \"semana 3\" (formato foro).\n\n## Temas Principales\n\n1. Bienes corporales e incorporales (repaso).\n2. Muebles e inmuebles y sus consecuencias jurídicas (transferencia, garantía, prescripción, forma).\n3. Muebles e inmuebles por naturaleza.\n4. Inmuebles por adherencia.\n5. Inmuebles por destino.\n6. Muebles por anticipación.\n7. Separación momentánea de lo adherido.\n8. Qué incluye la expresión \"muebles de una casa\".\n9. Bienes fungibles y no fungibles.\n\n## Conceptos Clave\n\n- **Bien corporal:** se percibe con los sentidos. **Incorporal:** no se toca, pero tiene valor (derechos, créditos, transferencias electrónicas, bonos de carbono).\n- **Mueble por naturaleza:** se mueve por fuerza propia (semoviente: caballo, vaca) o por fuerza externa (inanimado: laptop, televisor). Art. 585.\n- **Inmueble por naturaleza:** no se puede trasladar (tierras, minas, canteras). Art. 586.\n- **Inmueble por adherencia:** unido de forma permanente al inmueble (edificios, árboles, espejo empotrado). Art. 590.\n- **Inmueble por destino:** mueble que el dueño del inmueble destina de forma permanente a su uso o cultivo (tractor, animales de una finca). Art. 588.\n- **Mueble por anticipación:** frutos o productos adheridos que se tratan como muebles antes de separarse, para derechos de terceros (frutos pendientes, madera de un árbol vendido). Art. 589.\n- **Separación momentánea:** el inmueble por adherencia o destino conserva su calidad si se separa solo para repararlo (portón, tejas). Si el dueño lo regala, vende o cede, recupera la calidad de mueble. Art. 591.\n- **Muebles de una casa:** incluye camas, vajillas y muebles de uso común. Excluye ropa, joyas, obras de arte, dinero y artículos personales, salvo que el contrato o el testamento los mencione. Art. 592.\n- **Fungible:** se consume con el primer uso o se sustituye por otro igual de igual valor (dinero, arroz). **No fungible:** tiene individualidad propia y es irremplazable (caballo de pedigrí, cuadro único). Art. 593.\n\n## Definiciones (dichas por la docente)\n\n- Mueble: se transfiere con simple entrega material. Inmueble: exige escritura pública e inscripción en el registro.\n- Garantía de muebles: prenda. Garantía de inmuebles: hipoteca.\n- Prescripción: plazos cortos para muebles y largos para inmuebles (dicho de forma general; por verificar los plazos del Código).\n- \"La categorización legal depende no solo de la física, sino del destino económico y de la intención jurídica.\"\n\n## Ejemplos del Docente\n\n- Mateo compra una computadora (mueble: basta la entrega) y un lote (inmueble: escritura e inscripción).\n- Cuadro colgado con un clavo = mueble. Espejo empotrado = inmueble por adherencia. Cuadro descrito en el inventario de un departamento amoblado = se vuelve inmueble.\n- Árbol = inmueble. Árbol en una maceta o ya extraído = mueble.\n- Finca vendida con todo (tractor, animales) = inmueble por destino. Si el contrato excluye las vacas, se las puede llevar.\n- Naranjas del árbol = mueble por anticipación. Si se caen, son muebles.\n- **Plátanos o frutas de un árbol que cuelga sobre el terreno del vecino o hacia la calle:** pertenecen al dueño del terreno donde está plantado el árbol. Si caen en terreno ajeno, el dueño del árbol puede reclamarlas. Tomarlas sin permiso es robo.\n- Portón enviado a reparar: sigue siendo inmueble. Jacuzzi desmontable regalado: pasa a mueble.\n- Casa heredada con un cuarto escondido (obras de arte, joyas, dinero): no entra en \"muebles de una casa\" si no se describe.\n- Dinero: un billete de $20 por dos de $10 = fungible. Un billete de $10 por uno de $20 no equivale.\n- Caballo de pedigrí, cuadro único de Picasso, vestido de Lady Di subastado = no fungibles.\n\n## Temas Enfatizados\n\n- Un bien cambia de categoría según el contrato y la voluntad de las partes (\"en derecho aprendemos el depende\").\n- **Describir el bien con detalle en el contrato** (raza, número de arete, color, placa, chasis): un contrato mal descrito se invalida o provoca pleitos. \"La palabra se la lleva el viento\": vale lo escrito, y conviene notarizarlo.\n- La firma electrónica tiene la misma validez legal que la manual (dicho por la docente).\n- **Hay que estudiar la norma:** \"ningún juicio se va a ganar con la opinión de un autor\". Los autores (Parraguez, González) amplían, pero se evalúa el Código Civil ecuatoriano.\n\n## Normas y Autores Citados\n\n- Código Civil, Libro II: arts. 584–593 (por verificar).\n- Autores: Ernesto González y Luis Parraguez, como doctrina que amplía el tema.\n\n## Indicaciones Administrativas\n\n- Actividad práctica \"semana 3\" en el EVA. Lo que no se entienda se deja en blanco para verlo en la siguiente tutoría.\n- Evaluación diagnóstica: sin peso. Quienes no la rindieron o sacaron menos de 7 serán llamados a una reunión de socialización no obligatoria. La docente la reactivó hasta el sábado.\n\n## Relación con Actividades Calificadas\n\nForo de la unidad 1 (clases de bienes en la legislación civil), mapa conceptual \"Clasificación de los bienes\" y cuestionario de unidad (7–8 nov). Las categorías de esta clase son la base de las tres.\n\n## Posibles Preguntas de Examen\n\n1. ¿Qué diferencia hay entre bien y cosa? (viene de la guía, no de la clase)\n2. ¿Cuándo un mueble se vuelve inmueble? Distinga adherencia, destino y anticipación.\n3. ¿Qué requisitos exige un inmueble por destino?\n4. ¿Qué pasa con un portón enviado a reparar? ¿Y si se lo regala?\n5. ¿Qué incluye la expresión \"muebles de una casa\"? ¿Qué se excluye?\n6. Fungibles y no fungibles, con ejemplos.\n7. Caso: frutas del árbol que cuelgan sobre el terreno del vecino.\n\n## Recomendaciones para Estudiar\n\n- Leer los arts. 583–593 del Código Civil y rehacer la tabla de la clase.\n- Completar con Parraguez (2021), págs. 39–52.\n- Practicar con casos: cambia la categoría de un bien y piensa qué dice el contrato.\n\n## Nivel de importancia\n\n| Tema | Nivel |\n|---|---|\n| Muebles/inmuebles y cambios de categoría (adherencia, destino, anticipación) | ★★★★★ |\n| Separación momentánea | ★★★★ |\n| Muebles de una casa | ★★★★ |\n| Fungibles y no fungibles | ★★★★ |\n| Contratos, forma y prueba | ★★★ |\n\nLos niveles se basan en lo que la docente enfatizó y en que figuran en el tema del sílabo. No anunció el examen.\n"},{"id":"clase_03_anatomia_de_los_bienes_corporales","titulo":"Resumen Ejecutivo: Semana 3, anatomía de los bienes corporales (arts. 584 a 593)","md":"# Resumen Ejecutivo: Semana 3, anatomía de los bienes corporales (arts. 584 a 593)\n\n**Agente:** Analista de Clases · **Fuentes:** `Clases/Semana_03.txt` y `DiapositivasClases/Semana_03.pdf` (OCR). Docente de las tutorías: Abg. Claudia Patiño Izquierdo, Mgt.. 12 a 18 oct 2026.\n\n## Ubicación en el Sílabo\n\nUnidad 1, semana 3: los bienes y su clasificación (cosas corporales).\n\n## Temas Principales\n\nMuebles e inmuebles (art. 584), consecuencias jurídicas de la distinción, espectro de movilidad (arts. 585 y 586), adherencia y ornato (arts. 587 y 590), inmuebles por destino (art. 588), muebles por anticipación (art. 589), separación momentánea (art. 591), ajuar (art. 592) y fungibles (art. 593).\n\n## Conceptos Clave\n\n- La clasificación decide la **forma de transferir**, la **garantía** (prenda o hipoteca) y la **prescripción**.\n- Muebles se transfieren con la entrega; inmuebles exigen escritura pública e inscripción.\n- La ficción jurídica altera la clasificación por el propósito económico: destino y anticipación.\n\n## Definiciones\n\nVer `conocimiento/derecho_civil_II/unidad_01.../clasificacion_de_los_bienes/definiciones.md`.\n\n## Ejemplos del Docente\n\nVenta de una finca \"con todo\" (tractor, vacas, máquinas); espejo empotrado; portones y tejas retirados para reparar; laptop; cinco naranjas; caballo con pedigrí; dinero; vestido de Lady Di (bien único).\n\n## Temas Enfatizados\n\nLa voluntad de las partes: pactar por escrito qué se incluye en una venta, y notarizar los contratos; precisar las características de los animales (marca, número, color).\n\n## Normas y Autores Citados\n\nCódigo Civil arts. 584 a 593 (la docente citó 584 a 593).\n\n## Indicaciones Administrativas\n\nRefuerzo no calificado: caso \"La venta de la hacienda El Paraíso\" (arts. 584 a 593 según la docente).\n\n## Relación con Actividades Calificadas\n\nMapa conceptual (clasificación de los bienes) y evaluación de la unidad. La docente aclaró el 28 oct que el examen sale del material de la semana 5.\n\n## Posibles Preguntas de Examen\n\n★★★★★ Consecuencias de ser mueble o inmueble; requisitos del inmueble por destino; mueble por anticipación; espejo embutido frente a colgado; separación momentánea.\n\n## Recomendaciones para Estudiar\n\nEstudiar la matriz maestra y resolver el caso Hacienda El Paraíso (ver simulacro).\n\n## Nivel de importancia\n\n★★★★★ Es el núcleo del examen de la unidad.\n"},{"id":"clase_04_sin_transcripcion_de_la_materia","titulo":"Semana 4: sin transcripción utilizable","md":"# Semana 4: sin transcripción utilizable\n\n**Agente:** Analista de Clases.\n\n- La docente publicó solo un video sobre bienes incorporales (art. 594): https://youtube.com/live/1nfV0ujBQ5k. No hay transcripción ni diapositivas.\n- El archivo `entrada/guias/DerechoCivilII/Clases/Semana_04.txt` **no corresponde a Derecho Civil II**: es una tutoría de vinculación con la sociedad (emprendimientos, firmas electrónicas, equipos de proyecto). No se usó.\n- Acción pendiente del estudiante: subir la transcripción del video si existe, o confiar en el tema `cosas_incorporales_derechos_reales_y_personales`, que se armó con el Código Civil y los libros.\n- La semana 4 fue además un test (quiz) sin material descargable.\n"},{"id":"clase_05_arquitectura_de_los_bienes_y_actividad_obligatoria","titulo":"Resumen Ejecutivo: Semana 5, la arquitectura de los bienes (compendio y base del examen)","md":"# Resumen Ejecutivo: Semana 5, la arquitectura de los bienes (compendio y base del examen)\n\n**Agente:** Analista de Clases · **Fuentes:** `Clases/Semana_05.txt` (28 oct 2026) y `DiapositivasClases/Semana_05.pdf` (16 diapositivas, OCR). Docente Abg. Claudia Patiño Izquierdo, Mgt..\n\n## Ubicación en el Sílabo\n\nUnidad 1, semana 5: bienes y su clasificación; ACD 2 (video foro).\n\n## Temas Principales\n\nEvolución histórica de la propiedad; propiedad frente a posesión; macro-arquitectura (corporales e incorporales; muebles e inmuebles; públicos y privados); consecuencias jurídicas; espectro de adherencia; ficción jurídica (adherencia y ornato, destino, anticipación, separación momentánea); ajuar y fungibilidad; matriz maestra.\n\n## Conceptos Clave\n\nVer `conocimiento/derecho_civil_II/unidad_01.../clasificacion_de_los_bienes/conceptos.md` (sección de actualización).\n\n## Ejemplos del Docente\n\nCorporal e incorporal: propiedad intelectual, créditos, cuentas bancarias; mueble: artículos de oficina, mercaderías; semoviente: ganado; inamovibles: tierras, minas, canteras; espejo y clóset adherido; el tractor alquilado una semana no es inmueble por destino.\n\n## Temas Enfatizados\n\n- \"De este material es donde yo voy a tomar el examen.\" Es lo básico que un abogado debe saber.\n- Los temas de bienes más amplios se verán en la unidad 2 y en la retroalimentación, \"sin tomar examen de eso\".\n\n## Indicaciones Administrativas\n\n- **Trabajo autónomo:** se unifica; el video se elimina; queda el **mapa conceptual**, ampliado al **8 de noviembre**. Alcance: clasificación hasta las cosas incorporales y los derechos patrimoniales (derecho real y personal).\n- **Actividad obligatoria de la semana 5** (ACD 2): caso La casa de María y el préstamo de Juan, 3 preguntas, arts. 594 a 598; se contesta en el foro del EVA, sin PDF, hasta el domingo 1 de noviembre a las 23h00. Quien participó oralmente escribe su nombre completo y \"aporte oral en clase\". El estudiante recuerda que la docente dijo que el video foro se puede hacer **individual o en grupo de dos**; esa frase **no aparece en la transcripción** (la transcripción está incompleta en la parte final). Lo elaborado fue individual.\n- Feriado 2 y 3 de noviembre; retroalimentación el miércoles 4; evaluación 7 y 8 de noviembre.\n- La demanda de amparo posesorio sí existe (APE, 2,50 puntos): no la mencionó la docente; fecha por confirmar en el EVA.\n\n## Normas y Autores Citados\n\nCódigo Civil arts. 583 a 593 (la docente dijo \"568\" para el 588); arts. 594 a 598 en la actividad.\n\n## Relación con Actividades Calificadas\n\nVideo foro (ACD 2), mapa conceptual (AA), demanda de amparo (APE) y evaluación de la unidad.\n\n## Posibles Preguntas de Examen\n\n★★★★★ Todas las de la matriz y las consecuencias jurídicas; evolución propiedad y posesión; ficciones (destino, anticipación, separación momentánea).\n\n## Recomendaciones para Estudiar\n\nEstudiar `DiapositivasClases/Semana_05.pdf` completa (es la fuente del examen) y repasar la hoja de repaso de Civil II.\n\n## Nivel de importancia\n\n★★★★★ Fuente directa del examen de la unidad 1.\n"}],"tarjetas":[{"q":"Art. 583: clasificación general de los bienes","a":"Los bienes consisten en cosas corporales o incorporales."},{"q":"Cosas corporales","a":"Las que tienen un ser real y pueden ser percibidas por los sentidos: una casa, un libro (art. 583)."},{"q":"Cosas incorporales","a":"Las que consisten en meros derechos: créditos y servidumbres activas (art. 583). Son derechos reales o personales (art. 594)."},{"q":"¿Cómo se dividen las cosas corporales?","a":"En muebles e inmuebles (art. 584)."},{"q":"Muebles (art. 585)","a":"Se transportan de un lugar a otro por sí mismas (semovientes) o por fuerza externa (inanimadas)."},{"q":"Inmuebles (art. 586)","a":"Las que no pueden transportarse, como tierras y minas, y las unidas a ellas permanentemente, como edificios y árboles."},{"q":"¿Por qué importa distinguir muebles e inmuebles?","a":"Cambian la forma de transferir (entrega frente a escritura pública e inscripción), la garantía (prenda frente a hipoteca) y la prescripción (más corta en muebles)."},{"q":"Plantas (art. 587)","a":"Son inmuebles mientras adhieren al suelo por sus raíces; en macetas o cajones transportables son muebles."},{"q":"Inmuebles por destino (art. 588)","a":"Cosas muebles permanentemente destinadas al uso, cultivo y beneficio de un inmueble, puestas por el dueño: utensilios de labranza, animales de cultivo, máquinas de un establecimiento industrial adherente."},{"q":"Requisitos del inmueble por destino","a":"Destino al uso, cultivo o beneficio del inmueble; permanencia; colocado por el dueño de la finca."},{"q":"Muebles por anticipación (art. 589)","a":"Productos de los inmuebles y cosas accesorias (frutos, madera, tierra, metales de una mina) que se reputan muebles antes de separarse, para constituir derechos a favor de otra persona."},{"q":"Espejo y cuadros (art. 590)","a":"Si se fijan en la pared y se pueden remover sin detrimento, son muebles; si están embutidos y forman un mismo cuerpo con la pared, son parte de ella."},{"q":"Separación momentánea (art. 591)","a":"Lo que es inmueble por adherencia o destino no deja de serlo por una separación momentánea; sí cuando se separa para darle otro destino."},{"q":"Muebles de una casa (art. 592)","a":"Solo el ajuar: no incluye dinero, documentos, joyas, ropa, libros, armas ni carruajes."},{"q":"Fungibles (art. 593)","a":"Cosas muebles que no pueden usarse conforme a su naturaleza sin destruirse; el dinero es fungible."},{"q":"Derecho real (art. 595)","a":"El que tenemos sobre una cosa sin respecto a determinada persona. Ejemplos: dominio, herencia, usufructo, uso o habitación, servidumbres activas, prenda e hipoteca."},{"q":"Derecho personal o crédito (art. 596)","a":"El que solo puede reclamarse de ciertas personas que contrajeron la obligación por un hecho suyo o por la ley. Ejemplo: prestamista contra deudor; hijo contra padre por alimentos."},{"q":"Acciones reales y personales","a":"De los derechos reales nacen las acciones reales; de los personales, las acciones personales."},{"q":"Derechos y acciones como muebles o inmuebles (art. 597)","a":"Según la cosa en que se ejercen o que se debe: el usufructo sobre un inmueble es inmueble; la acción para que se pague un préstamo en dinero es mueble."},{"q":"Hechos que se deben (art. 598)","a":"Se reputan muebles."},{"q":"Dominio (art. 599)","a":"El derecho real en una cosa corporal para gozar y disponer de ella conforme a la ley y respetando el derecho ajeno. La propiedad separada del goce se llama nuda propiedad."},{"q":"Usufructo (arts. 778 y 779)","a":"Derecho real de gozar de una cosa con cargo de conservar su forma y sustancia; supone dos derechos coexistentes: el del nudo propietario y el del usufructuario."},{"q":"Bien y cosa según González Pesantes","a":"Todos los bienes son cosas, pero no todas las cosas son bienes (p. 14)."},{"q":"Bien y cosa según Parraguez","a":"El Código Civil ecuatoriano usa ambas palabras como sinónimos (pp. 49 a 51)."},{"q":"Propiedad y posesión según la docente","a":"Propiedad: ser dueño, tener el título. Posesión: tener la cosa con ánimo de señor o dueño; se puede poseer sin ser dueño legal."},{"q":"Evolución histórica de la propiedad (semana 5)","a":"Comunidades antiguas sin propiedad individual; Roma separa propiedad y posesión; edad media con dominio dividido; edad moderna con propiedad unificada (Código de Napoleón y Bello)."},{"q":"Bienes nacionales (art. 604)","a":"Aquellos cuyo dominio pertenece a la Nación toda."},{"q":"Posesión (art. 715)","a":"Tenencia de una cosa determinada con ánimo de señor o dueño."},{"q":"Acciones posesorias (art. 960)","a":"Tienen por objeto conservar o recuperar la posesión de bienes raíces o de derechos reales constituidos en ellos."},{"q":"Requisito para el amparo (art. 962)","a":"Posesión tranquila y no interrumpida durante un año completo; basta la posesión material."},{"q":"Plazo de la acción de conservar (art. 964)","a":"Un año desde el acto de molestia."},{"q":"Qué puede pedir el poseedor (art. 965)","a":"Que no se le turbe, que se le indemnice el daño y que se le dé seguridad contra quien fundadamente teme."},{"q":"En el juicio posesorio, ¿se discute el dominio? (art. 967)","a":"No; los títulos de dominio solo sirven para comprobar la posesión."},{"q":"Prueba de la posesión del suelo (art. 969)","a":"Hechos positivos como cerramientos, plantaciones y construcciones."},{"q":"Restablecimiento (art. 972)","a":"Quien fue despojado con violencia puede pedir que se restablezcan las cosas; el derecho prescribe en seis meses."},{"q":"Competencia y procedimiento del amparo","a":"Juez del lugar de la cosa, competencia excluyente (COGEP art. 11.2); procedimiento sumario (arts. 332.2 y 333)."}],"simulacro":"# Simulacro de la unidad 1: Derecho Civil II\n\n**Agente:** Preparador de Exámenes · **Unidad 1** · Basado en `conocimiento/` y el texto de las normas de la carpeta.\n**Formato de la evaluación:** no consta en el sílabo (cuestionario o estudio de caso). Este simulacro mezcla preguntas objetivas y casos.\n**Marcas:** [Clase] sale de lo dicho por el docente; [Guía] de la guía o el sílabo; [Propia] elaboración propia. Respuestas al final, con su fundamento.\n\n**Alcance:** lo que la docente dijo que tomará: el material de la semana 5 (`Semana_05.pdf`: evolución histórica, clasificación de los bienes, consecuencias, adherencia, destino, anticipación, separación momentánea, ajuar y fungibilidad). Se añade la parte de incorporales (alcance del mapa conceptual) y la demanda de amparo posesorio, que se evalúa en la tutoría presencial. Evaluación: sábado 7 de noviembre, 14h00 a 16h00.\n\n## Preguntas de memoria\n\n1. ¿Cómo clasifica el art. 583 del Código Civil los bienes? [Clase]\n2. ¿Qué son muebles según el art. 585 y qué diferencia hay entre semovientes e inanimados? [Clase]\n3. ¿Qué requisitos tiene un inmueble por destino (art. 588)? [Clase]\n4. ¿Qué es un mueble por anticipación (art. 589)? [Clase]\n5. ¿Qué dice el art. 591 sobre la separación momentánea? [Clase]\n6. ¿Qué comprende la expresión \"muebles de una casa\"? (art. 592) [Clase]\n7. Defina bien fungible y no fungible (art. 593) y dé un ejemplo de cada uno. [Clase]\n8. Defina derecho real y derecho personal (arts. 595 y 596). [Mapa; ACD 2]\n\n## Preguntas de comprensión\n\n9. ¿Qué consecuencias jurídicas tiene la distinción entre muebles e inmuebles? [Clase]\n10. ¿Por qué el espejo colgado es mueble y el embutido es inmueble? [Clase]\n11. ¿Qué diferencia hay entre propiedad y posesión según el recorrido histórico de la semana 5? [Clase]\n12. ¿Cómo se clasifican como muebles o inmuebles los derechos y acciones? (art. 597) [Propia]\n\n## Preguntas de aplicación\n\n13. Si se vende una finca \"con todo\", ¿qué pasa con el tractor y el ganado de ordeño? ¿Y si el tractor se alquiló una semana? [Clase]\n14. Las tejas de una casa se retiran para repararla. ¿Son muebles o inmuebles? ¿Y si se regalan a un vecino? [Clase]\n15. El Código dice \"muebles de una casa\" en un testamento. ¿El heredero recibe la colección de monedas guardada en la caja fuerte? [Clase]\n\n## Casos prácticos\n\n16. **Hacienda El Paraíso** [Clase, semana 3]: Roberto vende a Sofía la hacienda \"con todos sus bienes inmuebles y accesorios que correspondan por ley\". Roberto se lleva: un tractor comprado para arar permanentemente los campos, diez macetas con orquídeas en el corredor, las tejas del tejado desmontadas para barnizarlas, 200 sacos de naranjas vendidas a una empresa pero aún en los árboles, un espejo empotrado en yeso, el dinero de la caja fuerte y dos camionetas del garaje. Resuelva cada punto.\n17. **La casa de María** [ACD 2]: Rosa tiene usufructo sobre la casa de María; Juan debe a María USD 500. ¿Qué derecho tiene cada una? ¿Cuál es la diferencia principal? ¿Son bienes muebles o inmuebles?\n18. **Amparo posesorio** [Propia]: Segundo posee un lote desde hace cuatro años y su vecino retiró el cerramiento. ¿Qué acción procede, qué puede pedir, en cuánto tiempo prescribe y ante qué juez se presenta?\n\n## Respuestas sugeridas\n\n1. Los bienes consisten en cosas corporales o incorporales (art. 583). Corporales tienen un ser real y se perciben por los sentidos (casa, libro); incorporales son meros derechos (créditos, servidumbres activas).\n\n2. Muebles son las que pueden transportarse de un lugar a otro. Semovientes se mueven por sí mismos (caballo); inanimados solo por fuerza externa (teléfono, silla) (art. 585).\n\n3. Estar permanentemente destinadas al uso, cultivo y beneficio de un inmueble y haber sido puestas por el dueño de la finca (art. 588, y la diapositiva 7).\n\n4. Productos de los inmuebles y cosas accesorias (frutos, madera, tierra, metales de una mina) que se reputan muebles aun antes de separarse, para constituir un derecho a favor de otra persona que el dueño (art. 589).\n\n5. Las cosas que son inmuebles por adherencia o destino no dejan de serlo por una separación momentánea; dejan de serlo cuando se separan para darles otro destino (art. 591).\n\n6. Solo el ajuar doméstico (camas, vajilla, muebles de uso común); no el dinero, documentos, colecciones, libros, armas, joyas, ropa ni carruajes (art. 592).\n\n7. Fungibles: no pueden usarse conforme a su naturaleza sin destruirse y son sustituibles por otras iguales (dinero). No fungibles: tienen individualidad propia (caballo con pedigrí) (art. 593; diapositiva 11).\n\n8. Real: el que se tiene sobre una cosa sin respecto a determinada persona (usufructo, dominio, hipoteca). Personal: el que solo puede reclamarse de ciertas personas obligadas (préstamo, alimentos).\n\n9. Forma de transferencia (entrega o escritura pública con inscripción), garantía (prenda o hipoteca) y prescripción (más corta en muebles). Clasificar mal un bien invalida contratos y garantías (diapositivas 7 y 8; González Pesantes, p. 19).\n\n10. Porque si se puede remover fácilmente sin detrimento de la pared es mueble; si está embutido de modo que forma un mismo cuerpo con ella, es parte de la pared (art. 590).\n\n11. Propiedad es ser dueño, tener el título que avala el dominio; posesión es tener la cosa con ánimo de señor o dueño aunque no se sea el dueño legal. Roma los separó; la edad media fragmentó el dominio; la modernidad lo unificó (diapositivas 3 a 5).\n\n12. Según la cosa en que se ejercen o que se debe: el usufructo de un inmueble es inmueble; la acción para que se pague un préstamo en dinero es mueble; la del comprador para que se le entregue la finca es inmueble (art. 597); los hechos que se deben son muebles (art. 598).\n\n13. Por destino son inmuebles y pasan al comprador aunque no se mencionen, si se cumplen los requisitos del art. 588. El tractor alquilado una semana no es inmueble por destino: la destinación debe ser permanente y colocada por el dueño [Clase, semana 5]. Conviene pactar por escrito.\n\n14. Siguen siendo inmuebles mientras se retiran para volver a colocarlas (art. 591); si se regalan o venden aparte, recuperan la calidad de muebles.\n\n15. No: el art. 592 excluye el dinero, las colecciones y las joyas; el heredero recibe el ajuar (diapositiva 10).\n\n16. Tractor: inmueble por destino si Roberto lo puso para el cultivo permanente (art. 588), así que se queda con la hacienda. Macetas: muebles (art. 587); Roberto puede llevarlas. Espejo empotrado: parte de la pared, inmueble por adherencia (art. 590); se queda. Tejas desmontadas: siguen inmuebles mientras se vayan a volver a colocar (art. 591). Naranjas: son muebles por anticipación (art. 589); si ya estaban vendidas a la empresa, el derecho es de esta; el punto es discutible y depende del contrato y las fechas [Propia]. Dinero y camionetas: muebles ajenos a la venta de inmuebles y accesorios; Roberto puede llevarlos.\n\n17. Rosa: derecho real de usufructo (arts. 595 y 778), inmueble (art. 597). María: derecho personal o crédito contra Juan (art. 596), mueble. Diferencia: el real recae sobre la cosa y se tiene frente a todos; el personal solo se reclama a Juan.\n\n18. Acción posesoria de amparo o conservación (arts. 960 y 965): pedir que no se le turbe, indemnización y seguridad contra nuevos actos. Prescribe en un año desde el acto de molestia (art. 964). Se presenta ante el juez del lugar donde está el lote (COGEP, art. 11.2), por procedimiento sumario (art. 332.2). Debe probar posesión tranquila de un año completo (art. 962) por hechos positivos (art. 969); no se discute el dominio (art. 967).\n","repaso":"# Hoja de repaso rápido: Derecho Civil II, unidad 1\n\n**Agente:** Constructor de Material · Fuente principal: **`Semana_05.pdf`**, de donde la docente dijo que toma el examen. Evaluación: sábado 7 de noviembre, 14h00 a 16h00; la demanda se evalúa en la tutoría presencial.\n\n## Temas prioritarios\n\n1. ★★★★★ **Matriz maestra de clasificación** (diapositiva 16): muebles por naturaleza (arts. 585), inmuebles por naturaleza (586), por adherencia (586, 587, 590), por destino (588), muebles por anticipación (589).\n2. ★★★★★ **Consecuencias jurídicas de mueble o inmueble:** transferencia, garantía y prescripción.\n3. ★★★★★ **Ficciones jurídicas:** adherencia y ornato (587, 590), destino (588: uso o cultivo, permanente, puesto por el dueño), anticipación (589), separación momentánea (591).\n4. ★★★★ **Ajuar y fungibilidad** (592, 593).\n5. ★★★★ **Evolución histórica; propiedad y posesión** (diapositivas 3 a 5).\n6. ★★★ **Incorporales, derechos reales y personales** (arts. 594 a 598): alcance del mapa; la docente dijo que lo más amplio de bienes se ve en la unidad 2 sin tomar examen.\n\n## Cuadro: clasificación en una mirada\n\n| Categoría | Criterio | Ejemplo | Artículo |\n|---|---|---|---|\n| Mueble por naturaleza | Se mueve por sí mismo o por fuerza externa | Caballo, computadora | 585 |\n| Inmueble por naturaleza | No se puede transportar | Tierras, minas | 586 |\n| Inmueble por adherencia | Unido permanentemente | Edificio, árbol, espejo embutido | 586, 587, 590 |\n| Inmueble por destino | Mueble destinado por el dueño, de forma permanente, al predio | Tractor, alambiques | 588 |\n| Mueble por anticipación | Producto del inmueble que se negocia como mueble | Naranjas en el árbol, madera en pie | 589 |\n\n## Cuadro: derecho real y derecho personal\n\n| | Real | Personal |\n|---|---|---|\n| Sobre qué | Una cosa | Una persona obligada |\n| Se opone a | Todos | El deudor |\n| Ejemplos | Dominio, usufructo, hipoteca | Préstamo, alimentos |\n| Acción | Real | Personal |\n| Artículo | 595 | 596 |\n\n## Casos para practicar\n\nHacienda El Paraíso (semana 3), La casa de María (ACD 2) y la demanda de amparo: están resueltos en `salida/examenes/derecho_civil_II_simulacro_unidad_01.md`.\n\n## Alertas\n\nEl archivo de la semana 4 en `entrada` no es de Civil II (es de vinculación). La semana 4 real fue un video sobre bienes incorporales (art. 594).\n","guia":"# Análisis de guía y sílabo: Derecho Civil II\n\n**Agente:** Analista de Guías · **Fuentes:** `entrada/guias/DerechoCivilII/Guia_Derecho_Civil_II.pdf` y `Silabo_Derecho_Civil_II.pdf`\n\n## Datos de la materia\n\n| Dato | Valor |\n|---|---|\n| Carrera / modalidad | Derecho, Unidad de Educación a Distancia (Universidad Nacional de Loja) |\n| Ciclo y periodo | IV ciclo, septiembre 2026 – febrero 2027 |\n| Autor del sílabo | Dr. Otto Montesinos Guarnizo, PhD (otto.montesinos@unl.edu.ec) |\n| Docente de las tutorías (clases) | Se presenta como Claudia (apellido mal transcrito). No consta su correo |\n| Horas | 160 (ACD 96/ 6 por semana; APE 32 / 2 por semana; AA 32 / 2 por semana) |\n| Prerrequisito | Derecho Civil I (M5.C3.A4) |\n| Proyecto integrador | Clínica Jurídica II – Práctica Civil |\n| Propósito | Objetos del derecho, régimen jurídico del dominio y modos de adquirirlo, limitaciones al dominio, acción de dominio, posesión y acciones posesorias |\n\n## Unidades y temas (estructura oficial del sílabo)\n\n| Unidad | Nombre | Semanas (guía) | Resultado de aprendizaje |\n|---|---|---|---|\n| 1 | Enfoque general sobre bienes | 1–6 (28 sep – 8 nov 2026) | Analiza las categorías básicas relacionadas con los objetos del derecho |\n| 2 | El dominio y los modos de adquirir la propiedad | 7–12 (9 nov – 16 dic 2026) | Comprende el régimen jurídico del dominio y los modos de adquirirlo |\n| 3 | Las acciones derivadas del dominio | 13–19 (4 ene – 21 feb 2027) | Explica las limitaciones al dominio, la acción de dominio, la posesión y las acciones posesorias especiales |\n\nTemas por unidad según el sílabo:\n- **U1:** enfoque general sobre los bienes, su dominio, posesión, uso, goce y limitación; los bienes y su clasificación.\n- **U2:** el dominio y los modos de adquirirlo; las limitaciones del dominio. La guía añade: propiedad o dominio (etimología), modos originarios (ocupación, accesión, prescripción) y derivativos (tradición, sucesión por causa de muerte), y la prescripción ordinaria y extraordinaria.\n- **U3:** la acción de dominio (reivindicatoria), la posesión y las acciones posesorias. La guía y el sílabo piden diferencias entre poseedor y tenedor y los requisitos de la acción reivindicatoria.\n\n## Actividades por unidad (cada unidad vale 10 puntos)\n\n| Componente | Actividad | Puntos |\n|---|---|---|\n| ACD | Foro académico (asincrónico) | 1,00 |\n| ACD | Video foro (sincrónico, Zoom) | 1,00 |\n| AA | Trabajo autónomo 1 (mapa conceptual) | 1,00 |\n| AA | Trabajo autónomo 2 (video personal) | 1,00 |\n| APE | Trabajo práctico experimental (demanda) | 2,50 |\n| Evaluación sumativa | Cuestionario de unidad (en tutoría presencial) | 3,50 |\n| **Total** | | **10,00** |\n\nActividades concretas del sílabo:\n- **U1:** foro con preguntas (concepto de bienes, clases de bienes en la legislación civil, bienes incorporales); mapa conceptual de la clasificación de los bienes; video interactivo (qué son los bienes y clases de bienes); demanda de amparo posesorio (lectura del art. 142 COGEP, según la clase).\n- **U2:** foro (concepto de los modos de adquirir, tipos de posesión, diferencias entre prescripción ordinaria y extraordinaria); mapa conceptual de las limitaciones al dominio; video (modos de adquirir y tipos de posesión); demanda de prescripción extraordinaria adquisitiva de dominio.\n- **U3:** foro (diferencias entre poseedor y tenedor, acciones del poseedor, si el tenedor puede prescribir); mapa conceptual de las acciones posesorias; video (clases de posesión y requisitos de la acción reivindicatoria); demanda de acción reivindicatoria.\n\nInstrumentos: rúbricas para foro, video y mapa; lista de cotejo/registro de desempeño para ACD; calificación automática para el cuestionario.\n\n## Fechas importantes\n\n| Hito | Fecha |\n|---|---|\n| Taller de inducción | 28, 29 y 30 de septiembre 2026 |\n| Unidad 1: foro 1 / video foro | 28 sep – 25 oct / 26 oct – 1 nov 2026 |\n| Unidad 1: trabajo autónomo 1 / 2 | 28 sep – 18 oct / 19 oct – 1 nov 2026 |\n| Unidad 1: demanda (APE) | 28 sep – 1 nov 2026 |\n| Evaluación de la unidad 1 (presencial) | 7 y 8 nov 2026 |\n| Unidad 2: foro / video foro (conexión obligatoria) | 9 nov – 6 dic / 7–13 dic 2026 |\n| Unidad 2: trabajo autónomo 1 / 2 | 9–29 nov / 30 nov – 13 dic 2026 |\n| Unidad 2: demanda (APE) | 9 nov – 13 dic 2026 |\n| Evaluación de la unidad 2 | 14–16 dic 2026 |\n| Unidad 3: foro | 4 – 31 ene 2027 |\n| Unidad 3: video foro | 1–7 feb 2027 |\n| Evaluación de la unidad 3 (presencial) | 20 y 21 feb 2027 |\n| Semana del estudiante | 10, 11 y 12 feb 2027 |\n| Evaluación de recuperación | 8–12 mar 2027 |\n| Presenciales | 7–8 nov 2026, 9–10 ene 2027, 20–21 feb 2027 |\n\n## Bibliografía\n\n- **Básica física:** Parraguez Ruiz, Luis. *Régimen Jurídico de los Bienes*. Cevallos Editora Jurídica, 2020 (primera reimpresión). ISBN 978-9942-794-07-9. La guía la cita como Parraguez, L. (2021), págs. 39–52 para el tema de bienes.\n- **Básica virtual:** Morand-Deviller, J. (2011), *Los bienes públicos y el derecho de propiedad*, Revista de Estudios de la Administración Local y Autonómica; Guzmán Brito, A. (2015), *La tradición como modo de adquirir el dominio en el derecho romano*, SCIELO; Alcalde Silva, J. (2021), *Las acciones posesorias ordinarias y el concepto de posesión*, Revista chilena de derecho privado.\n- **Complementaria virtual:** González Pesantes, Ernesto (2012), *Derecho Patrimonial y…* (AJSA-UNL, ISBN 978-9942-13-006-8). El docente de la tutoría dijo que sus bienes y su doctrina son más amplios que el Código Civil.\n- **Normas:** Código Civil (Libro II, bienes), COGEP (art. 142, contenido de la demanda).\n\n## Normas de entrega\n\nPDF, citación APA 7, plataforma EVA. Las conexiones sincrónicas no son obligatorias, salvo el video foro de la unidad 2 (según la guía). La actividad sí es obligatoria.\n\n## Alertas\n\n1. **Contradicción de fechas del EVA.** En la clase 1, un
