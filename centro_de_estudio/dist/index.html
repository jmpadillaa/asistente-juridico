estudiante dijo que el EVA mostraba cierre el 8 de noviembre; la docente indicó que la guía manda: 18 de octubre (autónoma 1) y 1 de noviembre (autónoma 2 y demanda). Seguir la guía.\n2. **Sílabo vs. guía en las semanas.** El sílabo da 6 semanas a la unidad 1, 5 a la 2 y 5 a la 3 (16 en total). La guía pone 6, 6 y 7 semanas (19 en total, con la evaluación).\n3. **Sílabo vs. guía en los puntos de autónomo.** La tabla de evaluación del sílabo está desordenada (muestra 0,50 y 1,50 donde la guía pone 1,00 + 1,00). Seguir la guía: autónomo 1 + 1.\n4. **Posible error en el sílabo.** En la unidad 2, el foro menciona \"Las obligaciones: fuentes, caracteres y clases\", que no corresponde a dominio. Conviene confirmarlo con el docente.\n5. **Año de Parraguez.** El sílabo dice 2020 (reimpresión) y la guía 2021.\n6. **Evaluación diagnóstica.** La clase 2 menciona una evaluación diagnóstica: sin nota, pero quienes sacaron menos de 7 o no la rindieron serán llamados a una socialización no obligatoria.\n7. **Cambios comunicados por la docente (actualizado 29 oct 2026).** Fuentes: anuncios del EVA en el correo y `Clases/Semana_05.txt`.\n   - **2 oct, \"nota importante\":** los dos trabajos autónomos se unifican en una sola actividad. Fecha única: 1 de noviembre.\n   - **28 oct, en la tutoría:** a pedido de los estudiantes, el trabajo autónomo pasa al **8 de noviembre** y **se elimina el video**; queda solo el **mapa conceptual**. Alcance según la docente: la clasificación de los bienes hasta las cosas incorporales y los derechos patrimoniales (reales y personales). La plataforma tardó en reflejar el cambio: confirmar la fecha en el EVA.\n   - **28 oct, anuncio de la semana 5:** actividad práctica obligatoria de análisis de caso (identificar derechos patrimoniales y responder tres preguntas; arts. 594 a 598 del Código Civil). Se responde **escrita directamente en el foro \"semana 5 obligatoria\"**, sin subir PDF. Abierta hasta el **domingo 1 de noviembre, 23h00**. Quien participó oralmente en clase (leyó y explicó una diapositiva con un ejemplo) puede poner su nombre completo y \"(aporte oral en clase)\" en el foro.\n   - **29 oct:** la docente está en una delegación universitaria. **No hay tutoría hoy.** Dejó el material de la semana 5 (`Semana_05.pdf`) y la actividad en el EVA. El material es un compendio de lo visto y de ahí toma el examen.\n   - **Feriado:** lunes 2 y martes 3 de noviembre. Retroalimentación de la unidad el miércoles 4. Evaluación de la unidad 1: 7 y 8 de noviembre.\n   - **Corrección de la estudiante (29 oct):** la demanda de amparo posesorio **sí existe** y la debe hacer (APE, 2,50 puntos). La guía, el sílabo y la clase 1 la confirman. Vence el 1 de noviembre según la guía; la docente no la mencionó en la tutoría del 28 de octubre, así que confirmar en el EVA si cambió. Rúbrica: informe, defensa con video y participación en la tutoría presencial (7 y 8 de noviembre). Prerrequisitos: Código Civil art. 960 y siguientes, COGEP art. 142 y Parraguez. El foro de la unidad 1 ya está contestado.\n   - **Aclarado por la estudiante (29 oct):** las actividades prácticas semanales (semanas 2 a 4) son refuerzos que da la docente para afianzar la clase y no forman parte de las actividades calificadas de la guía. La de la semana 5 es el ACD 2 de la guía (video foro, 1,00 punto): `ActividadesPracticas/Semana_05_ACD2_Video_foro_OBLIGATORIO_Caso_Casa_de_Maria`. Las semanas 2 y 4 de Civil II fueron un test (quiz).\n8. **Falta material de la semana 4.** La docente publicó solo el video (https://youtube.com/live/1nfV0ujBQ5k, bienes incorporales, art. 594). No hay transcripción ni diapositivas en `entrada/guias/DerechoCivilII/`.\n","mapas":[{"id":"clasificacion","titulo":"Clasificación de los bienes","nota":"Arts. 583 a 597 del Código Civil. Es la matriz que la docente dijo que toma en el examen (Semana_05, diapositiva 16).","tipo":"arbol","datos":{"t":"Bienes","c":[{"t":"Cosas corporales","n":"art. 583","c":[{"t":"Muebles","n":"art. 585","c":[{"t":"Por naturaleza","c":[{"t":"Semovientes","n":"se mueven solos: caballo"},{"t":"Inanimados","n":"fuerza externa: computadora"}]},{"t":"Por anticipación","n":"art. 589","c":[{"t":"Frutos y productos aún adheridos","n":"naranjas en el árbol, madera en pie"}]}]},{"t":"Inmuebles","n":"art. 586","c":[{"t":"Por naturaleza","c":[{"t":"Tierras, minas, canteras"}]},{"t":"Por adherencia","n":"arts. 586, 587, 590","c":[{"t":"Edificios y árboles"},{"t":"Espejo o cuadro embutido","n":"cuadro con gancho = mueble"}]},{"t":"Por destino","n":"art. 588","c":[{"t":"Tractor, alambiques, animales de la finca"}]}]}]},{"t":"Cosas incorporales","n":"arts. 583 y 594","c":[{"t":"Derechos reales","n":"art. 595","c":[{"t":"Dominio y herencia"},{"t":"Usufructo, uso, habitación"},{"t":"Servidumbres activas"},{"t":"Prenda e hipoteca"}]},{"t":"Derechos personales","n":"art. 596","c":[{"t":"Préstamo (acreedor y deudor)"},{"t":"Alimentos del hijo contra el padre"}]}]}]}},{"id":"destino","titulo":"¿Es inmueble por destino?","nota":"Art. 588. Los tres requisitos deben cumplirse a la vez.","tipo":"flujo","datos":{"pasos":[{"t":"Es mueble por naturaleza","n":"se puede transportar"},{"t":"Está al servicio del inmueble","n":"uso, cultivo o beneficio"},{"t":"Es permanente","n":"no un uso pasajero"},{"t":"Lo puso el dueño de la finca","n":"no un arrendatario"},{"t":"Se reputa inmueble","n":"aunque pueda separarse sin detrimento","fin":true}],"pie":"Ejemplo de la docente: un tractor alquilado una semana no es inmueble por destino. Una finca vendida \"con todo\" incluye tractor y animales."}},{"id":"consecuencias","titulo":"Mueble frente a inmueble: consecuencias","nota":"Por qué importa clasificar bien: \"categorizar mal un objeto invalida contratos y garantías\" (diapositivas 7 y 8).","tipo":"comparar","datos":{"cols":[{"t":"Mueble","items":["Se transfiere con la entrega","Garantía: prenda","Prescripción: plazos más cortos","Ejemplo: computadora, joyas"]},{"t":"Inmueble","items":["Escritura pública (art. 1740) e inscripción en el Registro de la Propiedad (arts. 702 y 703)","Garantía: hipoteca, que debe inscribirse (art. 2312)","Prescripción: plazos más largos","Ejemplo: un lote, una casa"]}]}},{"id":"real-personal","titulo":"Derecho real frente a derecho personal","nota":"Arts. 595 y 596. Caso de clase: la casa de María.","tipo":"comparar","datos":{"cols":[{"t":"Derecho real","items":["Recae sobre una cosa","Se opone a todos","Ejemplos: dominio, usufructo, hipoteca","Nace la acción real","Caso: Rosa y el usufructo de la casa"]},{"t":"Derecho personal","items":["Recae sobre una persona obligada","Se opone solo al deudor","Ejemplos: préstamo, alimentos","Nace la acción personal","Caso: María contra Juan por USD 500"]}]}},{"id":"separacion","titulo":"Separación momentánea","nota":"Art. 591.","tipo":"comparar","datos":{"cols":[{"t":"Sigue siendo inmueble","items":["Se separa para reparar","Hay ánimo de volver a colocarla","Ejemplo: un portón enviado a reparar"]},{"t":"Pasa a ser mueble","items":["Se separa para darle otro destino","Se vende o se regala","Ejemplo: un jacuzzi desmontable que se regala"]}]}}]},{"id":"penal","nombre":"Derecho Penal","corto":"Penal","docente":"Mgtr. Wilson Rodas Mogrovejo","color":"#B4463C","colorOscuro":"#E58A80","evaluacion":{"inicio":"2026-11-07T08:00","fin":"2026-11-07T10:00"},"unidades":[{"id":"unidad_01_fundamentos_del_delito","num":1,"titulo":"Unidad 1 · Fundamentos del delito","pendiente":false,"estructura":"","temas":[{"id":"elementos_de_la_tipicidad","titulo":"Elementos de la tipicidad (niveles de imputación objetivo y subjetivo)","docs":[{"k":"conceptos","n":"Conceptos","md":"# Conceptos: Elementos de la tipicidad\n\nFuentes: [Clase 3] docente · [Diap. S3] diapositivas (Albán Gómez, cap. VII; COIP arts. 18, 25, 26, 27, 28.1)\n\n- **Tipo penal:** descripción abstracta de la conducta en la ley. **Tipicidad:** juicio de adecuación del hecho concreto a todos los requisitos de esa descripción. [Diap. S3]\n- **Funciones de la tipicidad (Albán Gómez):** garantista (concreta la legalidad), descriptiva (delimita la conducta), sistemática (la separa de la antijuridicidad) y procesal (orienta investigación, acusación y juzgamiento). [Diap. S3]\n- **Tipo objetivo:** verbo rector, sujeto activo y pasivo, objeto material, bien jurídico, medios, tiempo, lugar y ocasión, elementos descriptivos y normativos, y resultado y nexo causal si el tipo los exige. [Diap. S3]\n- **Bien jurídico vs. objeto material:** el primero es el interés protegido; el segundo, la persona o cosa sobre la que recae la acción. [Diap. S3]\n- **Imputación objetiva:** la causalidad no basta. Filtros: causalidad si hace falta; riesgo jurídicamente desaprobado creado o incrementado; el resultado realiza ese riesgo; riesgo permitido, principio de confianza y prohibición de regreso; circunstancias del caso. [Diap. S3; Albán Gómez, cap. VI]\n- **Tipo subjetivo:** dolo (art. 26) y culpa (art. 27, solo si la ley la tipifica). No se presumen por el solo resultado. [Diap. S3]\n- **Error de tipo (art. 28.1):** invencible excluye la infracción; vencible puede dar responsabilidad culposa; sobre una agravante, impide apreciarla. [Diap. S3]\n\n## Relaciones\n\n- Tipicidad → antijuridicidad: una conducta típica no es necesariamente antijurídica.\n- Error de tipo (tipicidad) ≠ error de prohibición (culpabilidad). [Clase 3]\n- Dolo y culpa se ubican en la tipicidad (finalismo): ver `teoria_del_delito_y_corrientes`.\n"},{"k":"definiciones","n":"Definiciones","md":"# Definiciones: Elementos de la tipicidad\n\n| Término | Definición | Fuente |\n|---|---|---|\n| Tipo penal | Descripción abstracta de la conducta que formula la ley | Diap. S3 |\n| Tipicidad | Juicio de adecuación del hecho concreto a todos los requisitos del tipo | Diap. S3 |\n| Verbo rector | Núcleo del tipo; delimita la conducta (matar, sustraer, falsificar) | Diap. S3 |\n| Sujeto activo | Quien realiza el hecho, a veces con una calidad especial | Diap. S3 |\n| Sujeto pasivo | Titular del bien jurídico protegido | Diap. S3 |\n| Bien jurídico | Interés que protege la ley | Diap. S3 |\n| Objeto material | Persona o cosa sobre la que recae la acción | Diap. S3 |\n| Elemento descriptivo | Se identifica con datos observables | Diap. S3 |\n| Elemento normativo | Exige valoración jurídica o social (\"ajeno\", \"servidor público\") | Diap. S3 |\n| Imputación objetiva | Atribución jurídica del resultado al autor por un riesgo desaprobado realizado en el resultado | Diap. S3; Clase 3 |\n| Dolo (art. 26) | Conocimiento de los elementos objetivos del tipo y ejecución voluntaria de la conducta | Diap. S3 |\n| Culpa (art. 27) | Infracción del deber objetivo de cuidado personalmente exigible que produce un resultado dañoso previsto como infracción culposa | Diap. S3 |\n| Error de tipo (art. 28.1) | Desconocimiento o comprensión equivocada de un elemento objetivo del tipo | Diap. S3 |\n"},{"k":"ejemplos","n":"Ejemplos","md":"# Ejemplos: Elementos de la tipicidad\n\n- **¿Incumplimiento o estafa?** Un carpintero cobra un anticipo y se retrasa. El incumplimiento no prueba estafa: hay que ver engaño y disposición patrimonial. [Diap. S3, caso 1]\n- **Sustracción de un teléfono:** verbo = sustraer; sujeto activo = A; sujeto pasivo = titular del patrimonio; objeto material = teléfono; bien jurídico = patrimonio. [Diap. S3, caso 2]\n- **Riesgo permitido:** conductor a velocidad permitida y peatón que surge tras un obstáculo: hay causalidad física pero quizá no imputación objetiva. [Diap. S3, caso 3]\n- **Principio de confianza:** semáforo verde y el otro conductor cruza en rojo; la confianza tiene límites si ya se veía el peligro. [Diap. S3, caso 4]\n- **¿Dolo o culpa?** Disparo deliberado frente a manipulación imprudente de un arma. [Diap. S3, caso 5]\n- **La maleta equivocada:** error sobre la ajenidad; hay que justificar si era vencible. [Diap. S3, caso 6]\n- **Conducir ebrio y causar una muerte:** el docente cuestionó que la pena se parezca a la del homicidio doloso (opinión suya, proporcionalidad). [Clase 3]\n"},{"k":"preguntas_frecuentes","n":"Preguntas","md":"# Preguntas frecuentes: Elementos de la tipicidad\n\n1. ★ Diferencia entre tipo penal y tipicidad.\n2. ★ Funciones de la tipicidad según Albán Gómez.\n3. ★ Elementos del tipo objetivo. ¿Qué diferencia hay entre bien jurídico y objeto material?\n4. ★ Filtros de la imputación objetiva. ¿Puede haber causalidad sin imputación objetiva?\n5. ★ Dolo (art. 26) y culpa (art. 27).\n6. ★ Error de tipo vencible e invencible. Diferencia con el error de prohibición.\n7. Elementos descriptivos y normativos con ejemplos.\n8. Caso: el carpintero con anticipo, ¿estafa?\n9. Caso: el principio de confianza en una intersección.\n"},{"k":"bibliografia","n":"Bibliografía","md":"# Bibliografía: Elementos de la tipicidad\n\n## Obligatoria (sílabo)\n\n- Zaffaroni, Eugenio Raúl (2006). *Manual de Derecho Penal. Parte General*. Ediar.\n- Código Orgánico Integral Penal (COIP), vigente. Asamblea Nacional.\n- Constitución de la República del Ecuador, vigente.\n- Mir Puig, Santiago (2003). *Introducción a las bases del Derecho Penal*. B de F.\n\n## Complementaria\n\n- Albán Gómez, Ernesto (2011). *Manual de Derecho Penal Ecuatoriano. Tomo 1. Parte general*. Ediciones Legales. Cap. VII (tipicidad, pp. 103-109 del PDF) y cap. VI (imputación objetiva, pp. 97-99). Nota de las diapositivas: el manual analiza legislación anterior al COIP; hay que actualizar sus ejemplos.\n- Roxin, Claus (1997). *Derecho Penal. Parte General. Tomo I*. Civitas.\n\n## Recurso\n\n- Biblioteca Virtual UNL y base JURLEX (LEXIS) para verificar vigencia y reformas del COIP.\n"},{"k":"jurisprudencia","n":"Jurisprudencia","md":"# Jurisprudencia: Elementos de la tipicidad\n\nNo consta jurisprudencia en las fuentes del curso (los docentes no citaron ninguna). No es un faltante: se llena solo si una tarea la pide. Ni el sílabo, ni las diapositivas ni la clase citan sentencias.\n\nEl docente mencionó que la Corte Constitucional colombiana reconoció el dolo eventual en tránsito (sin identificar la sentencia; por verificar).\n\n## Normas que aparecen\n\nCOIP: arts. 18, 25, 26, 27 y 28.1.\n"},{"k":"_ficha","n":"Ficha","md":"# Ficha del Gestor de Conocimiento\n\n**Materia:** Derecho Penal\n**Unidad:** 1 · Fundamentos del delito\n**Tema:** Elementos de la tipicidad (niveles de imputación objetivo y subjetivo)\n\n## Conceptos incorporados\nTipo y tipicidad, funciones, tipo objetivo, imputación objetiva, dolo, culpa, error de tipo.\n\n## Fuentes\nSílabo, Clase 3, diapositivas de la semana 3. Resumen: `salida/resumenes/derecho_penal/clase_03_elementos_de_la_tipicidad.md`.\n\n## Relaciones encontradas\n- Conexión con Derecho Civil II: el \"error sobre la ajenidad\" se apoya en la noción de bien ajeno.\n- Conexión con Medicina Legal: la causalidad médica (lesiones, muerte) alimenta la imputación objetiva.\n\n## Información pendiente de ampliar\nTexto de los arts. 25 a 28.1 del COIP; jurisprudencia; delitos de omisión.\n\n## Estado de actualización\nIncorporado desde la Clase 3 y las diapositivas.\n"}]},{"id":"la_ley_penal_en_el_estado_constitucional","titulo":"La ley penal en el Estado constitucional de derechos y justicia","docs":[{"k":"conceptos","n":"Conceptos","md":"# Conceptos: La ley penal en el Estado constitucional de derechos y justicia\n\nFuentes: [Clase 2] docente · [Diap. S2] diapositivas de la semana 2 · [Sílabo]\n\n- **Estado constitucional de derechos y justicia:** la Constitución orienta y limita el ejercicio del poder público (Constitución, art. 1). La creación y aplicación de delitos y penas deben respetar los derechos fundamentales. [Diap. S2]\n- **Doble función de la ley penal:** protege bienes jurídicos y limita el poder de castigar. Promueve la rehabilitación social y la reparación integral de las víctimas (Constitución, art. 78). [Clase 2; Diap. S2]\n- **Legalidad formal vs. control constitucional:** una ley vigente puede ser contraria a la Constitución. [Clase 2]\n- **Principio de legalidad** (Constitución, art. 76.3; COIP, art. 5.1): *lex scripta, lex praevia, lex stricta, lex certa*. [Diap. S2]\n- **Principios limitadores del poder punitivo:** mínima intervención (COIP, art. 3), dignidad humana (art. 4), lesividad, proporcionalidad (Constitución, art. 76.6), culpabilidad, presunción de inocencia, non bis in idem. [Sílabo; Diap. S2]\n- **Interpretación (COIP, art. 13):** conforme a la Constitución; los tipos penales y las penas se interpretan estrictamente.\n- **Ámbitos de validez (COIP, arts. 14 a 17):** espacial, personal, temporal y material; ley vigente al momento del hecho y ley posterior más favorable.\n- **Supremacía constitucional (Constitución, arts. 424 y 425):** la ley penal debe interpretarse dentro de la jerarquía normativa; COIP, art. 2.\n\n## Relaciones\n\n- Mínima intervención + proporcionalidad → límites a la creación de tipos (caso de la ley del insulto).\n- Legalidad → prohibición de analogía perjudicial → interpretación estricta (art. 13).\n- Conexión con Derecho Procesal Penal (prisión preventiva, presunción de inocencia).\n"},{"k":"definiciones","n":"Definiciones","md":"# Definiciones: La ley penal en el Estado constitucional de derechos y justicia\n\n| Término | Definición | Fuente |\n|---|---|---|\n| Ley penal | Norma que regula el poder punitivo del Estado, tipifica infracciones y establece el procedimiento para juzgarlas con debido proceso (COIP, art. 1) | Diap. S2 |\n| Lex scripta | Delitos y penas establecidos por ley | Diap. S2 |\n| Lex praevia | Ley anterior al hecho punible | Diap. S2 |\n| Lex stricta | Prohibición de analogía perjudicial | Diap. S2 |\n| Lex certa | Descripción suficientemente precisa de la conducta | Diap. S2 |\n| Mínima intervención | El derecho penal es el último recurso | Diap. S2 (COIP, art. 3) |\n| Dignidad humana | La persona no es un mero objeto de castigo | Diap. S2 (COIP, art. 4) |\n| Proporcionalidad | Correspondencia entre infracción y sanción | Diap. S2 (Constitución, art. 76.6) |\n| Derecho penal (cita) | \"Tarea más ingrata y temible: sancionar con las sanciones más graves los ataques más intolerables a los bienes jurídicos más importantes\" | Clase 1 y 2 (autor no identificado; por verificar) |\n"},{"k":"ejemplos","n":"Ejemplos","md":"# Ejemplos: La ley penal en el Estado constitucional de derechos y justicia\n\n- **Ley del insulto:** una ley que castiga con cinco años de prisión cualquier insulto, sin distinguir gravedad ni contexto. No basta la aprobación legislativa: fallan la proporcionalidad y la mínima intervención. [Diap. S2]\n- **Analogía:** ¿puede el juez crear una infracción por semejanza con otra? No: lex stricta. [Diap. S2]\n- **Normas cuestionadas por el docente (sin sentencias citadas):** un artículo de la ley antimafia que ponía a la persona procesada la carga de demostrar que las medidas cautelares eran insuficientes; artículos de la ley de seguridad luego declarados inconstitucionales; la condición \"no tener instrucción fiscal por un nuevo delito\" del art. 631 del COIP. [Clase 2; por verificar]\n- **Populismo penal:** normas penales dictadas por presión pública. [Clase 2]\n"},{"k":"preguntas_frecuentes","n":"Preguntas","md":"# Preguntas frecuentes: La ley penal en el Estado constitucional de derechos y justicia\n\n1. ★ ¿Es suficiente que una conducta esté prohibida por una ley para que su sanción sea constitucional?\n2. ★ ¿Cómo limitan lex praevia, scripta, stricta y certa la creación y aplicación del tipo penal? [Foro]\n3. ★ ¿Qué principios limitan el poder punitivo? Cite su base constitucional y del COIP.\n4. ¿Qué dice el art. 13 del COIP sobre la interpretación?\n5. ¿Cuáles son los ámbitos de validez de la ley penal (arts. 14 a 17)?\n6. ¿Qué papel cumplen los arts. 424 y 425 de la Constitución?\n7. Caso de la ley del insulto: ¿por qué no basta la aprobación legislativa?\n"},{"k":"bibliografia","n":"Bibliografía","md":"# Bibliografía: La ley penal en el Estado constitucional de derechos y justicia\n\n## Obligatoria (sílabo)\n\n- Zaffaroni, Eugenio Raúl (2006). *Manual de Derecho Penal. Parte General*. Ediar.\n- Código Orgánico Integral Penal (COIP), vigente. Asamblea Nacional.\n- Constitución de la República del Ecuador, vigente.\n- Mir Puig, Santiago (2003). *Introducción a las bases del Derecho Penal*. B de F.\n\n## Complementaria\n\n- Albán Gómez, Ernesto (2011). *Manual de Derecho Penal Ecuatoriano. Tomo 1. Parte general*. Ediciones Legales. Sirve para ampliar la ley penal y los principios.\n- Roxin, Claus (1997). *Derecho Penal. Parte General. Tomo I*. Civitas.\n\n## Recurso\n\n- Biblioteca Virtual UNL y base JURLEX (LEXIS) para verificar vigencia y reformas del COIP.\n"},{"k":"jurisprudencia","n":"Jurisprudencia","md":"# Jurisprudencia: La ley penal en el Estado constitucional de derechos y justicia\n\nNo consta jurisprudencia en las fuentes del curso (los docentes no citaron ninguna). No es un faltante: se llena solo si una tarea la pide. El docente mencionó leyes declaradas inconstitucionales (ley de seguridad, ley antimafia) sin citar sentencias.\n\n## Normas que aparecen\n\n- Constitución: arts. 1, 76 (3, 6 y presunción de inocencia), 78, 424 y 425.\n- COIP: arts. 1 a 5, 13 y 14 a 17 (y el 631 que citó el docente).\n\n## Por investigar\n\n- Sentencias de la Corte Constitucional que declararon inconstitucionales artículos de la ley de seguridad y de la ley antimafia (Investigador Académico).\n"},{"k":"_ficha","n":"Ficha","md":"# Ficha del Gestor de Conocimiento\n\n**Materia:** Derecho Penal\n**Unidad:** 1 · Fundamentos del delito (sílabo)\n**Tema:** La ley penal en el Estado constitucional de derechos y justicia\n\n## Conceptos incorporados\nEstado constitucional, doble función de la ley penal, legalidad (4 lex), principios limitadores, interpretación, ámbitos de validez, supremacía constitucional.\n\n## Fuentes\nSílabo, Clase 2 y diapositivas de la semana 2. Resumen: `salida/resumenes/derecho_penal/clase_02_ley_penal_y_estado_constitucional.md`.\n\n## Relaciones encontradas\n- Conecta con el tema de teoría del delito (límites del poder punitivo).\n- Conexión con Medicina Legal: la prueba pericial debe respetar el debido proceso y la presunción de inocencia.\n\n## Información pendiente de ampliar\n- Texto de los arts. 1 a 17 del COIP; jurisprudencia; ámbitos de validez (próxima tutoría según el docente, no registrada).\n\n## Estado de actualización\nIncorporado desde la Clase 2 y las diapositivas.\n"}]},{"id":"teoria_del_delito_y_corrientes","titulo":"Teoría del delito y corrientes causalista y finalista","docs":[{"k":"conceptos","n":"Conceptos","md":"# Conceptos: Teoría del delito, causalismo y finalismo\n\nFuentes: [Clase 4] docente · [Diap. S4] diapositivas · [Sílabo]\n\n- **Teoría del delito:** sistema ordenado de categorías jurídicas para decidir si una conducta puede atribuirse penalmente; sistema de filtros que contiene y racionaliza el poder punitivo (Zaffaroni, cap. X). [Diap. S4]\n- **Doble utilidad:** garantista (frena la arbitrariedad) y práctica (ordena el razonamiento). [Diap. S4]\n- **Estructura escalonada (art. 18 COIP):** conducta → tipicidad → antijuridicidad → culpabilidad. Si falla un filtro, no se analiza el siguiente. [Diap. S4; Clase 4]\n- **Conducta (arts. 22 a 24):** acción u omisión relevante; derecho penal de acto; omisión con obligación jurídica de impedir (posición de garante); ausencia de conducta por fuerza irresistible, reflejos o plena inconsciencia. [Diap. S4]\n- **Antijuridicidad (arts. 29 y 30):** lesión sin justa causa; causas de justificación (legítima defensa, necesidad). [Diap. S4]\n- **Culpabilidad (art. 34):** imputabilidad y conocimiento de la antijuridicidad; no equivale a dolo. Error de prohibición (art. 35.1). [Diap. S4]\n- **Causalismo clásico:** acción como proceso causal; dolo y culpa en la culpabilidad. [Diap. S4]\n- **Finalismo (Welzel):** acción humana dirigida a fines; dolo en la tipicidad; culpabilidad como reproche personal. [Diap. S4]\n- **COIP:** al ubicar dolo y culpa en la tipicidad, muestra influencia finalista, sin adoptar una sola escuela \"sin matices\". [Diap. S4]\n- ★ **Dicho del docente:** \"si les pregunto en el examen si el derecho penal es causalista o finalista, es finalista\". [Clase 4]\n\n## Relaciones\n\n- Una conducta puede ser típica y no antijurídica (legítima defensa) o antijurídica y no culpable.\n- Se conecta con el control constitucional: legalidad, motivación, presunción de inocencia y debido proceso limitan la respuesta penal (art. 13 COIP). [Diap. S4]\n"},{"k":"definiciones","n":"Definiciones","md":"# Definiciones: Teoría del delito, causalismo y finalismo\n\n| Término | Definición | Fuente |\n|---|---|---|\n| Teoría del delito | Sistema ordenado de categorías jurídicas para decidir si una conducta puede atribuirse penalmente | Diap. S4 |\n| Infracción penal (art. 18) | Conducta típica, antijurídica y culpable con sanción prevista en el Código | Diap. S4 |\n| Conducta penalmente relevante (art. 22) | Acciones u omisiones que ponen en peligro o producen resultados lesivos, descriptibles y demostrables | Diap. S4 |\n| Derecho penal de acto | No se sanciona por identidad, peligrosidad o características personales | Diap. S4 |\n| Omisión | No realizar la conducta exigida; requiere obligación jurídica de impedir el resultado | Diap. S4; Clase 4 |\n| Ausencia de conducta (art. 24) | Fuerza física irresistible, movimientos reflejos o plena inconsciencia | Diap. S4 |\n| Antijuridicidad (art. 29) | Amenaza o lesión sin justa causa de un bien jurídico | Diap. S4 |\n| Culpabilidad (art. 34) | Imputabilidad y conocimiento de la antijuridicidad | Diap. S4 |\n| Error de prohibición (art. 35.1) | Error sobre la ilicitud | Diap. S4 |\n| Causalismo clásico | Énfasis en causación; dolo en la culpabilidad | Diap. S4 |\n| Finalismo | Acción final; dolo en el tipo subjetivo | Diap. S4 |\n"},{"k":"ejemplos","n":"Ejemplos","md":"# Ejemplos: Teoría del delito, causalismo y finalismo\n\n- **Tránsito:** conductor que cumple el límite y un peatón irrumpe: la muerte no prueba por sí sola un delito; hay que identificar la infracción concreta del deber de cuidado antes de atribuir homicidio culposo (arts. 27 y 145). [Diap. S4]\n- **Mochila:** una estudiante toma por error una mochila idéntica: ¿qué elemento desconoce? ¿art. 28.1? [Diap. S4]\n- **Lesiones:** A lesiona a B durante una agresión iniciada por B; aplicar los cuatro filtros y revisar la necesidad racional y la falta de provocación suficiente (art. 33). [Diap. S4]\n- **Posibilidades de combinación:** hay tipicidad y culpabilidad sin antijuridicidad (legítima defensa); si no hay conducta, no se analiza lo demás. [Clase 4]\n- **Posición de garante:** quien no evita un daño estando obligado comete omisión. Estar cerca de una persona herida no vuelve culpable a nadie. [Clase 4]\n- **Animal atropellado:** el docente planteó un caso de un cliente al que se acusa de matar a un animal: ¿tuvo intención dolosa? [Clase 4; el contexto no es claro]\n"},{"k":"preguntas_frecuentes","n":"Preguntas","md":"# Preguntas frecuentes: Teoría del delito, causalismo y finalismo\n\n1. ★ ¿El derecho penal ecuatoriano es causalista o finalista?\n2. ★ Defina la infracción penal (art. 18) y enumere los filtros de la teoría del delito.\n3. ★ ¿Dónde se ubican el dolo y la culpa en el causalismo y en el finalismo?\n4. ¿Qué es la ausencia de conducta (art. 24)?\n5. ¿Qué requiere la omisión?\n6. Diferencia entre error de tipo y error de prohibición.\n7. Funciones de la teoría del delito (garantista y práctica).\n8. Caso: lesiones en una agresión iniciada por la víctima. Aplique conducta, tipicidad, antijuridicidad y culpabilidad.\n9. ¿Puede haber tipicidad sin antijuridicidad? Ejemplo.\n\n10. ★ (clase 5) Caso Juan y Pedro: ¿hubo legítima defensa en el puñetazo? ¿Hay exceso (art. 31)? ¿Qué relevancia tiene que Juan creyera que el peligro continuaba? Respuesta guía del docente en el simulacro, pregunta 12.\n"},{"k":"bibliografia","n":"Bibliografía","md":"# Bibliografía: Teoría del delito, causalismo y finalismo\n\n## Obligatoria (sílabo)\n\n- Zaffaroni, Eugenio Raúl (2006). *Manual de Derecho Penal. Parte General*. Ediar. **Cap. X, págs. 372-392** (estructura de la teoría del delito), no las págs. 287-309 de la guía (corrección del docente, Clase 4). Obra escrita con Alagia y Slokar (según las diapositivas).\n- Código Orgánico Integral Penal (COIP), vigente. Asamblea Nacional.\n- Constitución de la República del Ecuador, vigente.\n- Mir Puig, Santiago (2003). *Introducción a las bases del Derecho Penal*. B de F.\n\n## Complementaria\n\n- Albán Gómez, Ernesto (2011). *Manual de Derecho Penal Ecuatoriano. Tomo 1. Parte general*. Ediciones Legales.\n- Roxin, Claus (1997). *Derecho Penal. Parte General. Tomo I*. Civitas.\n\n## Recurso\n\n- Biblioteca Virtual UNL y base JURLEX (LEXIS) para verificar vigencia y reformas del COIP.\n"},{"k":"jurisprudencia","n":"Jurisprudencia","md":"# Jurisprudencia: Teoría del delito, causalismo y finalismo\n\nNo consta jurisprudencia en las fuentes del curso (los docentes no citaron ninguna). No es un faltante: se llena solo si una tarea la pide. No se citó jurisprudencia.\n\n## Normas\n\nCOIP: arts. 13, 18, 22 a 35.1 (más el 145, homicidio culposo, mencionado en la diapositiva).\n"},{"k":"_ficha","n":"Ficha","md":"# Ficha del Gestor de Conocimiento\n\n**Materia:** Derecho Penal\n**Unidad:** 1 · Fundamentos del delito\n**Tema:** Teoría del delito y corrientes causalista y finalista\n\n## Conceptos incorporados\nTeoría del delito, funciones, estructura escalonada, conducta, omisión, ausencia de conducta, antijuridicidad, culpabilidad, causalismo, finalismo.\n\n## Fuentes\nSílabo, Clase 4, diapositivas de la semana 4. Resumen: `salida/resumenes/derecho_penal/clase_04_teoria_del_delito_causalismo_y_finalismo.md`.\n\n## Relaciones encontradas\n- Antecede las unidades 2 (antijuridicidad, culpabilidad, participación) y 3 (causas de exclusión).\n- Contradicción registrada: la guía remite a Zaffaroni, cap. 10, págs. 287-309; el docente indicó las págs. 372-392.\n\n## Información pendiente de ampliar\nTexto de los arts. 18 y 22 a 35.1; jurisprudencia; Welzel y Beling (autores no desarrollados en clase).\n\n## Estado de actualización\nIncorporado desde la Clase 4 y las diapositivas.\n\n## Actualización del 31-oct-2026 (clase 5)\n\n- Incorporada la clase 5 (`salida/resumenes/derecho_penal/clase_05_video_foro_caso_integrador.md`): el docente dijo que las preguntas de la evaluación ya están subidas, que salen solo de lo analizado en las tutorías y que piden **aplicar** (casos) y no definir. Retroalimentación el miércoles 4 de noviembre.\n- Caso integrador (Juan y Pedro): aplica conducta, tipicidad (art. 152, numeral 3 por verificar), antijuridicidad (arts. 33 y 31) y culpabilidad (error sobre los presupuestos de una causa de justificación).\n- Simulacro, tarjetas y hoja de repaso: `salida/examenes/derecho_penal_simulacro_unidad_01.md`, `salida/flashcards/derecho_penal_unidad_01.csv`, `salida/material_estudio/DerechoPenal/hoja_de_repaso_unidad_01.md`.\n"}]}]},{"id":"unidad_02_responsabilidad_de_la_infraccion","num":2,"titulo":"Unidad 2 · Responsabilidad de la infraccion","pendiente":true,"estructura":"# Unidad 2 · Responsabilidad de la infracción\n\nEstructura del sílabo. Aún no hay clases (semanas 7–12, 9 nov – 16 dic 2026).\n\n## Temas (carpetas por crear cuando haya clase)\n\n- `la_infraccion_penal_y_la_estructura_escalonada` (arts. 18 y 19 del COIP)\n- `la_antijuridicidad` (art. 29: concepto legal, contenido formal y material, desvalor de acción y de resultado)\n- `la_culpabilidad` (imputabilidad, conocimiento de la antijuridicidad, exigibilidad de otra conducta; arts. 34 a 38)\n- `la_participacion_en_la_infraccion` (autoría directa, mediata, coautoría y complicidad; dominio del hecho; arts. 41 a 43)\n\n## Actividades (sílabo)\n\nForo (¿qué criterio permite deslindar al coautor del cómplice?), video-foro de roles, estudio de caso con informe jurídico y matriz de imputación individualizada, infografía con nota explicativa. Evaluación: 15 y 16 dic 2026.\n\n## Alerta\n\nLa guía muestra actividades de otra materia en esta unidad (ver `salida/analisis_guias/derecho_penal_analisis_guia.md`).\n","temas":[]},{"id":"unidad_03_causas_de_exclusion_autoria_y_pena","num":3,"titulo":"Unidad 3 · Causas de exclusion autoria y pena","pendiente":true,"estructura":"# Unidad 3 · Causas de exclusión y justificación; autoría y pena\n\nEstructura del sílabo. Aún no hay clases (semanas 13–19, 4 ene – 21 feb 2027).\n\n## Temas (carpetas por crear cuando haya clase)\n\n- `causas_de_exclusion_de_la_antijuridicidad` (art. 30)\n- `estado_de_necesidad_legitima_defensa_y_exceso` (arts. 30 y 31)\n- `cumplimiento_del_deber_legal_y_orden_legitima` (art. 30.1; estándares interamericanos y Principios Básicos de la ONU de 1990 sobre el uso de la fuerza)\n- `causas_de_inculpabilidad` (error de prohibición, trastorno mental, embriaguez, inimputabilidad por edad; arts. 34 a 38)\n- `la_pena` (concepto, fines, legalidad, individualización, clases; arts. 51 a 60; atenuantes y agravantes, arts. 44 a 48; reparación integral, arts. 77 y 78)\n\n## Actividades (sílabo)\n\nForo, video-foro de roles, estudio de caso con informe de determinación de la pena y propuesta de reparación integral, organizador gráfico. Evaluación: 20 y 21 feb 2027.\n\n## Bibliografía\n\nZaffaroni (cap. 2, págs. 29 a 67, según el sílabo), Albán Gómez, COIP y Constitución (arts. 66.1, 158 y 163).\n","temas":[]}],"normas":"# Normas verificadas contra el texto oficial\n\n**Fuentes:** `entrada/bibliografia/Normas/COIP_act_feb-2021.pdf` y `Constitucion-de-la-Republica-del-Ecuador_act_ene-2021.pdf`\n**Advertencia:** son versiones de enero y febrero de 2021. Pueden existir reformas posteriores. Antes de citar en una tarea, confirmar la vigencia en JURLEX (Biblioteca Virtual UNL), como pide el sílabo.\n\n## Constitución\n\n| Artículo | Contenido verificado |\n|---|---|\n| 1 | Ecuador es un Estado constitucional de derechos y justicia, social, democrático, soberano, independiente, unitario, intercultural, plurinacional y laico |\n| 76.2 | Presunción de inocencia hasta que se declare la responsabilidad con resolución firme o sentencia ejecutoriada |\n| 76.3 | Legalidad: nadie será juzgado ni sancionado por un acto u omisión que al cometerse no esté tipificado en la ley; ni se aplicará una sanción no prevista |\n| 76.6 | La ley establecerá la debida proporcionalidad entre las infracciones y las sanciones |\n| 78 | Protección especial a las víctimas, no revictimización y reparación integral (restitución, indemnización, rehabilitación, garantía de no repetición, satisfacción) |\n| 424 | La Constitución es norma suprema; las normas contrarias carecen de eficacia jurídica; los tratados de derechos humanos más favorables prevalecen |\n| 425 | Orden jerárquico: Constitución; tratados internacionales; leyes orgánicas; leyes ordinarias; normas regionales y ordenanzas distritales; decretos y reglamentos; ordenanzas; acuerdos y resoluciones |\n\n## COIP\n\n| Artículo | Contenido verificado |\n|---|---|\n| 1 | Finalidad: normar el poder punitivo del Estado, tipificar infracciones y establecer el procedimiento para juzgarlas |\n| 2 | Principios generales: se aplican los principios de la Constitución, instrumentos internacionales y este Código |\n| 3 | Mínima intervención: legitimada solo si es estrictamente necesaria; último recurso |\n| 4 | Dignidad humana y titularidad de derechos; las personas privadas de libertad conservan sus derechos |\n| 5.1 / 5.2 / 5.3 / 5.4 | Legalidad (no hay infracción, pena ni proceso sin ley anterior al hecho) / Favorabilidad / Duda a favor del reo / Inocencia |\n| 13 | Interpretación: 1) conforme a la Constitución e instrumentos de derechos humanos; 2) tipos y penas en forma estricta; 3) prohibida la analogía para crear infracciones o ampliar los límites de una sanción |\n| 14 | Ámbito espacial |\n| 15 | Ámbito personal: a nacionales o extranjeros que cometan infracciones |\n| 16 | Ámbito temporal: ley vigente al momento de la comisión; ley posterior más benigna sin petición |\n| 17 | Ámbito material: solo son infracciones las tipificadas en el COIP (con excepciones de niñez y de usuarios y consumidores) |\n| 18 | Infracción penal: conducta típica, antijurídica y culpable cuya sanción se prevé en el Código |\n| 22 | Conductas penalmente relevantes; no se sanciona por identidad, peligrosidad o características personales |\n| 23 | Modalidades: acción y omisión; no impedir un acontecimiento con obligación jurídica de impedirlo equivale a ocasionarlo |\n| 24 | Causas de exclusión de la conducta: fuerza física irresistible, movimientos reflejos o plena inconsciencia, comprobados |\n| 25 | Tipicidad: los tipos penales describen los elementos de las conductas penalmente relevantes |\n| 26 | Dolo: conocimiento de los elementos objetivos del tipo y ejecución voluntaria. Incluye el delito preterintencional (dos tercios de la pena) |\n| 27 | Culpa: infringe el deber objetivo de cuidado que personalmente le corresponde; es punible solo si está tipificada |\n| 28 | **Omisión dolosa** y posición de garante (obligación legal o contractual de cuidado y riesgo previo) |\n| 28.1 | **Error de tipo:** el invencible excluye la infracción; el vencible responde por la modalidad culposa si existe |\n| 29 | Antijuridicidad: amenazar o lesionar, sin justa causa, un bien jurídico protegido |\n| 30 | Causas de exclusión: estado de necesidad, legítima defensa, orden legítima y expresa de autoridad o deber legal |\n| 30.1 | Cumplimiento del deber legal de policías y seguridad penitenciaria (uso progresivo, proporcional y racional de la fuerza) |\n| 31 | Exceso en las causas de exclusión: pena reducida en un tercio de la mínima |\n| 33 | Legítima defensa: agresión actual e ilegítima; necesidad racional; falta de provocación suficiente |\n| 34 | Culpabilidad: imputable y con conocimiento de la antijuridicidad |\n| 35 | Causas de inculpabilidad: error de prohibición invencible y trastorno mental |\n| 35.1 | Error de prohibición: invencible, sin responsabilidad; vencible, pena mínima reducida en un tercio |\n| 145 | Homicidio culposo: tres a cinco años |\n\n## Correcciones a los resúmenes\n\n1. **Presunción de inocencia:** en la Constitución es el **art. 76.2** (la clase 2 dijo solo \"art. 76\"). En el COIP es el **art. 5.4**, como dijo el docente. Queda confirmado.\n2. **Art. 631 del COIP:** el docente lo citó como ejemplo de contradicción con la Constitución. En el texto de 2021 trata las condiciones de la suspensión condicional de la pena (residir en un lugar, no salir del país, trabajar, etc.). La condición \"no tener instrucción fiscal por un nuevo delito\" no aparece en lo que revisé. Puede ser de otra versión o de otro artículo. Queda **sin verificar**.\n3. **Art. 28 vs. art. 28.1:** el art. 28 es la omisión dolosa; el error de tipo está en el 28.1, como pone el sílabo.\n4. **Homicidio culposo (3 a 5 años):** el docente dijo la cifra de memoria y coincide con el art. 145.\n5. **Diapositivas de la clase 4:** dicen \"Art. 35.1 error de prohibición\", correcto.\n6. **Art. 24 (clase 4):** coincide con las tres causas de exclusión de la conducta de las diapositivas.\n","resumenes":[{"id":"clase_01_tutoria_de_encuadre","titulo":"Clase 1 · Tutoría de encuadre (Derecho Penal)","md":"# Clase 1 · Tutoría de encuadre (Derecho Penal)\n\n**Agente:** Analista de Clases · **Fuente:** `entrada/guias/DerechoPenal/Clases/Clase_01.txt`\n**Tipo:** encuadre. Es material administrativo, no contenido jurídico.\n\n## Resumen Ejecutivo\n\nEl docente (Mgtr. Rafael Rodas Mogrovejo) se presentó y recorrió la guía de estudios: unidades, actividades, rúbricas y fechas. Explicó cómo trabajará cada semana y qué es obligatorio. La idea central: **las tutorías no son obligatorias, pero las actividades calificadas sí**, y **las evaluaciones salen de las diapositivas de cada semana y de los textos de la guía**.\n\n## Ubicación en el Sílabo\n\nSemana 1 (28 sep – 4 oct 2026): socialización del sílabo. Unidad 1: Fundamentos del delito.\n\n## Indicaciones Administrativas\n\n- Cada semana sube el video de la tutoría, las diapositivas y la actividad práctica al EVA, en cuanto termina la clase.\n- Son obligatorias las cuatro actividades calificadas: foro, video-foro, actividad autónoma y actividad práctica. El video-foro ya no exige conexión, pero sí cumplir la actividad, en vivo o de forma asincrónica.\n- Si no se puede asistir al video-foro, el docente habilita la actividad como un foro hasta el domingo de esa semana.\n- Foro: intervención de 350 a 450 palabras con al menos tres fuentes. Hay que replicar y corregir; quien no replica a tiempo pierde puntos (el foro cierra a las 23:00).\n- Rúbrica del foro: análisis jurídico, debate, interacción, síntesis, fuentes y mejora. Para sacar los 4 puntos de análisis hay que identificar el problema, interpretar las fuentes vigentes y formular argumentos completos.\n- Contactos y dudas: coordinar con la representante del curso.\n- Evaluación diagnóstica: no calificada.\n- Evaluación de la unidad 1: 7 y 8 de noviembre de 2026.\n\n## Relación con Actividades Calificadas\n\nRevisó las de la unidad 1: foro académico (28 sep – 25 oct), video-foro (semana 5), infografía o mapa conceptual sobre los elementos de la tipicidad (leer a Albán y el art. 25 del COIP) y ensayo académico sobre la teoría del delito.\n\n## Recomendaciones para Estudiar\n\n- Mirar cada semana las diapositivas y el video: el docente dijo que de ahí saca la mayoría de las preguntas.\n- Leer la rúbrica antes de entregar cada tarea.\n- Estudiar el COIP, la Constitución y los textos de la guía (Albán Gómez, Zaffaroni).\n\n## Nivel de importancia\n\n| Tema | Nivel |\n|---|---|\n| Qué se evalúa y de dónde salen las preguntas | ★★★★★ |\n| Reglas del foro y del video-foro | ★★★★ |\n| Fechas | ★★★★ |\n\nAdemás citó, sin desarrollarla, la frase de que al derecho penal \"le corresponde la tarea más ingrata y temible: sancionar con las sanciones más graves los ataques más intolerables a los bienes jurídicos más importantes\" (el docente no nombró al autor; por verificar).\n"},{"id":"clase_02_ley_penal_y_estado_constitucional","titulo":"Clase 2 · La ley penal en el Estado constitucional de derechos y justicia","md":"# Clase 2 · La ley penal en el Estado constitucional de derechos y justicia\n\n**Agente:** Analista de Clases · **Fuentes:** `Clases/Clase_02.txt` y `DiapositivasClases/Semana_02.pdf`\nLos números de artículo los dijo el docente \"si la memoria no me falla\"; los de las diapositivas son más confiables. Marcar **por verificar** los de la voz.\n\n## Resumen Ejecutivo\n\nTutoría de orientación para el **foro académico de la unidad 1**. La pregunta guía: *¿es suficiente que una conducta esté prohibida por una ley para que su sanción sea constitucional?* La respuesta del docente: no. La legalidad formal no sustituye el control constitucional, y el poder de castigar tiene límites. Ecuador es un Estado constitucional de derechos y justicia (art. 1 de la Constitución), así que la ley penal debe leerse desde la Constitución y los derechos humanos.\n\n## Ubicación en el Sílabo\n\nUnidad 1, semana 2. Tema 1: La ley penal en el Estado constitucional de derechos y justicia (arts. 1 a 17 del COIP).\n\n## Temas Principales\n\n1. Estado constitucional de derechos y justicia (Constitución, art. 1).\n2. Función de la ley penal: doble función (protege bienes jurídicos y limita el poder de castigar). Promueve la rehabilitación social y la reparación integral (Constitución, art. 78).\n3. Principio de legalidad: *lex scripta, praevia, stricta y certa* (Constitución, art. 76.3; COIP, art. 5.1).\n4. Interpretación (COIP, art. 13) y ámbitos de validez espacial, personal, temporal y material (arts. 14 a 17).\n5. Principios limitadores: mínima intervención (COIP, art. 3), dignidad humana (art. 4), proporcionalidad (Constitución, art. 76.6), presunción de inocencia (Constitución, art. 76; COIP, art. 5.4 según el docente).\n6. Supremacía constitucional y control de constitucionalidad (Constitución, arts. 424 y 425; COIP, art. 2).\n\n## Conceptos Clave\n\n- **Legalidad formal vs. control constitucional:** una ley vigente puede ser contraria a la Constitución.\n- **Lex scripta:** delitos y penas en la ley. **Lex praevia:** ley anterior al hecho. **Lex stricta:** prohibida la analogía perjudicial. **Lex certa:** descripción suficientemente precisa.\n- **Mínima intervención:** el derecho penal es el último recurso.\n- **Proporcionalidad:** correspondencia entre infracción y sanción.\n\n## Ejemplos del Docente\n\n- Una ley que impone cinco años de prisión por cualquier insulto verbal, sin distinguir gravedad ni contexto (caso de las diapositivas). El docente lo usó para mostrar la falta de proporcionalidad y de mínima intervención.\n- Un conductor que se pasa un semáforo en rojo y lesiona a una persona (para explicar que la responsabilidad requiere más que el resultado).\n- Normas penales que, según el docente, contradicen la Constitución: mencionó un artículo de la ley antimafia que obligaba a la persona procesada a demostrar que las medidas cautelares eran insuficientes frente a la prisión preventiva, y artículos de la ley de seguridad declarados luego inconstitucionales (sin citar sentencias; por verificar). También señaló una condición del art. 631 del COIP (\"no tener instrucción fiscal por un nuevo delito\") como posible contradicción.\n- Habló de \"populismo penal\" a partir del comentario de un estudiante.\n\n## Temas Enfatizados\n\n- Entender el derecho penal desde los principios, no desde artículos aislados: \"el razonamiento jurídico debe ir más allá de citar un artículo aislado del COIP\".\n- Todo análisis debe valorar el grado de constitucionalidad de la norma.\n- Próxima tutoría: ámbitos de aplicación de la ley penal (arts. 14 a 17).\n\n## Normas y Autores Citados\n\nConstitución: arts. 1, 76 (3, 6 y presunción de inocencia), 78, 424, 425. COIP: arts. 1, 2, 3, 4, 5, 13 y 14 a 17.\n\n## Indicaciones Administrativas\n\n- Las tutorías son los miércoles de 19:00 a 21:00 y no son obligatorias.\n- La evaluación diagnóstica aún no estaba cargada (no es calificada).\n- Cada semana se suben video, diapositivas y actividad práctica. El docente dijo que las diapositivas son \"el fiel reflejo de las tutorías\" y las evaluaciones, de lo analizado cada semana.\n\n## Relación con Actividades Calificadas\n\nForo académico (ACD 1): intervención de 350 a 450 palabras con tres fuentes sobre la importancia de la ley penal en el modelo constitucional, con réplica y corrección final. Preguntas del foro: ¿cómo limitan lex praevia, scripta, stricta y certa la creación del tipo?, ¿basta la vigencia formal?\n\n## Posibles Preguntas de Examen\n\n1. ¿Basta con que una conducta esté prohibida en una ley para que su sanción sea constitucional? ★★★★★\n2. Nombre y explique los cuatro componentes de la legalidad penal. ★★★★★\n3. Principios que limitan el poder punitivo y su base normativa. ★★★★★\n4. ¿Qué dice el art. 13 del COIP sobre la interpretación? ★★★★\n5. Ámbitos de validez de la ley penal. ★★★★\n\n## Recomendaciones para Estudiar\n\nLeer los arts. 1 a 17 del COIP, los arts. 1, 76, 78, 424 y 425 de la Constitución, y rehacer el caso del insulto con los tres pasos de la diapositiva: constitucionalidad, proporcionalidad y derechos ponderados.\n\n## Nivel de importancia\n\n| Tema | Nivel |\n|---|---|\n| Legalidad (cuatro lex) | ★★★★★ |\n| Principios limitadores | ★★★★★ |\n| Supremacía constitucional | ★★★★ |\n| Interpretación y ámbitos de validez | ★★★★ |\n"},{"id":"clase_03_elementos_de_la_tipicidad","titulo":"Clase 3 · Elementos de la tipicidad","md":"# Clase 3 · Elementos de la tipicidad\n\n**Agente:** Analista de Clases · **Fuentes:** `Clases/Clase_03.txt` y `DiapositivasClases/Semana_03.pdf` (Albán Gómez, cap. VII; COIP arts. 18, 25, 26, 27 y 28.1)\n\n## Resumen Ejecutivo\n\nTutoría de orientación para elaborar el **mapa conceptual o la infografía** (actividad autónoma de la unidad 1). Se explicó la tipicidad como juicio de adecuación del hecho a la descripción legal, sus funciones, los elementos del tipo objetivo, la imputación objetiva y el tipo subjetivo (dolo, culpa y error de tipo). Mensaje central: **no basta un resultado dañoso ni que la conducta esté prohibida; hay que recorrer conducta → tipicidad → antijuridicidad → culpabilidad**.\n\n## Ubicación en el Sílabo\n\nUnidad 1, semana 3. Temas 2 a 4: teoría del delito y niveles de imputación objetivo y subjetivo. Actividad práctica de la tutoría del 14 de octubre de 2026.\n\n## Temas Principales\n\n1. Ubicación de la tipicidad en la secuencia conducta, tipicidad, antijuridicidad y culpabilidad.\n2. Tipo penal vs. tipicidad.\n3. Cuatro funciones de la tipicidad: garantista, descriptiva, sistemática y procesal (Albán Gómez).\n4. Elementos del tipo objetivo.\n5. Causalidad e imputación objetiva.\n6. Tipo subjetivo: dolo y culpa.\n7. Error de tipo y sus efectos.\n\n## Conceptos Clave\n\n- **Tipo penal:** descripción abstracta de la conducta (art. 25 COIP). **Tipicidad:** juicio de adecuación del hecho concreto a todos sus requisitos.\n- **Elementos del tipo objetivo:** verbo rector, sujeto activo y pasivo, objeto material, bien jurídico, medios, tiempo, lugar y ocasión, elementos descriptivos y normativos, y resultado y nexo causal si el tipo los exige.\n- **Bien jurídico** (qué interés protege la ley) vs. **objeto material** (sobre qué persona o cosa recae la acción). Ejemplo: en el robo de un teléfono, el bien jurídico es el patrimonio y el objeto material es el teléfono.\n- **Elementos descriptivos** (observables) y **normativos** (exigen valoración: \"ajeno\", \"sin autorización\", \"servidor público\").\n- **Imputación objetiva (cinco filtros):** causalidad si hace falta; creación o incremento de un riesgo jurídicamente desaprobado; que el resultado realice ese riesgo; riesgo permitido, principio de confianza y prohibición de regreso; circunstancias del caso.\n- **Dolo (art. 26):** conocimiento de los elementos objetivos del tipo y ejecución voluntaria. **Culpa (art. 27):** infracción del deber objetivo de cuidado que causa un resultado previsto como infracción culposa.\n- **Error de tipo (art. 28.1):** desconocimiento o comprensión equivocada de un elemento objetivo del tipo. **Invencible:** excluye la infracción. **Vencible:** puede dar responsabilidad culposa si la ley la prevé. No confundir con el **error de prohibición** (está en la culpabilidad; el error de tipo está en la tipicidad).\n\n## Ejemplos del Docente\n\n- Golpear a alguien con un bate \"¿por qué lo hice?\": hay que analizar la intención y la voluntad.\n- Caso 1: el carpintero que cobra un anticipo y se retrasa, ¿incumplimiento o estafa? Incumplir no prueba estafa; hay que analizar engaño y disposición patrimonial.\n- Casos 3 y 4 de las diapositivas: conductor que va a velocidad permitida y un peatón surge de pronto (puede haber causalidad física sin imputación objetiva); semáforo verde y el otro conductor cruza en rojo (la confianza tiene límites).\n- Caso 6: la maleta idéntica en el aeropuerto (error sobre la ajenidad; hay que justificar si era vencible).\n- Accidentes de tránsito: delitos culposos y dolosos. El docente comentó que la sanción por conducir ebrio y causar una muerte, equiparada al homicidio doloso, le parece contraria a la proporcionalidad (es su opinión) y que la Corte Constitucional colombiana reconoció el dolo eventual en tránsito (por verificar).\n- Dolo y culpa en una colisión: si alguien usa el vehículo como medio para pisar a otra persona, es dolo.\n\n## Temas Enfatizados\n\n- \"Un resultado o un accidente no es automáticamente culpa de quien conducía.\"\n- La teoría del delito exige pasar los cuatro filtros en orden.\n- El docente dice que el dolo y la culpa están en la tipicidad (finalismo), y que históricamente se discutió si pertenecían a la culpabilidad.\n- Lecturas: Albán Gómez, cap. VII (pp. 103-109 del PDF) y cap. VI (imputación objetiva, pp. 97-99); COIP arts. 18, 25, 26, 27 y 28.1. El manual de Albán analiza legislación anterior al COIP: sus ejemplos hay que actualizarlos.\n\n## Normas y Autores Citados\n\nCOIP: arts. 18, 25, 26, 27 y 28.1 (diapositivas). Ernesto Albán Gómez (Manual de Derecho Penal Ecuatoriano, caps. VI y VII).\n\n## Indicaciones Administrativas\n\n- Tutoría no obligatoria; asistieron unos 20 estudiantes.\n- El docente subirá el video, las diapositivas y la actividad práctica.\n\n## Relación con Actividades Calificadas\n\nActividad autónoma de la unidad 1: infografía o mapa conceptual con, como mínimo, concepto y funciones de la tipicidad, elementos del tipo objetivo, criterios de imputación objetiva, elementos del tipo subjetivo (dolo y culpa) y efectos del error de tipo. Nota explicativa de 800 a 1.000 palabras y seis fuentes en APA 7.\n\n## Posibles Preguntas de Examen\n\n1. Diferencia entre tipo penal y tipicidad. ★★★★★\n2. Funciones de la tipicidad según Albán Gómez. ★★★★\n3. Elementos del tipo objetivo; diferencia entre bien jurídico y objeto material. ★★★★★\n4. Filtros de la imputación objetiva. ★★★★★\n5. Dolo (art. 26) y culpa (art. 27). ★★★★★\n6. Error de tipo vencible e invencible; diferencia con el error de prohibición. ★★★★★\n\n## Recomendaciones para Estudiar\n\nRepasar las diapositivas de la semana 3 caso por caso. Para la infografía, usar la ficha final del docente (verbo rector y bien jurídico; sujetos y objeto material; elementos normativos; imputación objetiva; dolo o culpa y ejemplo de error de tipo).\n\n## Nivel de importancia\n\n| Tema | Nivel |\n|---|---|\n| Elementos del tipo objetivo | ★★★★★ |\n| Imputación objetiva | ★★★★★ |\n| Dolo, culpa y error de tipo | ★★★★★ |\n| Funciones de la tipicidad | ★★★★ |\n"},{"id":"clase_04_teoria_del_delito_causalismo_y_finalismo","titulo":"Clase 4 · Teoría del delito: estructura, causalismo y finalismo","md":"# Clase 4 · Teoría del delito: estructura, causalismo y finalismo\n\n**Agente:** Analista de Clases · **Fuentes:** `Clases/Clase_04.txt` y `DiapositivasClases/Semana_04.pdf` (el título de las diapositivas dice \"Semana 3\", por error de rotulado)\nAutores: Zaffaroni, Alagia y Slokar, cap. X; COIP arts. 13, 18, 22 a 35.1.\n\n## Resumen Ejecutivo\n\nTutoría de orientación para el **ensayo académico** (actividad práctico-experimental de la unidad 1). Se explicó la teoría del delito como sistema de filtros que racionaliza el poder punitivo y se contrastó el **causalismo** con el **finalismo**. El docente fue explícito: **la corriente que se aplica hoy en Ecuador es el finalismo**, y esa pregunta puede salir en el examen.\n\n## Ubicación en el Sílabo\n\nUnidad 1, semana 4. Temas 2 y 3: la teoría del delito (concepto, función, estructura escalonada) y las corrientes causalistas y finalistas.\n\n## Temas Principales\n\n1. Concepto y función de la teoría del delito (garantista y práctica).\n2. Estructura escalonada: conducta, tipicidad, antijuridicidad, culpabilidad (art. 18 COIP).\n3. Conducta penalmente relevante: acción y omisión; ausencia de conducta (arts. 22 a 24).\n4. Tipicidad (arts. 25 a 28.1).\n5. Antijuridicidad (art. 29) y causas de justificación (art. 30).\n6. Culpabilidad (art. 34) y error de prohibición (art. 35.1).\n7. Causalismo clásico, finalismo y qué recoge el COIP.\n\n## Conceptos Clave\n\n- **Teoría del delito:** sistema ordenado de categorías jurídicas para decidir si una conducta puede atribuirse penalmente. Filtros que contienen el poder punitivo (Zaffaroni, cap. X; págs. 372-392 según el docente).\n- **Infracción penal (art. 18):** conducta típica, antijurídica y culpable con sanción prevista en el Código.\n- **Conducta (art. 22):** acciones u omisiones que ponen en peligro o producen resultados lesivos, descriptibles y demostrables. **Derecho penal de acto:** no se sanciona por identidad, peligrosidad o características personales.\n- **Omisión:** exige una obligación jurídica de impedir el resultado (posición de garante). No toda inactividad es omisión.\n- **Ausencia de conducta (art. 24):** fuerza física irresistible, movimientos reflejos o plena inconsciencia, comprobados.\n- **Antijuridicidad (art. 29):** amenaza o lesión sin justa causa de un bien jurídico. **Culpabilidad (art. 34):** imputabilidad y conocimiento de la antijuridicidad; no equivale a dolo.\n- **Causalismo clásico:** acción como proceso causal; dolo y culpa en la culpabilidad. **Finalismo (Welzel):** acción humana dirigida a fines; dolo y culpa en el tipo subjetivo.\n- **COIP:** ubica dolo y culpa en la tipicidad, lo que evidencia influencia finalista, aunque no prueba que adopte una sola escuela sin matices (diapositivas).\n\n## Ejemplos del Docente\n\n- Conductor prudente y peatón imprevisible: no hay homicidio culposo sin infracción concreta del deber de cuidado.\n- La estudiante que toma por error una mochila idéntica: error de tipo (art. 28.1).\n- Legítima defensa: hay tipicidad, pero puede faltar antijuridicidad.\n- Combinaciones posibles: hay tipicidad y culpabilidad pero no antijuridicidad; si falta la conducta, ni siquiera se analiza lo demás.\n- Estar cerca de quien recibe un golpe accidental no hace culpable: se analiza el grado de participación.\n- Comparó las penas: homicidio y asesinato (dolosos) superan los 10 años; el homicidio culposo es de 3 a 5 años (cifras dichas de memoria; por verificar).\n- Principio de mancomunidad de la prueba: la prueba no es de quien la oferta, es del proceso.\n- Dijo que \"deliberadamente\" en el COIP equivale a \"dolosamente\".\n\n## Temas Enfatizados\n\n- ★ **Si el examen pregunta si el derecho penal ecuatoriano es causalista o finalista, la respuesta es finalista.**\n- Diferencia a recordar: el causalismo clásico ubicaba dolo y culpa en la culpabilidad; el finalismo los incorpora en la tipicidad.\n- \"Siempre se debe trabajar en este orden: conducta, tipicidad, antijuridicidad, culpabilidad.\" Si no hay conducta, no se analiza el resto.\n- Para el ensayo, se necesita solo la estructura básica de la teoría del delito, no todo el desarrollo de cada categoría.\n\n## Normas y Autores Citados\n\nCOIP: arts. 13, 18, 22, 23, 24, 25, 26, 27, 28.1, 29, 30, 33, 34, 35.1 y 145 (homicidio culposo, según la diapositiva). Zaffaroni, Alagia y Slokar (Manual de Derecho Penal, cap. X); Welzel; Albán Gómez; Roxin (en la bibliografía).\n\n## Indicaciones Administrativas\n\n- **Error en la guía:** la actividad práctica remite a Zaffaroni, cap. 10, págs. 287-309, pero el EVA traía otro texto (cap. 20). Lo correcto, según el docente: cap. 10, págs. 372-392. Subirá el texto como anuncio del EVA.\n- Aclaró que la guía no fue elaborada por él y que las tutorías siguen la bibliografía de la guía.\n- Secuencia de las semanas: 1 encuadre, 2 foro (introducción constitucional), 3 tipicidad (autónoma), 4 teoría del delito (ensayo).\n\n## Relación con Actividades Calificadas\n\nEnsayo académico sobre la función de la teoría del delito (APE, 2,50 puntos): 1.200 a 1.500 palabras, PDF, mínimo cinco referencias APA 7; delimitar el problema y enunciar la tesis, explicar la estructura escalonada, contrastar causalismo y finalismo y argumentar qué sistemática recoge el COIP.\n\n## Posibles Preguntas de Examen\n\n1. ¿El derecho penal ecuatoriano es causalista o finalista? ★★★★★\n2. Defina la infracción penal según el art. 18. ★★★★★\n3. Enumere los filtros de la teoría del delito y su orden. ★★★★★\n4. Diferencias entre causalismo clásico y finalismo (ubicación del dolo). ★★★★★\n5. ¿Cuáles son las causas de ausencia de conducta (art. 24)? ★★★★\n6. Diferencia entre error de tipo y error de prohibición. ★★★★\n7. Caso: conducta típica con legítima defensa. ¿Qué categoría falla? ★★★★\n\n## Recomendaciones para Estudiar\n\nEstudiar la tabla de las diapositivas de la semana 4 (32 láminas) y los artículos 18 y 22 a 35.1. Hacer un cuadro causalismo vs. finalismo. Practicar con los tres casos (tránsito, mochila, lesiones) aplicando los cuatro filtros.\n\n## Nivel de importancia\n\n| Tema | Nivel |\n|---|---|\n| Finalismo en Ecuador / dolo en la tipicidad | ★★★★★ |\n| Estructura escalonada y art. 18 | ★★★★★ |\n| Conducta, omisión y ausencia de conducta | ★★★★ |\n| Antijuridicidad y culpabilidad (introducción) | ★★★ |\n"},{"id":"clase_05_video_foro_caso_integrador","titulo":"Resumen Ejecutivo: Clase 5, video foro: caso práctico integrador","md":"# Resumen Ejecutivo: Clase 5, video foro: caso práctico integrador\n\n**Agente:** Analista de Clases · **Fuente:** `entrada/guias/DerechoPenal/Clases/Clase_05.txt` (28 oct 2026; docente Mgtr. Wilson Rodas, que se conectó tarde por una reunión de ajustes curriculares). Clase corta y casi administrativa.\n\n## Ubicación en el Sílabo\n\nUnidad 1, semana 5: video foro (ACD 2). Cierre de la unidad.\n\n## Temas Principales\n\nCaso integrador de lesiones (Juan y Pedro) para aplicar los cuatro filtros de la teoría del delito; indicaciones de la evaluación.\n\n## Indicaciones Administrativas\n\n- **La unidad 1 ya está abordada.** Semana 1: socialización de guía y sílabo; semana 2: foro académico; semana 3: actividad autónoma; semana 4: actividad práctica. [Clase]\n- **Evaluación:** el docente **ya subió las preguntas** y salen \"única y exclusivamente de lo que hemos venido analizando en cada una de las tutorías\". Las respuestas están en las diapositivas, pero se pide razonamiento y aplicación, no definiciones (\"no les pregunto qué es la legítima defensa\").\n- **Retroalimentación general el miércoles 4 de noviembre** (lunes y martes son feriado), con \"puntos clave\" para la evaluación y una actividad práctica con un caso.\n- El video foro: conexión no obligatoria, **actividad sí obligatoria**; el caso se habilita en el EVA hasta el domingo 1 de noviembre.\n- El foro académico del domingo anterior tenía **una sola pregunta** (la autora de la guía consideró solo una, según el video de socialización).\n- Los textos son el hilo conductor: las diapositivas salen de los textos, las tareas de los mismos textos y la evaluación también.\n\n## Caso (resumen)\n\nJuan y Pedro discuten por una deuda; Pedro empuja a Juan y avanza con una botella; Juan lanza una silla y golpea el hombro; Pedro suelta la botella, retrocede y dice que no hará nada; Juan lo golpea en el rostro, Pedro cae y sufre fractura nasal y traumatismo craneal con 35 días de incapacidad. Juan dice que creyó que el peligro seguía. La Fiscalía investiga lesiones (art. 152 del COIP).\n\n## Guía del docente para responder\n\n- **Conducta:** dos comportamientos (silla y puñetazo), voluntarios, sin causas de exclusión del art. 24; importa distinguirlos porque el peligro pudo cambiar entre uno y otro.\n- **Tipicidad:** sujeto activo Juan, pasivo Pedro, bien jurídico integridad personal; art. 152, probablemente numeral 3 por los 35 días (lo que se mira primero es la incapacidad); imputación objetiva (riesgo desaprobado concretado en la caída); no querer los 35 días no descarta el dolo; nuestro derecho es finalista.\n- **Antijuridicidad (la parte más importante):** art. 33, legítima defensa, con tres presupuestos; la silla frente a la botella se puede justificar; el puñetazo, tras soltar la botella y retroceder, plantea si el peligro cesó; si la reacción empezó justificada y se excedió, mirar el art. 31 (exceso), sin presumirlo.\n- **Culpabilidad:** no hay datos de inimputabilidad; la creencia de Juan introduce el posible error sobre los presupuestos fácticos de una causa de justificación.\n- Cierre: la teoría del delito sirve para aplicar categorías a casos y distinguir hechos de valoraciones; un resultado lesivo no determina por sí solo la responsabilidad.\n\n## Normas y Autores Citados\n\nCOIP arts. 24, 31, 33 y 152 (verificados 24, 31 y 33 en `conocimiento/derecho_penal/_normas_verificadas.md`; el 152, por verificar).\n\n## Relación con Actividades Calificadas\n\nVideo foro (ACD 2) y evaluación sumativa. Entregable: `salida/material_estudio/DerechoPenal/entregables/VideoForo-CasoPractico-UnidadI.pdf`.\n\n## Posibles Preguntas de Examen\n\n★★★★★ Aplicación de legítima defensa y exceso (arts. 33 y 31); filtros de la teoría del delito sobre un caso; causalismo frente a finalismo; imputación objetiva.\n\n## Recomendaciones para Estudiar\n\nRepasar las diapositivas de las semanas 2 a 4 con casos, no solo con definiciones. Usar `salida/examenes/derecho_penal_simulacro_unidad_01.md`.\n\n## Nivel de importancia\n\n★★★★★ Es la guía más directa de cómo será la evaluación.\n"},{"id":"clase_06_retroalimentacion_previa_a_la_evaluacion","titulo":"Clase 6 · Retroalimentación previa a la evaluación de la unidad 1","md":"# Clase 6 · Retroalimentación previa a la evaluación de la unidad 1\n\n**Agente:** Analista de Clases · **Fuente:** `Clases/Clase_06.txt` (no hay diapositivas de esta clase)\nDocente: Mgtr. Wilson Rodas Mogrovejo.\n\n## Resumen Ejecutivo\n\nSesión corta (unos 10 minutos de contenido) para orientar la evaluación de la unidad 1. El docente repasó los tres bloques de la unidad (ley penal, teoría del delito, causalismo y finalismo), dio ejemplos del tipo de pregunta y advirtió que **no usará esos mismos ejemplos, pero sí otros similares**. Dijo que quien estudie lo explicado y vea el video \"dos o tres veces\" le irá muy bien.\n\n## Ubicación en el Sílabo\n\nUnidad 1, cierre. Repasa los temas de las semanas 2 a 4.\n\n## Cómo viene la evaluación (dicho por el docente)\n\n- ★ **Distractores:** pone respuestas que son verdaderas pero que no responden la pregunta. Hay que leer primero la pregunta y escoger la respuesta que la contesta de forma más directa.\n  - Ejemplo suyo: si se pregunta la principal exigencia del principio de legalidad, \"todos son inocentes hasta tener sentencia ejecutoriada\" es cierto, pero es presunción de inocencia, no legalidad. La respuesta es que nadie puede ser sancionado por una conducta no tipificada en la ley al momento de realizarse.\n- Las preguntas son de aplicación a casos cortos, como los ejemplos que siguen.\n- Habrá una retroalimentación breve el día de la evaluación.\n\n## Puntos que repasó, con el ejemplo que dio\n\n| Tema | Lo que dijo | Ejemplo |\n|---|---|---|\n| **Principio de legalidad** | En el Estado constitucional de derechos y justicia, nadie puede ser sancionado por una conducta no tipificada como infracción al momento de realizarla. | Distractor: la presunción de inocencia. |\n| **Mínima intervención penal** | Reconocido en la Constitución. La ley penal se legitima cuando es estrictamente necesaria para proteger a las personas y los mecanismos extrapenales son insuficientes. | Si se resuelve con ley civil o laboral, no se recurre a la penal. |\n| **Infracción (art. 18 COIP)** | Conducta típica, antijurídica y culpable, cuya sanción está prevista en el COIP. | |\n| **Función de la teoría del delito (Zaffaroni, Alagia y Slokar)** | Son **filtros** jurídicos que permiten analizar y limitar racionalmente el ejercicio del poder punitivo. | |\n| **Legítima defensa** | Está en la **antijuridicidad** (causa de justificación). | Pedro lesiona a Juan al repeler una agresión actual e ilegítima, con necesidad racional de defensa y sin provocación suficiente. |\n| **Trastorno mental** | Está en la **culpabilidad**. | Conducta típica y antijurídica, pero la persona tiene trastorno mental: se anula la culpabilidad. |\n| **Corriente en Ecuador** | Derecho penal **finalista**. | |\n| **Causalismo clásico frente a finalismo** | La diferencia es dónde se ubican dolo y culpa: en el causalismo, en la culpabilidad; en el finalismo, en la **tipicidad**. | |\n| **Influencia finalista en el COIP** | La regulación del dolo y la culpa dentro de la sección de la tipicidad. | |\n| **Imputación objetiva** | Hay que ver si el conductor creó un riesgo jurídicamente desaprobado que se concretó en el resultado. Sin culpa no hay responsabilidad penal. | Camión que cumple las normas de tránsito y un peatón que entra de forma impredecible a la calzada. |\n| **Culpa (tipicidad subjetiva)** | Infracción del deber objetivo de cuidado. En tránsito, la modalidad a analizar es la culpa. | Conductor que usa una computadora mientras conduce y atropella a una persona (si hay tipo penal culposo aplicable). |\n| **Clasificación de las infracciones** | Delitos y contravenciones. | El asesinato es un delito. |\n\n## Preguntas probables de examen\n\n1. ¿Cuál es la principal exigencia del principio de legalidad? (cuidado con el distractor de la presunción de inocencia).\n2. ¿Cuándo se legitima la ley penal según la mínima intervención?\n3. ¿Qué es la infracción según el art. 18 del COIP?\n4. ¿Cuál es la función de la teoría del delito según Zaffaroni, Alagia y Slokar? (filtros que limitan el poder punitivo).\n5. ¿En qué categoría queda excluida la conducta de quien actúa en legítima defensa? (antijuridicidad).\n6. ¿Qué categoría se anula si hay trastorno mental? (culpabilidad).\n7. ¿Qué corriente rige en Ecuador y qué distingue al causalismo del finalismo? (finalismo; ubicación de dolo y culpa).\n8. ¿Qué rasgo del COIP muestra influencia finalista? (dolo y culpa en la tipicidad).\n9. Caso de tránsito sin infracción de normas: ¿hay riesgo jurídicamente desaprobado?\n10. Caso de conductor distraído: ¿qué modalidad de la tipicidad subjetiva se analiza? (culpa, por infracción del deber objetivo de cuidado).\n11. ¿Cómo se clasifican las infracciones?\n\n## Por verificar\n\n- El docente no citó artículos para legalidad ni mínima intervención. Se pueden contrastar con la Constitución y el COIP (carpeta `entrada/bibliografia/Normas/`) antes de citarlos en un examen.\n- Dijo que la mínima intervención \"está reconocida en la Constitución\": falta ubicar el artículo exacto.\n\n## Indicaciones Administrativas y contradicción de horario\n\n- El docente dijo que la tutoría y la evaluación son **el sábado, de 8 a 10 de la mañana**, y cerró con \"nos vemos el sábado para cumplir con nuestra evaluación\".\n- El correo del EVA indica que el cuestionario de Penal abre el **sábado 7 de noviembre a las 23:00 y cierra a las 23:59**. Las dos versiones no coinciden: confirmar con el docente o en el EVA antes del sábado.\n- Las respuestas de los estudiantes en la grabación son mínimas (\"la tipicidad\", \"culpabilidad\", \"finalistas\"). No hay otros datos de la evaluación.\n"}],"tarjetas":[{"q":"¿Derecho penal ecuatoriano: causalista o finalista?","a":"Finalista (dicho del docente; el COIP ubica dolo y culpa en la tipicidad)."},{"q":"Infracción penal (COIP, art. 18)","a":"Conducta típica, antijurídica y culpable cuya sanción se prevé en el Código."},{"q":"Filtros de la teoría del delito","a":"Conducta, tipicidad, antijuridicidad y culpabilidad; si falla un filtro no se analiza el siguiente."},{"q":"Doble función de la ley penal","a":"Protege bienes jurídicos y limita el poder de castigar."},{"q":"Legalidad (Constitución art. 76.3; COIP art. 5.1)","a":"Lex scripta, lex praevia, lex stricta, lex certa."},{"q":"Mínima intervención (COIP, art. 3)","a":"El derecho penal solo se legitima si es estrictamente necesario; es el último recurso."},{"q":"Proporcionalidad (Constitución, art. 76.6)","a":"La ley establecerá la debida proporcionalidad entre infracciones y sanciones."},{"q":"Presunción de inocencia","a":"Constitución, art. 76.2; COIP, art. 5.4."},{"q":"Interpretación de la ley penal (COIP, art. 13)","a":"Conforme a la Constitución; tipos y penas en forma estricta; prohibida la analogía para crear infracciones o ampliar sanciones."},{"q":"Ámbitos de validez (COIP, arts. 14 a 17)","a":"Espacial, personal, temporal y material; rige la ley vigente al hecho, salvo la posterior más benigna."},{"q":"Supremacía constitucional (arts. 424 y 425)","a":"La Constitución es norma suprema; orden jerárquico de las normas."},{"q":"Conducta penalmente relevante (art. 22)","a":"Acciones u omisiones que ponen en peligro o producen resultados lesivos; no se sanciona por identidad ni peligrosidad."},{"q":"Ausencia de conducta (art. 24)","a":"Fuerza física irresistible, movimientos reflejos o plena inconsciencia."},{"q":"Omisión (arts. 23 y 28)","a":"No impedir un acontecimiento con obligación jurídica de impedirlo equivale a ocasionarlo; la omisión dolosa exige posición de garante."},{"q":"Tipo penal y tipicidad","a":"Tipo: descripción abstracta de la conducta. Tipicidad: juicio de adecuación del hecho concreto al tipo."},{"q":"Funciones de la tipicidad (Albán Gómez)","a":"Garantista, descriptiva, sistemática y procesal."},{"q":"Elementos del tipo objetivo","a":"Verbo rector, sujetos activo y pasivo, objeto material, bien jurídico, medios, tiempo, lugar, elementos descriptivos y normativos, y resultado y nexo si se exige."},{"q":"Bien jurídico y objeto material","a":"Bien jurídico: interés protegido. Objeto material: persona o cosa sobre la que recae la acción."},{"q":"Imputación objetiva","a":"Atribuye el resultado al autor si creó o incrementó un riesgo jurídicamente desaprobado y ese riesgo se realizó en el resultado; la causalidad sola no basta."},{"q":"Dolo (art. 26)","a":"Conocimiento de los elementos objetivos del tipo y ejecución voluntaria de la conducta."},{"q":"Culpa (art. 27)","a":"Infracción del deber objetivo de cuidado que personalmente corresponde; solo se castiga si está tipificada."},{"q":"Error de tipo (art. 28.1)","a":"Invencible: excluye la infracción. Vencible: responde por culpa si existe tipo culposo."},{"q":"Antijuridicidad (art. 29)","a":"Amenazar o lesionar, sin justa causa, un bien jurídico protegido."},{"q":"Causas de exclusión de la antijuridicidad (art. 30)","a":"Estado de necesidad, legítima defensa, orden legítima y expresa de autoridad o deber legal."},{"q":"Legítima defensa (art. 33)","a":"Agresión actual e ilegítima; necesidad racional de la defensa; falta de provocación suficiente por quien actúa en defensa."},{"q":"Exceso en las causas de exclusión (art. 31)","a":"La pena se reduce en un tercio de la mínima."},{"q":"Culpabilidad (art. 34)","a":"Imputabilidad y conocimiento de la antijuridicidad; no equivale a dolo."},{"q":"Error de prohibición (art. 35.1)","a":"Invencible: sin responsabilidad. Vencible: pena mínima reducida en un tercio."},{"q":"Causalismo clásico","a":"La acción es un proceso causal; dolo y culpa se analizan en la culpabilidad."},{"q":"Finalismo (Welzel)","a":"La acción es final, dirigida a fines; el dolo se ubica en el tipo subjetivo."},{"q":"Homicidio culposo (art. 145)","a":"Tres a cinco años (dicho de memoria por el docente y confirmado en el COIP)."},{"q":"Tipicidad sin antijuridicidad: ejemplo","a":"Una lesión causada en legítima defensa: es típica pero no antijurídica."},{"q":"Error de tipo y error de prohibición","a":"El de tipo recae sobre un elemento del tipo (tipicidad); el de prohibición sobre la ilicitud (culpabilidad)."}],"simulacro":"# Simulacro de la unidad 1: Derecho Penal\n\n**Agente:** Preparador de Exámenes · **Unidad 1** · Basado en `conocimiento/` y el texto de las normas de la carpeta.\n**Formato de la evaluación:** no consta en el sílabo (cuestionario o estudio de caso). Este simulacro mezcla preguntas objetivas y casos.\n**Marcas:** [Clase] sale de lo dicho por el docente; [Guía] de la guía o el sílabo; [Propia] elaboración propia. Respuestas al final, con su fundamento.\n\n**Alcance:** lo que dijo el docente (28 oct): la evaluación sale únicamente de lo analizado en las tutorías de la unidad (ley penal y Estado constitucional, tipicidad, teoría del delito: causalismo y finalismo) y las respuestas están en las diapositivas, pero se pide razonamiento y aplicación, no definiciones. La retroalimentación del 4 de noviembre ya se dio (ver el resumen de la clase 6). Evaluación: sábado 7 de noviembre, 8h00 a 10h00.\n\n## Preguntas de memoria\n\n1. ¿Cuáles son las cuatro garantías de la legalidad (lex)? [Diapositivas S2]\n2. Defina infracción penal según el art. 18 del COIP. [Diapositivas S4]\n3. ¿Qué dice el art. 24 del COIP? [Diapositivas S4]\n4. ¿Qué es el dolo (art. 26) y qué es la culpa (art. 27)? [Diapositivas S3]\n5. ¿Cuáles son los requisitos de la legítima defensa (art. 33)? [Clase 5]\n\n## Preguntas de comprensión\n\n6. ¿El derecho penal ecuatoriano es causalista o finalista? Explique. [Clase 4]\n7. ¿Por qué no basta que una ley esté vigente para que su sanción sea constitucional? [Clase 2]\n8. Diferencie bien jurídico y objeto material, y error de tipo y error de prohibición. [Diapositivas S3]\n9. ¿Qué es la imputación objetiva y por qué la causalidad no basta? [Diapositivas S3]\n\n## Preguntas de aplicación\n\n10. Una persona carpintera recibe un anticipo y no entrega la obra por una enfermedad. ¿Hay estafa? Analice el tipo subjetivo. [Propia, a partir de la clase 3]\n11. Dos vehículos se cruzan en una intersección; uno respeta el semáforo y es chocado por otro que lo ignora. ¿Qué filtro de la imputación objetiva se aplica? [Propia: principio de confianza]\n\n## Caso práctico\n\n12. **Caso integrador (ACD 2)** [Clase 5]: el 15 de octubre de 2026, Pedro reclama una deuda a Juan, lo empuja contra una mesa y avanza con una botella de vidrio. Juan le lanza una silla y lo golpea en el hombro. Pedro suelta la botella, retrocede tres metros y dice \"ya está, no voy a hacerte nada\". Juan avanza y le da un puñetazo; Pedro cae y se golpea la cabeza: fractura nasal y traumatismo craneal con 35 días de incapacidad. Juan dice que creyó que Pedro seguía siendo un peligro. Analice conducta, tipicidad, antijuridicidad y culpabilidad.\n\n## Respuestas sugeridas\n\n1. Lex scripta (ley escrita), lex praevia (anterior al hecho), lex stricta (prohíbe la analogía perjudicial) y lex certa (descripción precisa de la conducta) (Constitución, art. 76.3; COIP, art. 5.1).\n\n2. Conducta típica, antijurídica y culpable cuya sanción se prevé en el Código.\n\n3. Causas de exclusión de la conducta: fuerza física irresistible, movimientos reflejos o plena inconsciencia.\n\n4. Dolo: conocimiento de los elementos objetivos del tipo y ejecución voluntaria. Culpa: infracción del deber objetivo de cuidado que personalmente corresponde; solo punible si está tipificada.\n\n5. Agresión actual e ilegítima, necesidad racional de la defensa y falta de provocación suficiente por quien actúa en defensa.\n\n6. Finalista, como dijo el docente: el COIP ubica dolo y culpa en la tipicidad. En el causalismo estaban en la culpabilidad; el finalismo de Welzel concibe la acción dirigida a fines.\n\n7. Porque la ley vigente puede contradecir la Constitución (legalidad formal frente a control constitucional); la ley penal debe respetar los derechos y los principios de mínima intervención y proporcionalidad (Constitución, arts. 76.6, 424 y 425; COIP, arts. 3 y 4).\n\n8. Bien jurídico: interés protegido; objeto material: persona o cosa sobre la que recae la acción. Error de tipo (art. 28.1) recae sobre un elemento objetivo del tipo y se analiza en la tipicidad; error de prohibición (art. 35.1) recae sobre la ilicitud y se analiza en la culpabilidad.\n\n9. Es la atribución del resultado al autor cuando creó o incrementó un riesgo jurídicamente desaprobado que se realizó en el resultado. La causalidad material no explica por sí sola la responsabilidad (riesgo permitido, principio de confianza, prohibición de regreso).\n\n10. Depende del dolo: la estafa exige engaño y voluntad de defraudar al celebrar el contrato. Si la persona tenía la intención real de cumplir y la enfermedad lo impidió, falta el tipo subjetivo y habría un incumplimiento civil. El resultado por sí solo no presume dolo (diapositivas S3).\n\n11. El principio de confianza: quien respeta las normas puede confiar en que los demás también lo hacen; el conductor que cruza con luz verde no crea un riesgo desaprobado, por lo que el resultado no se le imputa objetivamente.\n\n12. Respuesta guía del docente (criterio propio, no hay una sola respuesta correcta): **Conducta**: dos comportamientos diferenciados, el lanzamiento de la silla y el puñetazo, ambos voluntarios; no hay causas de exclusión del art. 24. **Tipicidad**: sujeto activo Juan, pasivo Pedro, bien jurídico la integridad pe
