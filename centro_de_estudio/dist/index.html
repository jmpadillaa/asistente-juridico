<title>Centro de estudio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=Literata:opsz,wght@7..72,400..700&display=swap">
<style>
/* Concepto: apuntes de facultad. Barra lateral con las cuatro materias, cada una con su color; hojas claras tipo cuaderno; la parte visual (mapas, cuadros, líneas de tiempo) usa el color de la materia. */
:root {
  --bg: #F1F4F8; --surface: #FFFFFF; --surface2: #E8EDF3; --ink: #15202B; --ink2: #47586C;
  --line: #D5DCE5; --accent: #1D4E89; --on-accent: #FFFFFF;
  --ok: #1F7A4D; --warn: #A8640A; --bad: #B3342B;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Literata", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --on-m: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141B; --surface: #161F29; --surface2: #1E2A36; --ink: #E7EEF5; --ink2: #A2B3C5;
    --line: #2A3947; --accent: #7DB0EA; --on-accent: #0E141B;
    --ok: #5CCB97; --warn: #E3AA55; --bad: #EF8F86; --on-m: #0E141B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141B; --surface: #161F29; --surface2: #1E2A36; --ink: #E7EEF5; --ink2: #A2B3C5;
  --line: #2A3947; --accent: #7DB0EA; --on-accent: #0E141B;
  --ok: #5CCB97; --warn: #E3AA55; --bad: #EF8F86; --on-m: #0E141B; color-scheme: dark;
}
.mt { --m: var(--ml); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mt { --m: var(--md); } }
:root[data-theme="dark"] .mt { --m: var(--md); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 40; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; }
a { color: var(--accent); }

#app { display: grid; grid-template-columns: 252px minmax(0, 1fr); gap: 28px; max-width: 1240px; margin: 0 auto; padding-block: 16px 96px; }
#side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; max-height: calc(100vh - 32px); overflow: auto; display: flex; flex-direction: column; gap: 18px; }
#main { min-width: 0; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; line-height: 1.1; }
.brand small { display: block; font-family: var(--f-mono); font-weight: 400; font-size: .72rem; color: var(--ink2); letter-spacing: .04em; text-transform: uppercase; margin-top: 4px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav h6 { margin: 12px 0 4px; font: 500 .7rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.nv { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; border: 0; background: none; text-align: left; font-family: var(--f-display); font-weight: 600; font-size: .95rem; width: 100%; color: var(--ink); }
.nv:hover { background: var(--surface2); }
.nv[aria-current="true"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--m, var(--accent)); flex: none; }
.nv .pct { margin-left: auto; font: 500 .75rem var(--f-mono); color: var(--ink2); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font: 400 .75rem var(--f-mono); color: var(--ink2); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-family: var(--f-display); font-weight: 600; font-size: .9rem; }
.btn:hover { background: var(--surface2); }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.sm { padding: 5px 9px; font-size: .8rem; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: transparent; }
.sync { display: flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.sync.on i { background: var(--ok); }

#bottom { display: none; }
@media (max-width: 899px) {
  #app { grid-template-columns: minmax(0, 1fr); gap: 0; padding-block: 12px 100px; }
  #side { display: none; }
  #bottom { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  #bottom button { border: 0; background: none; font: 600 .68rem var(--f-display); padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink2); }
  #bottom button[aria-current="true"] { color: var(--accent); }
  #bottom svg { width: 22px; height: 22px; }
}

/* encabezados de vista */
.vh { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 16px; margin-bottom: 18px; }
.vh h1 { font-size: clamp(1.7rem, 4.5vw, 2.4rem); font-weight: 800; letter-spacing: -0.02em; }
.vh p { margin: 4px 0 0; color: var(--ink2); font-size: .95rem; }
.kicker { font: 500 .72rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.sec { margin-top: 28px; }
.sec > h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: baseline; gap: 10px; }
.sec > h2 small { font: 400 .75rem var(--f-mono); color: var(--ink2); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }

/* evaluaciones */
.evs { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.ev { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 14px 18px; overflow: hidden; display: flex; flex-direction: column; gap: 2px; text-align: left; }
.ev::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--m); }
.ev b { font-family: var(--f-display); font-size: 1.05rem; }
.ev .cuando { font: 400 .8rem var(--f-mono); color: var(--ink2); }
.ev .falta { font: 700 1.55rem var(--f-display); letter-spacing: -0.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.ev.next { box-shadow: 0 0 0 2px var(--m); }
.ev.done { opacity: .6; }
.ev .tag { align-self: flex-start; font: 500 .65rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; background: var(--m); color: var(--on-m); border-radius: 4px; padding: 1px 6px; margin-bottom: 4px; }

/* progreso */
.prog { display: grid; gap: 10px; }
.pr { display: grid; grid-template-columns: minmax(110px, 160px) 1fr; gap: 6px 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-align: left; width: 100%; }
.pr b { font-family: var(--f-display); display: flex; align-items: center; gap: 8px; }
.pr .bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 74px 1fr 56px; align-items: center; gap: 8px; font: 400 .72rem var(--f-mono); color: var(--ink2); }
.bar span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.track { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--m); border-radius: 4px; }
@media (max-width: 560px) { .pr { grid-template-columns: 1fr; } .bar { grid-template-columns: 66px 1fr 48px; } }

/* tareas */
.tl { display: flex; flex-direction: column; gap: 6px; }
.tk { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.tk input[type=checkbox], .chk { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--m, var(--accent)); flex: none; }
.tk .tt { font-family: var(--f-display); font-weight: 600; line-height: 1.3; }
.tk.hecho .tt { text-decoration: line-through; color: var(--ink2); font-weight: 500; }
.tk .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font: 400 .74rem var(--f-mono); color: var(--ink2); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 1px 9px 1px 7px; background: var(--surface2); font: 500 .72rem var(--f-mono); color: var(--ink); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--m); }
.pill.warn { color: var(--warn); }
.pill.bad { color: var(--bad); }
.tk .nota { grid-column: 2; font-size: .85rem; color: var(--ink2); line-height: 1.45; }
.grp { margin: 18px 0 8px; font: 500 .72rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); display: flex; gap: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font: 600 .82rem var(--f-display); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: transparent; }
form.add { display: grid; grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr)) auto; gap: 8px; margin-top: 12px; }
form.add input, form.add select, .field { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }
@media (max-width: 700px) { form.add { grid-template-columns: 1fr 1fr; } form.add input[name=t] { grid-column: 1 / -1; } }

/* materia */
.mh { background: var(--m); color: var(--on-m); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: end; }
.mh h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 800; letter-spacing: -0.02em; }
.mh p { margin: 2px 0 0; opacity: .9; font-size: .9rem; }
.mh .ex { font: 500 .78rem var(--f-mono); text-align: right; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tab { border: 0; background: none; padding: 9px 12px; border-radius: 8px 8px 0 0; font: 600 .92rem var(--f-display); color: var(--ink2); white-space: nowrap; border-bottom: 3px solid transparent; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--m); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.mc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 16px 20px; position: relative; overflow: hidden; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.mc::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--m); }
.mc b { font: 700 1.15rem var(--f-display); }
.mc span { font-size: .85rem; color: var(--ink2); }

/* temas */
.un { margin-bottom: 22px; }
.un h3 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.un h3 small { font: 400 .72rem var(--f-mono); color: var(--ink2); }
.tm { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
.tm .open { text-align: left; border: 0; background: none; padding: 2px 0; font: 600 1rem var(--f-display); line-height: 1.3; }
.tm .open small { display: block; font: 400 .72rem var(--f-mono); color: var(--ink2); margin-top: 2px; }
.tm.hecho { background: color-mix(in srgb, var(--m) 10%, var(--surface)); }
.soon { border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; color: var(--ink2); font-size: .9rem; }
.dtabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
.th { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }
.th h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; }

/* clases */
details.cl { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
details.cl > summary { cursor: pointer; padding: 12px 16px; font: 600 1rem var(--f-display); list-style: none; display: flex; align-items: center; gap: 10px; }
details.cl > summary::-webkit-details-marker { display: none; }
details.cl > summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--ink2); border-bottom: 2px solid var(--ink2); transform: rotate(-45deg); transition: transform .15s; flex: none; }
details.cl[open] > summary::before { transform: rotate(45deg); }
details.cl .md { padding: 0 16px 16px; }

/* markdown */
.md { max-width: 78ch; overflow-wrap: anywhere; }
.md.wide { max-width: none; }
.md h1 { font-size: 1.5rem; font-weight: 800; margin: 4px 0 12px; }
.md h2 { font-size: 1.2rem; font-weight: 700; margin: 24px 0 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.md h3 { font-size: 1.02rem; font-weight: 700; margin: 18px 0 6px; }
.md p { margin: 0 0 12px; }
.md ul, .md ol { padding-left: 1.3em; margin: 0 0 12px; }
.md li { margin: 3px 0; }
.md code { font-family: var(--f-mono); font-size: .85em; background: var(--surface2); padding: 1px 5px; border-radius: 4px; }
.md blockquote { margin: 0 0 12px; padding: 4px 14px; border-left: 3px solid var(--m, var(--accent)); color: var(--ink2); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.md strong { font-weight: 700; }
.tw { overflow-x: auto; margin: 0 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.tw table { border-collapse: collapse; width: 100%; font-size: .9rem; line-height: 1.45; }
.tw th, .tw td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; min-width: 90px; }
.tw th { font: 700 .82rem var(--f-display); background: color-mix(in srgb, var(--m, var(--accent)) 12%, var(--surface)); position: sticky; top: 0; }
.tw tr:last-child td { border-bottom: 0; }
.tw td:first-child { font-weight: 600; }

/* diagramas */
.dg { margin-bottom: 18px; }
.dg > h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 2px; }
.dg > p { margin: 0 0 10px; color: var(--ink2); font-size: .9rem; max-width: 78ch; }
.canvas { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; overflow-x: auto; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree li { display: flex; align-items: center; position: relative; }
.tree ul { display: flex; flex-direction: column; margin-left: 26px; position: relative; }
.tree ul::before { content: ""; position: absolute; left: -26px; top: 50%; width: 26px; border-top: 2px solid var(--line); }
.tree ul > li { padding: 4px 0 4px 26px; }
.tree ul > li::before { content: ""; position: absolute; left: 0; top: 50%; width: 26px; border-top: 2px solid var(--line); }
.tree ul > li::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 2px solid var(--line); }
.tree ul > li:first-child::after { top: 50%; }
.tree ul > li:last-child::after { bottom: 50%; }
.tree ul > li:only-child::after { display: none; }
.nd { border: 2px solid var(--m); border-radius: 10px; padding: 6px 11px; background: var(--surface); max-width: 280px; min-width: 96px; line-height: 1.3; font-size: .92rem; }
.nd b { font: 600 .95rem var(--f-display); display: block; }
.nd small { display: block; color: var(--ink2); font-size: .78rem; line-height: 1.35; margin-top: 2px; }
.nd.d0 { background: var(--m); color: var(--on-m); border-color: var(--m); }
.nd.d0 small { color: inherit; opacity: .9; }
.nd.d1 { background: color-mix(in srgb, var(--m) 18%, var(--surface)); }
.nd.d2 { background: color-mix(in srgb, var(--m) 7%, var(--surface)); }
.nd.d3 { border-width: 1px; border-style: dashed; }
@media (max-width: 640px) {
  .canvas { padding: 12px; }
  .tree li { display: block; }
  .tree ul { margin: 6px 0 2px 10px; padding-left: 14px; border-left: 2px solid var(--line); }
  .tree ul::before, .tree ul > li::before, .tree ul > li::after { display: none; }
  .tree ul > li { padding: 3px 0; }
  .nd { max-width: none; }
}
.flow { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px 0; counter-reset: paso; }
.flow li { counter-increment: paso; position: relative; flex: 1 1 190px; max-width: 280px; background: var(--surface); border: 2px solid var(--m); border-radius: 10px; padding: 10px 12px 10px 12px; margin-right: 26px; }
.flow li::before { content: counter(paso); position: absolute; top: -10px; left: 10px; width: 20px; height: 20px; border-radius: 50%; background: var(--m); color: var(--on-m); font: 700 .72rem var(--f-mono); display: grid; place-items: center; }
.flow li:not(:last-child)::after { content: ""; position: absolute; right: -24px; top: 50%; width: 22px; height: 22px; margin-top: -11px; background: var(--m); clip-path: polygon(0 28%, 55% 28%, 55% 0, 100% 50%, 55% 100%, 55% 72%, 0 72%); opacity: .55; }
.flow li.fin { background: var(--m); color: var(--on-m); }
.flow li b { font: 700 1rem var(--f-display); display: block; }
.flow li small { display: block; font-size: .8rem; line-height: 1.4; margin-top: 3px; color: var(--ink2); }
.flow li.fin small { color: inherit; opacity: .92; }
@media (max-width: 640px) {
  .flow { flex-direction: column; gap: 22px; }
  .flow li { margin-right: 0; max-width: none; flex-basis: auto; }
  .flow li:not(:last-child)::after { right: auto; left: 50%; top: auto; bottom: -22px; margin: 0 0 0 -11px; transform: rotate(90deg); }
}
.cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.cmp > div { border: 2px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.cmp > div.dest { border-color: var(--m); }
.cmp h4 { font: 700 1rem var(--f-display); padding: 9px 14px; background: color-mix(in srgb, var(--m) 16%, var(--surface)); }
.cmp .dest h4 { background: var(--m); color: var(--on-m); }
.cmp ul { margin: 0; padding: 10px 14px 12px 30px; font-size: .92rem; line-height: 1.45; }
.cmp li { margin: 4px 0; }
.line { list-style: none; margin: 0; padding: 22px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; position: relative; }
.line::before { content: ""; position: absolute; left: 0; right: 0; top: 11px; border-top: 3px solid var(--line); }
.line li { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.line li::before { content: ""; position: absolute; top: -17px; left: 14px; width: 14px; height: 14px; border-radius: 50%; background: var(--m); border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--m); }
.line .cu { font: 500 .74rem var(--f-mono); color: var(--m); letter-spacing: .04em; text-transform: uppercase; }
.line b { font: 700 1rem var(--f-display); display: block; }
.line small { display: block; font-size: .82rem; color: var(--ink2); line-height: 1.4; margin-top: 2px; }
.pie { margin: 10px 0 0; font-size: .88rem; color: var(--ink2); border-left: 3px solid var(--m); padding-left: 10px; }

/* tarjetas */
.fc-wrap { max-width: 640px; }
.fc { perspective: 1200px; margin: 8px 0 14px; }
.fc-in { position: relative; min-height: 260px; transition: transform .45s; transform-style: preserve-3d; }
.fc.flip .fc-in { transform: rotateY(180deg); }
.fc-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 16px; border: 2px solid var(--m); background: var(--surface); padding: 22px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; overflow: auto; width: 100%; }
.fc-face.back { transform: rotateY(180deg); background: color-mix(in srgb, var(--m) 10%, var(--surface)); }
.fc-face .lab { position: absolute; top: 10px; left: 14px; font: 500 .68rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.fc-face .txt { font: 600 1.25rem var(--f-display); line-height: 1.35; }
.fc.flip .fc-face.front, .fc:not(.flip) .fc-face.back { pointer-events: none; }
.fc-face.back .txt { font: 400 1.05rem var(--f-body); }
.fc-nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.fc-go { display: flex; gap: 8px; flex-wrap: wrap; }
.btn.ok { background: var(--ok); color: #fff; border-color: transparent; }
.btn.rev { background: var(--warn); color: #fff; border-color: transparent; }
@media (prefers-reduced-motion: reduce) { .fc-in { transition: none; } }

/* explicación simple y glosario */
.gl { border-bottom: 1.5px dotted var(--m, var(--accent)); cursor: help; }
.gl:hover, .gl:focus-visible { background: color-mix(in srgb, var(--m, var(--accent)) 14%, transparent); border-radius: 3px; }
.simple .lead { font: 600 1.2rem/1.45 var(--f-display); margin: 0 0 14px; }
.simple .ej, .simple .ojo { border-radius: 12px; padding: 12px 14px; margin: 14px 0; }
.simple .ej { background: var(--surface); border: 1px solid var(--line); }
.simple .ojo { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line)); }
.simple .ej p, .simple .ojo p { margin: 0; }
.simple .tg { display: block; font: 500 .68rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); margin-bottom: 3px; }
.gl-list { display: grid; gap: 8px; max-width: 78ch; }
.gi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.gi .gh { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.gi b { font: 700 1.05rem var(--f-display); }
.gi p { margin: 4px 0 0; font-size: .95rem; }
.pe { font-size: .9rem; color: var(--ink2); }
.pe span { font: 500 .68rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; margin-right: 6px; }
.pop { position: fixed; z-index: 55; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); padding: 14px 16px; max-height: 50vh; overflow: auto; }
@media (min-width: 900px) { .pop { left: auto; right: 24px; bottom: 24px; width: 400px; } }
.pop-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pop-h b { font: 700 1.1rem var(--f-display); }
.pop p { margin: 8px 0; }

/* notas y buscador */
textarea.nota { width: 100%; min-height: 160px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 12px; line-height: 1.55; }
.small { font: 400 .75rem var(--f-mono); color: var(--ink2); }
.search { display: flex; gap: 8px; margin-bottom: 14px; }
.search input { flex: 1; font-size: 1rem; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-width: 0; }
.res { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
.res b { font: 600 .98rem var(--f-display); }
.res p { margin: 4px 0 0; font-size: .85rem; color: var(--ink2); line-height: 1.45; }
mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; color: var(--ink2); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font: 500 .85rem var(--f-display); z-index: 60; }
@media (min-width: 900px) { .toast { bottom: 24px; } }

<script type="application/json" id="datos">{"generado":"2026-11-07 10:23","zona":"-05:00","glosario":[{"id":"bien","t":"Bien","m":"civil","s":"Todo lo que la ley reconoce como objeto de derechos: una casa, un auto, pero también un crédito. Es una palabra más amplia que «cosa».","e":"Tu laptop es un bien. El derecho a cobrar un préstamo también.","n":1},{"id":"cosa","t":"Cosa","m":"civil","s":"Algo material que vale dinero, que alguien puede tener como propio y que se puede pasar a otra persona.","e":"Una bicicleta.","n":1},{"id":"cosa-corporal","t":"Cosa corporal","m":"civil","s":"Lo que existe físicamente y se puede percibir con los sentidos.","e":"Una casa, un libro.","a":"art. 583","v":["cosas corporales","bien corporal","bienes corporales"]},{"id":"cosa-incorporal","t":"Cosa incorporal","m":"civil","s":"No se toca: es un derecho. Existe porque la ley lo reconoce.","e":"El derecho a cobrar un préstamo; el derecho de paso por el terreno del vecino.","a":"art. 583","v":["cosas incorporales","bien incorporal","bienes incorporales"]},{"id":"mueble","t":"Mueble","m":"civil","s":"Cosa que se puede llevar de un lugar a otro sin dañarla.","e":"Una computadora, un caballo.","a":"art. 585","v":["muebles"]},{"id":"semoviente","t":"Semoviente","m":"civil","s":"Mueble que se mueve por sí mismo: un animal.","e":"Un caballo, una vaca.","a":"art. 585","v":["semovientes"]},{"id":"inmueble","t":"Inmueble","m":"civil","s":"Cosa que no se puede trasladar sin destruirla: el terreno y lo que está unido a él de forma permanente. También se llama bien raíz, finca o predio.","e":"Un lote, una casa, un naranjo plantado.","a":"art. 586","v":["inmuebles","bien raíz","bienes raíces","finca","predio","predios","fundo"]},{"id":"inmueble-adherencia","t":"Inmueble por adherencia","m":"civil","s":"Algo que era mueble pero quedó pegado de forma permanente a un inmueble, y por eso la ley lo trata como parte de él.","e":"El espejo embutido en la pared del baño. El cuadro colgado de un clavo sigue siendo mueble.","a":"arts. 586, 587 y 590","v":["por adherencia"]},{"id":"inmueble-destino","t":"Inmueble por destino","m":"civil","s":"Mueble que el dueño de la finca puso ahí para servirla de forma permanente. Se puede mover, pero la ley lo trata como inmueble.","e":"El tractor y los animales de cultivo de una hacienda. Un tractor alquilado una semana no cuenta.","a":"art. 588","v":["por destino","por su destino"]},{"id":"mueble-anticipacion","t":"Mueble por anticipación","m":"civil","s":"Fruto o producto que todavía está pegado a la tierra o al árbol, pero se negocia como si ya estuviera separado.","e":"Vender las naranjas de un huerto antes de cosecharlas, o la madera de un árbol en pie.","a":"art. 589","v":["por anticipación"]},{"id":"separacion-momentanea","t":"Separación momentánea","m":"civil","s":"Si algo que pertenece a un inmueble se retira por poco tiempo, por ejemplo para repararlo, no deja de ser inmueble. Si se separa para darle otro destino, sí.","e":"Un portón enviado a reparar sigue siendo inmueble. Un jacuzzi desmontable que se regala pasa a ser mueble.","a":"art. 591"},{"id":"ajuar","t":"Muebles de una casa (ajuar)","m":"civil","s":"Cuando la ley o una persona dice «muebles de una casa» sin más detalle, se entienden las camas, la vajilla y los muebles de uso común. No incluye ropa, joyas, obras de arte ni dinero, salvo que se mencionen.","a":"art. 592","v":["muebles de una casa"]},{"id":"fungible","t":"Cosa fungible","m":"civil","s":"Se puede cambiar por otra igual sin que cambie nada jurídicamente. Lo contrario es la cosa no fungible, que tiene identidad propia.","e":"Un billete de USD 10 por otro. Un cuadro original no se puede reemplazar así.","a":"art. 593","v":["fungibles","no fungible","no fungibles"]},{"id":"consumible","t":"Cosa consumible","m":"civil","s":"Se gasta o se acaba con el primer uso.","e":"Los alimentos, el combustible."},{"id":"especifica-generica","t":"Cosa específica y genérica","m":"civil","s":"Específica (cuerpo cierto): es ese objeto concreto entre todos. Genérica: solo se define por su clase.","e":"Específica: este caballo, el Lucero. Genérica: un caballo cualquiera, o 10 sacos de arroz.","v":["cuerpo cierto","cosa genérica","cosa específica"]},{"id":"divisible","t":"Cosa divisible e indivisible","m":"civil","s":"Divisible: se puede partir sin que el conjunto pierda valor. Indivisible: no se puede partir por su naturaleza o porque las partes así lo acordaron.","e":"Un terreno grande se puede lotizar; un caballo vivo no.","v":["indivisible","divisibles"]},{"id":"derecho-real","t":"Derecho real","m":"civil","s":"Poder directo sobre una cosa. Lo puedes hacer valer frente a cualquiera, no solo frente a una persona concreta.","e":"El dueño de una casa; quien tiene usufructo o una hipoteca sobre ella.","a":"art. 595","v":["derechos reales"]},{"id":"derecho-personal","t":"Derecho personal o crédito","m":"civil","s":"Facultad de exigir algo a una persona determinada que se obligó contigo. Solo se puede reclamar a ella.","e":"Le prestaste USD 500 a Juan: solo se los puedes cobrar a Juan.","a":"art. 596","v":["derechos personales","crédito","créditos"]},{"id":"accion-real","t":"Acción real","m":"civil","s":"La demanda que nace de un derecho real: sirve para defender la cosa frente a quien la perturba o la tiene.","a":"art. 595","v":["acciones reales"]},{"id":"accion-personal","t":"Acción personal","m":"civil","s":"La demanda que nace de un derecho personal: se dirige solo contra la persona obligada.","a":"art. 596","v":["acciones personales"]},{"id":"erga-omnes","t":"Erga omnes","m":"civil","s":"Expresión latina que significa «frente a todos». Un derecho erga omnes se puede oponer a cualquier persona. Es la marca de los derechos reales.","a":"Parraguez, p. 41"},{"id":"acreedor-deudor","t":"Acreedor y deudor","m":"civil","s":"Acreedor es a quien le deben. Deudor es quien debe.","e":"En el préstamo, María es acreedora y Juan es deudor.","v":["acreedor","acreedora","deudor","deudora"]},{"id":"dominio","t":"Dominio (propiedad)","m":"civil","s":"El derecho de ser dueño: usar la cosa, disfrutarla y disponer de ella (venderla, regalarla), respetando la ley y los derechos de otros.","a":"art. 599","v":["dominio"]},{"id":"nuda-propiedad","t":"Nuda propiedad","m":"civil","s":"Ser dueño de una cosa sin poder usarla ni disfrutarla, porque otra persona tiene ese derecho por un tiempo. El dueño en esa situación es el nudo propietario.","e":"María es dueña de la casa, pero Rosa vive en ella por el usufructo: María es la nuda propietaria.","a":"art. 599","v":["nudo propietario","mera propiedad","nuda propiedad"]},{"id":"usufructo","t":"Usufructo","m":"civil","s":"Derecho de usar y disfrutar una cosa ajena, con la obligación de cuidarla y devolverla. Es un derecho real. Quien lo tiene es el usufructuario.","e":"Rosa puede vivir en la casa de María mientras dure el usufructo, pero la casa no es suya.","a":"arts. 595 y 778","v":["usufructuario","usufructuaria"]},{"id":"servidumbre","t":"Servidumbre","m":"civil","s":"Derecho de usar un terreno ajeno en beneficio del propio.","e":"Tu lote no tiene salida a la calle y tienes derecho a pasar por el lote del vecino.","a":"art. 595","v":["servidumbres","servidumbre activa","servidumbres activas"]},{"id":"hipoteca","t":"Hipoteca","m":"civil","s":"Garantía de una deuda sobre un inmueble. El deudor sigue usando la casa, pero si no paga, el acreedor puede pedir que se venda para cobrarse. Debe inscribirse; sin inscripción no vale.","a":"arts. 595 y 2312"},{"id":"prenda","t":"Prenda","m":"civil","s":"Garantía de una deuda sobre un mueble: el bien queda como respaldo de lo que se debe.","e":"Joyas entregadas en prenda por un préstamo.","a":"art. 595"},{"id":"tradicion","t":"Tradición","m":"civil","s":"La entrega jurídica de una cosa que hace que el nuevo dueño adquiera el dominio. En los muebles basta entregarlos; en los inmuebles hay que inscribir el título en el Registro de la Propiedad.","e":"Ana firmó la escritura de la casa, pero hasta que no se inscribe, el dueño sigue siendo don Luis.","a":"arts. 603 y 702"},{"id":"modo-adquirir","t":"Modos de adquirir el dominio","m":"civil","s":"Las formas que la ley reconoce para llegar a ser dueño: ocupación, accesión, tradición, sucesión, sentencia de extinción de dominio por causa de muerte y prescripción.","a":"art. 603","v":["modos de adquirir"]},{"id":"escritura-publica","t":"Escritura pública","m":"civil","s":"Documento que se firma ante notario. La ley lo exige para que la venta de un inmueble se considere perfecta.","a":"art. 1740","v":["escritura pública"]},{"id":"registro-propiedad","t":"Registro de la Propiedad","m":"civil","s":"Oficina del cantón donde se inscriben los títulos de los inmuebles. Mientras no se inscribe, la transferencia no se completa.","a":"arts. 702 y 703","v":["inscripción","inscribir","inscribirse"]},{"id":"prescripcion","t":"Prescripción","m":"civil","s":"Forma de ganar una cosa, o de perder un derecho, por el paso del tiempo. Los plazos son más cortos para los muebles que para los inmuebles.","a":"art. 603"},{"id":"posesion","t":"Posesión","m":"civil","s":"Tener una cosa como si fueras su dueño: la cuidas, la cercas, la usas como tuya. No es lo mismo que ser dueño: puedes poseer sin ser dueño, y la ley igual te protege.","e":"Quien vive en un lote y lo cultiva como propio es poseedor."},{"id":"amparo-posesorio","t":"Amparo posesorio","m":"civil","s":"Demanda para que te protejan en la posesión cuando alguien te perturba, sin habértela quitado.","e":"El vecino retira el cerramiento de tu terreno: puedes pedir amparo.","a":"art. 965"},{"id":"turbacion","t":"Turbación","m":"civil","s":"Acto que molesta o perturba la posesión sin quitarla.","e":"Retirar el cerramiento de un terreno ajeno.","v":["turbaciones"]},{"id":"restitucion","t":"Restitución","m":"civil","s":"Demanda para recuperar la posesión de quien te la quitó injustamente.","a":"art. 970"},{"id":"restablecimiento","t":"Restablecimiento","m":"civil","s":"Demanda rápida de quien fue despojado con violencia. Solo debe probar el despojo y tiene seis meses para pedirla.","a":"art. 972"},{"id":"juicio-posesorio","t":"Juicio posesorio","m":"civil","s":"Juicio que discute solo quién posee, sin decidir quién es dueño.","a":"art. 967"},{"id":"bienes-nacionales","t":"Bienes nacionales","m":"civil","s":"Bienes cuyo dueño es toda la Nación.","a":"art. 604"},{"id":"bienes-uso-publico","t":"Bienes de uso público","m":"civil","s":"Bienes nacionales que puede usar cualquier persona.","e":"Los ríos y los lagos naturales.","a":"art. 612","v":["uso público"]},{"id":"bienes-estado","t":"Bienes del Estado","m":"civil","s":"Las tierras sin otro dueño dentro del territorio del país.","a":"art. 605"},{"id":"ley-penal","t":"Ley penal","m":"penal","s":"Las normas que dicen qué conductas son infracciones, qué castigo tienen y cómo se juzga a quien las comete.","a":"COIP, art. 1"},{"id":"poder-punitivo","t":"Poder punitivo","m":"penal","s":"La facultad del Estado de castigar. La teoría del delito sirve para limitarlo.","v":["poder punitivo"]},{"id":"estado-constitucional","t":"Estado constitucional de derechos y justicia","m":"penal","s":"Un Estado que se somete a la Constitución: sus leyes y sus castigos tienen límites, y las personas tienen derechos que ni el Estado puede pasar por encima.","v":["Estado constitucional"]},{"id":"principio-legalidad","t":"Principio de legalidad","m":"penal","s":"Nadie puede ser sancionado por una conducta que, cuando la hizo, no estaba tipificada como infracción en la ley.","e":"Si algo se prohíbe recién mañana, hoy no se te puede castigar por haberlo hecho ayer.","v":["legalidad"]},{"id":"lex","t":"Lex scripta, praevia, stricta y certa","m":"penal","s":"Las cuatro exigencias de la legalidad. Scripta: la ley debe estar escrita. Praevia: debe ser anterior al hecho. Stricta: no se puede aplicar por analogía en perjuicio de la persona. Certa: la conducta debe estar descrita con claridad.","v":["lex scripta","lex praevia","lex stricta","lex certa"]},{"id":"analogia","t":"Analogía","m":"penal","s":"Aplicar una ley a un caso parecido que la ley no menciona. En materia penal está prohibida cuando perjudica a la persona.","v":["analogía"]},{"id":"minima-intervencion","t":"Mínima intervención","m":"penal","s":"El derecho penal es el último recurso: solo se usa cuando es necesario para proteger a las personas y lo civil o lo laboral no alcanzan.","e":"Una deuda se cobra en un juicio civil, no con cárcel.","a":"COIP, art. 3"},{"id":"proporcionalidad","t":"Proporcionalidad","m":"penal","s":"La sanción debe corresponder a la gravedad de la infracción.","a":"Constitución, art. 76.6"},{"id":"dignidad-humana","t":"Dignidad humana","m":"penal","s":"La persona no es un objeto de castigo: debe tratársela como persona aun cuando ha cometido una infracción.","a":"COIP, art. 4"},{"id":"sentencia-ejecutoriada","t":"Sentencia ejecutoriada","m":"penal","s":"Sentencia que ya no se puede impugnar. Hasta entonces la persona se presume inocente.","v":["sentencia condenatoria ejecutoriada","ejecutoriada"]},{"id":"bien-juridico","t":"Bien jurídico","m":"penal","s":"Lo que la ley protege con un delito: la vida, la libertad, el patrimonio.","e":"En el homicidio, el bien jurídico es la vida.","v":["bienes jurídicos"]},{"id":"teoria-delito","t":"Teoría del delito","m":"penal","s":"El método para decidir si una conducta puede atribuirse penalmente a alguien. Funciona como una serie de filtros: conducta, tipicidad, antijuridicidad y culpabilidad. Si falla uno, no se sigue con el siguiente.","v":["filtros"]},{"id":"infraccion","t":"Infracción penal","m":"penal","s":"Conducta típica, antijurídica y culpable que el COIP sanciona.","a":"art. 18","v":["infracción"]},{"id":"delito-contravencion","t":"Delito y contravención","m":"penal","s":"Las dos clases de infracciones. Los delitos son las más graves; las contravenciones, las más leves.","e":"El asesinato es un delito.","v":["delito","delitos","contravención","contravenciones"]},{"id":"conducta","t":"Conducta","m":"penal","s":"Primer filtro. Es lo que la persona hizo (acción) o dejó de hacer (omisión) y que se puede describir y demostrar.","a":"art. 22"},{"id":"derecho-penal-acto","t":"Derecho penal de acto","m":"penal","s":"Se castiga por lo que la persona hizo, no por lo que es, por su fama o por su peligrosidad.","a":"art. 22"},{"id":"omision","t":"Omisión","m":"penal","s":"No hacer lo que se debía hacer. Solo cuenta si la persona tenía la obligación jurídica de impedir el resultado; no toda inactividad es omisión.","e":"La madre que no alimenta a su bebé.","v":["omisiones"]},{"id":"ausencia-conducta","t":"Ausencia de conducta","m":"penal","s":"No hay conducta si la persona fue obligada con fuerza física irresistible, si fue un movimiento reflejo o si estaba plenamente inconsciente.","a":"art. 24"},{"id":"tipo-penal","t":"Tipo penal","m":"penal","s":"La descripción que hace la ley de la conducta prohibida.","e":"«El que mate a otra persona…» es la descripción del homicidio."},{"id":"tipicidad","t":"Tipicidad","m":"penal","s":"Segundo filtro. Comprobar que lo que pasó encaja en todas las piezas del tipo penal.","a":"arts. 25 a 28.1"},{"id":"verbo-rector","t":"Verbo rector","m":"penal","s":"El verbo central del tipo, que dice cuál es la conducta prohibida.","e":"Matar, sustraer, falsificar."},{"id":"sujeto-activo","t":"Sujeto activo","m":"penal","s":"La persona que realiza la conducta del delito."},{"id":"sujeto-pasivo","t":"Sujeto pasivo","m":"penal","s":"El titular del bien jurídico que el delito afecta; es quien lo sufre."},{"id":"objeto-material","t":"Objeto material","m":"penal","s":"La persona o cosa sobre la que recae físicamente la acción.","e":"En un robo, el celular robado."},{"id":"elemento-normativo","t":"Elemento normativo y descriptivo","m":"penal","s":"Descriptivo: se identifica con datos que se pueden observar. Normativo: hay que valorarlo jurídica o socialmente.","e":"Descriptivo: «persona». Normativo: «ajeno» o «servidor público».","v":["elemento descriptivo","elementos normativos"]},{"id":"imputacion-objetiva","t":"Imputación objetiva","m":"penal","s":"Pregunta si el resultado se le puede atribuir a la persona porque ella creó un riesgo que la ley desaprueba y ese riesgo es el que terminó en el daño.","e":"El conductor que respeta las normas y atropella a un peatón que se lanza de repente: no creó un riesgo desaprobado."},{"id":"riesgo-desaprobado","t":"Riesgo jurídicamente desaprobado","m":"penal","s":"Un peligro que la ley no tolera, por ejemplo manejar sin respetar las normas de tránsito.","v":["riesgo desaprobado"]},{"id":"dolo","t":"Dolo","m":"penal","s":"La persona sabía lo que hacía y lo quiso.","e":"Quien dispara a otro para matarlo.","a":"art. 26","v":["doloso","dolosa","dolosamente"]},{"id":"culpa","t":"Culpa","m":"penal","s":"La persona no quería el daño, pero actuó sin el cuidado que debía.","e":"El conductor que usa una computadora mientras maneja y atropella a alguien.","a":"art. 27","v":["culposo","culposa"]},{"id":"deber-cuidado","t":"Deber objetivo de cuidado","m":"penal","s":"El cuidado que se espera de cualquier persona en una actividad. Infringirlo es lo que caracteriza a la culpa.","v":["deber de cuidado"]},{"id":"error-tipo","t":"Error de tipo","m":"penal","s":"La persona no sabía que estaba realizando un elemento del delito.","e":"Toma una mochila idéntica a la suya creyendo que es suya.","a":"art. 28.1"},{"id":"antijuridicidad","t":"Antijuridicidad","m":"penal","s":"Tercer filtro. La conducta típica lesiona o amenaza un bien jurídico sin una causa que la justifique.","a":"art. 29","v":["antijurídica","antijurídico"]},{"id":"causa-justificacion","t":"Causa de justificación","m":"penal","s":"Una razón que hace que la conducta típica sea permitida y por tanto no sea antijurídica.","a":"art. 30","v":["causas de justificación"]},{"id":"legitima-defensa","t":"Legítima defensa","m":"penal","s":"Defenderse de una agresión cumple tres requisitos a la vez: agresión actual e ilegítima, necesidad racional de la defensa y que la persona no haya provocado suficientemente.","e":"Pedro lesiona a Juan para repeler una agresión actual e ilegítima.","a":"art. 33"},{"id":"exceso-defensa","t":"Exceso en la defensa","m":"penal","s":"Cuando la reacción va más allá de lo racionalmente necesario para defenderse. Se examina por separado.","v":["exceso"]},{"id":"culpabilidad","t":"Culpabilidad","m":"penal","s":"Cuarto filtro. ¿Se le puede reprochar la conducta a esta persona? Exige imputabilidad y que pudiera saber que lo hecho estaba prohibido.","a":"art. 34","v":["culpable"]},{"id":"imputabilidad","t":"Imputabilidad","m":"penal","s":"La capacidad de entender lo que se hace y de querer hacerlo. Un trastorno mental la excluye.","v":["imputable","trastorno mental"]},{"id":"error-prohibicion","t":"Error de prohibición","m":"penal","s":"La persona sabía lo que hacía pero creía que estaba permitido. Si el error era invencible, no hay responsabilidad.","a":"art. 35.1"},{"id":"causalismo","t":"Causalismo clásico","m":"penal","s":"Escuela que ve la acción como un proceso causal. Pone el dolo y la culpa en la culpabilidad.","v":["causalista","causalistas"]},{"id":"finalismo","t":"Finalismo","m":"penal","s":"Escuela de Welzel: la acción humana siempre persigue un fin. Pone el dolo y la culpa en la tipicidad. Es la corriente que sigue Ecuador.","v":["finalista","finalistas"]},{"id":"acto-proposicion","t":"Acto de proposición","m":"procesal","s":"Los primeros escritos del juicio: la demanda, la contestación, la reconvención y su contestación. Con ellos las partes dicen qué piden y qué responden.","v":["actos de proposición"]},{"id":"demanda","t":"Demanda","m":"procesal","s":"El escrito con el que el actor inicia el juicio y dice qué pide y por qué.","a":"art. 142","n":1},{"id":"actor-demandado","t":"Actor y demandado","m":"procesal","s":"Actor es quien demanda. Demandado es contra quien se demanda.","v":["actor","actora","demandado","demandada"],"n":1},{"id":"pretension","t":"Pretensión","m":"procesal","s":"Lo que se le exige al demandado. Es el núcleo de la demanda.","e":"Que le pague USD 1.000."},{"id":"legitimacion","t":"Legitimación en la causa","m":"procesal","s":"Tener la calidad jurídica para pedir (activa) o para que te pidan (pasiva).","e":"Solo el acreedor puede demandar el pago de la deuda."},{"id":"citacion","t":"Citación","m":"procesal","s":"El acto con el que se le comunica al demandado que le han demandado.","v":["citar","citado"]},{"id":"contestacion","t":"Contestación","m":"procesal","s":"La respuesta del demandado a la demanda.","a":"arts. 151 y 152","v":["contestar"]},{"id":"excepcion","t":"Excepción","m":"procesal","s":"Lo que alega el demandado para oponerse a la pretensión. Puede ser previa (antes de discutir el fondo) o de fondo.","e":"«Ya pagué la deuda».","a":"art. 153","v":["excepciones"]},{"id":"reconvencion","t":"Reconvención","m":"procesal","s":"Cuando el demandado, en el mismo juicio, demanda al actor.","e":"Te cobran una deuda y a la vez reclamas que el actor te debe dinero por otro contrato.","a":"art. 154","v":["reconvenir"]},{"id":"preclusion","t":"Preclusión","m":"procesal","s":"Pierdes la oportunidad de hacer algo porque no lo hiciste a tiempo.","e":"Anunciar prueba después de la demanda o la contestación.","a":"art. 159"},{"id":"parte","t":"Parte","m":"procesal","s":"Quien propone la demanda y aquel contra quien se propone.","a":"art. 30","n":1},{"id":"procurador-comun","t":"Procurador común","m":"procesal","s":"Una sola persona que representa a varios actores o demandados que tienen el mismo derecho.","a":"art. 37"},{"id":"terceria","t":"Tercería","m":"procesal","s":"Un tercero que entra a un juicio ya iniciado.","e":"Alguien alega que el bien embargado en el juicio es suyo.","a":"arts. 46 a 50","v":["tercerías"]},{"id":"principio-dispositivo","t":"Principio dispositivo","m":"procesal","s":"Las partes mandan en el juicio: deciden si inician, qué piden y cuándo terminan, siempre que sean derechos que se puedan disponer.","v":["dispositivo"]},{"id":"objeto-proceso","t":"Objeto del proceso","m":"procesal","s":"Lo que se pide y las razones de hecho y de derecho por las que se pide, fijados en la demanda y la contestación.","v":["objeto del litigio"]},{"id":"congruencia","t":"Congruencia","m":"procesal","s":"El juez debe resolver sobre lo que se pidió, ni más ni menos.","e":"Si pides USD 1.000, no puede condenar a USD 5.000.","a":"art. 92"},{"id":"diligencia-preparatoria","t":"Diligencia preparatoria","m":"procesal","s":"Actuación antes de la demanda para completar datos del demandado o asegurar una prueba que podría perderse.","a":"art. 120","v":["diligencias preparatorias"]},{"id":"providencia-preventiva","t":"Providencia preventiva","m":"procesal","s":"Medida para proteger el cobro de una deuda o la cosa que se discute: secuestro, retención, prohibición de enajenar inmuebles y arraigo. No incluye el embargo.","a":"arts. 124 a 133","v":["providencias preventivas"]},{"id":"secuestro","t":"Secuestro (medida)","m":"procesal","s":"Aquí no es el delito. Es dejar una cosa que se discute en manos de un depositario para que nadie disponga de ella durante el juicio.","a":"arts. 124 a 133"},{"id":"retencion","t":"Retención","m":"procesal","s":"Orden de que el dinero o los bienes del deudor que están en poder de un tercero queden retenidos.","e":"Retener lo que el deudor tiene en una cuenta bancaria."},{"id":"arraigo","t":"Arraigo","m":"procesal","s":"Medida para que la persona no se ausente mientras dura el juicio.","a":"arts. 124 a 133"},{"id":"prohibicion-enajenar","t":"Prohibición de enajenar","m":"procesal","s":"Orden de no vender ni transferir un inmueble mientras dura el juicio.","a":"arts. 124 a 133","v":["enajenar"]},{"id":"caucion","t":"Caución","m":"procesal","s":"Una garantía suficiente que da el deudor para que el juez levante las providencias preventivas.","a":"art. 128"},{"id":"caducidad","t":"Caducidad","m":"procesal","s":"Pérdida de eficacia de la medida si no se presenta la demanda en quince días.","a":"art. 133"},{"id":"apremio","t":"Apremio","m":"procesal","s":"Medida para obligar a cumplir una orden del juez. Personal si recae sobre la persona; real si recae sobre sus bienes.","a":"art. 134","v":["apremios"]},{"id":"conciliacion","t":"Conciliación","m":"procesal","s":"Las partes llegan a un acuerdo y el juez lo aprueba en audiencia, en sentencia.","a":"arts. 233 y 234"},{"id":"transaccion","t":"Transacción","m":"procesal","s":"Acuerdo en el que cada parte cede algo y que termina el proceso cuando el juez lo autoriza.","a":"art. 235"},{"id":"retiro-demanda","t":"Retiro de la demanda","m":"procesal","s":"El actor retira su demanda antes de la citación. Se archiva y puede volver a demandar (máximo dos veces).","a":"art. 236"},{"id":"desistimiento","t":"Desistimiento","m":"procesal","s":"El actor renuncia a su pretensión antes de la sentencia de primera instancia y ya no puede volver a demandar.","a":"art. 237"},{"id":"allanamiento","t":"Allanamiento","m":"procesal","s":"El demandado acepta expresamente la pretensión, en todo o en parte, antes de la sentencia.","a":"art. 241","v":["allanarse"]},{"id":"abandono","t":"Abandono","m":"procesal","s":"El proceso termina porque nadie hizo nada durante seis meses contados desde la última notificación útil.","a":"art. 245"},{"id":"derecho-indisponible","t":"Derecho indisponible","m":"procesal","s":"Derecho al que las partes no pueden renunciar ni sobre el que pueden transigir. Impide el allanamiento y el desistimiento.","a":"arts. 240 y 241","v":["derechos indisponibles"]},{"id":"prueba","t":"Prueba","m":"procesal","s":"Los elementos con los que se le demuestra al juez que lo que afirmas ocurrió.","a":"art. 158","n":1},{"id":"conducencia","t":"Conducencia","m":"procesal","s":"Que la prueba sea capaz, por su contenido, de demostrar el hecho.","a":"art. 161"},{"id":"pertinencia","t":"Pertinencia","m":"procesal","s":"Que la prueba se relacione, directa o indirectamente, con los hechos que se discuten.","a":"art. 161"},{"id":"utilidad","t":"Utilidad (de la prueba)","m":"procesal","s":"Que la prueba sirva para aclarar el hecho.","a":"art. 160"},{"id":"sana-critica","t":"Sana crítica","m":"procesal","s":"El juez valora todas las pruebas juntas, con lógica y experiencia, sin una tabla fija de valores.","a":"art. 164"},{"id":"carga-prueba","t":"Carga de la prueba","m":"procesal","s":"Quien afirma un hecho debe probarlo.","e":"Si dices que pagaste una deuda, te toca mostrar el recibo.","a":"art. 169"},{"id":"prueba-nueva","t":"Prueba nueva","m":"procesal","s":"Prueba que no se anunció a tiempo y se admite solo si se demuestra que no se conocía o no se pudo tener antes.","a":"art. 166"},{"id":"prueba-mejor-resolver","t":"Prueba para mejor resolver","m":"procesal","s":"Prueba que ordena el juez por su cuenta, de forma excepcional y con razones, para aclarar hechos discutidos.","a":"art. 168"},{"id":"de-oficio","t":"De oficio","m":"procesal","s":"Que el juez lo hace por su propia iniciativa, sin que una parte lo pida.","v":["de oficio"]},{"id":"perito","t":"Perito","m":"procesal","s":"Persona acreditada que informa al juez sobre un hecho de su ciencia o arte, como un médico, un ingeniero o un contador.","a":"art. 221","v":["peritos","pericial"]},{"id":"cogep","t":"COGEP","m":"procesal","s":"Código Orgánico General de Procesos: la ley que regula los juicios que no son penales.","v":["COGEP"]},{"id":"medicina-legal","t":"Medicina legal","m":"medicina","s":"La rama de la medicina que sirve de puente con el derecho: responde las preguntas médicas que el juez necesita para decidir. También se llama medicina forense, judicial, pericial, jurídica o del derecho. «Medicina criminal» es incorrecto.","v":["medicina forense"]},{"id":"pericia","t":"Pericia","m":"medicina","s":"El informe de un experto, por ejemplo un médico, que el juez pide para entender un hecho.","v":["pericial","peritaje"]},{"id":"jurisprudencia-medica","t":"Jurisprudencia médica","m":"medicina","s":"Los conocimientos de derecho que el médico debe tener para su trabajo y para actuar como perito."},{"id":"traumatologia","t":"Traumatología médico legal","m":"medicina","s":"Estudia las lesiones y muertes violentas causadas por agentes físicos, como golpes o armas."},{"id":"tanatologia","t":"Tanatología","m":"medicina","s":"Estudia la muerte y el cadáver, desde el lugar del hecho hasta la autopsia.","v":["tanatología forense"]},{"id":"asfixiologia","t":"Asfixiología","m":"medicina","s":"Estudia las formas en que se interrumpe la respiración y pueden causar la muerte."},{"id":"toco-ginecologia","t":"Toco-ginecología forense","m":"medicina","s":"Los aspectos médicos y legales del embarazo, el parto y el puerperio.","v":["puerperio"]},{"id":"sexologia","t":"Sexología forense","m":"medicina","s":"Los aspectos legales de la intimidad, el sexo y la sexualidad."},{"id":"pediatria-legal","t":"Pediatría médico legal","m":"medicina","s":"Estudia la agresión física, psíquica o sexual a niños, incluido el síndrome del niño maltratado."},{"id":"criminalistica","t":"Criminalística","m":"medicina","s":"Procedimientos científicos y técnicos para investigar delitos."},{"id":"toxicologia","t":"Toxicología forense","m":"medicina","s":"Estudia los efectos de sustancias tóxicas relacionadas con delitos o muertes sospechosas."},{"id":"psiquiatria","t":"Psiquiatría forense","m":"medicina","s":"Evalúa el estado mental de una persona para saber si responde penalmente o si tiene capacidad civil."},{"id":"genetica","t":"Genética forense","m":"medicina","s":"Usa el ADN para identificar personas con fines legales."},{"id":"deontologia","t":"Deontología médica","m":"medicina","s":"Los deberes y obligaciones del médico según los códigos de ética."},{"id":"arma-fuego","t":"Arma de fuego","m":"medicina","s":"Arma que usa la energía de la pólvora al quemarse para lanzar un proyectil.","v":["armas de fuego"]},{"id":"balistica","t":"Balística interna, externa y de efectos","m":"medicina","s":"Interna: lo que ocurre dentro del arma. Externa: el recorrido del proyectil desde que sale hasta que impacta. De efectos: lo que el proyectil produce al llegar al cuerpo.","v":["balística interna","balística externa","balística de efectos"]},{"id":"contusion","t":"Contusión","m":"medicina","s":"Lesión producida por un golpe o choque contra una superficie dura.","v":["contusivo","contusiva"]},{"id":"excoriacion","t":"Excoriación","m":"medicina","s":"Raspadura: se destruyen las capas superficiales de la piel sin llegar a la capa basal.","v":["excoriativo"]},{"id":"anillo-fisch","t":"Anillo de Fisch","m":"medicina","s":"Marca en el borde del orificio de entrada del proyectil, formada por un anillo contusivo-excoriativo y otro de enjugamiento. Aparece siempre y prueba que la herida se produjo en vida.","e":"Si hay anillo de Fisch, la persona estaba viva cuando recibió el disparo."},{"id":"tatuaje","t":"Tatuaje verdadero","m":"medicina","s":"Granos de pólvora incrustados en la piel. No se borra al lavar. Indica disparo a corta distancia.","v":["tatuaje"]},{"id":"negro-humo","t":"Negro de humo (falso tatuaje)","m":"medicina","s":"Hollín del disparo depositado en la piel. Se borra al lavar. Indica disparo a corta distancia.","v":["falso tatuaje"]},{"id":"signo-rojas","t":"Signo de Rojas","m":"medicina","s":"Deshilachamiento en forma de cruz en la ropa en el sitio del disparo.","v":["Rojas"]},{"id":"escarapela-simonin","t":"Escarapela de Simonin","m":"medicina","s":"Marca en la ropa causada por un disparo a corta distancia.","v":["Simonin"]},{"id":"calcado-bonnet","t":"Calcado de Bonnet","m":"medicina","s":"Calcado de la trama del tejido de la ropa en el sitio del disparo. Es otro signo de disparo a corta distancia.","v":["Bonnet"]},{"id":"fenomenos-cadavericos","t":"Fenómenos cadavéricos","m":"medicina","s":"Los cambios que sufre el cuerpo después de la muerte. Sirven para calcular cuánto tiempo hace que murió.","v":["fenómenos cadavéricos","data de la muerte"]},{"id":"deshidratacion","t":"Deshidratación cadavérica","m":"medicina","s":"Pérdida de líquidos del cuerpo. Interesa sobre todo la desecación de las mucosas.","v":["deshidratación"]},{"id":"enfriamiento","t":"Enfriamiento cadavérico","m":"medicina","s":"La temperatura del cuerpo baja de afuera hacia adentro hasta igualar la del ambiente, en unas 24 horas.","v":["enfriamiento"]},{"id":"livideces","t":"Livideces","m":"medicina","s":"Manchas rojo-violáceas por la sangre que se acumula en las zonas más bajas del cuerpo. No aparecen donde hay presión. Se ven desde las 3 horas.","v":["lividez"]},{"id":"rigidez","t":"Rigidez cadavérica","m":"medicina","s":"Endurecimiento de los músculos que empieza por la mandíbula y el cuello. Aparece entre las 3 y 6 horas.","v":["rigidez"]},{"id":"espasmo","t":"Espasmo cadavérico","m":"medicina","s":"Rigidez instantánea que fija la postura que la persona tenía en el momento de una muerte brusca. No se puede simular. No es lo mismo que la rigidez cadavérica.","e":"Una persona que cae muerta con un objeto agarrado y lo sigue agarrando con fuerza.","v":["espasmo cadavérico"]},{"id":"putrefaccion","t":"Putrefacción","m":"medicina","s":"Destrucción de los tejidos por los gérmenes del intestino.","v":["putrefacto"]},{"id":"mancha-verde","t":"Mancha verde abdominal","m":"medicina","s":"Primer signo de putrefacción, en la parte baja derecha del abdomen (fosa ilíaca derecha).","v":["mancha verde"]},{"id":"colicuativa","t":"Etapa colicuativa","m":"medicina","s":"Fase de la putrefacción en que los órganos pierden su forma y su consistencia, y la piel se desprende.","v":["colicuativa"]},{"id":"autopsia","t":"Autopsia","m":"medicina","s":"Examen del cuerpo después de la muerte para establecer la causa y las circunstancias.","v":["autopsias"]},{"id":"declive","t":"Zonas declives","m":"medicina","s":"Las partes más bajas del cuerpo según su posición, hacia donde baja la sangre por gravedad.","v":["declives"]},{"id":"reconviniente","t":"Reconviniente","m":"procesal","s":"El demandado que presenta la reconvención: deja de solo defenderse y también ataca.","e":"Te cobran una deuda y tú reclamas que el actor te debe otra cosa: eres el reconviniente.","a":"art. 154"},{"id":"reconvenido","t":"Reconvenido","m":"procesal","s":"El actor al que el demandado le presenta la reconvención. Debe contestarla, igual que el demandado contesta la demanda.","a":"art. 155"},{"id":"reconvencion-conexa","t":"Reconvención conexa","m":"procesal","s":"La contrademanda que tiene relación con lo que se discute en el juicio. En laborales y en el sumario solo se admite esta.","e":"Demanda por despido y el patrono reclama anticipos de sueldo: conexa. Que el trabajador le deba plata a su hermano: no.","a":"arts. 150 y 333"},{"id":"prueba-cargo-descargo","t":"Prueba de cargo y de descargo","m":"procesal","s":"De cargo: la que anuncia quien ataca (actor o reconviniente). De descargo: la de quien se defiende (demandado o reconvenido).","v":["prueba de cargo","prueba de descargo","pruebas de cargo","pruebas de descargo"]},{"id":"autocomposicion","t":"Autocomposición","m":"procesal","s":"Cuando las partes mismas resuelven el conflicto con un acuerdo, sin que el juez lo imponga: conciliación y transacción.","v":["autocomposición"]}],"explicaciones":{"civil:clasificacion_de_los_bienes":{"corto":"El Código Civil ordena todo lo que se puede tener en grupos: lo que se toca y lo que no, lo que se mueve y lo que no. Según el grupo cambian las reglas para comprarlo, regalarlo o darlo en garantía.","texto":["Piensa en una casa llena de cosas. El terreno y las paredes no se pueden llevar a otro lugar: son inmuebles. La laptop, la cama y el perro sí se pueden llevar: son muebles. Hasta ahí es fácil.","Lo difícil son los casos intermedios, y ahí se concentra el examen. La ley a veces trata como inmueble algo que físicamente se puede mover (el tractor de una finca, el espejo embutido en la pared) y como mueble algo que físicamente está pegado a la tierra (las naranjas aún en el árbol, cuando se venden antes de cosecharlas). Se mira para qué sirve la cosa y qué decidió su dueño, no solo si pesa o se mueve.","¿Por qué importa? Porque un mueble se transfiere entregándolo y un inmueble exige escritura pública e inscripción. Porque el mueble se da en prenda y el inmueble en hipoteca. Y porque la prescripción tarda menos en los muebles. Clasificar mal una cosa puede dejar sin valor un contrato."],"ejemplo":"Compras una finca «con todo». Entran el terreno y la casa (inmuebles), el tractor y las vacas que el dueño usaba para trabajarla (muebles que la ley trata como inmuebles por destino) y un espejo embutido en la pared. No entran el cuadro colgado de un clavo ni un tractor que alguien alquiló por una semana.","ojo":"El destino exige tres cosas a la vez: servir a la finca, de forma permanente y puesto por el dueño. Si falta una, sigue siendo mueble. Y sacar algo un rato para repararlo (separación momentánea) no le quita la calidad de inmueble.","terminos":["mueble","inmueble","inmueble-adherencia","inmueble-destino","mueble-anticipacion","separacion-momentanea","fungible","hipoteca","prenda","escritura-publica","registro-propiedad","prescripcion"]},"civil:cosas_incorporales_derechos_reales_y_personales":{"corto":"Además de las cosas que se tocan, la ley protege derechos. Hay dos clases: los que tienes sobre una cosa y los que tienes frente a una persona.","texto":["Un derecho real es un poder directo sobre una cosa. Si eres dueño de una casa, nadie puede entrar sin tu permiso y puedes reclamarle a cualquiera que lo haga. No depende de una persona concreta.","Un derecho personal, o crédito, es la facultad de exigir algo a una persona que se obligó contigo. Si le prestaste dinero a Juan, solo se lo puedes cobrar a Juan. No puedes ir contra su vecino.","De cada derecho nace su demanda: la acción real o la acción personal. Y los derechos también se cuentan como muebles o inmuebles según la cosa sobre la que se ejercen: el usufructo de una casa es inmueble y el crédito en dinero es mueble."],"ejemplo":"Caso de la casa de María. Rosa tiene el usufructo de la casa: es un derecho real, y lo puede defender frente a cualquiera. María le prestó USD 500 a Juan: es un derecho personal, y solo se los puede reclamar a Juan.","ojo":"Que Rosa no sea dueña no cambia que su derecho sea real. La dueña es María, que en este caso es la nuda propietaria.","terminos":["derecho-real","derecho-personal","accion-real","accion-personal","erga-omnes","usufructo","nuda-propiedad","acreedor-deudor","servidumbre","hipoteca"]},"civil:posesion_y_acciones_posesorias":{"corto":"La posesión es comportarse como dueño de una cosa. La ley la protege aunque todavía no se pruebe que eres el dueño, para que nadie se haga justicia por su mano.","texto":["Poseer no es lo mismo que ser dueño. Poseer es tener la cosa con ánimo de señor y dueño: la cuidas, la cercas, la usas como tuya. Puede que además seas el dueño, o que no.","Si alguien te perturba, puedes pedir amparo posesorio para que te sigan respetando. Si te quitaron la posesión, pides restitución. Si te despojaron con violencia, el restablecimiento es una vía rápida con plazo de seis meses.","En estos juicios no se discute quién es el dueño, solo quién posee. Por eso se llaman juicios posesorios."],"ejemplo":"Tu vecino retira el cerramiento de tu terreno para pasar su camioneta: es una turbación, y lo que pides es amparo posesorio. Si en cambio te saca con violencia y se queda con el lote, pides restablecimiento dentro de seis meses.","ojo":"Tres demandas para tres situaciones: perturbar (amparo), quitar injustamente (restitución) y despojar con violencia (restablecimiento). La demanda de amparo se evalúa en la tutoría presencial.","terminos":["posesion","amparo-posesorio","turbacion","restitucion","restablecimiento","juicio-posesorio","dominio"]},"civil:bienes_publicos_y_derecho_de_propiedad":{"corto":"No todo tiene un dueño particular: hay bienes que son de toda la Nación y otros que todos pueden usar. Y el derecho de propiedad tiene límites.","texto":["Los bienes nacionales son los que pertenecen a toda la Nación (art. 604). Dentro de ellos, los de uso público los puede usar cualquier persona, como los ríos y los lagos naturales (art. 612).","Los bienes del Estado son las tierras sin otro dueño dentro del territorio (art. 605).","El derecho de propiedad, o dominio, permite gozar y disponer de una cosa, pero respetando la ley y los derechos de los demás (art. 599)."],"ejemplo":"Un camino que un particular construyó en su propio terreno no es bien nacional solo porque deje pasar a otros (art. 608). El río que cruza el pueblo sí es de uso público.","ojo":"El material de este tema está incompleto: falta la lectura de Morand-Deviller. La docente dijo que lo más amplio de bienes se ve en la unidad 2, sin tomar examen.","terminos":["bienes-nacionales","bienes-uso-publico","bienes-estado","dominio","nuda-propiedad"]},"penal:la_ley_penal_en_el_estado_constitucional":{"corto":"El Estado puede castigar, pero con reglas: solo por lo que la ley dijo antes que estaba prohibido, solo cuando es necesario y sin pasar por encima de la dignidad de la persona.","texto":["Imagina que el Estado tiene un arma muy poderosa: la cárcel. El derecho penal es el conjunto de reglas que dicen cuándo y cómo se puede usar. Un Estado constitucional es el que se pone límites a sí mismo.","Legalidad: nadie puede ser sancionado por algo que, cuando lo hizo, no estaba tipificado como infracción. Eso exige una ley escrita, anterior al hecho, sin analogía en perjuicio de la persona y con una descripción clara.","Mínima intervención: el derecho penal es el último recurso. Si un problema se arregla con la ley civil o la laboral, no se acude a la penal. Proporcionalidad: la pena debe corresponder a la gravedad de la infracción."],"ejemplo":"Si una conducta se prohíbe recién mañana, hoy no se te puede castigar por haberla hecho ayer. Un conflicto por una deuda se resuelve en lo civil, no con cárcel.","ojo":"El docente avisó que en el examen puede haber respuestas verdaderas que no contestan la pregunta. «Todos son inocentes hasta la sentencia ejecutoriada» es cierto, pero no es legalidad.","terminos":["ley-penal","estado-constitucional","principio-legalidad","lex","analogia","minima-intervencion","proporcionalidad","dignidad-humana","sentencia-ejecutoriada","poder-punitivo"]},"penal:elementos_de_la_tipicidad":{"corto":"Tipicidad es comprobar que lo que pasó encaja exactamente en lo que la ley describe como delito. Se revisa pieza por pieza.","texto":["El tipo penal es la descripción de la conducta prohibida. Tiene un verbo (matar, robar), una persona que lo hace (sujeto activo), una persona que lo sufre (sujeto pasivo, titular del bien que se protege) y un bien jurídico (la vida, el patrimonio).","Tiene una parte objetiva (lo que se ve: la conducta, el resultado, el riesgo creado) y una subjetiva (lo que pasaba por la mente: dolo o culpa).","La imputación objetiva pregunta si el resultado se le puede atribuir a la persona porque ella creó un riesgo que la ley desaprueba y ese riesgo es el que terminó en el daño. Si manejaba respetando las normas y alguien se lanzó a la calzada de forma imprevisible, no creó un riesgo desaprobado.","Dolo: sabía lo que hacía y lo quiso. Culpa: no quiso el daño, pero descuidó el deber de cuidado. Error de tipo: no sabía que realizaba un elemento del delito."],"ejemplo":"Un conductor usa una computadora mientras maneja y atropella a alguien: no quería atropellar, pero infringió el deber de cuidado. Eso es culpa. Quien toma una mochila idéntica a la suya creyendo que es suya actúa con error de tipo: no sabía que era ajena.","ojo":"En un caso, haz las tres preguntas en orden: ¿hay riesgo desaprobado?, ¿hay dolo o culpa?, ¿hay error de tipo? En tránsito normalmente se analiza la culpa.","terminos":["tipo-penal","tipicidad","verbo-rector","sujeto-activo","sujeto-pasivo","bien-juridico","objeto-material","elemento-normativo","imputacion-objetiva","riesgo-desaprobado","dolo","culpa","deber-cuidado","error-tipo"]},"penal:teoria_del_delito_y_corrientes":{"corto":"Es el método para decidir si una persona responde penalmente: se pasa por cuatro filtros, en orden. Si falla uno, no se sigue.","texto":["Los cuatro filtros son conducta, tipicidad, antijuridicidad y culpabilidad. Una conducta que supera los cuatro es una infracción (art. 18).","Conducta: ¿hubo una acción u omisión de la persona? No la hay si la empujaron con fuerza irresistible, si fue un reflejo o si estaba inconsciente. Tipicidad: ¿encaja en el tipo penal? Antijuridicidad: ¿estaba justificada? La legítima defensa la excluye. Culpabilidad: ¿se le puede reprochar? Un trastorno mental o un error sobre la ilicitud la excluyen.","Causalismo y finalismo son dos escuelas que discrepan en un punto: dónde poner el dolo y la culpa. El causalismo los pone en la culpabilidad. El finalismo, que es el que sigue Ecuador, los pone en la tipicidad."],"ejemplo":"Pedro lesiona a Juan para repeler una agresión actual e ilegítima, con necesidad racional de defenderse y sin haberlo provocado. Hay conducta y tipicidad, pero la antijuridicidad queda excluida por legítima defensa: no hay infracción.","ojo":"Según el docente es lo más importante de la unidad. Practica aplicarlo a casos: di qué filtro falla y por qué. Y recuerda: Ecuador es finalista.","terminos":["teoria-delito","infraccion","delito-contravencion","conducta","derecho-penal-acto","omision","ausencia-conducta","antijuridicidad","causa-justificacion","legitima-defensa","exceso-defensa","culpabilidad","imputabilidad","error-prohibicion","causalismo","finalismo"]},"procesal:actos_de_proposicion_demanda_contestacion_y_reconvencion":{"corto":"Son los primeros escritos del juicio: con ellos cada parte dice qué pide, qué responde y cómo se defiende. Todo lo que pase después se mide contra estos escritos.","texto":["El actor presenta la demanda, que según el art. 142 debe cumplir 13 requisitos, con los documentos del art. 143. El juez la califica en cinco días (art. 146). Puede reformarse en los casos que el COGEP permite (art. 148).","El demandado responde con la contestación (arts. 151 y 152) y puede defenderse con excepciones. Si además quiere reclamarle algo al actor, lo hace en el mismo juicio con la reconvención (art. 154). Si no contesta, la ley prevé consecuencias (art. 157).","Preclusión significa que la oportunidad pasa y se pierde. Por eso lo que quieras probar hay que anunciarlo a tiempo, en la demanda o en la contestación."],"ejemplo":"Te cobran una deuda. Contestas que ya la pagaste (excepción) y a la vez reclamas que el actor te debe dinero por otro contrato (reconvención).","ojo":"Aprende los artículos de esta cadena: 142, 143, 146, 148, 151, 152, 154 y 157. En el procedimiento sumario no se puede reformar la demanda (art. 333.1).","terminos":["acto-proposicion","demanda","actor-demandado","pretension","legitimacion","citacion","contestacion","excepcion","reconvencion","preclusion"]},"procesal:la_prueba_y_los_medios_de_prueba":{"corto":"Probar es convencer al juez de que lo que afirmas ocurrió. Hay reglas de tiempo, de forma y sobre quién debe probar qué.","texto":["La prueba sirve para demostrar los hechos que las partes discuten (art. 158). Hay que anunciarla a tiempo (art. 159) y debe ser pertinente, útil y conducente (arts. 160 y 161): que se relacione con los hechos, que sirva y que sea capaz de demostrarlos.","Hay hechos que no necesitan prueba (art. 163). Quien afirma un hecho tiene la carga de probarlo (art. 169). El juez valora las pruebas juntas con sana crítica (art. 164).","Dos casos especiales: la prueba nueva, que se admite si no se conocía o no se pudo tener antes (art. 166), y la prueba para mejor resolver, que el juez ordena por su cuenta cuando necesita aclarar algo (art. 168)."],"ejemplo":"Afirmas que pagaste una deuda: te toca probarlo, por ejemplo con el recibo, y debes anunciarlo en la contestación. Si el recibo aparece después y no lo pudiste tener antes, pides que se admita como prueba nueva.","ojo":"Las diapositivas decían cosas que el COGEP no dice (juramento, hechos sobrevenidos, prohibición de suplencia). Responde con el texto de la norma.","terminos":["prueba","pertinencia","conducencia","utilidad","sana-critica","carga-prueba","prueba-nueva","prueba-mejor-resolver","de-oficio","perito","preclusion"]},"procesal:formas_extraordinarias_de_conclusion_del_proceso":{"corto":"Un juicio no siempre termina con sentencia. A veces termina antes porque las partes se ponen de acuerdo, una se retira o nadie hace nada.","texto":["Las formas se distinguen por quién actúa. El actor puede retirar la demanda (antes de la citación) o desistir (antes de la sentencia de primera instancia). El demandado puede allanarse, es decir, aceptar la pretensión. Ambas partes pueden conciliar o transigir. Y si nadie hace nada durante seis meses, hay abandono.","Dos diferencias que se confunden: con el retiro puedes volver a demandar (máximo dos veces); con el desistimiento, no. Y ni el allanamiento ni el desistimiento valen cuando el derecho es indisponible."],"ejemplo":"Demandaste y aún no citaron al demandado: puedes retirar la demanda y presentarla de nuevo. Si ya estaban en juicio y renuncias a tu pretensión, ya no podrás demandar lo mismo.","ojo":"El cuadro de la hoja de repaso resume quién actúa, hasta cuándo y con qué efecto. Es lo que más conviene memorizar.","terminos":["retiro-demanda","desistimiento","allanamiento","conciliacion","transaccion","abandono","derecho-indisponible","citacion"]},"procesal:diligencias_preparatorias_providencias_preventivas_y_apremios":{"corto":"Son medidas para que el juicio sirva de algo: antes de demandar, para preparar o anticipar prueba; durante el juicio, para que el deudor no esconda sus bienes; y al final, para obligar a cumplir lo ordenado.","texto":["Diligencias preparatorias (art. 120): se piden antes de la demanda, para completar datos del demandado o para asegurar una prueba que podría perderse.","Providencias preventivas (arts. 124 a 133): protegen el cobro o la cosa que se discute. Son el secuestro, la retención, la prohibición de enajenar inmuebles y el arraigo. El deudor puede detenerlas dando una caución (art. 128). Si no se presenta la demanda en quince días, caducan (art. 133).","Apremios (art. 134): son los medios para obligar a cumplir una orden del juez, sobre la persona (apremio personal) o sobre sus bienes (apremio real)."],"ejemplo":"Temes que quien te debe dinero venda su única propiedad antes del juicio. Pides prohibición de enajenar. Tienes quince días para demandar o la medida caduca.","ojo":"Las providencias preventivas no incluyen el embargo, aunque una diapositiva lo decía. Recuerda: audiencia en 48 horas, caducidad en 15 días y el apremio cesa a los 30 días.","terminos":["diligencia-preparatoria","providencia-preventiva","secuestro","retencion","arraigo","prohibicion-enajenar","caucion","caducidad","apremio"]},"procesal:sujetos_procesales_y_principio_dispositivo":{"corto":"Quién participa en un juicio, quién representa a quién y quién manda sobre el proceso: las partes son dueñas del juicio y el juez solo resuelve lo que le piden.","texto":["Las partes son quien demanda y contra quien se demanda (art. 30). Si varios tienen el mismo derecho, pueden nombrar un procurador común (art. 37). Un tercero puede entrar a un proceso ya iniciado: es la tercería (arts. 46 a 50), por ejemplo cuando alega que el bien embargado es suyo.","El principio dispositivo dice que las partes deciden si inician el juicio, qué piden y cuándo termina, siempre que se trate de derechos disponibles.","La congruencia obliga al juez a resolver sobre lo que se pidió, ni más ni menos (art. 92)."],"ejemplo":"Si pides USD 1.000, el juez no puede condenar a pagar USD 5.000, aunque crea que se debe más.","ojo":"La congruencia está en el art. 92, no en el 252 como decían las diapositivas.","terminos":["parte","actor-demandado","procurador-comun","terceria","principio-dispositivo","objeto-proceso","congruencia","derecho-indisponible"]},"medicina:la_medicina_forense_y_su_aplicacion":{"corto":"La medicina legal es el puente entre la medicina y el derecho: el médico responde preguntas que el juez no puede responder solo.","texto":["Cuando un juez necesita saber de qué murió una persona, cuánto tardará en sanar una lesión o si alguien tiene una enfermedad mental, consulta a un perito médico. Esa colaboración es la medicina legal.","Tiene varios nombres: forense, legal, judicial, pericial, jurídica. «Medicina criminal» es incorrecto porque la limita al derecho penal, cuando también sirve a otras ramas.","Se divide en 12 ramas, desde la tanatología (la muerte y el cadáver) hasta la toxicología (las sustancias tóxicas), la genética forense (el ADN) o la deontología (los deberes éticos del médico)."],"ejemplo":"En una muerte sospechosa, la autopsia estudia el cuerpo (tanatología), el análisis toxicológico busca sustancias y la criminalística recoge los indicios del lugar.","ojo":"Aprende las 12 divisiones. El mapa de esta materia las agrupa en tres ramas para recordarlas más fácil.","terminos":["medicina-legal","pericia","jurisprudencia-medica","traumatologia","tanatologia","asfixiologia","toco-ginecologia","sexologia","pediatria-legal","criminalistica","toxicologia","psiquiatria","genetica","deontologia"]},"medicina:lesionologia_lesiones_por_arma_de_fuego":{"corto":"Un disparo deja señales en la piel y en la ropa que permiten saber a qué distancia se disparó y si la persona estaba viva.","texto":["La pólvora no se quema del todo. Si el disparo es cercano, granos de pólvora quedan incrustados en la piel (tatuaje verdadero) o queda hollín que se borra al lavar (negro de humo). En la ropa también quedan marcas: Rojas, Simonin y Bonnet.","El anillo de Fisch es la marca en el borde del orificio de entrada. Aparece siempre y demuestra que la herida se produjo en vida.","Entonce
