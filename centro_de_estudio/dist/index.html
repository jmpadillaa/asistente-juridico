rsonal; lesiones del art. 152 (numeral 3 por la incapacidad de 35 días, según el docente; verificar el texto); imputación objetiva: el golpe creó un riesgo que se concretó en la caída y el traumatismo; dolo: no querer la incapacidad de 35 días no descarta el dolo. **Antijuridicidad**: legítima defensa del art. 33 frente a la botella (agresión actual, necesidad racional) justifica el lanzamiento de la silla; el puñetazo posterior, cuando Pedro ya había soltado la botella y retrocedido, plantea que la agresión había cesado: exceso del art. 31 (pena reducida en un tercio de la mínima). **Culpabilidad**: Juan es imputable; su creencia de que el peligro continuaba plantea un error sobre los presupuestos de una causa de justificación. Concluir distinguiendo hechos y valoraciones.\n","repaso":"# Hoja de repaso rápido: Derecho Penal, unidad 1\n\n**Agente:** Constructor de Material · Fuentes: `conocimiento/derecho_penal/` y la clase 5. Evaluación: sábado 7 de noviembre, 8h00 a 10h00. La retroalimentación del 4 de noviembre ya se dio: ver `salida/resumenes/derecho_penal/clase_06_retroalimentacion_previa_a_la_evaluacion.md`.\n\n## Cómo será la evaluación (dicho del docente, 28 oct)\n\nSolo lo visto en las tutorías de la unidad; las respuestas están en las diapositivas; piden **aplicar** (casos), no definir.\n\n## Temas prioritarios\n\n1. ★★★★★ **Teoría del delito: los cuatro filtros** (conducta, tipicidad, antijuridicidad, culpabilidad) y su aplicación a un caso. El docente dijo que lo más importante de la unidad es esto.\n2. ★★★★★ **Causalismo y finalismo:** \"es finalista\".\n3. ★★★★★ **Antijuridicidad y legítima defensa** (arts. 29, 30, 31, 33): agresión actual e ilegítima, necesidad racional, falta de provocación; exceso.\n4. ★★★★ **Tipicidad:** tipo objetivo y subjetivo, imputación objetiva, dolo y culpa, error de tipo.\n5. ★★★★ **Ley penal y Estado constitucional:** legalidad, mínima intervención, proporcionalidad, interpretación.\n\n## Esquema para resolver un caso\n\n1. **Conducta** (arts. 22 a 24): ¿acción u omisión voluntaria? ¿Hay fuerza irresistible, reflejo o inconsciencia?\n2. **Tipicidad** (arts. 25 a 28.1): sujetos, bien jurídico, verbo, resultado; riesgo desaprobado; dolo o culpa; error de tipo.\n3. **Antijuridicidad** (arts. 29 a 33): ¿hay causa de justificación? ¿Se cumplen todos sus requisitos? ¿Hubo exceso?\n4. **Culpabilidad** (arts. 34 y 35.1): imputabilidad, conocimiento de la ilicitud, error de prohibición.\nSi falla un filtro, no sigas. Separa siempre hechos y valoraciones.\n\n## Cuadro: error de tipo frente a error de prohibición\n\n| | Error de tipo | Error de prohibición |\n|---|---|---|\n| Recae sobre | Un elemento objetivo del tipo | La ilicitud de la conducta |\n| Filtro | Tipicidad (art. 28.1) | Culpabilidad (art. 35.1) |\n| Invencible | Excluye la infracción | Sin responsabilidad |\n| Vencible | Culpa, si hay tipo culposo | Pena mínima reducida en un tercio |\n\n## Práctica\n\n`salida/examenes/derecho_penal_simulacro_unidad_01.md` (incluye el caso integrador con la guía del docente) y `salida/flashcards/derecho_penal_unidad_01.csv`.\n","guia":"# Análisis de guía y sílabo: Derecho Penal\n\n**Agente:** Analista de Guías · **Fuentes:** `entrada/guias/DerechoPenal/Guia_Derecho_Penal.pdf` y `Silabo_Derecho_Penal.pdf`\n\n## Datos de la materia\n\n| Dato | Valor |\n|---|---|\n| Carrera / modalidad | Derecho, Unidad de Educación a Distancia (Universidad Nacional de Loja), IV ciclo, paralelo D |\n| Periodo | Septiembre 2026 – febrero 2027 |\n| Autora del sílabo | Mgtr. María Isabel Espinosa Ortega (maria.i.espinosa@unl.edu.ec) |\n| Docente de las tutorías | Mgtr. Wilson Rafael Rodas Mogrovejo (según las diapositivas y la clase). No consta su correo. Dijo que **no elaboró la guía** |\n| Horas | 200 (ACD 40, APE 40, AA 120) |\n| Prerrequisito / correquisito | Ciencias Penales y Criminología / Medicina Legal |\n| Tutorías | 2 horas por semana, miércoles de 19:00 a 21:00 (paralelo D), no obligatorias |\n\n## Unidades y temas (estructura oficial del sílabo)\n\n| Unidad | Nombre | Semanas | Resultado de aprendizaje |\n|---|---|---|---|\n| 1 | Fundamentos del delito | 1–6 (28 sep – 8 nov 2026) | Argumenta los fundamentos teóricos de la teoría del delito y los elementos de la tipicidad, según las corrientes causalistas y finalistas |\n| 2 | Responsabilidad de la infracción | 7–12 (9 nov – 16 dic 2026) | Analiza los niveles de responsabilidad penal |\n| 3 | Causas de exclusión y justificación; autoría y pena | 13–19 (4 ene – 21 feb 2027) | Identifica las causas de exclusión y justificación, la autoría y la pena |\n\n**Temas de la unidad 1:** (1) la ley penal en el Estado constitucional de derechos y justicia: legalidad (lex praevia, scripta, stricta, certa), mínima intervención, dignidad humana, lesividad, proporcionalidad, culpabilidad, non bis in idem, interpretación y ámbitos de validez (arts. 1 a 17 COIP); (2) la teoría del delito: concepto, función, estructura escalonada (arts. 18 y 22 a 28 COIP); (3) corrientes causalistas y finalistas y sistemática del COIP; (4) niveles de imputación objetivo y subjetivo (tipo objetivo, imputación objetiva, dolo, culpa y error de tipo); (5) control constitucional y convencional (arts. 424 y 425 de la Constitución).\n\n**Temas de la unidad 2:** la infracción penal y la estructura escalonada (arts. 18 y 19); la antijuridicidad (art. 29); la culpabilidad: imputabilidad, conocimiento de la antijuridicidad y exigibilidad de otra conducta (arts. 34 a 38); la participación: autoría directa, mediata, coautoría y complicidad (arts. 41 a 43).\n\n**Temas de la unidad 3:** teoría general de las causas de exclusión de la antijuridicidad (art. 30); estado de necesidad, legítima defensa y exceso (arts. 30 y 31); cumplimiento del deber legal y orden legítima de autoridad (art. 30.1); causas de inculpabilidad: error de prohibición, trastorno mental, embriaguez, inimputabilidad por edad (arts. 34 a 38); la pena: concepto, fines, legalidad, individualización y clases (arts. 51 a 60), atenuantes y agravantes (arts. 44 a 48) y reparación integral (arts. 77 y 78).\n\n## Actividades y puntos (10 puntos por unidad)\n\n| Componente | Actividad | Puntos |\n|---|---|---|\n| ACD (20 %) | Actividad 1: foro académico (intervención 350–450 palabras con 3 fuentes, réplica 150–200 y corrección final 120–180) | 1,00 |\n| ACD | Actividad 2: video-foro de roles, o alternativa asincrónica (síntesis de 500–700 palabras y audio/video de hasta 5 min) | 1,00 |\n| APE (25 %) | U1: ensayo académico sobre la función de la teoría del delito (1.200–1.500 palabras, PDF, mínimo 5 referencias APA 7). U2 y U3: estudio de caso con informe jurídico | 2,50 |\n| AA (20 %) | U1: infografía o mapa conceptual de los elementos de la tipicidad, con nota de 800–1.000 palabras y 6 fuentes. U2 y U3: infografía u organizador gráfico, con nota de 600–800 palabras y 5 fuentes | 2,00 |\n| Evaluación sumativa (35 %) | Evaluación de unidad en el EVA, calificación automática | 3,50 |\n\nInstrumentos: rúbricas sobre 10 puntos convertidas a la ponderación. Según la guía, el cuestionario de la unidad 1 se contesta en 15 minutos.\n\n## Fechas importantes\n\n| Hito | Fecha |\n|---|---|\n| Taller de inducción | 28, 29 y 30 de septiembre 2026 |\n| U1 foro (ACD 1) / video-foro (ACD 2) | 28 sep – 25 oct / 26 oct – 1 nov 2026 (video-foro con conexión obligatoria en la guía) |\n| U1 autónoma / práctico-experimental | 28 sep – 1 nov 2026 (la guía parte la autónoma en 28 sep – 18 oct y 19 oct – 1 nov) |\n| Evaluación de la unidad 1 | 7 y 8 nov 2026 |\n| U2 foro / video-foro | 9 nov – 6 dic / 7–13 dic 2026 |\n| U2 autónoma y práctico-experimental | 9 nov – 13 dic 2026 |\n| Evaluación de la unidad 2 | 15 y 16 dic 2026 (el calendario general dice 14–16 dic) |\n| U3 foro / video-foro | 4–31 ene / 1–7 feb 2027 |\n| U3 autónoma y práctico-experimental | 4 ene – 7 feb 2027 |\n| Semana del estudiante | 10, 11 y 12 feb 2027 |\n| Evaluación de la unidad 3 | 20 y 21 feb 2027 |\n| Evaluación de recuperación | 8–12 mar 2027 |\n\n## Bibliografía\n\n- **Básica (virtual):** Mir Puig, Santiago, *Introducción a las bases del Derecho Penal* (B de F, 2003); Zaffaroni, Eugenio Raúl, *Manual de Derecho Penal. Parte General* (Ediar, 2006); COIP (Asamblea Nacional, vigente); Constitución de la República del Ecuador (vigente).\n- **Complementaria:** Albán Gómez, Ernesto, *Manual de Derecho Penal Ecuatoriano. Tomo 1. Parte general* (Ediciones Legales, 2011); Roxin, Claus, *Derecho Penal. Parte General. Tomo I* (Civitas, 1997); Rodríguez Moreno, Felipe (obra y año no claros en el sílabo, pendiente de confirmar).\n- **Recursos:** Biblioteca Virtual UNL y base JURLEX (LEXIS) para legislación vigente; Principios Básicos sobre el Empleo de la Fuerza y de Armas de Fuego (ONU, 1990).\n\n## Normas de entrega\n\nPDF, APA 7, EVA. Cada actividad se evalúa con rúbrica. Se pide registrar la fecha de consulta de JURLEX y verificar reformas vigentes.\n\n## Alertas\n\n1. **La guía es un borrador con restos de otra materia.** En las unidades 2 y 3 los resúmenes de actividades dicen \"Foro: selección procedimental y valor por dinero\", \"Podcast jurídico y flujograma del ciclo contractual\", \"Caso integral y revisión contractual\", \"Análisis de expediente y escritos jurídicos\" y \"video-foro de estrategia\". Eso no coincide con el sílabo (foro sobre participación en la infracción, estudio de caso con informe jurídico, etc.). Las actividades reales deben confirmarse con el docente. El archivo se llama \"para revisión corregida\".\n2. **Página de Zaffaroni.** La actividad práctica de la unidad 1 pide el capítulo 10, págs. 287–309, pero el texto cargado en el EVA traía solo el capítulo 20. El docente aclaró en la clase 4 que lo correcto es el cap. 10, págs. 372–392 (estructura de la teoría del delito) y subió el texto al EVA.\n3. **Sílabo vs. guía en autoría:** el docente dijo que la guía no la hizo él. Seguir al sílabo cuando difieran.\n4. **Fechas de la unidad 2:** el calendario general dice 14–16 dic para la evaluación; el sílabo y las actividades dicen 15 y 16 dic (presencial).\n5. **Docente.** La autora del sílabo (Espinosa) no es la docente de las tutorías (Rodas).\n6. **Evaluación y diapositivas.** El docente dijo que las preguntas de evaluación salen mayormente de las diapositivas de cada semana.\n7. **Próximos vencimientos (hoy es 28 oct 2026):** el video-foro de la unidad 1 y la autónoma 2 vencen el 1 de noviembre. La evaluación de la unidad 1 es el 7 y 8 de noviembre.\n","mapas":[{"id":"filtros","titulo":"Los cuatro filtros del delito","nota":"Art. 18 COIP: infracción es la conducta típica, antijurídica y culpable. Si un filtro falla, no se sigue con el siguiente.","tipo":"flujo","datos":{"pasos":[{"t":"Conducta","n":"arts. 22 a 24. Acción u omisión. Falla si hay fuerza irresistible, reflejo o inconsciencia."},{"t":"Tipicidad","n":"arts. 25 a 28.1. Tipo objetivo y subjetivo, dolo o culpa."},{"t":"Antijuridicidad","n":"arts. 29 a 33. Falla si hay causa de justificación (legítima defensa)."},{"t":"Culpabilidad","n":"arts. 34 y 35.1. Falla con trastorno mental o error de prohibición invencible."},{"t":"Infracción","n":"hay responsabilidad penal","fin":true}],"pie":"Zaffaroni, Alagia y Slokar: son filtros que limitan racionalmente el poder punitivo."}},{"id":"corrientes","titulo":"Causalismo frente a finalismo","nota":"Pregunta segura: en Ecuador rige el finalismo. La diferencia está en dónde van el dolo y la culpa.","tipo":"comparar","datos":{"cols":[{"t":"Causalismo clásico","items":["La acción es un proceso causal","Dolo y culpa van en la culpabilidad"]},{"t":"Finalismo (Welzel)","destacado":true,"items":["La acción es una conducta dirigida a un fin","Dolo y culpa van en la tipicidad","Es lo que sigue el COIP"]}]}},{"id":"tipicidad","titulo":"Tipicidad","nota":"Arts. 25 a 28.1.","tipo":"arbol","datos":{"t":"Tipicidad","c":[{"t":"Tipo objetivo","c":[{"t":"Sujetos"},{"t":"Bien jurídico"},{"t":"Verbo (la conducta)"},{"t":"Resultado"},{"t":"Imputación objetiva","n":"¿creó un riesgo jurídicamente desaprobado que se concretó en el resultado?"}]},{"t":"Tipo subjetivo","c":[{"t":"Dolo"},{"t":"Culpa","n":"infracción del deber objetivo de cuidado"}]},{"t":"Error de tipo","n":"art. 28.1","c":[{"t":"Invencible: excluye la infracción"},{"t":"Vencible: culpa, si hay tipo culposo"}]}]}},{"id":"legitima-defensa","titulo":"Antijuridicidad y legítima defensa","nota":"Arts. 29, 30, 31 y 33. La legítima defensa es una causa de justificación: queda excluida la antijuridicidad, no la tipicidad.","tipo":"arbol","datos":{"t":"Antijuridicidad","n":"art. 29","c":[{"t":"Causas de justificación","n":"art. 30","c":[{"t":"Legítima defensa","n":"art. 33","c":[{"t":"Agresión actual e ilegítima"},{"t":"Necesidad racional de la defensa"},{"t":"Sin provocación suficiente"}]}]},{"t":"Exceso","n":"se examina si los requisitos no se cumplen del todo"}]}},{"id":"errores","titulo":"Error de tipo frente a error de prohibición","tipo":"comparar","datos":{"cols":[{"t":"Error de tipo","items":["Recae sobre un elemento objetivo del tipo","Filtro: tipicidad (art. 28.1)","Invencible: excluye la infracción","Vencible: culpa, si hay tipo culposo","Ejemplo: la estudiante que toma una mochila idéntica"]},{"t":"Error de prohibición","items":["Recae sobre la ilicitud de la conducta","Filtro: culpabilidad (art. 35.1)","Invencible: sin responsabilidad","Vencible: pena mínima reducida en un tercio"]}]}},{"id":"vistazo","titulo":"La evaluación de un vistazo","nota":"Lo que dijo el docente en la clase 6 (retroalimentación).","tipo":"arbol","datos":{"t":"Evaluación unidad 1","c":[{"t":"Ley penal","c":[{"t":"Legalidad","n":"nadie es sancionado por una conducta no tipificada al momento de realizarla"},{"t":"Mínima intervención","n":"solo si es necesaria y lo extrapenal es insuficiente"}]},{"t":"Teoría del delito","c":[{"t":"Infracción (art. 18)"},{"t":"Legítima defensa: antijuridicidad"},{"t":"Trastorno mental: culpabilidad"}]},{"t":"Corrientes","c":[{"t":"Ecuador es finalista"},{"t":"Dolo y culpa en la tipicidad"}]},{"t":"Casos","c":[{"t":"Camión y peatón: riesgo desaprobado"},{"t":"Conductor distraído: culpa"},{"t":"Delito o contravención"}]},{"t":"Trampa","n":"hay respuestas verdaderas que no contestan la pregunta: leer primero la pregunta"}]}}]},{"id":"medicina","nombre":"Medicina Legal","corto":"Medicina Legal","docente":"Abg. José David Mazón Loayza","color":"#2A8A6B","colorOscuro":"#6CCBA8","evaluacion":{"inicio":"2026-11-08T13:00","fin":"2026-11-08T14:00"},"unidades":[{"id":"unidad_01_medicina_forense_y_su_aplicacion","num":1,"titulo":"Unidad 1 · Medicina forense y su aplicación (sílabo)","pendiente":false,"estructura":"","temas":[{"id":"la_medicina_forense_y_su_aplicacion","titulo":"La medicina forense y su aplicación en procesos judiciales","docs":[{"k":"conceptos","n":"Conceptos","md":"# Conceptos: La medicina forense y su aplicación en procesos judiciales\n\nFuentes: [Semana 2] docente y diapositivas · [Guía] Patitó (2000) · [Sílabo]\n\n- **Medicina legal:** rama de la medicina que sirve de puente con el derecho y asesora sobre cuestiones biológicas, físicas, químicas y patológicas útiles para aplicar las normas a los fallos judiciales (Basile, 2023). [Semana 2]\n- **Denominaciones:** medicina forense, legal judicial, pericial, jurídica, del derecho. \"Medicina criminal\" es incorrecto porque restringe su alcance al derecho penal. [Semana 2]\n- **Finalidad:** aportar juicios esclarecedores a la administración de justicia. Biología y derecho se tocan en la medicina legal. [Guía, Patitó]\n- **Pericias medicolegales:** se usan en delitos contra la vida, delitos sexuales y agresiones físicas. [Guía]\n- **Divisiones (12):** jurisprudencia médica, traumatología médico legal, tanatología, asfixiología, toco-ginecología forense, sexología, pediatría médico legal, criminalística, toxicología forense, psiquiatría forense, genética forense, deontología médica. [Semana 2]\n- **Contenidos según la guía:** deontología médica; patología forense (tanatología, asfixiología, lesionología); criminalística médico legal; sexología médico legal. [Guía]\n- Las pericias se complementan entre sí (criminalística en la escena, médico legal en la autopsia, psicológica). [Semana 2]\n\n## Relaciones\n\n- Conecta con Derecho Penal: prueba pericial, tipicidad y causalidad (resultado muerte o lesión).\n- La psiquiatría forense conecta con la inimputabilidad (unidad 3 y Derecho Penal, unidad 3).\n"},{"k":"definiciones","n":"Definiciones","md":"# Definiciones: La medicina forense y su aplicación en procesos judiciales\n\n| Término | Definición | Fuente |\n|---|---|---|\n| Medicina legal | Disciplina médica que, encuadrada en las normas jurídicas vigentes, responde con métodos y técnicas propios a las cuestiones médicas que plantea el derecho | Guía (Patitó, 2000) |\n| Medicina legal (puente) | Rama que establece un puente con el derecho y asesora sobre cuestiones biológicas, físicas, químicas y patológicas | Semana 2 (Basile, 2023) |\n| Jurisprudencia médica | Conocimientos jurídicos que el médico debe tener para su labor profesional y pericial | Semana 2 |\n| Traumatología médico legal | Estudio de lesiones y muertes violentas por agentes físicos | Semana 2 |\n| Tanatología | Todo lo relativo a la muerte y al cadáver, del lugar del hecho a la autopsia | Semana 2 |\n| Asfixiología | Mecanismos de interrupción de la respiración que pueden causar muerte por asfixia | Semana 2 |\n| Toco-ginecología forense | Aspectos médico legales del embarazo, parto y puerperio | Semana 2 |\n| Sexología forense | Aspectos jurídicos de la intimidad, el sexo y la sexualidad | Semana 2 |\n| Pediatría médico legal | Agresión física, psíquica o sexual a menores; síndrome de maltrato infantil | Semana 2 |\n| Criminalística | Procedimientos científicos y técnicos aplicados a la investigación de delitos | Semana 2 |\n| Toxicología forense | Efectos de sustancias tóxicas vinculadas a delitos o muertes sospechosas | Semana 2 |\n| Psiquiatría forense | Evaluación del estado mental para determinar responsabilidad penal y capacidad civil | Semana 2 |\n| Genética forense | Aplicación del ADN a la identificación legal de personas | Semana 2 |\n| Deontología médica | Ciencia que estudia los deberes y obligaciones del médico según los códigos de ética | Semana 2 |\n"},{"k":"ejemplos","n":"Ejemplos","md":"# Ejemplos: La medicina forense y su aplicación en procesos judiciales\n\n- Un accidente, una muerte sospechosa, un caso de violencia o una prueba de ADN requieren intervención médica para aclarar hechos. [Diapositiva, actividad no calificada]\n- Muerte de una persona privada de libertad: la autopsia médico legal se realiza con fines investigativos. [Semana 2]\n- El perito de criminalística en la escena y el perito médico legal en la mesa de autopsia: igual de importantes. [Semana 2]\n- Pruebas sin protocolo técnico: el abogado puede demostrarlo en el proceso. [Semana 2]\n"},{"k":"preguntas_frecuentes","n":"Preguntas","md":"# Preguntas frecuentes: La medicina forense y su aplicación en procesos judiciales\n\n1. ★ Defina la medicina legal. ¿Por qué se la llama también medicina forense?\n2. ★ ¿Por qué \"medicina criminal\" es un término incorrecto?\n3. ★ Enumere y defina las divisiones de la medicina legal.\n4. ¿Cómo contribuye la medicina forense al estudio de procesos judiciales? [Foro]\n5. ¿Qué conceptos, métodos y técnicas médico forenses debe conocer el abogado? [Foro]\n6. ¿En qué casos se usan las pericias medicolegales?\n7. ¿Qué es la deontología médica?\n"},{"k":"bibliografia","n":"Bibliografía","md":"# Bibliografía: La medicina forense y su aplicación en procesos judiciales\n\n## Obligatoria (sílabo)\n\n- Basile, Alejandro A. *Tratado de Medicina Legal para médicos y abogados*. Cathedra Jurídica (2001; las diapositivas citan 2023). ISBN 978-987-8904-32-0. Págs. 1-15 (foro de la unidad 1).\n\n## Otras fuentes de la clase\n\n- Patitó, José Ángel (2000), citado por la guía para el concepto.\n- Gisbert Calabuig y López Gómez, citados por Basile (2023) en la definición de jurisprudencia médica.\n\n## Pendiente\n\nBibliografía complementaria: el sílabo no consigna ninguna.\n"},{"k":"jurisprudencia","n":"Jurisprudencia","md":"# Jurisprudencia: La medicina forense y su aplicación en procesos judiciales\n\nNo consta jurisprudencia en las fuentes del curso (los docentes no citaron ninguna). No es un faltante: se llena solo si una tarea la pide. No se citaron normas ni sentencias en esta clase.\n\n## Por investigar\n\n- Norma ecuatoriana sobre peritos y autopsia médico legal (COIP, Código Orgánico de la Función Judicial, protocolos de la Fiscalía) para el Investigador Académico.\n"},{"k":"_ficha","n":"Ficha","md":"# Ficha del Gestor de Conocimiento\n\n**Materia:** Medicina Legal\n**Unidad:** 1 · Medicina forense y su aplicación (sílabo)\n**Tema:** La medicina forense y su aplicación en procesos judiciales\n\n## Conceptos incorporados\nConcepto, denominaciones, 12 divisiones, pericias, deontología.\n\n## Fuentes\nSílabo, guía, Semana 2 y diapositivas. Resumen: `salida/resumenes/medicina_legal/semana_02_la_medicina_forense_y_su_aplicacion.md`.\n\n## Relaciones encontradas\n- Conecta con Derecho Penal (prueba pericial) y con Derecho Civil II (capacidad civil y psiquiatría forense, por verificar).\n\n## Información pendiente de ampliar\nNormas sobre peritaje; temas de las divisiones no tratadas aún (asfixiología, toxicología, genética).\n\n## Estado de actualización\nIncorporado desde la Semana 2.\n"}]},{"id":"lesionologia_lesiones_por_arma_de_fuego","titulo":"Lesionología médico legal: lesiones por arma de fuego (APE 1)","docs":[{"k":"conceptos","n":"Conceptos","md":"# Conceptos: Lesionología médico legal: lesiones por arma de fuego\n\nFuentes: [Semana 3] docente y diapositivas (\"Material de estudio APE\") · [Sílabo]\n\n- **Arma de fuego:** usa la energía de la combustión de la pólvora para lanzar un proyectil a distancia.\n- **Balística:** estudia armas, pólvoras y proyectiles. **Interna** (dentro del arma), **externa** (del cañón al impacto) y **de efectos / de arribada / médico legal** (los efectos del proyectil en el blanco).\n- **Naturaleza de la lesión:** las lesiones por proyectil son contusas (choque de un cuerpo duro contra el organismo).\n- **Estructura:** orificio de entrada → trayecto intracorporal → proyectil alojado o salida por orificio de salida.\n- **Orificio de entrada:** se estudia en el plano óseo, cutáneo y en la ropa.\n- **Ropa (si el disparo fue a corta distancia):** deshilachamiento crucial de Rojas; escarapela de Simonin; calcado de la trama del tejido de Bonnet.\n- **Piel:** efectos del cañón (impronta quemante si se apoya en la piel), del proyectil (anillo de contusión + anillo de enjugamiento = **anillo de Fisch**) y de la pólvora (tatuaje).\n- **Anillo de Fisch:** nunca falta, está presente sin importar la distancia y atestigua el carácter vital de la lesión.\n- **Tatuaje verdadero** (granos de pólvora incrustados, no se borra) y **negro de humo / falso tatuaje** (se borra al lavar): indican disparo a corta distancia.\n- **Disparo a larga distancia:** sin granos de pólvora, humo ni llama.\n- Los signos permiten establecer que es una lesión por proyectil, el ángulo de incidencia y la distancia.\n\n## Relaciones\n\n- Distancia del disparo → prueba de intención / dolo en Derecho Penal (tipo subjetivo), a verificar con el docente de Penal.\n- Se enlaza con tanatología (muerte violenta) en la semana 4.\n"},{"k":"definiciones","n":"Definiciones","md":"# Definiciones: Lesionología médico legal: lesiones por arma de fuego\n\n| Término | Definición | Fuente |\n|---|---|---|\n| Arma de fuego | La que utiliza la energía de la combustión de la pólvora para lanzar un proyectil a distancia | Diapositiva S3 |\n| Balística interna | Armas, pólvoras, proyectiles y recorrido del proyectil dentro del arma hasta la boca del cañón | Diapositiva S3 |\n| Balística externa | Recorrido del proyectil desde la salida del arma hasta el impacto | Diapositiva S3 |\n| Balística de efectos (de arribada o médico legal) | Efectos que produce el proyectil a su llegada al blanco | Diapositiva S3 |\n| Contusión | Lesión resultante del golpe o choque con o contra cuerpos o superficies duras | Diapositiva S3 |\n| Excoriación | Destrucción de los estratos superficiales de la epidermis sin afectar la capa basal | Diapositiva S3 |\n| Anillo de Fisch | Anillo contusivo-excoriativo + anillo de enjugamiento, superpuestos; signo constante de lesión vital | Diapositiva S3 |\n| Tatuaje verdadero | Granos de pólvora no combustionados impregnados en la piel; no se borra al lavar | Diapositiva S3 |\n| Negro de humo (falso tatuaje) | Depósito de humo que se borra al lavar | Diapositiva S3 |\n| Signo de Rojas | Deshilachamiento crucial de la prenda | Diapositiva S3; Semana 3 |\n| Escarapela de Simonin | Signo en la ropa por disparo a corta distancia | Diapositiva S3 |\n| Calcado de Bonnet | Calcado de la trama del tejido | Diapositiva S3 |\n"},{"k":"ejemplos","n":"Ejemplos","md":"# Ejemplos: Lesionología médico legal: lesiones por arma de fuego\n\n- Cómo atribuir un homicidio con arma de fuego a una persona: la lesión y la distancia aportan, junto con criminalística. [Semana 3]\n- Mala interpretación de la distancia del disparo que derivó en una apertura indebida del cuerpo (relato del docente). [Semana 3]\n- El proyectil gira sobre su eje para vencer la resistencia del aire. [Semana 3]\n- Arma corta vs. arma larga (se apoya en el hombro). [Semana 3]\n"},{"k":"preguntas_frecuentes","n":"Preguntas","md":"# Preguntas frecuentes: Lesionología médico legal: lesiones por arma de fuego\n\n1. ★ ¿Qué es un arma de fuego? ¿Qué es la balística de efectos?\n2. ★ Signos del orificio de entrada en la ropa (Rojas, Simonin, Bonnet).\n3. ★ ¿Qué es el anillo de Fisch y qué prueba?\n4. ★ Tatuaje verdadero vs. falso tatuaje: ¿qué indican sobre la distancia?\n5. ¿Qué signos indican un disparo a larga distancia?\n6. ¿Qué datos aportan las lesiones sobre el ángulo y la distancia del disparo?\n7. ¿Por qué las lesiones por proyectil son contusas?\n"},{"k":"bibliografia","n":"Bibliografía","md":"# Bibliografía: Lesionología médico legal: lesiones por arma de fuego\n\n## Obligatoria (sílabo)\n\n- Basile, Alejandro A. *Tratado de Medicina Legal para médicos y abogados*. Cathedra Jurídica (2001; las diapositivas citan 2023). ISBN 978-987-8904-32-0. APE de la unidad 1: págs. 250-286 (según el sílabo).\n\n## Otras fuentes de la clase\n\n- Robalino (2020), fuente de las fotografías de las diapositivas (obra no identificada; por verificar).\n\n## Pendiente\n\nBibliografía complementaria: el sílabo no consigna ninguna.\n"},{"k":"jurisprudencia","n":"Jurisprudencia","md":"# Jurisprudencia: Lesionología médico legal: lesiones por arma de fuego\n\nNo consta jurisprudencia en las fuentes del curso (los docentes no citaron ninguna). No es un faltante: se llena solo si una tarea la pide. No se citaron normas ni sentencias.\n\n## Por investigar\n\n- Protocolos de la Fiscalía para balística y autopsia por arma de fuego.\n"},{"k":"_ficha","n":"Ficha","md":"# Ficha del Gestor de Conocimiento\n\n**Materia:** Medicina Legal\n**Unidad:** 1 · Medicina forense y su aplicación\n**Tema:** Lesionología médico legal: lesiones por arma de fuego (APE 1)\n\n## Conceptos incorporados\nArma de fuego, balística, orificio de entrada, signos en ropa y piel, anillo de Fisch, tatuaje, distancia del disparo.\n\n## Fuentes\nSílabo, Semana 3 y diapositivas. Resumen: `salida/resumenes/medicina_legal/semana_03_lesiones_por_arma_de_fuego.md`.\n\n## Relaciones encontradas\n- Derecho Penal: delitos contra la vida, causalidad e imputación objetiva.\n\n## Información pendiente de ampliar\nArma larga, orificio de salida y trayecto (solo mencionados); otras lesiones del APE (arma blanca, contusas).\n\n## Estado de actualización\nIncorporado desde la Semana 3 y las diapositivas.\n"}]},{"id":"tanatologia_forense","titulo":"Tanatología forense (trabajo autónomo 1)","docs":[{"k":"conceptos","n":"Conceptos","md":"# Conceptos: Tanatología forense\n\nFuentes: [Semana 4] docente y diapositivas · [Sílabo]\n\n- **Tanatología:** estudio de la muerte y del cadáver en todas sus condiciones. Tras la muerte, el cadáver cambia por el ambiente y los microbios.\n- **Dos etapas:** fenómenos cadavéricos recientes y alejados.\n- **Fenómenos recientes:** deshidratación, enfriamiento, livideces, rigidez y espasmo.\n- **Livideces:** manchas rojo-violáceas en zonas declives; señalan la posición del cadáver; visibles a las 3 horas; no aparecen en zonas de presión (\"falsos surcos\").\n- **Enfriamiento:** iguala el ambiente a las 24 horas, de afuera hacia adentro.\n- **Rigidez:** endurecimiento muscular, inicia en mandíbula y cuello, aparece de 3 a 6 horas, predominan flexores.\n- **Espasmo:** rigidez instantánea que fija la actitud del momento de la muerte brusca; origen vital; excepcional; no se simula. ★ **Dicho del docente:** la diferencia entre espasmo y rigidez \"normalmente se toma en el examen\".\n- **Putrefacción:** mancha verde abdominal (fosa ilíaca derecha) a las 24-36 horas; generalización en una semana; gases, red venosa, hinchazón; etapa colicuativa; esqueletización.\n- **Data de la muerte:** estimación del tiempo transcurrido usando livideces, rigidez, enfriamiento y putrefacción.\n- **Entrega del cadáver:** tras la autopsia médico legal y la toma de muestras, en ataúd cerrado; el Estado puede retenerlo mientras dure la investigación.\n\n## Relaciones\n\n- Investigación de la muerte (unidad 2) y delitos contra la vida (Derecho Penal).\n"},{"k":"definiciones","n":"Definiciones","md":"# Definiciones: Tanatología forense\n\n| Término | Definición | Fuente |\n|---|---|---|\n| Tanatología forense | Estudio de la muerte y el cadáver en todas sus condiciones | Diapositiva S4 (Basile, 2023) |\n| Deshidratación cadavérica | Pérdida de líquidos del cuerpo inerte; interesa la desecación de mucosas | Diapositiva S4 |\n| Enfriamiento cadavérico | Descenso progresivo de la temperatura hasta equilibrarse con el ambiente (24 h) | Diapositiva S4 |\n| Livideces | Manchas rojo-violáceas por sedimentación de sangre en zonas declives | Diapositiva S4 |\n| Rigidez cadavérica | Endurecimiento muscular posterior a la relajación inicial | Diapositiva S4 |\n| Espasmo cadavérico | Rigidez inmediata que fija la actitud adoptada voluntariamente antes de una muerte brusca | Diapositiva S4 (Raffo, 2016) |\n| Putrefacción | Destrucción de tejidos por los gérmenes del intestino | Diapositiva S4 |\n| Mancha verde abdominal | Primer signo de putrefacción, en la fosa ilíaca derecha | Diapositiva S4 |\n| Etapa colicuativa | Órganos sin forma ni consistencia; la piel se desprende | Semana 4 |\n"},{"k":"ejemplos","n":"Ejemplos","md":"# Ejemplos: Tanatología forense\n\n- Piloto de combate con el cráneo seccionado en dos por el choque con la cúpula de acrílico: el brazo izquierdo rígido contra el hombro y el derecho apuntando a la ingle opuesta, con el paracaídas desplegado. [Diapositiva; Raffo]\n- Soldado en la trinchera que asoma la cabeza y muere por un disparo: ejemplo de espasmo. [Semana 4]\n- Caso Nisman (documental): simulación de suicidio frente a homicidio. [Semana 4]\n- Cadáver en un terreno baldío con abdomen distendido, color verdoso y red venosa en el tórax: ¿qué etapa de putrefacción, qué signos, qué tiempo de muerte? [Diapositiva, actividad no calificada]\n- Livideces en el dorso si el cadáver está en decúbito dorsal; en la mitad inferior en los ahorcados. [Diapositiva]\n"},{"k":"preguntas_frecuentes","n":"Preguntas","md":"# Preguntas frecuentes: Tanatología forense\n\n1. ★ Diferencia entre rigidez y espasmo cadavérico.\n2. ★ Fenómenos cadavéricos recientes y alejados.\n3. ★ Livideces: ¿qué indican, cuándo aparecen, por qué no aparecen en las zonas de presión?\n4. ★ ¿Qué es la mancha verde abdominal y a qué hora aparece?\n5. Etapas de la putrefacción.\n6. ¿Cómo influyen el clima y la contextura en el enfriamiento?\n7. Caso del cadáver en el terreno baldío: etapa, signos, tiempo estimado e importancia penal.\n8. ¿Por qué el espasmo cadavérico no se puede simular?\n"},{"k":"bibliografia","n":"Bibliografía","md":"# Bibliografía: Tanatología forense\n\n## Obligatoria (sílabo)\n\n- Basile, Alejandro A. *Tratado de Medicina Legal para médicos y abogados*. Cathedra Jurídica (2001; las diapositivas citan 2023). ISBN 978-987-8904-32-0. Tanatología: págs. 343-428 (trabajo autónomo, según el sílabo).\n\n## Otras fuentes de la clase\n\n- Raffo (2016), citado en las diapositivas sobre espasmo cadavérico (obra no identificada; por verificar).\n\n## Pendiente\n\nBibliografía complementaria: el sílabo no consigna ninguna.\n"},{"k":"jurisprudencia","n":"Jurisprudencia","md":"# Jurisprudencia: Tanatología forense\n\nNo consta jurisprudencia en las fuentes del curso (los docentes no citaron ninguna). No es un faltante: se llena solo si una tarea la pide. No se citaron normas ni sentencias.\n\n## Por investigar\n\n- Normas sobre autopsia médico legal y entrega de cadáveres (COIP, protocolos de la Fiscalía; Resolución 073-FGE-2014 está en el sílabo para la unidad 2).\n"},{"k":"_ficha","n":"Ficha","md":"# Ficha del Gestor de Conocimiento\n\n**Materia:** Medicina Legal\n**Unidad:** 1 · Medicina forense y su aplicación\n**Tema:** Tanatología forense (trabajo autónomo 1)\n\n## Conceptos incorporados\nFenómenos cadavéricos recientes (deshidratación, enfriamiento, livideces, rigidez, espasmo), putrefacción, data de la muerte, entrega del cadáver.\n\n## Fuentes\nSílabo, Semana 4 y diapositivas. Resumen: `salida/resumenes/medicina_legal/semana_04_tanatologia_forense.md`.\n\n## Relaciones encontradas\n- Derecho Penal: delitos contra la vida; simulación de suicidio frente a homicidio.\n\n## Información pendiente de ampliar\nFenómenos cadavéricos alejados (solo nombrados), asfixiología, identificación de cadáveres.\n\n## Estado de actualización\nIncorporado desde la Semana 4 y las diapositivas.\n"}]}]},{"id":"unidad_02_pericia_medico_forense","num":2,"titulo":"Unidad 2 · Pericia medico forense","pendiente":true,"estructura":"# Unidad 2 · Pericia médico forense\n\nEstructura del sílabo. Aún no hay clases (semanas 7–12, 9 nov – 16 dic 2026).\n\n## Temas (carpetas por crear cuando haya clase)\n\n- `medicina_forense_materno_infantil_y_sexologica`\n- `maltrato_infantil` (foro: definición, relevancia para el abogado)\n- `investigacion_medicolegal_de_la_muerte` (Vázquez Fanego)\n- `pericias_forenses_en_delitos_sexuales` (Basile págs. 579-594; Resolución 073-FGE-2014)\n- `pediatria_y_obstetricia_medicolegal` (Basile págs. 605-607, 614-615, 625-642; COIP arts. 147 a 150)\n\n## Actividades (sílabo)\n\nForo, video foro (cámara encendida según el sílabo), estudio de caso con ficha de análisis, test. Visita opcional al Centro de Investigación Forense. Evaluación: 15 y 16 dic 2026.\n","temas":[]},{"id":"unidad_03_alteraciones_sexuales","num":3,"titulo":"Unidad 3 · Alteraciones sexuales","pendiente":true,"estructura":"# Unidad 3 · Alteraciones sexuales\n\nEstructura del sílabo. Aún no hay clases (semanas 13–19, 4 ene – 21 feb 2027).\n\n## Temas (carpetas por crear cuando haya clase)\n\n- `parafilias_o_aberraciones_sexuales` (Patitó, págs. 367-369; DSM-5, págs. 373-380)\n- `trastornos_de_la_sexualidad`\n- `psiquiatria_forense_penal` (Basile págs. 765-808; COIP arts. 34 a 36)\n- `el_trastorno_mental_como_causa_de_inculpabilidad` (foro y video foro)\n\n## Conexión\n\nDerecho Penal, unidad 3: causas de inculpabilidad (trastorno mental, arts. 34 a 38 del COIP).\n\n## Actividades (sílabo)\n\nForo con lectura de Santillán Montenegro y Santacruz Cruz sobre inimputabilidad por trastorno mental en el COIP; video foro; ficha de análisis de caso; test. Evaluación: 20 y 21 feb 2027.\n","temas":[]}],"normas":"","resumenes":[{"id":"semana_02_la_medicina_forense_y_su_aplicacion","titulo":"Semana 2 · La medicina forense y su aplicación en procesos judiciales","md":"# Semana 2 · La medicina forense y su aplicación en procesos judiciales\n\n**Agente:** Analista de Clases · **Fuentes:** `Clases/Semana_02.txt` y `DiapositivasClases/Semana_02.pdf` (Basile, 2023)\nEsta tutoría fue en parte de encuadre: el docente recorrió el EVA, las reglas y la unidad 1.\n\n## Resumen Ejecutivo\n\nEl docente (José David Mazón Loayza) inició el periodo con el paralelo D, explicó cómo califica y recibe tareas, recorrió las actividades de la unidad 1 y presentó la medicina legal como la rama de la medicina que sirve de puente con el derecho. Enfatizó que las pericias se complementan entre sí: tan importante es el perito de criminalística en la escena como el perito médico legal en la autopsia, y que el abogado debe poder cuestionar una prueba mal hecha.\n\n## Ubicación en el Sílabo\n\nUnidad 1, semana 2. Tema: la medicina forense y su aplicación en procesos judiciales (foro de la unidad 1).\n\n## Temas Principales\n\n1. Concepto de medicina legal y sus denominaciones.\n2. Las doce divisiones de la medicina legal.\n3. Importancia de las pericias y de los centros forenses para la investigación criminal.\n4. Reglas de las actividades (foro, video foro, APE, AA).\n\n## Conceptos Clave\n\n- **Medicina legal:** rama de la medicina que establece un puente con el derecho y asesora sobre cuestiones biológicas, físicas, químicas y patológicas útiles para aplicar las normas legales a los fallos judiciales (Basile, 2023). Otras denominaciones: medicina forense, medicina legal judicial, medicina pericial, medicina jurídica, medicina del derecho. Llamarla \"medicina criminal\" es incorrecto: restringe su alcance al derecho penal.\n- **Divisiones (diapositivas):** jurisprudencia médica; traumatología médico legal; tanatología; asfixiología; toco-ginecología forense; sexología; pediatría médico legal; criminalística; toxicología forense; psiquiatría forense; genética forense; deontología médica.\n- Según la guía (Patitó, 2000): la medicina legal es la especialidad médica que, encuadrada en las normas jurídicas, responde con métodos propios a las cuestiones médicas que plantea el derecho; su finalidad es aportar juicios esclarecedores a la administración de justicia.\n\n## Ejemplos del Docente\n\n- Autopsia médico legal en una persona privada de libertad muerta: puede deberse a que era un testigo clave; las autopsias se hacen con fines investigativos.\n- Una pericia complementa a otra (la psicológica del ciclo anterior con la médica).\n- Si las pruebas se hicieron sin protocolos técnicos, el abogado puede demostrarlo: \"esa es la vida del abogado\".\n- Dijo que los centros forenses no reciben la atención debida.\n\n## Temas Enfatizados\n\n- Revisar siempre la rúbrica antes de subir una tarea.\n- No se reciben tareas fuera del plazo; hay un acta de acuerdos y compromisos.\n- Las tres actividades se repiten cada unidad: foro (3 preguntas de análisis, debate y síntesis), test y estudio de caso. El APE de la unidad 1 es lesionología médico legal.\n- El video foro: la mayoría lo hará de forma asincrónica. El docente pidió no repetir la actividad en vivo y la suplementaria.\n- Cámara: no la exige, solo en las evaluaciones.\n- Las actividades no calificadas se habilitan cada semana y quedan abiertas hasta el fin del ciclo; sirven para medir el conocimiento general y evitar el plan de seguimiento al desempeño estudiantil.\n\n## Normas y Autores Citados\n\nBasile (2023). No se citaron artículos.\n\n## Indicaciones Administrativas\n\n- El docente adelantó el inicio del paralelo D para igualarse con los otros paralelos.\n- Receso académico del 14 de diciembre al 3 de enero; semana del estudiante 10–12 de febrero; recuperación 8–12 de marzo.\n- Foro académico de la unidad 1: hasta el 25 de octubre.\n- Visita opcional al Centro de Investigación Forense (se hará en la unidad 2).\n- Dudas: por correo o por el grupo de WhatsApp; no pedir permisos de edición en los enlaces.\n\n## Relación con Actividades Calificadas\n\nForo de la unidad 1 (\"La medicina forense y su aplicación en procesos judiciales\"): ¿qué es la medicina forense?, ¿cómo contribuye al estudio de procesos judiciales?, conclusiones sobre los conceptos, métodos y técnicas que el abogado debe conocer. Lectura: Basile, págs. 1-15.\n\n## Posibles Preguntas de Examen\n\n1. Defina la medicina legal. ★★★★\n2. ¿Por qué \"medicina criminal\" es un término incorrecto? ★★★★\n3. Enumere y defina las divisiones de la medicina legal. ★★★★★\n4. ¿Qué diferencia hay entre tanatología y asfixiología? ★★★\n5. ¿Qué es la deontología médica? ★★★\n\n## Recomendaciones para Estudiar\n\nEstudiar las 12 divisiones con una frase cada una (están en las diapositivas) y leer Basile, págs. 1-15.\n\n## Nivel de importancia\n\n| Tema | Nivel |\n|---|---|\n| Concepto y denominaciones | ★★★★ |\n| Divisiones de la medicina legal | ★★★★★ |\n| Reglas del curso | ★★★ |\n"},{"id":"semana_03_lesiones_por_arma_de_fuego","titulo":"Semana 3 · Lesionología médico legal: lesiones por arma de fuego","md":"# Semana 3 · Lesionología médico legal: lesiones por arma de fuego\n\n**Agente:** Analista de Clases · **Fuentes:** `Clases/Semana_03.txt` y `DiapositivasClases/Semana_03.pdf` (\"Material de estudio APE\")\n\n## Resumen Ejecutivo\n\nTutoría no obligatoria y no calificada. El docente habilitó el test de la actividad autónoma y desarrolló el material del APE: concepto de arma de fuego, balística y las lesiones por proyectil. Mostró cómo los signos del orificio de entrada (en la ropa y en la piel) permiten determinar el tipo de lesión, el ángulo y la **distancia del disparo**.\n\n## Ubicación en el Sílabo\n\nUnidad 1, semana 3. APE 1: lesionología médico legal.\n\n## Temas Principales\n\n1. Concepto de arma de fuego y balística (interna, externa y de efectos o de arribada).\n2. Lesiones por arma de fuego corta: orificio de entrada, trayecto intracorporal y orificio de salida.\n3. Signos en la ropa: deshilachamiento crucial de Rojas, escarapela de Simonin, calcado de la trama de Bonnet.\n4. Signos en la piel: efectos del cañón, del proyectil (anillo de contusión y anillo de enjugamiento = anillo de Fisch) y de la pólvora (tatuaje).\n5. Distancia del disparo (contacto, corta distancia y larga distancia).\n\n## Conceptos Clave\n\n- **Arma de fuego:** utiliza la energía liberada por la combustión de la pólvora para lanzar un proyectil a distancia.\n- **Balística de efectos (de arribada o médico legal):** estudia los efectos del proyectil en el blanco; de especial interés médico legal.\n- **Las lesiones por proyectil son de carácter contuso.**\n- **Anillo de Fisch:** anillo contusivo-excoriativo más anillo de enjugamiento. **Nunca falta, aparece sin importar la distancia y atestigua el carácter vital de la lesión** (marcado como IMPORTANTE en la diapositiva).\n- **Tatuaje verdadero:** granos de pólvora incrustados en la piel; no se borra al lavar. **Falso tatuaje (negro de humo):** se borra al lavar. Ambos indican disparo a corta distancia (IMPORTANTE).\n- **Larga distancia:** no hay granos de pólvora, ni humo ni llama.\n- **Contusión:** lesión por golpe contra superficies duras. **Excoriación:** destrucción de los estratos superficiales de la epidermis sin afectar la capa basal.\n\n## Ejemplos del Docente\n\n- Cómo se prueba que una persona determinada cometió un homicidio con arma de fuego: la medicina legal contribuye a materializar el hecho, junto con criminalística y la investigación.\n- Casos de mala interpretación de la distancia de disparo que llevaron a una apertura indebida del cuerpo (relato del docente).\n- El proyectil gira sobre su propio eje para tener estabilidad y no caer.\n- Diferencia entre arma corta y arma larga (la larga se apoya en el hombro).\n- Mencionó el barrido de cámaras y la ruta técnica en la investigación de sicariato.\n\n## Temas Enfatizados\n\n- Distinguir los signos de la ropa y los de la piel.\n- Anillo de Fisch y tatuaje (el docente los marcó como importantes en la diapositiva).\n- Citó al autor de las fotografías (Robalino, 2020) para no vulnerar derechos.\n\n## Normas y Autores Citados\n\nBasile (APE: págs. 250-286 del Tratado, según el sílabo); Robalino (2020) como fuente de las imágenes.\n\n## Indicaciones Administrativas\n\n- Test de la actividad autónoma: **50 preguntas, 60 minutos**, habilitado ese día.\n- Un estudiante con adaptación curricular entrega un video en lugar del test; otra estudiante señaló que el EVA no indicaba dónde subirlo.\n- El test debe rendirse en computador (se insistió en la clase 4).\n\n## Relación con Actividades Calificadas\n\nAPE 1 (lesionología médico legal: lectura, estudio de caso y ficha de análisis en PDF) y test del trabajo autónomo.\n\n## Posibles Preguntas de Examen\n\n1. Defina arma de fuego y balística; ¿qué es la balística de efectos? ★★★★\n2. Signos del orificio de entrada en la ropa (Rojas, Simonin, Bonnet). ★★★★★\n3. ¿Qué es el anillo de Fisch y por qué es el signo constante? ★★★★★\n4. Diferencia entre tatuaje verdadero y falso tatuaje. ★★★★★\n5. ¿Qué indica la ausencia de pólvora, humo y llama? ★★★★\n\n## Recomendaciones para Estudiar\n\nRepasar las diapositivas de la semana 3 y la lectura de Basile del APE. Hacer un cuadro de la distancia del disparo con los signos en piel y ropa.\n\n## Nivel de importancia\n\n| Tema | Nivel |\n|---|---|\n| Anillo de Fisch y tatuaje | ★★★★★ |\n| Signos en la ropa | ★★★★ |\n| Balística y concepto de arma de fuego | ★★★★ |\n"},{"id":"semana_04_tanatologia_forense","titulo":"Semana 4 · Tanatología forense","md":"# Semana 4 · Tanatología forense\n\n**Agente:** Analista de Clases · **Fuentes:** `Clases/Semana_04.txt` y `DiapositivasClases/Semana_04.pdf` (Basile, 2023; Raffo, 2016)\n\n## Resumen Ejecutivo\n\nTutoría no obligatoria y no calificada. Se explicó la tanatología como el estudio de la muerte y el cadáver, con los **fenómenos cadavéricos recientes** (deshidratación, enfriamiento, livideces, rigidez y espasmo) y la **putrefacción**, siempre con su utilidad para estimar la **data de la muerte** y reconstruir los hechos. El docente advirtió que la diferencia entre **espasmo y rigidez cadavérica \"normalmente se toma en el examen\"**.\n\n## Ubicación en el Sílabo\n\nUnidad 1, semana 4. Tanatología forense (trabajo autónomo; Basile, págs. 343-428).\n\n## Temas Principales\n\n1. Tanatología y las dos etapas: fenómenos cadavéricos recientes y alejados.\n2. Deshidratación, enfriamiento, livideces.\n3. Rigidez y espasmo cadavérico.\n4. Putrefacción: mancha verde abdominal, gases, red venosa, etapa colicuativa y esqueletización.\n5. Entrega del cadáver y autopsia médico legal.\n\n## Conceptos Clave\n\n- **Tanatología:** estudio de la muerte y del cadáver en todas sus condiciones (Basile, 2023). Tras la muerte, el cadáver sufre modificaciones por el ambiente y por los microbios.\n- **Deshidratación:** pérdida de líquidos; de interés la desecación de las mucosas expuestas (rostro, genitales, ojos, labios).\n- **Enfriamiento:** la temperatura baja hasta igualar el ambiente, a las 24 horas. Se enfría de afuera hacia adentro (cara, manos, pies). Influyen el clima, la contextura y la causa de la muerte.\n- **Livideces:** manchas rojo-violáceas por la sangre que se sedimenta en las zonas declives. Importancia: señalan la posición del cadáver; se hacen visibles a las 3 horas en promedio (útil para la data); no aparecen en las zonas de presión (los \"falsos surcos\" de estrangulamiento por ropa ajustada).\n- **Rigidez cadavérica:** endurecimiento de los músculos tras la muerte; comienza en mandíbula y cuello y baja hacia los miembros inferiores; aparece entre 3 y 6 horas; predominan los flexores. El puño semicerrado no puede sostener un arma colocada después de la muerte.\n- **Espasmo cadavérico:** la rigidez invade los músculos en el mismo momento de la muerte, sin relajación previa; fija la actitud que la víctima tenía; origen vital; requiere muerte brusca; es excepcional; **no se puede simular** y permite reconstruir el hecho (Raffo, 2016). Ejemplo del piloto de combate.\n- **Putrefacción:** los gérmenes del intestino destruyen los tejidos; el primer signo es la **mancha verde abdominal** en la fosa ilíaca derecha, a las 24-36 horas; se generaliza en una semana. Luego: gases, red venosa, hinchazón de labios, párpados, cuello, escroto y vulva; etapa colicuativa (órganos sin consistencia, piel que se cae); esqueletización.\n\n## Ejemplos del Docente\n\n- Caso Nisman (documental en Netflix): simulación de suicidio frente a homicidio.\n- El soldado en la trinchera con un disparo en la cabeza: ejemplo de espasmo.\n- La entrega del cuerpo: tras la autopsia y la toma de muestras se entrega en ataúd cerrado; el cadáver puede permanecer en poder del Estado el tiempo que requiera la investigación. El docente contó un caso en el que, por primera vez, se entregó un cuerpo sin autopsia por no tratarse de una muerte violenta (sin detalles; por verificar).\n- Planteó la pregunta de cómo identificar un cadáver cuando las huellas ya no son aptas por la putrefacción (la respuesta no consta en lo que se revisó).\n- Pregunta de un estudiante sobre cuerpos con mayor masa corporal: el gas de la descomposición.\n\n## Temas Enfatizados\n\n- ★ **Espasmo vs. rigidez cadavérica:** el docente dijo que \"normalmente se toma en el examen\".\n- Las livideces son uno de los signos cadavéricos más importantes para reconstruir las circunstancias de la muerte.\n- El test de la actividad autónoma debe hacerse en computador, no en teléfono.\n- El foro académico de la unidad 1 (tres preguntas) vence esta semana (25 de octubre).\n- La visita al centro forense será en la unidad 2.\n\n## Normas y Autores Citados\n\nBasile (2023), Raffo (2016). No se citaron artículos ni resoluciones.\n\n## Indicaciones Administrativas\n\nEl video de la tutoría es para quien tenga adaptación curricular. Foro hasta el 25 de octubre.\n\n## Relación con Actividades Calificadas\n\nTrabajo autónomo 1 (tanatología forense; test), foro de la unidad 1 y evaluación de unidad (7 y 8 de noviembre).\n\n## Posibles Preguntas de Examen\n\n1. Diferencia entre rigidez y espasmo cadavérico. ★★★★★\n2. Fenómenos cadavéricos recientes y alejados. ★★★★★\n3. ¿Qué señalan las livideces y en cuánto tiempo aparecen? ★★★★★\n4. ¿Qué es la mancha verde abdominal y cuándo aparece? ★★★★\n5. Caso: cadáver con abdomen distendido, mancha verde y red venosa; ¿en qué etapa de putrefacción está y por qué importa en el proceso? (actividad no calificada de las diapositivas) ★★★★\n6. ¿Qué es la tanatología forense? ★★★★\n\n## Recomendaciones para Estudiar\n\nHacer una línea de tiempo con los fenómenos y sus horas (livideces 3 h, rigidez 3-6 h, enfriamiento 24 h, mancha verde 24-36 h, generalización en una semana). Resolver la actividad no calificada del cadáver en el terreno baldío.\n\n## Nivel de importancia\n\n| Tema | Nivel |\n|---|---|\n| Rigidez y espasmo | ★★★★★ |\n| Livideces | ★★★★★ |\n| Enfriamiento y deshidratación | ★★★★ |\n| Putrefacción | ★★★★ |\n"}],"tarjetas":[{"q":"Medicina legal (Basile, 2023)","a":"Rama de la medicina que sirve de puente con el derecho y asesora sobre cuestiones biológicas, físicas, químicas y patológicas útiles para aplicar las normas."},{"q":"¿Por qué 'medicina criminal' es incorrecto?","a":"Porque restringe la disciplina al derecho penal; sirve también a otras ramas."},{"q":"Denominaciones de la medicina legal","a":"Medicina forense, legal judicial, pericial, jurídica, del derecho."},{"q":"Divisiones de la medicina legal (12)","a":"Jurisprudencia médica, traumatología médico legal, tanatología, asfixiología, toco-ginecología forense, sexología, pediatría médico legal, criminalística, toxicología forense, psiquiatría forense, genética forense y deontología médica."},{"q":"Deontología médica","a":"Ciencia que estudia los deberes y obligaciones del médico según los códigos de ética."},{"q":"¿Para qué se usan las pericias medicolegales?","a":"Delitos contra la vida, delitos sexuales y agresiones físicas."},{"q":"Arma de fuego","a":"La que usa la energía de la combustión de la pólvora para lanzar un proyectil a distancia."},{"q":"Balística interna, externa y de efectos","a":"Interna: dentro del arma hasta la boca del cañón. Externa: del arma al impacto. De efectos: lo que el proyectil produce en el blanco."},{"q":"Naturaleza de la lesión por proyectil","a":"Contusa (choque de un cuerpo duro contra el organismo)."},{"q":"Estructura de la lesión por proyectil","a":"Orificio de entrada, trayecto intracorporal y proyectil alojado o salida por orificio de salida."},{"q":"Signos en la ropa por disparo a corta distancia","a":"Deshilachamiento crucial de Rojas, escarapela de Simonin y calcado de la trama de Bonnet."},{"q":"Anillo de Fisch","a":"Anillo contusivo-excoriativo más anillo de enjugamiento; siempre está presente, sin importar la distancia, y prueba el carácter vital de la lesión."},{"q":"Tatuaje verdadero","a":"Granos de pólvora no combustionados incrustados en la piel; no se borra al lavar; indica disparo a corta distancia."},{"q":"Negro de humo o falso tatuaje","a":"Depósito de humo que se borra al lavar; indica disparo a corta distancia."},{"q":"Disparo a larga distancia","a":"No deja granos de pólvora, humo ni llama; solo el anillo de Fisch y el orificio."},{"q":"¿Qué permiten establecer los signos del orificio de entrada?","a":"Que es una lesión por proyectil, el ángulo de incidencia y la distancia del disparo."},{"q":"Tanatología","a":"Estudio de la muerte y el cadáver en todas sus condiciones."},{"q":"Fenómenos cadavéricos recientes","a":"Deshidratación, enfriamiento, livideces, rigidez y espasmo."},{"q":"Livideces","a":"Manchas rojo-violáceas en zonas declives por sedimentación de sangre; señalan la posición del cadáver; visibles a las 3 horas; no aparecen en zonas de presión."},{"q":"Enfriamiento cadavérico","a":"Descenso de la temperatura hasta igualar el ambiente a las 24 horas, de afuera hacia adentro."},{"q":"Rigidez cadavérica","a":"Endurecimiento muscular que comienza en mandíbula y cuello, aparece entre 3 y 6 horas y predomina en flexores."},{"q":"Espasmo cadavérico","a":"Rigidez instantánea que fija la actitud del momento de una muerte brusca; es excepcional y no se puede simular. La diferencia con la rigidez 'normalmente se toma en el examen' (docente)."},{"q":"Putrefacción","a":"Destrucción de tejidos por los gérmenes del intestino; primer signo: mancha verde abdominal en la fosa ilíaca derecha a las 24 a 36 horas."},{"q":"Etapas de la putrefacción","a":"Mancha verde, red venosa, gases e hinchazón, etapa colicuativa y esqueletización."},{"q":"Data de la muerte","a":"Estimación del tiempo transcurrido usando livideces, rigidez, enfriamiento y putrefacción."},{"q":"Entrega del cadáver","a":"Tras la autopsia médico legal y la toma de muestras, en ataúd cerrado; el Estado puede retenerlo mientras dure la investigación."}],"simulacro":"# Simulacro de la unidad 1: Medicina Legal\n\n**Agente:** Preparador de Exámenes · **Unidad 1** · Basado en `conocimiento/` y el texto de las normas de la carpeta.\n**Formato de la evaluación:** no consta en el sílabo (cuestionario o estudio de caso). Este simulacro mezcla preguntas objetivas y casos.\n**Marcas:** [Clase] sale de lo dicho por el docente; [Guía] de la guía o el sílabo; [Propia] elaboración propia. Respuestas al final, con su fundamento.\n\n**Alcance:** semanas 2 a 4: la medicina forense y su aplicación, lesionología (lesiones por arma de fuego) y tanatología. El docente dijo que la diferencia entre espasmo y rigidez cadavérica \"normalmente se toma en el examen\". Evaluación: domingo 8 de noviembre, 13h00 a 14h00. Docente: Abg. José David Mazón Loayza.\n\n## Preguntas de memoria\n\n1. Defina medicina legal. ¿Por qué \"medicina criminal\" es incorrecto? [Clase 2]\n2. Enumere las doce divisiones de la medicina legal. [Clase 2]\n3. ¿Qué es un arma de fuego y qué estudia la balística de efectos? [Diapositiva S3]\n4. ¿Qué es el anillo de Fisch y qué demuestra? [Diapositiva S3]\n5. Nombre los signos en la ropa por disparo a corta distancia. [Diapositiva S3]\n6. Enumere los fenómenos cadavéricos recientes. [Diapositiva S4]\n\n## Preguntas de comprensión\n\n7. Diferencie tatuaje verdadero y negro de humo. ¿Qué indican sobre la distancia? [Diapositiva S3]\n8. Diferencie rigidez y espasmo cadavérico. [Clase 4; \"se toma en el examen\"]\n9. ¿Por qué las livideces no aparecen en las zonas de presión y qué indican? [Clase 4]\n10. ¿Cómo contribuye la medicina forense a los procesos judiciales? [Foro]\n\n## Preguntas de aplicación\n\n11. Un cadáver aparece en un terreno baldío con mancha verde abdominal y livideces fijas. ¿Qué etapa y qué tiempo aproximado sugiere? [Propia, a partir de la clase 4]\n12. Un orificio de entrada tiene anillo de Fisch, pero no hay tatuaje ni negro de humo en la piel. ¿Qué puede decir sobre la distancia? [Propia]\n\n## Caso práctico\n\n13. **Caso de arma de fuego** [Propia, inspirado en el caso del video foro]: se halla una persona con una herida de entrada con tatuaje verdadero y deshilachamiento crucial en la camisa. Indique qué signos observaría, qué dice cada uno sobre la distancia del disparo, qué pericias intervienen y cómo se relaciona con el dolo en Derecho Penal.\n\n## Respuestas sugeridas\n\n1. Rama de la medicina que sirve de puente con el derecho y asesora sobre cuestiones biológicas, físicas, químicas y patológicas útiles para aplicar las normas (Basile, 2023). \"Medicina criminal\" restringe la disciplina al derecho penal.\n\n2. Jurisprudencia médica, traumatología médico legal, tanatología, asfixiología, toco-ginecología forense, sexología, pediatría médico legal, criminalística, toxicología forense, psiquiatría forense, genética forense y deontología médica.\n\n3. Arma de fuego: usa la energía de la combustión de la pólvora para lanzar un proyectil a distancia. Balística de efectos: los efectos que el proyectil produce al llegar al blanco.\n\n4. Anillo contusivo-excoriativo más anillo de enjugamiento, superpuestos. Siempre está presente, sin importar la distancia, y atestigua el carácter vital de la lesión.\n\n5. Deshilachamiento crucial de Rojas, escarapela de Simonin y calcado de la trama de Bonnet.\n\n6. Deshidratación, enfriamiento, livideces, rigidez y espasmo.\n\n7. El tatuaje verdadero tiene granos de pólvora incrustados y no se borra al lavar; el negro de humo (falso tatuaje) se borra. Ambos indican disparo a corta distancia.\n\n8. La rigidez es el endurecimiento muscular posterior a la relajación inicial, comienza en mandíbula y cuello y aparece entre 3 y 6 horas. El espasmo es una rigidez instantánea que fija la actitud del momento de una muerte brusca, es excepcional y no se simula.\n\n9. Porque la presión impide la sedimentación de la sangre en esas zonas (los \"falsos surcos\"); las livideces señalan la posición del cadáver y son visibles desde las 3 horas.\n\n10. Aporta prueba pericial técnica en delitos contra la vida, delitos sexuales y agresiones físicas, y se complementa con la criminalística (escena), la autopsia médico legal y la pericia psicológica (clase 2).\n\n11. La mancha verde abdominal es el primer signo de putrefacción (24 a 36 horas); sugiere más de un día de evolución. La fijación de livideces refuerza un tiempo avanzado. Es una estimación (data de la muerte) que debe confirmar la autopsia.\n\n12. El anillo de Fisch está en toda distancia, así que por sí solo no la define. La ausencia de tatuaje y de negro de humo sugiere disparo a larga distancia (sin granos de pólvora, humo ni llama).\n\n13. Tatuaje verdadero y deshilachamiento de Rojas indican corta distancia; se observaría también el anillo de Fisch, que prueba que la lesión fue en vida. Intervienen el perito médico legal (autopsia) y la criminalística (escena, balística). La distancia puede orientar la intención (dolo) en la tipicidad subjetiva; es una conexión por verificar con el docente de Penal.\n","repaso":"# Hoja de repaso rápido: Medicina Legal, unidad 1\n\n**Agente:** Constructor de Material · Fuentes: `conocimiento/medicina_legal/`. Evaluación: domingo 8 de noviembre, 13h00 a 14h00. Docente: Abg. José David Mazón Loayza.\n\n## Temas prioritarios\n\n1. ★★★★★ **Espasmo frente a rigidez cadavérica:** el docente dijo que \"normalmente se toma en el examen\".\n2. ★★★★★ **Lesiones por arma de fuego:** anillo de Fisch, tatuaje verdadero frente a negro de humo, signos en la ropa (Rojas, Simonin, Bonnet), distancia del disparo.\n3. ★★★★ **Fenómenos cadavéricos:** livideces, enfriamiento, rigidez, espasmo, putrefacción (mancha verde), data de la muerte.\n4. ★★★★ **Medicina legal:** definición, denominaciones, \"medicina criminal\" es incorrecto, las 12 divisiones.\n\n## Cuadro: fenómenos cadavéricos recientes\n\n| Fenómeno | Qué es | Cuándo |\n|---|---|---|\n| Deshidratación | Pérdida de líquidos; desecación de mucosas | No consta en el material |\n| Enfriamiento | Iguala la temperatura ambiente, de afuera hacia adentro | 24 horas |\n| Livideces | Manchas rojo-violáceas en zonas declives; no aparecen donde hay presión | Visibles a las 3 horas |\n| Rigidez | Endurecimiento muscular; mandíbula y cuello primero; predominan flexores | 3 a 6 horas |\n| Espasmo | Rigidez instantánea que fija la actitud de la muerte brusca; no se simula | En el momento de la muerte |\n\n## Cuadro: disparo a corta frente a larga distancia\n\n| Signo | Corta | Larga |\n|---|---|---|\n| Tatuaje verdadero (pólvora incrustada) | Sí | No |\n| Negro de humo (se borra al lavar) | Sí | No |\n| Deshilachamiento de Rojas, escarapela de Simonin, calcado de Bonnet en la ropa | Sí | No |\n| Anillo de Fisch | Sí | Sí (siempre; prueba que la lesión fue en vida) |\n\n## Práctica\n\n`salida/examenes/medicina_legal_simulacro_unidad_01.md`, `salida/flashcards/medicina_legal_unidad_01.csv` y el banco de 50 preguntas de tanatología en `salida/material_estudio/MedicinaLegal/Entregables/`.\n","guia":"# Análisis de guía y sílabo: Medicina Legal\n\n**Agente:** Analista de Guías · **Fuentes:** `entrada/guias/MedicinaLegal/Guia_Medicina_Legal.pdf` y `Silabo_Medicina_Legal.pdf`\n\n## Datos de la materia\n\n| Dato | Valor |\n|---|---|\n| Carrera / modalidad | Derecho, Unidad de Educación a Distancia (UNL), IV ciclo, paralelo D |\n| Periodo | Septiembre 2026 – marzo 2027 según el sílabo (la clase 2 habla de septiembre 2026 – febrero 2027) |\n| Docente y autor del sílabo | José David Mazón Loayza (jose.mazon@unl.edu.ec). Abogado, Licenciado en Criminalística, Magíster en Criminalística y Ciencias Forenses |\n| Código | M5C4A1 / UNESCO 3203 |\n| Horas | 80 en total (unidades de 30, 25 y 25 horas) |\n| Prerrequisito | No aplica. Es correquisito de Derecho Penal |\n| Proyecto integrador | Clínica Jurídica II – Práctica Civil |\n| Tutorías | No obligatorias ni calificadas; el docente las dicta en el paralelo D por la tarde |\n\n## Unidades y temas (estructura oficial del sílabo)\n\n| Unidad | Nombre | Semanas | Resultado de aprendizaje |\n|---|---|---|---|\n| 1 | Medicina forense y su aplicación | 1–6 (28 sep – 8 nov 2026) | Establece los conceptos, procedimientos y rutinas de la medicina forense y su aplicación a procesos judiciales |\n| 2 | Pericia médico forense | 7–12 (9 nov – 16 dic 2026) | Resuelve qué tipo de experticia e informe se requiere en casos que alteren la integridad materno infantil y sexual |\n| 3 | Alteraciones sexuales | 13–19 (4 ene – 21 feb 2027) | Aborda las alteraciones sexuales que configuran un delito |\n\n**Temas:** U1: medicina forense, tanatología y traumatología (el APE trata la lesionología médico legal; el AA, tanatología forense). U2: medicina forense materno infantil y sexológica (maltrato infantil, investigación médico legal de la muerte, pericias en delitos sexuales, pediatría y obstetricia médico legales; COIP arts. 147 a 150; Resolución 073-FGE-2014). U3: parafilias o aberraciones sexuales relacionadas con la justicia; trastornos de la sexualidad; psiquiatría forense penal; el trastorno mental como causa de inculpabilidad (COIP arts. 34 a 36; guía de criterios DSM-5).\n\n## Actividades y puntos (10 puntos por unidad)\n\n| Componente | Actividad | Puntos |\n|---|---|---|\n| ACD (20 %) | Foro académico (3 preguntas: análisis, debate y síntesis) | 1,00 |\n| ACD | Video foro (sincrónico por Zoom; el sílabo exige cámara encendida) | 1,00 |\n| AA (20 %) | U1: lectura de Basile (págs. 343-428) y test de 50 preguntas en 60 minutos en el EVA (dato de la clase 3). El sílabo habla de dos trabajos (1 y 2) | 2,00 |\n| APE (25 %) | U1: lesionología médico legal (lectura de Basile, págs. 250-286, estudio de caso y ficha de análisis de caso en PDF) | 2,50 |\n| Evaluación sumativa (35 %) | Evaluación de fin de unidad | 3,50 |\n\nActividad opcional: visita al Centro de Investigación Forense (el docente la ubica en la unidad 2, después de los temas de investigación de la muerte y de las pericias en delitos sexuales).\n\n## Fechas importantes\n\n| Hito | Fecha |\n|---|---|\n| Taller de inducción | 28, 29 y 30 de septiembre 2026 |\n| U1: foro / video foro | 28 sep – 25 oct / 26 oct – 1 nov 2026 |\n| U1: autónoma 1 / APE | 28 sep – 18 oct / 28 sep – 1 nov 2026 |\n| Evaluación de la unidad 1 | 7 y 8 de noviembre 2026 |\n| Evaluación de la unidad 2 | 15 y 16 de diciembre 2026 |\n| Evaluación de la unidad 3 | 20 y 21 de febrero 2027 |\n| Semana del estudiante | 10, 11 y 12 de febrero 2027 |\n| Evaluación de recuperación | 8–12 de marzo 2027 |\n\n**Evaluación de recuperación (sílabo):** solo quien reprobó menos del 20 % de las horas; se rinde una sola evaluación; se califica con el 60 % y se suma al 40 % de la nota de la asignatura; la nota mínima para acceder es 2,75/10; la nota de aprobación es 7/10. No aplica a quien reprueba por inasistencias o retiro, ni en tercera matrícula. La nota final es el promedio de las tres unidades.\n\n## Bibliografía\n\n- **Básica virtual:** Basile, Alejandro A., *Tratado de Medicina Legal para médicos y abogados* (Cathedra Jurídica, 2001/2023, ISBN 978-987-8904-32-0); Rodríguez Cely, L. A., *Intervención interdisciplinaria en casos de abuso sexual infantil* (Universitas Psychologica, ISSN 1657-9267).\n- **Lecturas de la guía y del sílabo:** Vázquez Fanego, Héctor, *Investigación medicolegal de la muerte* (U2); Resolución No. 073-FGE-2014 (U2); Patitó, José Ángel, *Medicina Legal* (U3, págs. 367-369 y 373-380 sobre el DSM-5); Santillán Montenegro y Santacruz Cruz, *La inimputabilidad por trastorno mental en el COIP* (U3).\n- **En la clase y las diapositivas:** Raffo (2016) sobre espasmo cadavérico y Robalino (2020) como fuente de fotografías.\n\n## Normas de entrega\n\nRúbricas por actividad; las fichas se entregan en PDF. No se reciben tareas fuera de plazo (acta de acuerdos y compromisos). Las actividades no calificadas se habilitan cada semana y quedan abiertas hasta el final del ciclo.\n\n## Alertas\n\n1. **Cámara en el video foro.** El sílabo dice que la participación es obligatoria y con cámara encendida; el docente dijo en la clase 2 que no exige cámara, salvo en las evaluaciones. Preguntar cuál rige.\n2. **Periodo.** Sílabo: sept. 2026 – marzo 2027. Clase: sept. 2026 – febrero 2027. La recuperación (marzo) explica la diferencia.\n3. **Test de la unidad 1.** La clase 3 habló de un test de 50 preguntas en 60 minutos y de un estudiante que, con adaptación curricular, hace un video. Un estudiante dijo que el EVA no tenía dónde subir el video; el sílabo habla de dos trabajos autónomos (1 y 2). Confirmar en el EVA.\n4. **Tanatología en el AA.** El sílabo coloca la tanatología en el trabajo autónomo (lectura de Basile págs. 343-428); en la clase 4 el docente la dictó como contenido de la unidad 1.\n5. **Año de Basile.** El sílabo da 2001 y 2023; la diapositiva cita 2023.\n6. **Las tablas de la guía están incompletas** (Actividad 1: ... en el resumen, como en las otras materias).\n7. **Presenciales.** El sílabo no da fechas; la guía indica 7–8 nov, 15–16 dic y 20–21 feb.\n8. **Próximos vencimientos (hoy es 28 oct 2026):** el video foro de la unidad 1 y el APE vencen el 1 de noviembre. El foro cerró el 25 de octubre. Evaluación de la unidad 1: 7 y 8 de noviembre.\n","mapas":[{"id":"fenomenos","titulo":"Fenómenos cadavéricos recientes","nota":"Del más inmediato al más tardío.","tipo":"linea","datos":{"puntos":[{"cuando":"Al morir","t":"Espasmo","n":"Rigidez instantánea que fija la actitud de la muerte brusca. No se simula."},{"cuando":"3 horas","t":"Livideces","n":"Manchas rojo-violáceas en zonas declives. No aparecen donde hay presión."},{"cuando":"3 a 6 horas","t":"Rigidez","n":"Endurecimiento muscular. Mandíbula y cuello primero. Predominan los flexores."},{"cuando":"24 horas","t":"Enfriamiento","n":"Iguala la temperatura ambiente, de afuera hacia adentro."}],"pie":"La deshidratación (pérdida de líquidos, desecación de mucosas) no tiene hora en el material. La putrefacción (mancha verde) es un fenómeno tardío."}},{"id":"espasmo-rigidez","titulo":"Espasmo frente a rigidez cadavérica","nota":"El docente dijo que esta diferencia \"normalmente se toma en el examen\".","tipo":"comparar","datos":{"cols":[{"t":"Espasmo cadavérico","destacado":true,"items":["Aparece en el momento de la muerte","Es instantáneo","Fija la actitud de la muerte brusca","No se simula"]},{"t":"Rigidez cadavérica","items":["Aparece entre 3 y 6 horas","Es progresivo","Empieza por mandíbula y cuello","Predominan los flexores"]}]}},{"id":"distancia","titulo":"Disparo a corta frente a larga distancia","tipo":"comparar","datos":{"cols":[{"t":"Corta distancia","items":["Tatuaje verdadero (pólvora incrustada)","Negro de humo (se borra al lavar)","Deshilachamiento de Rojas en la ropa","Escarapela de Simonin","Calcado de Bonnet","Anillo de Fisch"]},{"t":"Larga distancia","items":["Sin tatuaje","Sin negro de humo","Sin signos en la ropa","Anillo de Fisch: sí aparece siempre"]}],"pie":"El anillo de Fisch aparece en ambos casos y prueba que la lesión fue en vida."}},{"id":"arma-fuego","titulo":"Lesiones por arma de fuego","tipo":"arbol","datos":{"t":"Signos del disparo","c":[{"t":"En la piel","c":[{"t":"Anillo de Fisch","n":"siempre; prueba lesión en vida"},{"t":"Tatuaje verdadero","n":"pólvora incrustada; corta distancia"},{"t":"Negro de humo","n":"se borra al lavar; corta distancia"}]},{"t":"En la ropa","c":[{"t":"Rojas","n":"deshilachamiento"},{"t":"Simonin","n":"escarapela"},{"t":"Bonnet","n":"calcado"}]}]}},{"id":"divisiones","titulo":"Las 12 divisiones de la medicina legal","nota":"\"Medicina criminal\" es incorrecto porque restringe la disciplina al derecho penal. Las tres ramas son una agrupación propia para memorizar las 12 divisiones; el docente no las agrupó así.","tipo":"arbol","datos":{"t":"Medicina legal","n":"también: forense, legal judicial, pericial, jurídica, del derecho","c":[{"t":"Del cuerpo","c":[{"t":"Traumatología médico legal"},{"t":"Tanatología"},{"t":"Asfixiología"},{"t":"Toxicología forense"}]},{"t":"De la persona","c":[{"t":"Toco-ginecología forense"},{"t":"Sexología"},{"t":"Pediatría médico legal"},{"t":"Psiquiatría forense"},{"t":"Genética forense"}]},{"t":"Del ejercicio y la prueba","c":[{"t":"Jurisprudencia médica"},{"t":"Criminalística"},{"t":"Deontología médica"}]}]}}]},{"id":"procesal","nombre":"Derecho Procesal II (No Penal)","corto":"Procesal II","docente":"Abg. Ximena Orosco Aguilar","color":"#B07A1E","colorOscuro":"#E3B25F","evaluacion":{"inicio":"2026-11-07T10:00","fin":"2026-11-07T12:00"},"unidades":[{"id":"unidad_01_actos_de_proposicion_y_medios_de_prueba","num":1,"titulo":"Unidad 1 · Actos de proposición y medios de prueba (sílabo)","pendiente":false,"estructura":"","temas":[{"id":"actos_de_proposicion_demanda_contestacion_y_reconvencion","titulo":"Actos de proposición (COGEP, arts. 141 a 157)","docs":[{"k":"conceptos","n":"Conceptos","md":"# Conceptos: Actos de proposición: demanda, contestación y reconvención\n\n## Demanda (arts. 141 a 150)\n\n- Todo proceso comienza con la demanda (art. 141). Es el acto procesal que materializa el derecho de acción; su núcleo es la **pretensión** y exige legitimación en la causa activa y pasiva. [Guía]\n- Contenido: **trece numerales** del art. 142: juzgador, datos del actor, RUC, datos y lugar de citación del demandado, hechos numerados, fundamentos de derecho, anuncio de prueba, acceso judicial a la prueba, pretensión, cuantía, procedimiento, firmas y demás requisitos.\n- Documentos anexos (art. 143): poder, habilitantes de representación, cédula, calidad invocada, prueba disponible y los demás exigidos por ley. La prueba que no se acompaña ni se anuncia no se puede practicar.\n- Calificación (art. 146): en un máximo de **cinco días** el juez examina los requisitos; si faltan, ordena completar o aclarar en cinco días; si no se cumple, archivo (apelable).\n- Inadmisión (art. 147): incompetencia o indebida acumulación de pretensiones, o demanda manifiestamente inadmisible; providencia apelable.\n- Reforma (art. 148): hasta antes de la contestación; si después sobreviene un **hecho nuevo**, hasta antes de la audiencia preliminar o única. En el procedimiento sumario no procede reformar (art. 333.1).\n- Efectos de la calificación (art. 149): la competencia no cambia y las partes conservan la legitimación.\n- Pluralidad de pretensiones (art. 145): misma competencia, no contrarias y mismo procedimiento.\n\n## Contestación (arts. 151 a 157)\n\n- Nace del derecho de contradicción. Se presenta por escrito con los mismos requisitos formales; debe pronunciarse sobre cada pretensión, la veracidad de los hechos y la autenticidad de los documentos, y deducir **todas** las excepciones (art. 151). Debe anunciar toda su prueba (art. 152).\n- Excepciones **previas** (art. 153, taxativas): incompetencia, incapacidad o falta de personería, falta de legitimación o litisconsorcio incompleto, error en la forma, inadecuación del procedimiento o indebida acumulación, litispendencia, prescripción, caducidad, cosa juzgada, transacción, entre otras. Son de forma y subsanables. Las de **fondo** atacan la pretensión y pueden terminar el proceso. [Guía; COGEP]\n- Falta de contestación o respuesta sin pronunciamiento expreso: se aprecia como **negativa** de los hechos, salvo que la ley atribuya otro efecto (art. 157).\n- **Allanamiento:** aceptar total o parcialmente la pretensión (ver tema de formas de conclusión).\n\n## Reconvención (arts. 154 a 156)\n\n- Es la contrademanda: el demandado demanda al actor en el mismo proceso. Procede en todos los casos salvo los previstos en la ley (no en alimentos); se rigen por las reglas de la demanda; se tramita y resuelve **junto con la demanda y las excepciones** (misma sentencia).\n- El actor reconvenido contesta en el tiempo y la forma de la contestación (art. 155). En el sumario solo se admite reconvención **conexa** (art. 333.2).\n\n## Preclusión y anuncio de la prueba\n\n- La demanda y la contestación son los actos en que se anuncia y adjunta la prueba; la que no se anuncia no se puede introducir en la audiencia, salvo las excepciones del COGEP (art. 159). Ver el tema de la prueba.\n## Ampliación del video de Cando y de la tutoría de la semana 6 (7-nov-2026)\n\n- **Elementos del acto de proposición:** escrito; hechos (fundamentos de hecho); sujetos activo y pasivo; medios de prueba (testimonial, documental, pericial y ocular o inspección judicial); normas jurídicas (fundamentos de derecho); pretensión ajustada a una norma. [Video Cando]\n- Son **cuatro** actos: demanda, contestación a la demanda, reconvención y contestación a la reconvención (arts. 141 a 157, Libro III, título I). La docente Orosco los simplifica como \"la demanda\" en clase; en el examen conviene nombrar los cuatro.\n- **Contestar no es reconvenir:** al contestar el demandado solo se defiende; para contraatacar (por ejemplo, pedir la prescripción adquisitiva frente a una reivindicación) debe reconvenir. [Video Cando]\n- La reconvención abre un proceso **en paralelo** y el juez resuelve ambos en la sentencia (art. 154). Va en el **mismo procedimiento** que la demanda. Aplica las reglas de la demanda \"en lo pertinente\": se omite lo innecesario, como el dato de citación del demandado.\n- **No procede la reconvención** en alimentos (art. 154) ni en el procedimiento monitorio (art. 359). En laborales (art. 150) y en el sumario (art. 333 num. 2) solo cabe la **conexa**.\n- **Pruebas de cargo y de descargo:** el actor y el reconviniente anuncian pruebas de cargo; el demandado y el reconvenido, de descargo.\n- Contestación a la reconvención: la hace el actor, ahora **reconvenido**, frente al **reconviniente**; mismos requisitos que la contestación (arts. 151 a 153 y 155).\n- Dicho de la docente en la semana 6: el cuestionario \"está en base a todo lo que hemos visto\" y pide explicar el porqué de cada respuesta.\n"},{"k":"definiciones","n":"Definiciones","md":"# Definiciones: Actos de proposición: demanda, contestación y reconvención\n\n## Acto de proposición\n\nActuación de las partes que inicia el juicio, formula pretensiones o excepciones y delimita el objeto del litigio: demanda, contestación, reconvención y contestación a la reconvención. [Diapositiva semana 5]\n\n## Pretensión\n\nLo que se exige al demandado; núcleo de la demanda. [Guía]\n\n## Legitimación en la causa\n\nCalidad jurídica para pedir (activa) o para que se le pida (pasiva); límite del derecho de acción. [Guía]\n\n## Excepción\n\nMedio por el cual el demandado controvierte la pretensión; previa o de fondo. [Guía; COGEP 153]\n\n## Reconvención\n\nDemanda del demandado contra el actor dentro del mismo proceso. [Guía; COGEP 154]\n\n## Preclusión\n\nPérdida de la oportunidad procesal de realizar un acto: por ejemplo, anunciar prueba después de la demanda o la contestación. [Diapositiva; COGEP 159]\n## Definiciones del video de Cando (7-nov-2026)\n\n- **Actos de proposición:** escritos en los que se hace conocer al juez la existencia de ciertos hechos atribuidos a determinadas personas y que son susceptibles de acarrearles consecuencias jurídicas de ser comprobados en un procedimiento judicial.\n- **Demanda:** escrito con el que el accionante inicia un proceso judicial y hace conocer al juez hechos comprobables y susceptibles de acarrear consecuencias jurídicas al demandado.\n- **Contestación a la demanda:** escrito en el que el demandado se pronuncia sobre la veracidad de los hechos, la autenticidad, utilidad, pertinencia y conducencia de la prueba y cada pretensión del actor, indicando lo que admite y lo que niega; deduce excepciones y anuncia los medios de prueba para desvirtuar las pretensiones.\n- **Reconvención:** escrito de contrademanda con el que el demandado contraataca judicialmente al actor, haciendo conocer al juez otros hechos comprobables y susceptibles de acarrearle consecuencias jurídicas.\n- **Contestación a la reconvención:** defensa del actor (reconvenido) contra el reconviniente.\n- **Prueba de cargo / de descargo:** la que anuncia quien ataca (actor, reconviniente) / la que anuncia quien se defiende (demandado, reconvenido).\n"},{"k":"ejemplos","n":"Ejemplos","md":"# Ejemplos: Actos de proposición: demanda, contestación y reconvención\n\n- **Divorcio (docente, semana 5):** la parte actora afirma que abandonó el hogar el 5 de enero de 2020; el debate queda fijado y toda la prueba se dirige a ese hecho.\n- **Video foro (caso Carmen v. Esteban, alimentos):** Carmen no anunció prueba sobre los ingresos de Esteban; no puede introducirla después (art. 159), la prueba nueva exige lo que dice el art. 166 y el juez no puede suplir su omisión con prueba de oficio (art. 168).\n- **APE (letra de cambio):** demanda ejecutiva de USD 8.000 y contestación con la excepción de extinción parcial por un abono de USD 2.500 (art. 353, num. 3).\n- **Reivindicación y prescripción (video Cando):** el actor pide la reivindicación; el demandado posee el bien hace más de 15 años con ánimo de señor y dueño. En la contestación solo puede defenderse; para que el juez le declare la prescripción adquisitiva debe reconvenir. El juez resuelve ambas pretensiones en la sentencia.\n- **Reconvención cone
