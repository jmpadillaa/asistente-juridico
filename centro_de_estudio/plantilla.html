<title>Centro de estudio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=Literata:opsz,wght@7..72,400..700&display=swap">
<style>
/* Concepto: apuntes de facultad. Barra lateral con las cuatro materias, cada una con su color; hojas claras tipo cuaderno; la parte visual (mapas, cuadros, líneas de tiempo) usa el color de la materia. */
:root {
  --bg: #F1F4F8; --surface: #FFFFFF; --surface2: #E8EDF3; --ink: #15202B; --ink2: #47586C;
  --line: #D5DCE5; --accent: #1D4E89; --on-accent: #FFFFFF;
  --ok: #1F7A4D; --warn: #A8640A; --bad: #B3342B;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Literata", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --on-m: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141B; --surface: #161F29; --surface2: #1E2A36; --ink: #E7EEF5; --ink2: #A2B3C5;
    --line: #2A3947; --accent: #7DB0EA; --on-accent: #0E141B;
    --ok: #5CCB97; --warn: #E3AA55; --bad: #EF8F86; --on-m: #0E141B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141B; --surface: #161F29; --surface2: #1E2A36; --ink: #E7EEF5; --ink2: #A2B3C5;
  --line: #2A3947; --accent: #7DB0EA; --on-accent: #0E141B;
  --ok: #5CCB97; --warn: #E3AA55; --bad: #EF8F86; --on-m: #0E141B; color-scheme: dark;
}
.mt { --m: var(--ml); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mt { --m: var(--md); } }
:root[data-theme="dark"] .mt { --m: var(--md); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 40; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; }
a { color: var(--accent); }

#app { display: grid; grid-template-columns: 252px minmax(0, 1fr); gap: 28px; max-width: 1240px; margin: 0 auto; padding-block: 16px 96px; }
#side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; max-height: calc(100vh - 32px); overflow: auto; display: flex; flex-direction: column; gap: 18px; }
#main { min-width: 0; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; line-height: 1.1; }
.brand small { display: block; font-family: var(--f-mono); font-weight: 400; font-size: .72rem; color: var(--ink2); letter-spacing: .04em; text-transform: uppercase; margin-top: 4px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav h6 { margin: 12px 0 4px; font: 500 .7rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.nv { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; border: 0; background: none; text-align: left; font-family: var(--f-display); font-weight: 600; font-size: .95rem; width: 100%; color: var(--ink); }
.nv:hover { background: var(--surface2); }
.nv[aria-current="true"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--m, var(--accent)); flex: none; }
.nv .pct { margin-left: auto; font: 500 .75rem var(--f-mono); color: var(--ink2); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font: 400 .75rem var(--f-mono); color: var(--ink2); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-family: var(--f-display); font-weight: 600; font-size: .9rem; }
.btn:hover { background: var(--surface2); }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.sm { padding: 5px 9px; font-size: .8rem; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: transparent; }
.sync { display: flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.sync.on i { background: var(--ok); }

#bottom { display: none; }
@media (max-width: 899px) {
  #app { grid-template-columns: minmax(0, 1fr); gap: 0; padding-block: 12px 100px; }
  #side { display: none; }
  #bottom { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  #bottom button { border: 0; background: none; font: 600 .68rem var(--f-display); padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink2); }
  #bottom button[aria-current="true"] { color: var(--accent); }
  #bottom svg { width: 22px; height: 22px; }
}

/* encabezados de vista */
.vh { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 16px; margin-bottom: 18px; }
.vh h1 { font-size: clamp(1.7rem, 4.5vw, 2.4rem); font-weight: 800; letter-spacing: -0.02em; }
.vh p { margin: 4px 0 0; color: var(--ink2); font-size: .95rem; }
.kicker { font: 500 .72rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.sec { margin-top: 28px; }
.sec > h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: baseline; gap: 10px; }
.sec > h2 small { font: 400 .75rem var(--f-mono); color: var(--ink2); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }

/* evaluaciones */
.evs { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.ev { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 14px 18px; overflow: hidden; display: flex; flex-direction: column; gap: 2px; text-align: left; }
.ev::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--m); }
.ev b { font-family: var(--f-display); font-size: 1.05rem; }
.ev .cuando { font: 400 .8rem var(--f-mono); color: var(--ink2); }
.ev .falta { font: 700 1.55rem var(--f-display); letter-spacing: -0.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.ev.next { box-shadow: 0 0 0 2px var(--m); }
.ev.done { opacity: .6; }
.ev .tag { align-self: flex-start; font: 500 .65rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; background: var(--m); color: var(--on-m); border-radius: 4px; padding: 1px 6px; margin-bottom: 4px; }

/* progreso */
.prog { display: grid; gap: 10px; }
.pr { display: grid; grid-template-columns: minmax(110px, 160px) 1fr; gap: 6px 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-align: left; width: 100%; }
.pr b { font-family: var(--f-display); display: flex; align-items: center; gap: 8px; }
.pr .bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 74px 1fr 56px; align-items: center; gap: 8px; font: 400 .72rem var(--f-mono); color: var(--ink2); }
.bar span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.track { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--m); border-radius: 4px; }
@media (max-width: 560px) { .pr { grid-template-columns: 1fr; } .bar { grid-template-columns: 66px 1fr 48px; } }

/* tareas */
.tl { display: flex; flex-direction: column; gap: 6px; }
.tk { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.tk input[type=checkbox], .chk { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--m, var(--accent)); flex: none; }
.tk .tt { font-family: var(--f-display); font-weight: 600; line-height: 1.3; }
.tk.hecho .tt { text-decoration: line-through; color: var(--ink2); font-weight: 500; }
.tk .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font: 400 .74rem var(--f-mono); color: var(--ink2); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 1px 9px 1px 7px; background: var(--surface2); font: 500 .72rem var(--f-mono); color: var(--ink); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--m); }
.pill.warn { color: var(--warn); }
.pill.bad { color: var(--bad); }
.tk .nota { grid-column: 2; font-size: .85rem; color: var(--ink2); line-height: 1.45; }
.grp { margin: 18px 0 8px; font: 500 .72rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); display: flex; gap: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font: 600 .82rem var(--f-display); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: transparent; }
form.add { display: grid; grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr)) auto; gap: 8px; margin-top: 12px; }
form.add input, form.add select, .field { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }
@media (max-width: 700px) { form.add { grid-template-columns: 1fr 1fr; } form.add input[name=t] { grid-column: 1 / -1; } }

/* materia */
.mh { background: var(--m); color: var(--on-m); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: end; }
.mh h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 800; letter-spacing: -0.02em; }
.mh p { margin: 2px 0 0; opacity: .9; font-size: .9rem; }
.mh .ex { font: 500 .78rem var(--f-mono); text-align: right; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tab { border: 0; background: none; padding: 9px 12px; border-radius: 8px 8px 0 0; font: 600 .92rem var(--f-display); color: var(--ink2); white-space: nowrap; border-bottom: 3px solid transparent; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--m); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.mc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 16px 20px; position: relative; overflow: hidden; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.mc::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--m); }
.mc b { font: 700 1.15rem var(--f-display); }
.mc span { font-size: .85rem; color: var(--ink2); }

/* temas */
.un { margin-bottom: 22px; }
.un h3 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.un h3 small { font: 400 .72rem var(--f-mono); color: var(--ink2); }
.tm { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
.tm .open { text-align: left; border: 0; background: none; padding: 2px 0; font: 600 1rem var(--f-display); line-height: 1.3; }
.tm .open small { display: block; font: 400 .72rem var(--f-mono); color: var(--ink2); margin-top: 2px; }
.tm.hecho { background: color-mix(in srgb, var(--m) 10%, var(--surface)); }
.soon { border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; color: var(--ink2); font-size: .9rem; }
.dtabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
.th { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }
.th h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; }

/* clases */
details.cl { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
details.cl > summary { cursor: pointer; padding: 12px 16px; font: 600 1rem var(--f-display); list-style: none; display: flex; align-items: center; gap: 10px; }
details.cl > summary::-webkit-details-marker { display: none; }
details.cl > summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--ink2); border-bottom: 2px solid var(--ink2); transform: rotate(-45deg); transition: transform .15s; flex: none; }
details.cl[open] > summary::before { transform: rotate(45deg); }
details.cl .md { padding: 0 16px 16px; }

/* markdown */
.md { max-width: 78ch; overflow-wrap: anywhere; }
.md.wide { max-width: none; }
.md h1 { font-size: 1.5rem; font-weight: 800; margin: 4px 0 12px; }
.md h2 { font-size: 1.2rem; font-weight: 700; margin: 24px 0 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.md h3 { font-size: 1.02rem; font-weight: 700; margin: 18px 0 6px; }
.md p { margin: 0 0 12px; }
.md ul, .md ol { padding-left: 1.3em; margin: 0 0 12px; }
.md li { margin: 3px 0; }
.md code { font-family: var(--f-mono); font-size: .85em; background: var(--surface2); padding: 1px 5px; border-radius: 4px; }
.md blockquote { margin: 0 0 12px; padding: 4px 14px; border-left: 3px solid var(--m, var(--accent)); color: var(--ink2); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.md strong { font-weight: 700; }
.tw { overflow-x: auto; margin: 0 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.tw table { border-collapse: collapse; width: 100%; font-size: .9rem; line-height: 1.45; }
.tw th, .tw td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; min-width: 90px; }
.tw th { font: 700 .82rem var(--f-display); background: color-mix(in srgb, var(--m, var(--accent)) 12%, var(--surface)); position: sticky; top: 0; }
.tw tr:last-child td { border-bottom: 0; }
.tw td:first-child { font-weight: 600; }

/* diagramas */
.dg { margin-bottom: 18px; }
.dg > h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 2px; }
.dg > p { margin: 0 0 10px; color: var(--ink2); font-size: .9rem; max-width: 78ch; }
.canvas { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; overflow-x: auto; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree li { display: flex; align-items: center; position: relative; }
.tree ul { display: flex; flex-direction: column; margin-left: 26px; position: relative; }
.tree ul::before { content: ""; position: absolute; left: -26px; top: 50%; width: 26px; border-top: 2px solid var(--line); }
.tree ul > li { padding: 4px 0 4px 26px; }
.tree ul > li::before { content: ""; position: absolute; left: 0; top: 50%; width: 26px; border-top: 2px solid var(--line); }
.tree ul > li::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 2px solid var(--line); }
.tree ul > li:first-child::after { top: 50%; }
.tree ul > li:last-child::after { bottom: 50%; }
.tree ul > li:only-child::after { display: none; }
.nd { border: 2px solid var(--m); border-radius: 10px; padding: 6px 11px; background: var(--surface); max-width: 280px; min-width: 96px; line-height: 1.3; font-size: .92rem; }
.nd b { font: 600 .95rem var(--f-display); display: block; }
.nd small { display: block; color: var(--ink2); font-size: .78rem; line-height: 1.35; margin-top: 2px; }
.nd.d0 { background: var(--m); color: var(--on-m); border-color: var(--m); }
.nd.d0 small { color: inherit; opacity: .9; }
.nd.d1 { background: color-mix(in srgb, var(--m) 18%, var(--surface)); }
.nd.d2 { background: color-mix(in srgb, var(--m) 7%, var(--surface)); }
.nd.d3 { border-width: 1px; border-style: dashed; }
@media (max-width: 640px) {
  .canvas { padding: 12px; }
  .tree li { display: block; }
  .tree ul { margin: 6px 0 2px 10px; padding-left: 14px; border-left: 2px solid var(--line); }
  .tree ul::before, .tree ul > li::before, .tree ul > li::after { display: none; }
  .tree ul > li { padding: 3px 0; }
  .nd { max-width: none; }
}
.flow { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px 0; counter-reset: paso; }
.flow li { counter-increment: paso; position: relative; flex: 1 1 190px; max-width: 280px; background: var(--surface); border: 2px solid var(--m); border-radius: 10px; padding: 10px 12px 10px 12px; margin-right: 26px; }
.flow li::before { content: counter(paso); position: absolute; top: -10px; left: 10px; width: 20px; height: 20px; border-radius: 50%; background: var(--m); color: var(--on-m); font: 700 .72rem var(--f-mono); display: grid; place-items: center; }
.flow li:not(:last-child)::after { content: ""; position: absolute; right: -24px; top: 50%; width: 22px; height: 22px; margin-top: -11px; background: var(--m); clip-path: polygon(0 28%, 55% 28%, 55% 0, 100% 50%, 55% 100%, 55% 72%, 0 72%); opacity: .55; }
.flow li.fin { background: var(--m); color: var(--on-m); }
.flow li b { font: 700 1rem var(--f-display); display: block; }
.flow li small { display: block; font-size: .8rem; line-height: 1.4; margin-top: 3px; color: var(--ink2); }
.flow li.fin small { color: inherit; opacity: .92; }
@media (max-width: 640px) {
  .flow { flex-direction: column; gap: 22px; }
  .flow li { margin-right: 0; max-width: none; flex-basis: auto; }
  .flow li:not(:last-child)::after { right: auto; left: 50%; top: auto; bottom: -22px; margin: 0 0 0 -11px; transform: rotate(90deg); }
}
.cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.cmp > div { border: 2px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.cmp > div.dest { border-color: var(--m); }
.cmp h4 { font: 700 1rem var(--f-display); padding: 9px 14px; background: color-mix(in srgb, var(--m) 16%, var(--surface)); }
.cmp .dest h4 { background: var(--m); color: var(--on-m); }
.cmp ul { margin: 0; padding: 10px 14px 12px 30px; font-size: .92rem; line-height: 1.45; }
.cmp li { margin: 4px 0; }
.line { list-style: none; margin: 0; padding: 22px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; position: relative; }
.line::before { content: ""; position: absolute; left: 0; right: 0; top: 11px; border-top: 3px solid var(--line); }
.line li { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.line li::before { content: ""; position: absolute; top: -17px; left: 14px; width: 14px; height: 14px; border-radius: 50%; background: var(--m); border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--m); }
.line .cu { font: 500 .74rem var(--f-mono); color: var(--m); letter-spacing: .04em; text-transform: uppercase; }
.line b { font: 700 1rem var(--f-display); display: block; }
.line small { display: block; font-size: .82rem; color: var(--ink2); line-height: 1.4; margin-top: 2px; }
.pie { margin: 10px 0 0; font-size: .88rem; color: var(--ink2); border-left: 3px solid var(--m); padding-left: 10px; }

/* tarjetas */
.fc-wrap { max-width: 640px; }
.fc { perspective: 1200px; margin: 8px 0 14px; }
.fc-in { position: relative; min-height: 260px; transition: transform .45s; transform-style: preserve-3d; }
.fc.flip .fc-in { transform: rotateY(180deg); }
.fc-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 16px; border: 2px solid var(--m); background: var(--surface); padding: 22px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; overflow: auto; width: 100%; }
.fc-face.back { transform: rotateY(180deg); background: color-mix(in srgb, var(--m) 10%, var(--surface)); }
.fc-face .lab { position: absolute; top: 10px; left: 14px; font: 500 .68rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.fc-face .txt { font: 600 1.25rem var(--f-display); line-height: 1.35; }
.fc.flip .fc-face.front, .fc:not(.flip) .fc-face.back { pointer-events: none; }
.fc-face.back .txt { font: 400 1.05rem var(--f-body); }
.fc-nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.fc-go { display: flex; gap: 8px; flex-wrap: wrap; }
.btn.ok { background: var(--ok); color: #fff; border-color: transparent; }

  /* ---------- utilidades ---------- */

  }

  /* ---------- cálculos ---------- */

    return { tareas: [td, ts.length], temas: [tdh, te.length], tarjetas: [cdh, cs] };
  }
  function pct(a) { return a[1] ? Math.round(a[0] * 100 / a[1]) : 0; }
  function pctGlobal(m) { var p = progreso(m), a = p.tareas[0] + p.temas[0] + p.tarjetas[0], b = p.tareas[1] + p.temas[1] + p.tarjetas[1]; return b ? Math.round(a * 100 / b) : 0; }

  }
  function resultados() {
    var box = document.getElementById("resultados"); if (!box) return;
    var q = norm(nav.q).trim();
    if (q.length < 2) { box.innerHTML = '<div class="empty">Escribe al menos dos letras.</div>'; return; }
    if (!IDX) buildIdx();
    var partes = q.split(/\s+/), out = [];
    IDX.forEach(function (e, i) {
      var ok = partes.every(function (p) { return e.n.indexOf(p) >= 0; });
      if (ok) { var score = (norm(e.titulo).indexOf(q) >= 0 ? 5 : 0) + partes.length; out.push({ e: e, i: i, s: score }); }
    });
    out.sort(function (a, b) { return b.s - a.s; });
    if (!out.length) { box.innerHTML = '<div class="empty">No encontré nada con esas palabras.</div>'; return; }
    box.innerHTML = '<p class="small">' + out.length + " resultados" + (out.length > 40 ? " (muestro 40)" : "") + "</p>" + out.slice(0, 40).map(function (r) {
      var e = r.e, txt = e.texto.replace(/[#*|`>_-]+/g, " ").replace(/\s+/g, " "), nt = norm(txt), pos = nt.indexOf(partes[0]);
      var snip = pos >= 0 ? txt.slice(Math.max(0, pos - 60), pos + 140) : txt.slice(0, 140);
      var re = new RegExp("(" + partes.map(function (p) { return p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|") + ")", "ig");
      return '<button class="res mt" style="' + mstyle(e.m) + '" data-a="res" data-i="' + r.i + '"><span class="pill"><i></i>' + esc(MAT[e.m].corto) + "</span> <b>" + esc(e.titulo) + "</b><p>" + (pos > 60 ? "…" : "") + esc(snip).replace(re, "<mark>$1</mark>") + "…</p></button>";
    }).join("");
  }

  /* ---------- render ---------- */
  function render(keepScroll) {
    var y = window.scrollY;
    var vista = { inicio: vistaInicio, materias: vistaMaterias, materia: vistaMateria, tareas: vistaTareas, glosario: vistaGlosario, buscar: vistaBuscar, plan: vistaPlan }[nav.v] || vistaInicio;
    document.getElementById("main").innerHTML = vista();
    autolink(document.getElementById("main"));
    if (nav.v === "glosario") renderGlosarioLista();
    renderSide();
    if (nav.v === "buscar") resultados();
    lsSet("ce_nav", nav);
    if (keepScroll === true) window.scrollTo(0, y);
  }
  function irA(cambios, arriba) {
    Object.assign(nav, cambios);
    render();
    if (arriba !== false) window.scrollTo(0, 0);
  }
  function toast(t) {
    var el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 1800);
  }

  /* ---------- eventos ---------- */
  document.addEventListener("click", function (ev) {
    if (!ev.target.closest(".pop") && !ev.target.closest(".gl")) cerrarPop();
    var el = ev.target.closest("[data-a]"); if (!el) return;
    var a = el.dataset.a, d = el.dataset;
    if (el.tagName === "INPUT" && el.type === "checkbox") return;
    if (el.tagName === "FORM") return;
    if (a === "go") { if (d.v === "buscar") nav.q = nav.q || ""; irA({ v: d.v }); if (d.v === "buscar") { var q = document.getElementById("q"); if (q) q.focus(); } }
    else if (a === "mat") irA({ v: "materia", mat: d.m, tab: d.t || (nav.mat === d.m && nav.tab) || "mapas", un: null, tema: null, card: 0, flip: false });
    else if (a === "tab") { irA({ tab: d.t, un: null, tema: null, card: 0, flip: false }, false); }
    else if (a === "tema") irA({ un: d.u, tema: d.t, dtab: D.explicaciones[nav.mat + ":" + d.t] ? "_simple" : "conceptos" });
    else if (a === "gl") abrirPop(d.g);
    else if (a === "gl-cerrar") cerrarPop();
    else if (a === "gl-ver") { cerrarPop(); irA({ v: "glosario", gq: GL[d.g].t, gm: "todas" }); }
    else if (a === "glm") irA({ gm: d.f }, false);
    else if (a === "volver-temas") irA({ un: null, tema: null });
    else if (a === "dtab") irA({ dtab: d.d }, false);
    else if (a === "normas") { var m = MAT[nav.mat]; var box = document.querySelector("#main .mt > div:last-child"); if (box) box.innerHTML = '<p><button class="btn sm" data-a="volver-temas">&larr; Todos los temas</button></p><div class="md">' + md(m.normas) + "</div>"; window.scrollTo(0, 0); }
    else if (a === "ver-estructura") { var mm = MAT[nav.mat], u = mm.unidades.filter(function (x) { return x.id === d.u; })[0]; var b2 = document.querySelector("#main .mt > div:last-child"); if (b2 && u) b2.innerHTML = '<p><button class="btn sm" data-a="volver-temas">&larr; Todos los temas</button></p><div class="md">' + md(u.estructura) + "</div>"; window.scrollTo(0, 0); }
    else if (a === "voltear") { nav.flip = !nav.flip; var fc = document.querySelector(".fc"); if (fc) fc.classList.toggle("flip", nav.flip); }
    else if (a === "cnext") { nav.card++; nav.flip = false; render(true); }
    else if (a === "cprev") { nav.card = Math.max(0, nav.card - 1); nav.flip = false; render(true); }
    else if (a === "cmark") { var mc = MAT[nav.mat], idx = mezclaIdx(mc), i = idx[nav.card]; if (i !== undefined) { S.marks["card:" + mc.id + ":" + i] = d.s; pushState(); } var fil = nav.cfil !== "todas"; if (!fil) nav.card++; nav.flip = false; render(true); }
    else if (a === "cfil") irA({ cfil: d.f, card: 0, flip: false }, false);
    else if (a === "cmezcla") { var mz = MAT[nav.mat]; var ord = mz.tarjetas.map(function (c, i) { return { c: c, i: i, r: Math.random() }; }).sort(function (x, y) { return x.r - y.r; }); mz.tarjetas = ord.map(function (o) { return o.c; }); var mapa = {}; ord.forEach(function (o, n) { mapa[o.i] = n; }); var nuevas = {}; Object.keys(S.marks).forEach(function (k) { var p = k.split(":"); if (p[0] === "card" && p[1] === mz.id) nuevas["card:" + mz.id + ":" + mapa[+p[2]]] = S.marks[k]; else nuevas[k] = S.marks[k]; }); S.marks = nuevas; pushState(); nav.card = 0; nav.flip = false; render(true); toast("Tarjetas mezcladas"); }
    else if (a === "creset") { var mr = MAT[nav.mat]; Object.keys(S.marks).forEach(function (k) { if (k.indexOf("card:" + mr.id + ":") === 0) delete S.marks[k]; }); pushState(); nav.card = 0; render(true); toast("Marcas borradas"); }
    else if (a === "fest") irA({ fEst: d.f }, false);
    else if (a === "fmat") irA({ fMat: d.f }, false);
    else if (a === "plan") irA({ pi: +d.i }, false);
    else if (a === "borrar-extra") { S.extras = (S.extras || []).filter(function (t) { return t.id !== d.id; }); pushState(); render(true); }
    else if (a === "res") { var e = IDX[+d.i]; if (e.dest.open) openSet[e.dest.open] = true; irA(Object.assign({ un: null, tema: null }, e.dest)); }
    else if (a === "tema-oscuro") { var root = document.documentElement, dark = window.matchMedia("(prefers-color-scheme: dark)").matches, cur2 = root.getAttribute("data-theme") || (dark ? "dark" : "light"), nx = cur2 === "dark" ? "light" : "dark"; root.setAttribute("data-theme", nx); try { localStorage.setItem("ce_tema", nx); } catch (e2) {} }
  });
  document.addEventListener("change", function (ev) {
    var el = ev.target;
    if (el.dataset && el.dataset.a === "chk") {
      var k = el.dataset.k;
      if (k.indexOf("e:") === 0) { var id = k.slice(2); (S.extras || []).forEach(function (t) { if (t.id === id) t.hecho = el.checked; }); }
      else S.marks[k] = el.checked;
      pushState(); render(true);
    }
  });
  document.addEventListener("toggle", function (ev) { var el = ev.target; if (el.tagName === "DETAILS" && el.dataset.k) openSet[el.dataset.k] = el.open; }, true);
  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (el.dataset && el.dataset.note) { N[el.dataset.note] = { t: el.value, u: Date.now() }; saveNote(el.dataset.note); }
    else if (el.id === "q") { nav.q = el.value; resultados(); lsSet("ce_nav", nav); }
    else if (el.id === "gq") { nav.gq = el.value; renderGlosarioLista(); lsSet("ce_nav", nav); }
  });
  document.addEventListener("submit", function (ev) {
    var f = ev.target; if (!f.matches("form.add")) return;
    ev.preventDefault();
    var t = f.elements.t.value.trim(); if (!t) return;
    (S.extras = S.extras || []).push({ id: "x" + Date.now().toString(36), mat: f.elements.m.value, t: t, tipo: "Propia", fecha: f.elements.f.value || "", estado: "", hecho: false, nota: "" });
    pushState(); render(true); toast("Tarea agregada");
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") cerrarPop();
    if (ev.key === "Enter" && ev.target.classList && ev.target.classList.contains("gl")) { abrirPop(ev.target.dataset.g); return; }
    if (nav.v !== "materia" || nav.tab !== "tarjetas") return;
    var tag = (ev.target.tagName || "").toLowerCase(); if (tag === "input" || tag === "textarea" || tag === "select") return;
    if (ev.key === " ") { ev.preventDefault(); nav.flip = !nav.flip; var fc = document.querySelector(".fc"); if (fc) fc.classList.toggle("flip", nav.flip); }
    else if (ev.key === "ArrowRight") { nav.card++; nav.flip = false; render(true); }
    else if (ev.key === "ArrowLeft") { nav.card = Math.max(0, nav.card - 1); nav.flip = false; render(true); }
  });

  /* cuenta regresiva: solo actualiza el texto, no vuelve a dibujar la página */
  setInterval(function () {
    var now = new Date();
    document.querySelectorAll("[data-cd]").forEach(function (el) {
      var m = MAT[el.dataset.cd], i = dt(m.evaluacion.inicio), f = dt(m.evaluacion.fin);
      el.textContent = f <= now ? "Terminada" : i <= now ? "En curso" : "en " + faltan(i - now);
    });
  }, 30000);

  try { var th = localStorage.getItem("ce_tema"); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) {}
  if (nav.v === "materia" && !MAT[nav.mat]) nav.v = "inicio";
  render();
  initDb();
})();
</script>
